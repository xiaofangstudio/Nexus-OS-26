<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虚拟机</title>
<link rel="stylesheet" href="../ui/tokens.css">
<style>
  html, body { height: 100%; margin: 0; font-family: var(--font-sans); }
  body { background: transparent; overflow: hidden; color: #1a1a1a; }
  body.dark-mode { color: #eef1f6; }

  #vm { display: flex; flex-direction: column; height: 100%; }

  /* 顶部标签栏 */
  .vm-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; flex: none;
    background: rgba(255,255,255,0.42);
    border-bottom: 1px solid rgba(0,0,0,0.07);
  }
  body.dark-mode .vm-bar { background: rgba(255,255,255,0.05); border-bottom-color: rgba(255,255,255,0.08); }
  .vm-tabs { display: flex; gap: 5px; flex: 1; min-width: 0; overflow-x: auto; }
  .vm-tab {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 9px; cursor: pointer;
    font-size: 12px; white-space: nowrap; flex: none;
    background: rgba(120,130,150,0.10);
    border: 1px solid transparent;
    transition: background .16s var(--ease-out);
  }
  .vm-tab:hover { background: rgba(120,130,150,0.18); }
  .vm-tab.on { background: #fff; border-color: rgba(0,0,0,0.08); box-shadow: 0 2px 8px rgba(0,0,0,0.07); font-weight: 600; }
  body.dark-mode .vm-tab.on { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.12); }
  .vm-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; flex: none; }
  .vm-tab .dot.off { background: #94a3b8; }
  .vm-tab .x { opacity: .45; font-size: 10px; margin-left: 2px; }
  .vm-tab .x:hover { opacity: 1; }
  .vm-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px; border-radius: 9px; cursor: pointer;
    font-size: 12px; font-family: inherit; flex: none;
    background: linear-gradient(180deg, #60a5fa, #3b82f6);
    border: 1px solid rgba(59,130,246,0.6); color: #fff; font-weight: 600;
    box-shadow: 0 3px 10px rgba(59,130,246,0.28);
  }
  .vm-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

  /* 画面区 */
  .vm-stage { flex: 1; min-height: 0; position: relative; background: #0b1020; }
  .vm-stage iframe { width: 100%; height: 100%; border: none; display: block; background: #0b1020; }

  /* 空态 / 上限提示 */
  .vm-empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 28px;
    background: linear-gradient(160deg, #101a33, #0b1020 60%);
    color: #e8eefc;
  }
  .vm-empty .ic {
    width: 62px; height: 62px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #93c5fd;
    background: rgba(96,165,250,0.14);
    border: 1px solid rgba(96,165,250,0.28);
  }
  .vm-empty h3 { margin: 0; font-size: 17px; font-weight: 700; }
  .vm-empty h3.warn { color: #fbbf24; }
  .vm-empty p { margin: 0; font-size: 12.5px; line-height: 1.75; opacity: .68; max-width: 430px; }
  .vm-start {
    margin-top: 4px; padding: 9px 20px; border-radius: 11px; cursor: pointer;
    font-size: 13px; font-weight: 700; font-family: inherit;
    background: linear-gradient(180deg, #60a5fa, #3b82f6);
    border: 1px solid rgba(59,130,246,0.6); color: #fff;
    box-shadow: 0 6px 20px rgba(59,130,246,0.35);
  }
  .vm-start:hover { filter: brightness(1.06); }

  /* 加载遮罩 */
  .vm-loading {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(11,16,32,0.92); color: #cbd5e1; font-size: 12.5px;
  }
  .vm-loading.show { display: flex; }
  .vm-spin {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2.5px solid rgba(147,197,253,0.25);
    border-top-color: #60a5fa;
    animation: vmSpin .8s linear infinite;
  }
  @keyframes vmSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="vm">
  <div class="vm-bar">
    <div class="vm-tabs" id="vmTabs"></div>
    <button class="vm-btn" id="vmNew"><i class="fas fa-plus"></i> 新建虚拟机</button>
  </div>
  <div class="vm-stage" id="vmStage">
    <div class="vm-empty" id="vmEmpty">
      <div class="ic"><i class="fas fa-layer-group"></i></div>
      <h3>虚拟机</h3>
      <p>在这里再开一台完整的 Nexus OS 26 —— 一个新实例，独立桌面、独立应用，可以拿来试东西、折腾设置，崩了也不影响外面这台。</p>
      <button class="vm-start" id="vmStart">启动虚拟机</button>
    </div>
    <div class="vm-loading" id="vmLoading">
      <div class="vm-spin"></div>
      <div>正在启动 Nexus OS 26…</div>
    </div>
  </div>
</div>

<script src="_bridge.js"></script>
<script src="_app.js"></script>
<script>
(function () {
  'use strict';

  /* 嵌套层数由 URL 的 ?vm=N 传入：
       宿主直接打开 → MY_LAYER = 0，这台虚拟机是第 1 层
       第 1 层里再开   → 第 2 层
       第 2 层不允许再开（防无限套娃把浏览器拖死） */
  var qs = new URLSearchParams(location.search);
  var MY_LAYER = parseInt(qs.get('vm') || '0', 10) || 0;
  var NEXT_LAYER = MY_LAYER + 1;
  var MAX_LAYER = 2;
  var OS_SRC = '../Nexus OS 26.html';

  var vms = [];
  var active = null;
  var seq = 0;

  var stage = document.getElementById('vmStage');
  var tabsBox = document.getElementById('vmTabs');
  var emptyBox = document.getElementById('vmEmpty');
  var loading = document.getElementById('vmLoading');
  var btnNew = document.getElementById('vmNew');

  function toast(t) {
    try { if (window.Nexus && Nexus.notify) Nexus.notify('虚拟机', t, 'info'); } catch (e) {}
  }
  function canCreate() { return NEXT_LAYER <= MAX_LAYER; }

  function renderTabs() {
    if (!vms.length) { tabsBox.innerHTML = ''; return; }
    tabsBox.innerHTML = vms.map(function (v) {
      return '<div class="vm-tab' + (v === active ? ' on' : '') + '" data-id="' + v.id + '">'
        + '<span class="dot' + (v.ready ? '' : ' off') + '"></span>'
        + '<span>' + v.name + '</span>'
        + '<span class="x" data-close="' + v.id + '">✕</span>'
        + '</div>';
    }).join('');
  }

  function showEmpty() {
    emptyBox.style.display = 'flex';
    if (!canCreate()) {
      emptyBox.innerHTML =
        '<div class="ic"><i class="fas fa-ban"></i></div>'
        + '<h3 class="warn">已经套到最里面了</h3>'
        + '<p>虚拟机最多套 <b>' + MAX_LAYER + '</b> 层 —— 再套下去浏览器内存就撑不住了。'
        + '你现在在第 <b>' + MY_LAYER + '</b> 层。<br>把某一层的虚拟机关掉，才能再开新的。</p>';
      return;
    }
    emptyBox.innerHTML =
      '<div class="ic"><i class="fas fa-layer-group"></i></div>'
      + '<h3>虚拟机</h3>'
      + '<p>在这里再开一台完整的 Nexus OS 26 —— 一个新实例，独立桌面、独立应用，可以拿来试东西、折腾设置，崩了也不影响外面这台。</p>'
      + '<button class="vm-start" id="vmStart">启动虚拟机</button>';
    var b = document.getElementById('vmStart');
    if (b) b.onclick = createVM;
  }

  function createVM() {
    if (!canCreate()) { toast('虚拟机最多套 ' + MAX_LAYER + ' 层'); return; }
    emptyBox.style.display = 'none';
    loading.classList.add('show');

    seq++;
    var id = 'vm' + seq;
    var frame = document.createElement('iframe');
    frame.src = OS_SRC + '?vm=' + NEXT_LAYER;
    frame.setAttribute('allow', 'autoplay; fullscreen; clipboard-read; clipboard-write; microphone; camera');
    frame.style.display = 'none';
    stage.appendChild(frame);

    var vm = { id: id, name: 'Nexus OS ' + seq, iframe: frame, ready: false };
    vms.push(vm);
    active = vm;

    var done = false;
    frame.addEventListener('load', function () {
      done = true;
      loading.classList.remove('show');
      frame.style.display = 'block';
      vm.ready = true;
      renderTabs();
    });
    // 嵌套整机比较重，给足 15 秒；超时给可恢复提示而不是一直转圈
    setTimeout(function () {
      if (done) return;
      loading.classList.remove('show');
      emptyBox.style.display = 'flex';
      emptyBox.innerHTML =
        '<div class="ic"><i class="fas fa-triangle-exclamation"></i></div>'
        + '<h3 class="warn">虚拟机启动超时</h3>'
        + '<p>可能是一次开太多层，或者系统文件正被占用。把多余的虚拟机关掉再试一次。</p>';
    }, 15000);

    renderTabs();
  }

  function closeVM(id) {
    var i = -1;
    for (var k = 0; k < vms.length; k++) if (vms[k].id === id) { i = k; break; }
    if (i < 0) return;
    try { vms[i].iframe.remove(); } catch (e) {}
    vms.splice(i, 1);
    if (active && active.id === id) {
      active = vms[vms.length - 1] || null;
      vms.forEach(function (v) { v.iframe.style.display = (v === active) ? 'block' : 'none'; });
      if (!active) showEmpty();
    }
    renderTabs();
  }

  function switchVM(id) {
    var hit = null;
    vms.forEach(function (v) { if (v.id === id) hit = v; });
    if (!hit) return;
    active = hit;
    emptyBox.style.display = 'none';
    vms.forEach(function (v) { v.iframe.style.display = (v === active) ? 'block' : 'none'; });
    renderTabs();
  }

  tabsBox.addEventListener('click', function (e) {
    var closeBtn = e.target.closest('[data-close]');
    if (closeBtn) { e.stopPropagation(); closeVM(closeBtn.dataset.close); return; }
    var tab = e.target.closest('.vm-tab');
    if (tab) switchVM(tab.dataset.id);
  });

  btnNew.onclick = createVM;
  var firstStart = document.getElementById('vmStart');
  if (firstStart) firstStart.onclick = createVM;

  if (!canCreate()) {
    btnNew.disabled = true;
    btnNew.title = '已经套到最里面了（最多 ' + MAX_LAYER + ' 层）';
    showEmpty();
  }

  window.addEventListener('nexus:theme', function (e) {
    if (!e.detail) return;
    document.body.classList.toggle('dark-mode', !!e.detail.dark);
  });
  Nexus.ready(function (ctx) {
    if (ctx && ctx.dark) document.body.classList.add('dark-mode');
    try { Nexus.setWindowTitle('虚拟机'); } catch (e) {}
  });
})();
</script>
</body>
</html>
