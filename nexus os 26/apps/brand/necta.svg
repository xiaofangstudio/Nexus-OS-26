<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6d0"/>
      <stop offset="0.52" stop-color="#0e9aa7"/>
      <stop offset="1" stop-color="#0b3f66"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 超椭圆底盘 -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#glow)"/>
  <!-- 两端设备 -->
  <rect x="46" y="74" width="54" height="82" rx="13" fill="#ffffff" fill-opacity="0.94"/>
  <rect x="156" y="100" width="54" height="82" rx="13" fill="#ffffff" fill-opacity="0.94"/>
  <!-- 连接弧线（nectere 的「系」） -->
  <path d="M100 100 C124 100 132 118 156 118" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-opacity="0.95"/>
  <path d="M100 132 C124 132 132 150 156 150" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-opacity="0.62"/>
  <!-- 中间的连接点 -->
  <circle cx="128" cy="125" r="9" fill="#c9fbf5"/>
  <circle cx="128" cy="125" r="4.5" fill="#0b3f66"/>
</svg>
