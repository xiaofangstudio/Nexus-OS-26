<!DOCTYPE html>
<html lang="zh-CN" data-ui="liquid" data-mode="light">
<!-- ============================================================
  Nexus OS 26 · 方哩方哩（B 站原生客户端） · apps/bili/index.html
  ------------------------------------------------------------
  ★ 数据契约（后端部署后即生效；接口不可用时显示空态与真实原因，不内置任何演示数据）
      GET {API_BASE}/api/bili/feed?page=
      GET {API_BASE}/api/bili/search?keyword=&page=
      GET {API_BASE}/api/bili/video?bvid=
      GET {API_BASE}/api/bili/play?bvid=&cid=&q=
      GET {API_BASE}/api/bili/related?bvid=
      GET {API_BASE}/api/bili/img?url=
  ★ 真实接口接入时只需要改脚本里的 API_BASE（唯一基址）。
    若后端返回结构与 B 站原始字段不同，再改 normalizeList / normalizeDetail / normalizePlay。
  布局：左侧 66px 圆胶囊导航（应用商店/文件管理同款）+ 右侧卡片栅格。
  ============================================================ -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方哩方哩</title>
<link rel="stylesheet" href="../../ui/tokens.css">
<link rel="stylesheet" href="../../ui/glass.css">
<link rel="stylesheet" href="../../vendor/fontawesome/all.min.css">
<script src="../_bridge.js"></script>
<script src="../_app.js?v=2.9.57"></script>
<script src="../../ui/n26-gestures.js"></script>
<style>
  /* ================= 主题变量（浅色 / 深色都成立） ================= */
  :root {
    /* 粉只给「选中的 icon」用，玻璃层永远中性无色 */
    --accent: #c9869a;
    --focus: rgba(15, 23, 42, 0.34);
    --dur-fast: 200ms;
    --dur-base: 240ms;
    --app-bg: rgba(244, 247, 251, 0.72);
    --panel: rgba(255, 255, 255, 0.72);
    --panel-solid: rgba(255, 255, 255, 0.9);
    --line: rgba(15, 23, 42, 0.07);
    --line-2: rgba(15, 23, 42, 0.12);
    --chip-bg: rgba(125, 135, 155, 0.12);
    --chip-hover: rgba(255, 255, 255, 0.88);
    --sk-a: rgba(255, 255, 255, 0.62);
    --sk-b: rgba(219, 227, 238, 0.88);
    --note-bg: rgba(255, 255, 255, 0.62);
    --note-bd: rgba(15, 23, 42, 0.10);
    --note-fg: var(--text-2);
    --scroll-thumb: rgba(120, 130, 150, 0.28);
    --stage: #06080d;
    --player-fg: rgba(255, 255, 255, 0.92);
  }
  body.dark-mode {
    --accent: #e2a3b6;
    --focus: rgba(255, 255, 255, 0.46);
    --app-bg: rgba(16, 19, 26, 0.62);
    --panel: rgba(255, 255, 255, 0.06);
    --panel-solid: rgba(255, 255, 255, 0.11);
    --line: rgba(255, 255, 255, 0.12);
    --line-2: rgba(255, 255, 255, 0.20);
    --chip-bg: rgba(255, 255, 255, 0.08);
    --chip-hover: rgba(255, 255, 255, 0.13);
    --sk-a: rgba(255, 255, 255, 0.11);
    --sk-b: rgba(255, 255, 255, 0.045);
    --note-bg: rgba(255, 255, 255, 0.07);
    --note-bd: rgba(255, 255, 255, 0.16);
    --note-fg: rgba(235, 240, 248, 0.92);
    --scroll-thumb: rgba(255, 255, 255, 0.18);
  }

  /* ================= 基础 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--app-bg);
    color: var(--text-1);
    overflow: hidden;
    font-size: var(--fs-13);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background var(--dur-base) var(--ease-smooth), color var(--dur-base) var(--ease-smooth);
  }
  button, input { font-family: inherit; }
  button { cursor: pointer; border: none; background: none; color: inherit; }
  img { display: block; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-xs); }

  /* ================= 壳：左胶囊 + 主区 ================= */
  .app { height: 100%; display: flex; gap: var(--sp-3); padding: var(--sp-3); }

  .rail {
    flex: 0 0 76px; width: 76px;
    min-height: 0; height: 100%;
    display: flex; flex-direction: column; gap: 3px;
    padding: 7px 5px;
    border-radius: 16px;
    background: var(--glass-tint-2);
    border: 1px solid var(--glass-border-2);
    box-shadow: var(--glass-inner);
    -webkit-backdrop-filter: blur(var(--glass-blur-panel)) saturate(var(--glass-saturate));
    backdrop-filter: blur(var(--glass-blur-panel)) saturate(var(--glass-saturate));
    overflow-y: auto; overflow-x: hidden;
    overscroll-behavior: contain;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { width: 0; }
  body.dark-mode .rail {
    background: var(--glass-tint-2);
    border-color: var(--glass-border);
    box-shadow: var(--glass-inner);
  }

  .rail-item {
    flex: none;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    margin: 0 0 2px;
    padding: 7px 0 6px;
    border-radius: 11px;
    color: rgba(30, 52, 78, 0.72);
    font-size: 10.5px; line-height: 1.1;
    white-space: nowrap;
    user-select: none;
    transition: background var(--dur-fast) var(--ease-out-quart),
                color var(--dur-fast) var(--ease-out-quart),
                transform var(--dur-fast) var(--ease-spring);
  }
  .rail-item i { font-size: 15px; transition: color var(--dur-base) var(--ease-out-quart); }
  .rail-item:hover { background: var(--chip-hover); color: #16324e; }
  .rail-item:active { transform: none; }
  .rail-item.active { background: rgba(125, 135, 155, 0.16); color: #1c2b3a; }
  .rail-item.active i { color: var(--accent); }
  body.dark-mode .rail-item { color: rgba(255, 255, 255, 0.68); }
  body.dark-mode .rail-item:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
  body.dark-mode .rail-item.active { background: rgba(255, 255, 255, 0.10); color: #eef3fa; }
  body.dark-mode .rail-item.active i { color: var(--accent); }

  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* ================= 顶栏 ================= */
  .topbar {
    flex: none; display: flex; align-items: center; gap: var(--sp-2);
    margin: 0 0 10px;
    padding: 8px 10px;
    border-radius: var(--r-md);
    background: var(--glass-tint-2);
    border: 1px solid var(--glass-border-2);
    box-shadow: var(--glass-inner);
    -webkit-backdrop-filter: blur(var(--glass-blur-panel)) saturate(var(--glass-saturate));
    backdrop-filter: blur(var(--glass-blur-panel)) saturate(var(--glass-saturate));
  }
  body.dark-mode .topbar {
    background: var(--glass-tint-2);
    border-color: var(--glass-border);
    box-shadow: var(--glass-inner);
  }
  .navbtns { flex: none; display: flex; gap: 2px; }
  .titles { flex: 0 1 auto; min-width: 0; max-width: 240px; }
  .crumb {
    font-size: var(--fs-16); font-weight: 800; color: #17324d; letter-spacing: 0.2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub {
    margin-top: 2px; font-size: var(--fs-11); color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.dark-mode .crumb { color: rgba(255, 255, 255, 0.9); }
  .top-actions { flex: none; display: flex; align-items: center; gap: var(--sp-1); }

  /* 顶栏固定搜索：所有视图都能看到，回车进结果页 */
  .topsearch {
    flex: 0 1 520px;
    min-width: 140px;
    margin: 0 auto;
    display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 13px;
    border-radius: var(--r-full);
    background: var(--panel-solid);
    border: 1px solid var(--line-2);
    box-shadow: var(--sh-card);
    transition: box-shadow var(--dur-fast) var(--ease-out-quart);
  }
  .topsearch > i { flex: none; font-size: var(--fs-11); color: var(--text-3); }
  .topsearch input {
    flex: 1 1 auto; min-width: 0; height: 100%;
    border: none; outline: none; background: transparent;
    color: var(--text-1); font-size: var(--fs-12);
  }
  .topsearch input::placeholder { color: var(--text-3); }
  .topsearch input::-webkit-search-cancel-button { display: none; }
  .topsearch:focus-within { box-shadow: 0 0 0 3px var(--chip-bg), var(--sh-card); }

  /* 原生 / iframe 模式切换：右上角小齿轮，菜单保持无色玻璃 */
  .mode-wrap { position: relative; flex: none; }
  .mode-pop {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 40;
    width: 214px; padding: 6px;
    border-radius: 14px; border: 1px solid var(--line-2);
    background: var(--panel-solid); box-shadow: var(--sh-pop);
    animation: popIn var(--dur-fast) var(--ease-out-quart);
  }
  .mode-pop[hidden] { display: none; }
  /* iframe 模式：只留右上角外挂设置，其他原生 chrome 全部收起，避免误触/假交互 */
  body[data-bili-mode="iframe"] .rail { display: none; }
  body[data-bili-mode="iframe"] .topbar { justify-content: flex-end; padding: 6px 8px; }
  body[data-bili-mode="iframe"] .navbtns,
  body[data-bili-mode="iframe"] .titles,
  body[data-bili-mode="iframe"] .topsearch,
  body[data-bili-mode="iframe"] #acctBtn,
  body[data-bili-mode="iframe"] #themeBtn { display: none; }
  .mode-opt {
    width: 100%; display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border: 0; border-radius: 10px;
    background: transparent; color: var(--text-1); text-align: left;
    font-family: inherit; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out-quart);
  }
  .mode-opt:hover { background: var(--chip-bg); }
  .mode-opt > i {
    flex: none; width: 14px; font-size: 11px; color: transparent;
    transition: color var(--dur-fast) var(--ease-out-quart);
  }
  .mode-opt[aria-checked="true"] > i { color: var(--accent); }
  .mode-opt span { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .mode-opt b { font-size: var(--fs-12); font-weight: 650; color: var(--text-1); }
  .mode-opt small { font-size: 10px; color: var(--text-3); }
  @keyframes popIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  .panes { position: relative; flex: 1 1 auto; min-height: 0; }
  .pane {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    min-height: 0; opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity var(--dur-base) var(--ease-out-quart), visibility 0s linear var(--dur-base);
  }
  .pane.on {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity var(--dur-base) var(--ease-out-quart), visibility 0s;
  }
  .pane .scroll { flex: 1 1 auto; min-height: 0; }
  .bili-frame {
    flex: 1 1 auto; width: 100%; height: 100%; border: 0;
    background: #fff; border-radius: 12px;
  }
  .frame-load {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: #f4f7fb;
    color: var(--text-2); border-radius: 12px;
    visibility: visible; /* 别继承 pane 的 visibility 过渡，否则加载卡片会跟着延迟出现 */
    transition: opacity var(--dur-base) var(--ease-out-quart), visibility 0s linear var(--dur-base);
  }
  .frame-load b { font-size: var(--fs-12); color: var(--text-1); }
  .frame-load small { font-size: var(--fs-11); color: var(--text-3); }
  .frame-load.off { opacity: 0; visibility: hidden; pointer-events: none; }
  .spin {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line-2); border-top-color: var(--text-2);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.dark-mode .bili-frame { background: #0b0e14; }
  body.dark-mode .frame-load { background: #10131a; }

  /* 账号入口：未登录是「登录」，登录后是头像 + 昵称 */
  .acct {
    height: 30px; padding: 0 11px 0 4px;
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: var(--r-full);
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: var(--sh-card);
    color: var(--text-1);
    font-size: var(--fs-11); font-weight: 600;
    transition: background var(--dur-fast) var(--ease-out-quart),
                transform var(--dur-fast) var(--ease-spring);
  }
  .acct:hover { background: var(--panel-solid); transform: translateY(-1px); }
  .acct:active { transform: none; }
  .acct .acct-av {
    width: 22px; height: 22px; border-radius: 50%; overflow: hidden;
    display: grid; place-items: center;
    background: var(--chip-bg); color: var(--text-2); font-size: 10px;
  }
  .acct .acct-av img { width: 100%; height: 100%; object-fit: cover; }
  .acct .acct-name { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .iconbtn {
    width: 30px; height: 30px; border-radius: var(--r-full);
    display: grid; place-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-2);
    font-size: var(--fs-12);
    box-shadow: var(--sh-card);
    transition: background var(--dur-fast) var(--ease-out-quart),
                color var(--dur-fast) var(--ease-out-quart),
                transform var(--dur-fast) var(--ease-spring),
                box-shadow var(--dur-fast) var(--ease-out-quart);
  }
  .iconbtn:hover { background: var(--panel-solid); color: var(--text-1); transform: translateY(-1px); box-shadow: var(--sh-pop); }
  .iconbtn:active { transform: scale(0.93); }
  .iconbtn:disabled { opacity: 0.32; pointer-events: none; }

  /* ================= 滚动区 ================= */
  .scroll {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 2px 4px 24px;
    overscroll-behavior: contain;
  }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 8px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .view { max-width: 1280px; margin: 0 auto; }

  /* ================= 区块标题 ================= */
  .sec-head { display: flex; align-items: flex-end; gap: var(--sp-3); padding: 4px 2px 14px; }
  .sec-head > div:first-child { min-width: 0; }
  .sec-title { font-size: var(--fs-22); font-weight: 800; letter-spacing: 0.2px; line-height: 1.25; }
  .sec-sub { margin-top: 3px; font-size: var(--fs-11); color: var(--text-2); }
  .sec-actions { margin-left: auto; flex: none; display: flex; align-items: center; gap: var(--sp-2); }
  .count-pill {
    padding: 3px 10px; border-radius: var(--r-full);
    background: var(--chip-bg); color: var(--text-2);
    font-size: var(--fs-11); font-variant-numeric: tabular-nums;
  }

  /* ================= 按钮 ================= */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px; padding: 0 14px;
    border-radius: var(--r-full);
    border: 1px solid var(--line-2);
    background: var(--panel);
    color: var(--text-1);
    font-size: var(--fs-12); font-weight: 600;
    box-shadow: var(--sh-card);
    transition: transform var(--dur-fast) var(--ease-spring),
                background var(--dur-fast) var(--ease-out-quart),
                box-shadow var(--dur-fast) var(--ease-out-quart);
  }
  .btn:hover { background: var(--panel-solid); transform: translateY(-1px); box-shadow: var(--sh-pop); }
  .btn:active { transform: scale(0.96); }
  .btn.primary {
    border-color: var(--line-2);
    background: var(--panel-solid);
    color: var(--text-1);
    box-shadow: var(--sh-card);
  }
  .btn.primary:hover { box-shadow: var(--sh-pop); }
  .btn.ghost { background: transparent; box-shadow: none; }
  .btn.sm { height: 26px; padding: 0 11px; font-size: var(--fs-11); }
  .btn.danger { color: var(--danger); }

  /* ================= 视频卡片栅格 ================= */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
    gap: var(--sp-3);
    align-content: start;
  }
  .vcard {
    display: flex; flex-direction: column;
    padding: 9px;
    border-radius: var(--r-md);
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--sh-card);
    text-align: left;
    min-width: 0;
    cursor: pointer;
    transition: transform 0.22s var(--ease-out-quart), opacity 0.22s var(--ease-out-quart);
    animation: cardIn 0.26s var(--ease-out-expo) backwards;
  }
  .vcard:hover {
    transform: translateY(-3px);
    background: var(--panel-solid);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.11);
    border-color: var(--line-2);
  }
  .vcard:active { transform: none; }
  body.dark-mode .vcard:hover { box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---- 首页层级：推荐大卡 / 分区横条 / 继续观看 ---- */
  .hero {
    position: relative; display: block; width: 100%;
    aspect-ratio: 2.35 / 1;
    margin-bottom: var(--sp-4);
    border-radius: var(--r-lg);
    overflow: hidden;
    text-align: left;
    border: 1px solid var(--line);
    background: var(--chip-bg);
    box-shadow: var(--sh-card);
    transition: transform 0.24s var(--ease-out-quart), opacity 0.24s var(--ease-out-quart);
  }
  .hero:hover { transform: translateY(-2px); }
  .hero:active { transform: none; }
  .hero .hero-img { position: absolute; inset: 0; }
  .hero .hero-img img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.24s var(--ease-out-quart); }
  .hero .hero-img img.in { opacity: 1; }
  .hero .hero-shade {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(5, 7, 12, 0.86), rgba(5, 7, 12, 0.34) 48%, rgba(5, 7, 12, 0.04) 78%);
    pointer-events: none;
  }
  .hero-body {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; gap: 7px;
    padding: 22px 24px;
    color: #fff;
    pointer-events: none;
  }
  .hero-kicker {
    display: inline-flex; align-items: center; gap: 6px;
    align-self: flex-start;
    padding: 2px 9px;
    border-radius: var(--r-full);
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.22);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    backdrop-filter: blur(14px) saturate(150%);
    font-size: var(--fs-11); font-weight: 700;
  }
  .hero-kicker i { font-size: 10px; color: rgba(255, 255, 255, 0.78); }
  .hero-title { font-size: clamp(18px, 2.3vw, 26px); font-weight: 750; line-height: 1.28; max-width: 74%; }
  .hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: var(--fs-11); color: rgba(255, 255, 255, 0.74); }
  .hero-play {
    margin-top: 4px; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 16px;
    border-radius: var(--r-full);
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.26);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    color: #fff; font-size: var(--fs-12); font-weight: 700;
  }
  .hero-play i { font-size: 10px; }

  .sec { margin-top: var(--sp-4); }
  .sec-row-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-2); padding: 0 2px 10px;
  }
  .sec-row-head b { font-size: var(--fs-13); color: var(--text-1); }
  .sec-row-head span { font-size: var(--fs-11); color: var(--text-3); }

  .cat-strip {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 2px 2px 6px;
    scrollbar-width: none;
  }
  .cat-strip::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex: none; display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 14px;
    border-radius: var(--r-full);
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-2);
    font-size: var(--fs-12); font-weight: 600;
    transition: transform 0.22s var(--ease-out-quart), opacity 0.22s var(--ease-out-quart);
  }
  .cat-chip i { font-size: 11px; color: var(--text-3); transition: color 0.22s var(--ease-out-quart); }
  .cat-chip:hover { transform: translateY(-1px); color: var(--text-1); background: var(--panel-solid); }
  .cat-chip:hover i, .cat-chip.on i { color: var(--accent); }
  .cat-chip.on { color: var(--text-1); background: var(--panel-solid); }
  .cat-chip.more { color: var(--text-3); }

  .cw-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: var(--sp-3); }
  .cw-card {
    display: flex; gap: 9px; align-items: center;
    padding: 8px;
    border-radius: var(--r-md);
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--sh-card);
    text-align: left; min-width: 0;
    transition: transform 0.22s var(--ease-out-quart), opacity 0.22s var(--ease-out-quart);
  }
  .cw-card:hover { transform: translateY(-2px); }
  .cw-thumb { position: relative; flex: none; width: 116px; aspect-ratio: 16 / 9; border-radius: var(--r-sm); overflow: hidden; background: var(--chip-bg); }
  .cw-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.24s var(--ease-out-quart); }
  .cw-thumb img.in { opacity: 1; }
  .cw-info { min-width: 0; flex: 1; }
  .cw-title { font-size: var(--fs-12); font-weight: 650; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text-1); }
  .cw-sub { margin-top: 4px; font-size: var(--fs-11); color: var(--text-3); display: flex; gap: 6px; align-items: center; }

  .cover {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: var(--r-sm);
    overflow: hidden;
    background: rgba(120, 135, 160, 0.12);
  }
  .cover img {
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0;
    transform: scale(1.001);
    transition: opacity 0.24s var(--ease-out-quart),
                transform 0.24s var(--ease-out-quart);
  }
  .cover img.in { opacity: 1; }
  .vcard:hover .cover img { transform: scale(1.045); }

  .dur-badge {
    position: absolute; right: 6px; bottom: 6px;
    padding: 1px 6px;
    border-radius: var(--r-xs);
    background: rgba(8, 10, 15, 0.72);
    color: #fff;
    font-size: var(--fs-11); font-variant-numeric: tabular-nums;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .hot-badge {
    position: absolute; left: 6px; top: 6px;
    padding: 1px 7px;
    border-radius: var(--r-full);
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.26);
    color: #fff;
    font-size: var(--fs-11); font-weight: 700;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .watch-line {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: rgba(255, 255, 255, 0.22);
    pointer-events: none;
  }
  .watch-line i { display: block; height: 100%; background: rgba(255, 255, 255, 0.88); border-radius: 0 2px 2px 0; }

  .vtitle {
    margin: 9px 2px 0;
    font-size: var(--fs-13); font-weight: 600; line-height: 1.45;
    color: var(--text-1);
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 38px;
  }
  .vmeta {
    display: flex; align-items: center; gap: 6px;
    margin: 7px 2px 2px;
    font-size: var(--fs-11); color: var(--text-3);
    min-width: 0;
  }
  .vmeta .up { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vmeta .up i { font-size: 9px; margin-right: 3px; opacity: 0.8; }
  .vmeta .views { flex: none; display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .vmeta .views i { font-size: 9px; }

  /* 加载更多 */
  .more {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 22px 10px 8px;
    color: var(--text-3);
    font-size: var(--fs-11);
  }
  .more .dots { display: inline-flex; gap: 4px; }
  .more .dots i {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--text-3);
    animation: dotPulse 1.1s var(--ease-in-out-quart) infinite;
  }
  .more .dots i:nth-child(2) { animation-delay: 0.16s; }
  .more .dots i:nth-child(3) { animation-delay: 0.32s; }
  @keyframes dotPulse { 0%, 100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }

  /* ================= 骨架屏 ================= */
  .sk {
    background: linear-gradient(100deg, var(--sk-a) 18%, var(--sk-b) 38%, var(--sk-a) 58%);
    background-size: 220% 100%;
    animation: skSweep 1.6s var(--ease-in-out-quart) infinite;
    border-radius: var(--r-sm);
  }
  @keyframes skSweep { from { background-position: 170% 0; } to { background-position: -70% 0; } }
  .sk-card { pointer-events: none; animation: none; }
  .sk-cover { width: 100%; aspect-ratio: 16 / 9; border-radius: var(--r-sm); }
  .sk-line { height: 12px; margin: 10px 2px 0; }
  .sk-line.short { width: 58%; height: 10px; margin-top: 9px; }
  .sk-list { display: flex; flex-direction: column; gap: var(--sp-2); }
  .sk-list.wide .sk-thumb { flex: 0 0 232px; }
  .sk-row { display: flex; gap: var(--sp-3); padding: 9px; border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--line); }
  .sk-thumb { flex: 0 0 108px; aspect-ratio: 16 / 9; border-radius: var(--r-sm); }
  .sk-row-lines { flex: 1; }
  .sk-row-lines .sk-line { margin-top: 6px; }
  .sk-row-lines .sk-line:first-child { margin-top: 8px; height: 13px; }
  .sk-row-lines .sk-line:nth-child(3) { width: 42%; }

  /* ================= 搜索 ================= */
  .search-wrap { padding: 2px 2px 14px; }
  .hot-words { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 0 4px; }

  /* ---- 「更多推荐」横向 rail：箭头 / 滚轮 / 拖拽 / 边缘渐隐 ---- */
  .feed-rail { position: relative; }
  .rail-track {
    display: flex; gap: var(--sp-3);
    overflow-x: auto; overflow-y: hidden;
    padding: 2px 2px 8px;
    scrollbar-width: none;
    scroll-snap-type: x proximity;
    touch-action: pan-y;
    cursor: grab;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%);
  }
  .rail-track::-webkit-scrollbar { display: none; }
  .rail-track.dragging { cursor: grabbing; scroll-snap-type: none; }
  .rail-track.gliding { scroll-snap-type: none; }
  .rail-track .vcard { flex: 0 0 224px; scroll-snap-align: start; }
  .rail-arrow {
    position: absolute; top: 64px; z-index: 4;
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--panel-solid);
    border: 1px solid var(--line-2);
    color: var(--text-1); font-size: var(--fs-11);
    box-shadow: var(--sh-card);
    -webkit-backdrop-filter: blur(var(--glass-blur-panel)) saturate(var(--glass-saturate));
    backdrop-filter: blur(var(--glass-blur-panel)) saturate(var(--glass-saturate));
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur-fast) var(--ease-out-quart), transform var(--dur-fast) var(--ease-spring);
  }
  .rail-arrow.prev { left: -8px; }
  .rail-arrow.next { right: -8px; }
  .rail-arrow:hover { transform: scale(1.06); }
  .feed-rail.scrollable .rail-arrow { opacity: 1; pointer-events: auto; }
  .feed-rail.at-start .rail-arrow.prev,
  .feed-rail.at-end .rail-arrow.next { opacity: 0; pointer-events: none; }

  .sec-row-head .hint { font-size: var(--fs-11); color: var(--text-3); }

  .hot-words .label { font-size: var(--fs-11); color: var(--text-3); margin-right: 2px; }
  .word {
    padding: 4px 11px; border-radius: var(--r-full);
    background: var(--chip-bg); color: var(--text-2);
    font-size: var(--fs-11);
    transition: background var(--dur-fast) var(--ease-out-quart), color var(--dur-fast) var(--ease-out-quart), transform var(--dur-fast) var(--ease-spring);
  }
  .word:hover { background: var(--panel-solid); color: var(--text-1); }
  .word:active { transform: scale(0.95); }

  .r-list { display: flex; flex-direction: column; gap: var(--sp-2); }
  .r-item {
    display: flex; gap: 10px; padding: 7px;
    border-radius: var(--r-md);
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--sh-card);
    cursor: pointer; text-align: left;
    transition: background 0.22s var(--ease-out-quart), transform 0.22s var(--ease-out-quart), box-shadow 0.22s var(--ease-out-quart);
    animation: cardIn var(--dur-base) var(--ease-out-expo) backwards;
  }
  .r-item:hover { background: var(--panel-solid); transform: translateY(-1px); box-shadow: var(--sh-pop); }
  .r-thumb {
    position: relative; flex: 0 0 108px; aspect-ratio: 16 / 9;
    border-radius: var(--r-sm); overflow: hidden;
    background: rgba(120, 135, 160, 0.12);
  }
  .r-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.24s var(--ease-out-quart); }
  .r-thumb img.in { opacity: 1; }
  .r-thumb .dur-badge { right: 4px; bottom: 4px; }
  .r-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
  .r-title {
    font-size: var(--fs-13); font-weight: 600; line-height: 1.45; color: var(--text-1);
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .r-meta { display: flex; align-items: center; gap: 12px; font-size: var(--fs-11); color: var(--text-3); flex-wrap: wrap; }
  .r-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .r-meta i { font-size: 9px; }
  .r-meta .tname { color: var(--text-2); }

  /* 纵向信息流：推荐 / 搜索 / 相关推荐统一「一列往下滚」 */
  .feed-list { display: flex; flex-direction: column; gap: var(--sp-2); }
  .feed-list .r-item,
  .search-view .r-item { padding: 10px; gap: 14px; }
  .feed-list .r-thumb,
  .search-view .r-thumb { flex: 0 0 232px; }
  .feed-list .r-title,
  .search-view .r-title { font-size: var(--fs-14); -webkit-line-clamp: 3; line-clamp: 3; }
  .feed-list .r-info,
  .search-view .r-info { gap: 7px; }
  @media (max-width: 760px) {
    .feed-list .r-item,
    .search-view .r-item { flex-direction: column; gap: 10px; }
    .feed-list .r-thumb,
    .search-view .r-thumb { flex-basis: auto; width: 100%; }
  }
  /* 无限滚动的页尾：加载中 / 到底都有一块可见反馈 */
  .more.end { flex-direction: column; gap: 4px; padding: 22px 10px 34px; }
  .more.end b { font-size: var(--fs-12); color: var(--text-2); font-weight: 600; }
  .more.end .line { width: 48px; height: 1px; background: var(--line-2); }

  /* ================= 分区 ================= */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: var(--sp-3); }
  .cat {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 7px;
    padding: 14px;
    min-height: 118px;
    text-align: left;
    border-radius: var(--r-md);
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--sh-card);
    transition: transform var(--dur-base) var(--ease-out-quart), opacity var(--dur-base) var(--ease-out-quart);
  }
  .cat:hover { transform: translateY(-3px); box-shadow: var(--sh-pop); background: var(--panel-solid); }
  .cat:active { transform: none; }
  .cat-ico {
    width: 40px; height: 40px; border-radius: var(--r-sm);
    display: grid; place-items: center;
    background: var(--chip-bg);
    border: 1px solid var(--line);
    color: var(--text-2);
    font-size: var(--fs-16);
    transition: color var(--dur-base) var(--ease-out-quart);
  }
  body.dark-mode .cat-ico { background: var(--chip-bg); border-color: var(--line); color: rgba(255, 255, 255, 0.7); }
  .cat-name { font-size: var(--fs-13); font-weight: 700; color: var(--text-1); }
  .cat-sub { font-size: var(--fs-11); color: var(--text-3); }
  .cat-go { margin-top: auto; font-size: var(--fs-11); color: var(--text-3); display: inline-flex; align-items: center; gap: 5px; }
  .cat:hover .cat-ico i, .cat.selected .cat-ico i { color: var(--accent); }
  .cat:hover .cat-go { color: var(--text-1); }
  .cat-go i { font-size: 9px; transition: transform var(--dur-fast) var(--ease-out-quart); }
  .cat:hover .cat-go i { transform: translateX(2px); }

  /* ================= 空态 / 错误 ================= */
  .state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--sp-2);
    padding: 52px 20px;
    text-align: center;
    color: var(--text-2);
  }
  .state i { font-size: 34px; opacity: 0.22; }
  .state b { font-size: var(--fs-13); font-weight: 600; color: var(--text-1); }
  .state small { font-size: var(--fs-11); line-height: 1.7; opacity: 0.8; max-width: 360px; }
  .state .actions { display: flex; gap: var(--sp-2); margin-top: 6px; }
  .hard-error {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--sp-3); padding: 46px 20px; text-align: center;
  }
  .hard-error .ico { width: 52px; height: 52px; border-radius: var(--r-md); display: grid; place-items: center; background: rgba(239, 68, 68, 0.12); color: #ef4444; font-size: var(--fs-22); }
  .hard-error b { font-size: var(--fs-14); }
  .hard-error small { font-size: var(--fs-11); color: var(--text-2); max-width: 420px; line-height: 1.7; }

  /* ================= 详情：播放器 ================= */
  .detail-hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
  @media (min-width: 1000px) {
    .detail-hero { grid-template-columns: minmax(0, 1fr) 320px; }
    .player-col { position: sticky; top: 10px; }
  }

  .player {
    position: relative;
    width: 100%; aspect-ratio: 16 / 9;
    background: var(--stage);
    border-radius: var(--r-md);
    overflow: hidden;
    box-shadow: var(--sh-card), 0 8px 30px rgba(0, 0, 0, 0.18);
    user-select: none;
  }
  body.dark-mode .player { border: 1px solid rgba(255, 255, 255, 0.10); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); }
  .player:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; }
  .player:-webkit-full-screen { width: 100vw; height: 100vh; }

  .poster {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    background-color: var(--stage);
    filter: brightness(0.92) saturate(1.02);
    transition: opacity 0.24s var(--ease-out-quart);
  }
  .poster.hide { opacity: 0; pointer-events: none; }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: var(--stage);
    opacity: 0;
    transition: opacity var(--dur-base) var(--ease-out-quart);
  }
  #video.ready { opacity: 1; }
  #video::-webkit-media-controls { display: none !important; }

  .stage-shade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 124px;
    background: linear-gradient(to top, rgba(3, 5, 9, 0.9), rgba(3, 5, 9, 0.42) 58%, transparent);
    pointer-events: none;
    z-index: 2;
  }
  .bigplay {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 58px; height: 58px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: #fff; font-size: var(--fs-18);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
    z-index: 12;
    transition: transform 0.22s var(--ease-spring), opacity 0.22s var(--ease-out-quart);
  }
  .bigplay:hover { transform: translate(-50%, -50%) scale(1.06); }
  .bigplay:active { transform: translate(-50%, -50%) scale(0.92); }
  .bigplay.hide { opacity: 0; pointer-events: none; }

  .pcontrols {
    position: absolute; left: 0; right: 0; bottom: 0;
    z-index: 10;
    padding: 8px 12px 10px;
    color: var(--player-fg);
    background: linear-gradient(to top, rgba(6, 8, 13, 0.72), rgba(6, 8, 13, 0.30) 62%, rgba(6, 8, 13, 0));
    border-top: 1px solid rgba(255, 255, 255, 0.10);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    transition: opacity var(--dur-base) var(--ease-out-quart), transform var(--dur-base) var(--ease-out-quart);
  }
  .seek {
    position: relative; height: 18px;
    display: flex; align-items: center;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .seek-track { position: relative; width: 100%; height: 4px; border-radius: var(--r-full); background: rgba(255, 255, 255, 0.24); transition: height var(--dur-fast) var(--ease-out-quart); }
  .seek:hover .seek-track, .seek.dragging .seek-track { height: 6px; }
  .seek-buf { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: var(--r-full); background: rgba(255, 255, 255, 0.26); }
  .seek-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: var(--r-full); background: rgba(255, 255, 255, 0.92); }
  .seek-knob {
    position: absolute; top: 50%; left: 0%;
    width: 12px; height: 12px; border-radius: 50%;
    background: #fff;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.18s var(--ease-spring);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  .seek:hover .seek-knob, .seek.dragging .seek-knob { transform: translate(-50%, -50%) scale(1); }
  .seek-tip {
    position: absolute; bottom: 22px; left: 0;
    transform: translateX(-50%);
    padding: 3px 8px; border-radius: var(--r-full);
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.22);
    -webkit-backdrop-filter: blur(16px) saturate(165%);
    backdrop-filter: blur(16px) saturate(165%);
    color: #fff; font-size: var(--fs-11); font-variant-numeric: tabular-nums;
    display: none; white-space: nowrap; pointer-events: none;
  }
  .seek:hover .seek-tip, .seek.dragging .seek-tip { display: block; }

  .crow { display: flex; align-items: center; gap: 2px; }
  .cbtn {
    flex: none; height: 32px; min-width: 32px; padding: 0 4px;
    border-radius: var(--r-xs);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--player-fg); font-size: 13px;
    transition: background var(--dur-fast) var(--ease-out-quart), transform var(--dur-fast) var(--ease-spring);
  }
  .cbtn:hover { background: rgba(255, 255, 255, 0.14); }
  .cbtn:active { transform: scale(0.9); }
  .cbtn.wide {
    padding: 0 9px; font-size: var(--fs-11); font-weight: 700;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: var(--r-full);
  }
  .cbtn.wide:hover { background: rgba(255, 255, 255, 0.18); }
  .cbtn.wide.dm-off { opacity: 0.62; }
  .cbtn.wide.dm-na { opacity: 0.55; text-decoration: line-through; }
  .cbtn.on { color: #fff; }

  /* 弹幕层：贴住画面，不挡控制条 */
  .dmlayer {
    position: absolute; left: 0; right: 0; top: 0; bottom: 56px;
    overflow: hidden; pointer-events: none; z-index: 6;
  }
  .dmlayer.off { display: none; }
  .dmitem {
    position: absolute; left: 100%; top: 0;
    white-space: nowrap; font-size: 16px; font-weight: 600;
    line-height: 26px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.7);
    animation: dmFloat var(--dm-dur, 8s) linear forwards;
    will-change: transform;
  }
  .dmlayer.paused .dmitem { animation-play-state: paused; }
  @keyframes dmFloat { to { transform: translateX(var(--dm-shift, -1200px)); } }

  .time { margin: 0 8px 0 4px; font-size: var(--fs-11); font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, 0.82); white-space: nowrap; }
  .crow .spacer { flex: 1 1 auto; }
  .vol-wrap { display: inline-flex; align-items: center; }
  .vol {
    -webkit-appearance: none; appearance: none;
    width: 64px; height: 4px; margin-left: 2px;
    border-radius: var(--r-full);
    background: rgba(255, 255, 255, 0.28);
    cursor: pointer;
  }
  .vol::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  }
  @media (max-width: 560px) { .vol { display: none; } .time { margin-right: 2px; } }

  .pmenu {
    position: absolute; right: 12px; bottom: 52px;
    min-width: 118px; padding: 5px;
    border-radius: var(--r-sm);
    background: rgba(14, 17, 24, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    display: none;
    z-index: 30;

<body>
<div class="app">

<script>
/* ==========================================================================
   方哩方哩 · 原生客户端逻辑
   ★ 真实接口接入：只改下面这一行 API_BASE 即可。
     端点已按契约接好；若返回字段与 B 站原版不同，改 normalizeList /
     normalizeDetail / normalizePlay 三个适配函数。
   ========================================================================== */
(function () {
  'use strict';

  var API_BASE = 'https://ai.fanggame.company';
  var REQ_TIMEOUT = 15000;
  var CACHE_TTL = 5 * 60 * 1000;

  var scrollEl = document.getElementById('scroll');
  var crumbEl = document.getElementById('crumb');
  var subEl = document.getElementById('sub');
  var backBtn = document.getElementById('backBtn');
  var fwdBtn = document.getElementById('fwdBtn');
  var themeBtn = document.getElementById('themeBtn');
  var acctBtn = document.getElementById('acctBtn');
  var topSearchForm = document.getElementById('topSearchForm');
  var topSearch = document.getElementById('topSearch');
  var toastEl = document.getElementById('toast');

  var S = {
    route: null,
    stack: [],
    idx: -1,
    offline: false,
    reason: ''
  };

  var renderToken = 0;
  var pendingRestore = null;
  var feedIO = null;
  var toastTimer = 0;

  /* ======================= 基础工具 ======================= */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escXML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c];
    });
  }

  function stripHtml(v) {
    return String(v == null ? '' : v)
      .replace(/<[^>]*>/g, '')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&quot;/gi, '"')
      .replace(/&#39;/gi, "'")
      .replace(/&lt;/gi, '<')
      .replace(/&gt;/gi, '>')
      .replace(/&amp;/gi, '&')
      .trim();
  }

  function fmtNum(v) {
    if (v == null || v === '') return '0';
    if (typeof v === 'string' && /[万亿]/.test(v)) return v;
    var n = Number(v);
    if (!isFinite(n)) return String(v);
    if (n >= 100000000) return trimZero(n / 100000000) + '亿';
    if (n >= 10000) return trimZero(n / 10000) + '万';
    return String(n);
  }
  function trimZero(n) {
    return (Math.round(n * 10) / 10).toString().replace(/\.0$/, '');
  }

  function fmtDur(v) {
    if (v == null || v === '') return '';
    if (typeof v === 'string' && v.indexOf(':') >= 0) return v;
    var s = Number(v);
    if (!isFinite(s) || s <= 0) return '';
    s = Math.floor(s);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var ss = s % 60;
    return (h ? h + ':' + pad2(m) : m) + ':' + pad2(ss);
  }

  function fmtDate(t) {
    if (!t) return '';
    var n = Number(t);
    if (!isFinite(n)) return String(t);
    if (n < 1000000000000) n *= 1000;
    var d = new Date(n);
    if (isNaN(d.getTime())) return String(t);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* ======================= 本地存储：历史 / 进度 / 偏好 ======================= */
  var LS = {
    get: function (key, def) {
      try {
        var raw = localStorage.getItem('bili26.' + key);
        return raw == null ? def : JSON.parse(raw);
      } catch (e) { return def; }
    },
    set: function (key, value) {
      try { localStorage.setItem('bili26.' + key, JSON.stringify(value)); } catch (e) {}
    }
  };

  function getHistory() {
    var v = LS.get('history', []);
    return Array.isArray(v) ? v : [];
  }

  /* 收藏夹：本机持久化，不依赖登录态（登录后仍可收藏；未登录也可保存） */
  function getFav() {
    var v = LS.get('fav', []);
    return Array.isArray(v) ? v : [];
  }

  function isFav(bvid) {
    if (!bvid) return false;
    var hit = false;
    getFav().forEach(function (f) { if (f && f.bvid === bvid) hit = true; });
    return hit;
  }

  function toggleFav(rec) {
    if (!rec || !rec.bvid) return false;
    var list = getFav();
    var idx = -1;
    list.forEach(function (f, i) { if (f && f.bvid === rec.bvid) idx = i; });
    var on = idx < 0;
    if (on) {
      list.unshift({
        bvid: rec.bvid,

    AUTH.qrBusy = true;
    AUTH.qr = null;
    AUTH.qrState = 'loading';
    AUTH.qrMsg = isRetry ? '中转限流，正在重试…' : QR_TEXT.loading;
    if (S.route && S.route.view === 'me') viewMe();
    apiNoCache('/api/bili/login/qrcode', null, 32000).then(function (d) {
      if (!d || !d.token || !d.svg) throw new Error('接口没有返回二维码');
      AUTH.qr = { token: d.token, url: d.url || '', svg: d.svg, at: Date.now() };
      AUTH.qrState = 'waiting';
      AUTH.qrMsg = QR_TEXT.waiting;
      AUTH.qrBusy = false;
      if (S.route && S.route.view === 'me') viewMe();
      startPoll(d.token);
    }).catch(function (e) {
      AUTH.qrBusy = false;
      var msg = (e && e.message) || '网络错误';
      if (!AUTH.qrRetried) {
        AUTH.qrRetried = true;
        AUTH.qrState = 'loading';
        AUTH.qrMsg = '二维码生成失败，正在自动重试…';
        if (S.route && S.route.view === 'me') paintQrState();
        setTimeout(function () { refreshQr(true); }, 1600);
        return;
      }
      AUTH.qrState = 'error';
      AUTH.qrMsg = '二维码生成失败：' + msg;
      if (S.route && S.route.view === 'me') viewMe();
    });
  }

  function startPoll(token) {
    stopPoll();
    AUTH.pollFails = 0;
    AUTH.pollTimer = setInterval(function () { pollOnce(token); }, 4000);
    pollOnce(token);
  }

  function pollOnce(token) {
    if (!AUTH.qr || AUTH.qr.token !== token || AUTH.pollBusy) return;
    AUTH.pollBusy = true;
    apiNoCache('/api/bili/login/poll', { token: token }, 15000).then(function (d) {
      AUTH.pollBusy = false;
      AUTH.pollFails = 0;
      if (!AUTH.qr || AUTH.qr.token !== token) return;
      var st = (d && d.status) || 'waiting';
      if (st === 'ok') {
        stopPoll();
        AUTH.qr = null;
        AUTH.token = token;
        LS.set('token', token);
        AUTH.profile = (d && d.profile) || {};
        AUTH.at = Number((d && d.at) || Date.now());
        /* 不急着宣布成功：先回读 /login/me，确认会话确实存住了 */
        AUTH.status = 'checking';
        AUTH.qrState = 'checking';
        AUTH.qrMsg = '扫码已通过，正在回读登录态…';
        if (S.route && S.route.view === 'me') viewMe();
        apiNoCache('/api/bili/login/me', { token: token }).then(function (m) {
          if (m && m.status === 'ok') {
            AUTH.status = 'logged';
            AUTH.profile = m.profile || AUTH.profile || {};
            AUTH.at = Number(m.at || AUTH.at || 0);
            AUTH.qrState = '';
            AUTH.qrMsg = '';
            renderAccountBtn();
            var nm = AUTH.profile && AUTH.profile.name;
            toast(nm ? '已登录：' + nm : '登录已生效，但昵称/头像没回读（上游 412 限流）');
            if (S.route) updateChrome(S.route);
            if (S.route && S.route.view === 'me') viewMe();
          } else {
            AUTH.status = 'anonymous';
            AUTH.token = '';
            LS.set('token', null);
            AUTH.qrState = 'error';
            AUTH.qrMsg = 'B站已确认扫码通过，但服务端会话没存住（存储写入失败），请重新生成二维码再试';
            renderAccountBtn();
            if (S.route && S.route.view === 'me') viewMe();
          }
        }).catch(function (e) {
          AUTH.status = 'anonymous';
          AUTH.qrState = 'error';
          AUTH.qrMsg = '扫码已通过，但回读登录态失败：' + ((e && e.message) || '网络错误');
          if (S.route && S.route.view === 'me') viewMe();
        });
        return;
      }
      AUTH.qrState = st === 'scanned' ? 'scanned' : (st === 'expired' ? 'expired' : 'waiting');
      AUTH.qrMsg = st === 'waiting'
        ? QR_TEXT.waiting
        : ((d && d.message) || QR_TEXT[AUTH.qrState] || '等待扫码');
      if (st === 'expired') {
        stopPoll();
        AUTH.qr = null;
      }
      if (S.route && S.route.view === 'me') {
        if (AUTH.qr) paintQrState();
        else viewMe();
      }
    }).catch(function (e) {
      AUTH.pollBusy = false;
      if (!AUTH.qr || AUTH.qr.token !== token) return;
      AUTH.pollFails += 1;
      if (AUTH.pollFails >= 5) {
        stopPoll();
        AUTH.qr = null;
        AUTH.qrState = 'error';
        AUTH.qrMsg = '扫码状态查询失败：' + ((e && e.message) || '网络错误');
        if (S.route && S.route.view === 'me') viewMe();
        return;
      }
      AUTH.qrState = 'waiting';
      AUTH.qrMsg = '网络波动，正在重试（' + AUTH.pollFails + '/5）…';
      if (S.route && S.route.view === 'me') paintQrState();
    });
  }

  function logoutBili() {
    var t = AUTH.token;
    stopPoll();
    AUTH.token = '';
    AUTH.profile = null;
    AUTH.at = 0;
    AUTH.status = 'anonymous';
    AUTH.qr = null;
    AUTH.qrState = '';
    AUTH.qrMsg = '';
    AUTH.qrBusy = false;
    LS.set('token', null);
    renderAccountBtn();
    if (t) apiNoCache('/api/bili/login/logout', { token: t }).catch(function () {});
    if (S.route && S.route.view === 'me') viewMe();
    else if (S.route) updateChrome(S.route);
    toast('已退出 B站账号');
  }

  function updateChrome(route) {
    if (APP_MODE === 'iframe') {
      if (crumbEl) crumbEl.textContent = 'B 站网页版';
      if (subEl) subEl.textContent = 'iframe 模式 · 右上角齿轮可切回原生';

    if (subEl) subEl.textContent = c.sub;

    $$('.rail-item').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-nav') === nav);
    });
    if (backBtn) backBtn.disabled = S.idx <= 0;
    if (fwdBtn) fwdBtn.disabled = S.idx >= S.stack.length - 1;
    if (topSearch && route && route.view === 'search') {
      var kw = String(route.keyword || '');
      if (topSearch.value !== kw) topSearch.value = kw;
    }
    document.title = '方哩方哩 · ' + c.title;
  }

  function navigate(route, push) {
    if (push === undefined) push = true;
    if (S.idx >= 0 && S.stack[S.idx]) S.stack[S.idx].scroll = scrollEl.scrollTop;
    if (push) {
      S.stack = S.stack.slice(0, S.idx + 1);
      S.stack.push(route);
      S.idx = S.stack.length - 1;
    }
    S.route = route;
    render();
  }

  function goBack() {
    if (S.idx <= 0) return;
    if (S.stack[S.idx]) S.stack[S.idx].scroll = scrollEl.scrollTop;
    S.idx--;
    S.route = S.stack[S.idx];
    render();
  }

  function goForward() {
    if (S.idx >= S.stack.length - 1) return;
    S.idx++;
    S.route = S.stack[S.idx];
    render();
  }

  function navTo(name) {
    if (name === 'recommend') return navigate({ view: 'feed', kind: 'recommend', nav: 'recommend' });

    if (name === 'category') return navigate({ view: 'cats', nav: 'category' });
    if (name === 'search') return navigate({ view: 'search', keyword: '', nav: 'search', focus: true });
    if (name === 'history') return navigate({ view: 'history', nav: 'history' });
    if (name === 'fav') return navigate({ view: 'fav', nav: 'fav' });
    if (name === 'me') return navigate({ view: 'me', nav: 'me' });

  /* 把请求异常翻成一句用户能看懂的真实原因，不猜测、不编造 */
  function reasonText(e) {
    var msg = (e && e.message) || '';
    var name = (e && e.name) || '';
    if (name === 'AbortError' || /超时|timeout/i.test(msg)) return '请求超时';
    if (/412/.test(msg)) return 'B 站风控 412';
    if (/Failed to fetch|NetworkError|Load failed|网络不可达|网络错误/i.test(msg)) return '网络不可达';
    if (/HTTP \d+/.test(msg)) return '接口返回 ' + msg;
    return msg || '网络不可达';
  }

  var imgWatchTimer = 0;
  function ensureImgWatch() {
    if (imgWatchTimer) return;
    imgWatchTimer = setInterval(function () {
      $$('img.bl-img').forEach(function (img) {
        if (img.naturalWidth > 0 && !img.classList.contains('in')) img.classList.add('in');
      });
    }, 500);
  }

  function hydrateImages(root) {
    $$('img.bl-img', root).forEach(function (img) {
      var triedRaw = false;
      function ok() { img.classList.add('in'); }
      function fail() {
        if (!triedRaw) {
          var raw = img.getAttribute('data-raw');
          if (raw && raw !== img.src) {
            triedRaw = true;
            img.removeAttribute('data-raw');
            img.src = raw;
            return;
          }
        }
        img.classList.remove('in');
        if (img.src !== DEFAULT_COVER) img.src = DEFAULT_COVER;
      }
      if (img.naturalWidth > 0) ok();
      else {
        img.addEventListener('load', ok, { once: true });
        img.addEventListener('error', fail);
      }
    });
    /* Edge 懒加载会把 load 事件延后，用轮询兜底，避免「图已解码但还是灰块」 */
    ensureImgWatch();
  }

  /* ======================= 首页 / 热门 / 分区视频流 ======================= */
  var feedStates = {};

  function feedKey(route) { return route.kind + ':' + (route.rid || ''); }

  function getFeedState(route) {
    var key = feedKey(route);
    if (!feedStates[key]) {
      feedStates[key] = { items: [], page: 0, more: true, loading: false, error: '' };
    }
    return feedStates[key];
  }

  function feedTitle(route) {
    if (route.kind === 'hot') return '热门';
    if (route.kind === 'cat') return route.title || '分区';
    return '推荐';
  }

  function feedSub(route) {
    if (route.kind === 'hot') return '全站正在热播';
    if (route.kind === 'cat') return (route.title || '分区') + ' · 按最新排序';
    var a = accountOf();
    return (a && a.name ? a.name + '，' : '') + '为你挑选的今日视频';
  }

  function viewFeed(route, token) {
    var st = getFeedState(route);
    paintFeed(route, st, token);
    if (st.page === 0 && !st.loading) {
      st.loading = true;
      loadFeed(route, st, token);
    } else if (st.items.length && pendingRestore != null) {
      scrollEl.scrollTop = pendingRestore;
      pendingRestore = null;
    }
    bindMore(route, st, token);
  }

  function paintFeed(route, st, token) {
    var hmap = progressMap();
    var isHome = route.kind === 'recommend';
    var heroItem = (isHome && st.items.length) ? st.items[0] : null;
    var list = heroItem ? st.items.slice(1) : st.items;

    var head = '<div class="sec-head">' +
      '<div><div class="sec-title">' + esc(feedTitle(route)) + '</div>' +
      '<div class="sec-sub">' + esc(feedSub(route)) + '</div></div>' +
      '<div class="sec-actions">' +
      (route.kind === 'cat' ? '<button class="btn sm" id="catsBack"><i class="fa-solid fa-layer-group"></i>全部分区</button>' : '') +
      (st.items.length ? '<span class="count-pill">' + st.items.length + ' 个视频</span>' : '') +
      '</div></div>';

    var hero = heroItem ? heroHTML(heroItem, hmap[heroItem.bvid]) : '';
    var extras = isHome && st.items.length ? hero + catStripHTML() + cwHTML() : '';

    var body;
    if (!st.items.length) {
      if (st.loading) body = skeletonList(6, true);
      else if (st.error) body = errorState('视频没有加载出来', st.error, 'feedRetry');
      else body = emptyState('fa-inbox', '这里暂时没有视频', '接口没有返回内容，可以点重试重新拉取');
    } else {
      var gridHead = (heroItem && list.length)
        ? '<div class="sec"><div class="sec-row-head"><b>更多推荐</b><span class="hint">' + list.length + ' 个视频 · 继续向下滚动自动加载</span></div></div>'
        : '';
      var rows = '';
      list.forEach(function (item, i) { rows += rowHTML(item); });
      body = extras + gridHead + (list.length ? '<div class="feed-list">' + rows + '</div>' : '');
      if (st.loading) body += skeletonList(3, true);
      if (st.error) {
        body += '<div class="more"><span>加载失败：' + esc(st.error) + '</span>' +
          '<button class="btn sm" id="moreRetry">重试</button></div>';
      } else if (st.loading) {
        body += '<div class="more"><span class="dots"><i></i><i></i><i></i></span><span>正在加载下一页</span></div>';
      } else if (st.more) {
        body += '<div class="more" id="moreSentinel"><span>继续向下滚动加载</span></div>';
      } else {
        body += '<div class="more end"><span class="line"></span><b>已经到底啦</b><span>共 ' + st.items.length + ' 个视频 · 没有更多推荐了</span></div>';
      }
    }

    var keepTop = scrollEl.scrollTop;
    scrollEl.innerHTML = '<div class="view">' + head + body + '</div>';
    bindCards(scrollEl);
    hydrateImages(scrollEl);
    /* 无限流加载下一页时保持滚动位置，避免每次续载跳回顶部 */
    if (keepTop > 0) scrollEl.scrollTop = keepTop;

    $$('.cat-chip[data-rid]', scrollEl).forEach(function (chip) {
      chip.addEventListener('click', function () {
        navigate({
          view: 'feed', kind: 'cat',
          rid: Number(chip.getAttribute('data-rid')),
          title: chip.getAttribute('data-name') || '分区',
          nav: 'category'
        });
      });
    });
    var allCats = $('#allCats', scrollEl);
    if (allCats) allCats.addEventListener('click', function () { navigate({ view: 'cats', nav: 'category' }); });

    var cb = $('#catsBack', scrollEl);
    if (cb) cb.addEventListener('click', function () { navigate({ view: 'cats', nav: 'category' }); });
    var mr = $('#moreRetry', scrollEl);
    if (mr) mr.addEventListener('click', function () {
      st.error = '';
      loadFeed(route, st, renderToken);
    });
    var fr = $('#feedRetry', scrollEl);
    if (fr) fr.addEventListener('click', function () {
      retryAll();
      st.error = '';
      st.page = 0;
      st.more = true;
      st.loading = true;
      paintFeed(route, st, renderToken);
      loadFeed(route, st, renderToken);
    });

    if (st.items.length && pendingRestore != null) {
      scrollEl.scrollTop = pendingRestore;
      pendingRestore = null;
    }
  }

  /* 「更多推荐」横向 rail：箭头 / 滚轮 / 拖拽，边缘按可滚方向渐隐 */
  function bindFeedRail() {
    var track = $('#feedRail', scrollEl);
    if (!track) return;
    var rail = track.parentNode;
    var prev = $('#railPrev', scrollEl);
    var next = $('#railNext', scrollEl);

    function maxScroll() { return Math.max(0, track.scrollWidth - track.clientWidth); }
    function step() { return Math.max(240, Math.round(track.clientWidth * 0.8)); }
    function update() {
      var max = maxScroll();
      var can = max > 4;
      var atStart = track.scrollLeft <= 4;
      var atEnd = track.scrollLeft >= max - 4;
      rail.classList.toggle('scrollable', can);
      rail.classList.toggle('at-start', atStart);
      rail.classList.toggle('at-end', atEnd);
      track.style.setProperty('--fade-l', (!atStart && can) ? '30px' : '0px');
      track.style.setProperty('--fade-r', (!atEnd && can) ? '30px' : '0px');
    }

    track.addEventListener('scroll', update, { passive: true });
    track.addEventListener('scrollend', function () { track.classList.remove('gliding'); });
    if (prev) prev.addEventListener('click', function () {
      track.scrollBy({ left: -step(), behavior: 'smooth' });
    });
    if (next) next.addEventListener('click', function () {
      track.scrollBy({ left: step(), behavior: 'smooth' });
    });

    /* 精准触控板：横向手势按 rAF 缓动跟进，保留惯性；触控板纵向留给页面滚动，
       只有鼠标滚轮（行/页模式或大格）才转成横向，避免劫持纵向滑动。 */
    var wheelTarget = null;
    var wheelRaf = 0;

    function glideStep() {
      wheelRaf = 0;
      if (!track.isConnected) return;
      var max = maxScroll();
      var target = clamp(wheelTarget == null ? track.scrollLeft : wheelTarget, 0, max);
      wheelTarget = target;
      var diff = target - track.scrollLeft;
      if (Math.abs(diff) < 0.8) {
        track.scrollLeft = target;
        track.classList.remove('gliding');
        return;
      }
      track.scrollLeft += diff * 0.24;
      wheelRaf = requestAnimationFrame(glideStep);
    }

    function queueGlide(delta) {
      if (wheelTarget == null) wheelTarget = track.scrollLeft;
      wheelTarget = clamp(wheelTarget + delta, 0, maxScroll());
      track.classList.add('gliding');
      if (!wheelRaf) wheelRaf = requestAnimationFrame(glideStep);
    }

    track.addEventListener('wheel', function (e) {
      if (maxScroll() <= 4) return;
      var scale = e.deltaMode === 1 ? 18 : (e.deltaMode === 2 ? track.clientWidth : 1);
      var dx = e.deltaX * scale;
      var dy = e.deltaY * scale;
      if (Math.abs(dx) > Math.abs(dy)) {
        e.preventDefault();
        queueGlide(dx);
        return;
      }
      var mouseWheel = e.deltaMode === 1 || e.deltaMode === 2 || Math.abs(dy) >= 40;
      if (!mouseWheel) return;
      e.preventDefault();
      queueGlide(dy);
    }, { passive: false });

    var dragging = false, moved = false, startX = 0, startLeft = 0, pointerId = null;
    track.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (wheelRaf) { cancelAnimationFrame(wheelRaf); wheelRaf = 0; }
      wheelTarget = track.scrollLeft;
      track.classList.remove('gliding');
      dragging = true;
      moved = false;
      startX = e.clientX;
      startLeft = track.scrollLeft;
      pointerId = e.pointerId;
    });
    track.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.clientX - startX;
      if (!moved && Math.abs(dx) < 6) return;
      if (!moved) {
        moved = true;
        track.classList.add('dragging');
        try { track.setPointerCapture(pointerId); } catch (err) {}
      }
      e.preventDefault();
      track.scrollLeft = startLeft - dx;
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      if (!moved) return;
      track.classList.remove('dragging');
      /* 拖拽结束的那次 click 不当作点开视频 */
      var swallow = function (e) { e.preventDefault(); e.stopPropagation(); };
      track.addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(function () {
        track.removeEventListener('click', swallow, true);
      }, 0);
    }
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);
    track.addEventListener('pointerleave', endDrag);

    update();
    requestAnimationFrame(update);
  }

  function loadFeed(route, st, token) {
    if (st.loading && st.page > 0) return;
    st.loading = true;
    st.error = '';
    var params = { page: st.page + 1 };
    if (route.kind === 'cat' && route.rid) params.rid = route.rid;
    /* 先把骨架画出来再请求，别让用户对着旧列表干等 */
    if (st.items.length) paintFeed(route, st, token);

    /* 中转限流时首屏经常 18s 超时；首屏自动补一次请求，避免直接甩一个错误页 */
    var fetchFeed = function (retry) {
      return apiGet('/api/bili/feed', params, 24000).catch(function (e) {
        if (!retry) throw e;
        return new Promise(function (res, rej) {
          setTimeout(function () { apiGet('/api/bili/feed', params, 24000).then(res, rej); }, 1400);
        });
      });
    };

    fetchFeed(st.page === 0).then(function (d) {
      if (token !== renderToken) return;
      var items = normalizeList(d);
      /* 推荐流同一页偶发重复：按 bvid 去重，已出现过的直接丢掉 */
      var seen = {};
      st.items.forEach(function (v) { seen[v.bvid] = 1; });
      items = items.filter(function (v) { return !seen[v.bvid]; });
      st.items = st.items.concat(items);
      st.page += 1;
      st.more = items.length ? hasMoreOf(d, items.length) : false;
    }).catch(function (e) {
      if (token !== renderToken) return;
      st.error = reasonText(e);
      st.more = false;
    }).then(function () {
      st.loading = false;
      if (token !== renderToken) return;
      paintFeed(route, st, token);
      bindMore(route, st, token);
    });
  }

  function bindMore(route, st, token) {
    if (feedIO) { feedIO.disconnect(); feedIO = null; }
    var sentinel = $('#moreSentinel', scrollEl);
    if (!sentinel || !st.more || st.loading) return;
    if (typeof IntersectionObserver === 'undefined') return;
    feedIO = new IntersectionObserver(function (entries) {
      if (!entries[0] || !entries[0].isIntersecting) return;
      if (st.loading || !st.more) return;
      if (feedIO) { feedIO.disconnect(); feedIO = null; }
      loadFeed(route, st, renderToken);
    }, { root: scrollEl, rootMargin: '240px 0px' });
    feedIO.observe(sentinel);
  }

  /* ======================= 搜索 ======================= */
  var searchStates = {};
  var HOT_WORDS = ['科技', '游戏', '猫咪', '生活', '编程', '新番', '摄影', '穿搭', '音乐'];

  function getSearchState(kw) {
    if (!searchStates[kw]) searchStates[kw] = { items: [], page: 0, more: true, loading: false, total: 0, error: '' };
    return searchStates[kw];
  }

  function hotWordsHTML() {
    var html = '<div class="hot-words"><span class="label">热门搜索</span>';
    HOT_WORDS.forEach(function (w) {
      html += '<button class="word" data-word="' + esc(w) + '">' + esc(w) + '</button>';
    });
    return html + '</div>';
  }

  function searchShell(kw, body) {
    return (kw ? '' : '<div class="search-wrap">' + hotWordsHTML() + '</div>') + body;
  }

  function viewSearch(route, token) {
    var kw = String(route.keyword || '').trim();
    var st = kw ? getSearchState(kw) : null;
    paintSearch(route, kw, st, token);
    if (kw && st && st.page === 0 && !st.loading) {
      st.loading = true;
      paintSearch(route, kw, st, token);
      loadSearch(kw, st, token);
    }
    if (!kw && route.focus && topSearch) topSearch.focus();
  }

  function paintSearch(route, kw, st, token) {
    var head = '<div class="sec-head">' +
      '<div><div class="sec-title">搜索</div>' +
      '<div class="sec-sub">' + (kw ? '正在搜索「' + esc(kw) + '」' : '视频、UP 主、关键词都能搜') + '</div></div>' +
      '<div class="sec-actions">' + (st && st.items.length ? '<span class="count-pill">' + st.items.length + ' 条结果</span>' : '') +
      (st && st.via === 'stale' ? '<span class="count-pill">上游限流 · 来自缓存</span>' : '') + '</div>' +
      '</div>';

    var body = '';
    if (!kw) {
      body = '<div class="state" style="padding-top:34px">' +
        '<i class="fa-solid fa-magnifying-glass"></i>' +
        '<b>搜点什么吧</b>' +
        '<small>在顶部搜索栏输入关键词，或者点上面的热门搜索。所有结果都支持直接播放。</small>' +
        '</div>';
    } else if (!st || (!st.items.length && st.loading)) {
      body = skeletonList(4, true);
    } else if (!st.items.length && st.error) {
      body = errorState('搜索没有返回结果', st.error, 'searchRetry');
    } else if (!st.items.length) {
      /* 接口成功但 0 条：这是「真的没有匹配」，与「请求失败」是两件事。
         把 Worker 实际走的通道（api / html / html-cache / stale）写出来，方便判断是不是上游抽风。 */
      body = '<div class="state">' +
        '<i class="fa-solid fa-magnifying-glass"></i>' +
        '<b>「' + esc(kw) + '」没有匹配到视频</b>' +
        '<small>接口请求成功，上游这次就是 0 条（通道：' + esc(st.via || 'api') + '）。换个更短的关键词，或点重试重新请求一次。</small>' +
        '<button class="btn primary" id="searchRetry" style="margin-top:14px">重试</button>' +
        '</div>' + hotWordsHTML();
    } else {
      body = '<div class="r-list">';
      st.items.forEach(function (item) { body += rowHTML(item); });
      body += '</div>';
      if (st.loading) body += skeletonList(2, true);
      if (st.error) {
        body += '<div class="more"><span>加载失败：' + esc(st.error) + '</span>' +
          '<button class="btn sm" id="searchMore">重试</button></div>';
      } else if (st.loading) {
        body += '<div class="more"><span class="dots"><i></i><i></i><i></i></span><span>正在加载更多结果</span></div>';
      } else if (st.more) {
        body += '<div class="more" id="searchSentinel"><span>继续向下滚动加载更多结果</span></div>';
      } else {
        body += '<div class="more end"><span class="line"></span><b>没有更多结果了</b><span>共 ' + st.items.length + ' 条 · 换个关键词试试</span></div>';
      }
    }

    var keepTop = scrollEl.scrollTop;
    scrollEl.innerHTML = '<div class="view' + (kw ? ' search-view' : '') + '">' + head + searchShell(kw, body) + '</div>';

    $$('.word', scrollEl).forEach(function (w) {
      w.addEventListener('click', function () {
        var q = w.getAttribute('data-word');
        navigate({ view: 'search', keyword: q, nav: 'search', focus: true });
      });
    });

    bindCards(scrollEl);
    hydrateImages(scrollEl);
    if (keepTop > 0) scrollEl.scrollTop = keepTop;
    if (kw) bindSearchMore(st, kw, token);

    var more = $('#searchMore', scrollEl);
    if (more) more.addEventListener('click', function () {
      if (!st || st.loading) return;
      st.loading = true;
      paintSearch(route, kw, st, token);
      loadSearch(kw, st, token);
    });
    var sr = $('#searchRetry', scrollEl);
    if (sr) sr.addEventListener('click', function () {
      if (!st || st.loading) return;
      retryAll();
      st.error = '';
      st.loading = true;
      paintSearch(route, kw, st, token);
      loadSearch(kw, st, token);
    });
  }

  var searchIO = null;
  function bindSearchMore(st, kw, token) {
    if (searchIO) { searchIO.disconnect(); searchIO = null; }
    var sentinel = $('#searchSentinel', scrollEl);
    if (!sentinel || !st || !st.more || st.loading) return;
    if (typeof IntersectionObserver === 'undefined') return;
    searchIO = new IntersectionObserver(function (entries) {
      if (!entries[0] || !entries[0].isIntersecting) return;
      if (st.loading || !st.more) return;
      if (searchIO) { searchIO.disconnect(); searchIO = null; }
      st.loading = true;
      loadSearch(kw, st, renderToken);
    }, { root: scrollEl, rootMargin: '360px 0px' });
    searchIO.observe(sentinel);
  }

  function loadSearch(kw, st, token) {
    st.error = '';
    if (st.items.length) paintSearch(S.route, kw, st, token);
    apiGet('/api/bili/search', { keyword: kw, page: st.page + 1 }, 30000).then(function (d) {
      if (token !== renderToken) return;
      var items = normalizeList(d);
      st.items = st.items.concat(items);
      st.page += 1;
      st.via = (d && d.via) || '';
      st.more = items.length ? hasMoreOf(d, items.length) : false;
      if (typeof d.total === 'number') st.total = d.total;
    }).catch(function (e) {
      if (token !== renderToken) return;
      st.error = reasonText(e);
      st.more = false;
    }).then(function () {
      st.loading = false;
      if (token !== renderToken) return;
      paintSearch(S.route, kw, st, token);
    });
  }

  /* ======================= 分区 ======================= */
  function viewCats() {
    var head = '<div class="sec-head">' +
      '<div><div class="sec-title">分区</div><div class="sec-sub">按兴趣逛逛，共 ' + CATEGORIES.length + ' 个分区</div></div>' +
      '</div>';

      grid += '<button class="cat" data-rid="' + c.rid + '" data-name="' + esc(c.name) + '">' +
        '<span class="cat-ico"><i class="fa-solid ' + c.icon + '"></i></span>' +
        '<span class="cat-name">' + esc(c.name) + '</span>' +
        '<span class="cat-sub">' + esc(c.name) + ' · 分区</span>' +
        '<span class="cat-go">进入分区<i class="fa-solid fa-arrow-right"></i></span>' +
        '</button>';

    scrollEl.innerHTML = '<div class="view">' + head + grid + '</div>';

  /* ======================= 历史 ======================= */
  function timeAgo(ms) {
    var diff = Date.now() - Number(ms || 0);
    if (!isFinite(diff) || diff < 0) return '';
    var min = Math.floor(diff / 60000);
    if (min < 1) return '刚刚';
    if (min < 60) return min + ' 分钟前';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + ' 小时前';
    var day = Math.floor(hr / 24);
    if (day < 30) return day + ' 天前';
    return fmtDate(ms);
  }

  function historyRow(h) {
    var pct = watchPercent(h);
    var dur = fmtDur(h.duration);
    var seen = fmtDur(h.t);
    var cover = imgURL(h.cover);
    return '<button class="r-item h-row" data-history="' + esc(h.bvid) + '">' +
      '<div class="r-thumb">' + imgTag(cover, rawURL(h.cover)) +
      (pct > 0 ? '<span class="watch-line"><i style="width:' + pct + '%"></i></span>' : '') +
      '</div>' +
      '<div class="r-info">' +
      '<div class="r-title">' + esc(h.title || '未命名视频') + '</div>' +

  function viewDetail(route, token) {
    paintDetailSkeleton();
    var bvid = route.bvid;
    if (!bvid) { detailFail('没有指定视频 BV 号'); return; }
    var seedItem = route.item || findHistory(bvid) || { bvid: bvid };

    apiGet('/api/bili/video', { bvid: bvid }).then(function (raw) {
      if (token !== renderToken) return null;
      return normalizeDetail(raw);
    }).catch(function (e) {
      if (token !== renderToken) return null;
      detailFail(reasonText(e));
      return null;
    }).then(function (detail) {
      if (!detail || token !== renderToken) return;

      var cid = (detail.pages && detail.pages[0] && detail.pages[0].cid) || detail.cid || '';
      var activeCid = route.cid || cid;

      var relReason = '';
      var relPromise = apiGet('/api/bili/related', { bvid: bvid }).then(function (raw) {
        return normalizeList(raw).slice(0, 8);
      }).catch(function (e) {
        /* 相关推荐失败不伪造数据，交给详情页显示真实原因 + 重试 */
        relReason = reasonText(e);
        return [];
      });

      var playReason = '';
      var playPromise = apiGet('/api/bili/play', { bvid: bvid, cid: activeCid, q: '' }, 30000)
        .then(normalizePlay)
        .catch(function (e) {
          playReason = reasonText(e);
          return { url: '', urls: [], qualities: [], current: '', error: playReason };
        });

      Promise.all([relPromise, playPromise]).then(function (res) {
        if (token !== renderToken) return;
        var related = res[0] || [];
        var play = res[1] || { url: '', urls: [], qualities: [], current: '', error: playReason };
        paintDetail(detail, related, play, relReason, seedItem, activeCid, bvid);
        remember({
          bvid: detail.bvid || bvid,
          title: detail.title,
          cover: detail.cover,
          author: detail.owner && detail.owner.name ? detail.owner.name : detail.author,
          duration: (detail.pages[0] && detail.pages[0].duration) || detail.duration
        }, 0, (detail.pages[0] && detail.pages[0].duration) || detail.duration);
      }).catch(function (e) {
        if (token !== renderToken) return;
        detailFail(reasonText(e));
      });
    });
  }

  var fsChangeHandler = null;
