  function clock(s) {
    s = Math.max(0, Math.floor(Number(s) || 0));
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var ss = s % 60;
    return (h ? h + ':' + pad2(m) : m) + ':' + pad2(ss);
  }

  function setupPlayer(detail, play, activeCid) {
    var stage = $('#stage', scrollEl);
    var video = $('#video', scrollEl);
    var poster = $('#poster', scrollEl);
    var bigPlay = $('#bigPlay', scrollEl);
    var errEl = $('#playerErr', scrollEl);
    var qualityMenu = $('#qualityMenu', scrollEl);
    var speedMenu = $('#speedMenu', scrollEl);
    var qBtn = $('#qualityBtn', scrollEl);
    var sBtn = $('#speedBtn', scrollEl);
    var fsBtn = $('#fsBtn', scrollEl);
    var playBtn = $('#playBtn', scrollEl);
    var muteBtn = $('#muteBtn', scrollEl);
    var vol = $('#vol', scrollEl);
    var seek = $('#seek', scrollEl);
    var track = $('.seek-track', seek);
    var fill = $('#seekFill', scrollEl);
    var buf = $('#seekBuf', scrollEl);
    var knob = $('#seekKnob', scrollEl);
    var tip = $('#seekTip', scrollEl);
    var timeText = $('#timeText', scrollEl);
    var dmLayer = $('#dmLayer', scrollEl);
    var dmBtn = $('#dmBtn', scrollEl);
    if (!stage || !video) return;

    var qualities = [{ id: '', label: '自动' }].concat(play.qualities || []);
    var currentQ = play.current || '';
    var rates = [2, 1.5, 1.25, 1, 0.75];
    var rate = Number(LS.get('rate', 1));
    if (!isFinite(rate) || rate <= 0) rate = 1;
    var started = false;
    var dragging = false;
    var lastSave = 0;
    var cid = activeCid || (detail.pages && detail.pages[0] && detail.pages[0].cid) || detail.cid || '';
    var savedVol = Number(LS.get('volume', 0.8));
    if (!isFinite(savedVol)) savedVol = 0.8;

    video.volume = clamp(savedVol, 0, 1);
    video.playbackRate = rate;
    vol.value = String(video.volume);
    updateVolIcon();
    updateQBtn();
    updateSpeedBtn();

    /* ---- 弹幕：默认开启，开关写入 bili26.dm，失败时如实提示，不伪造 ---- */
    var dmOn = LS.get('dm', true) !== false;
    var dmItems = [];
    var dmLoaded = false;
    var dmLoading = false;
    var dmUnavailable = false;
    var dmLanes = [];
    var DM_LANES = 7;

    function paintDm() {
      if (!dmLayer || !dmBtn) return;
      dmLayer.classList.toggle('off', !dmOn);
      dmBtn.classList.toggle('dm-off', !dmOn);
      dmBtn.classList.toggle('dm-na', dmUnavailable);
      dmBtn.title = dmUnavailable
        ? '弹幕接口暂不可用（B 站风控），可切到 iframe 模式观看'
        : (dmOn ? '关闭弹幕' : '开启弹幕');
    }

    function resetDmLanes() {
      dmLanes = [];
      for (var i = 0; i < DM_LANES; i++) dmLanes.push(0);
    }

    function clearDm() {
      if (dmLayer) dmLayer.innerHTML = '';
      resetDmLanes();
    }

    function spawnDm(d) {
      if (!dmLayer) return;
      var w = dmLayer.clientWidth || 640;
      var t = video.currentTime;
      var lane = 0, bestUntil = Infinity;
      for (var i = 0; i < DM_LANES; i++) {
        if (dmLanes[i] <= t) { lane = i; break; }
        if (dmLanes[i] < bestUntil) { bestUntil = dmLanes[i]; lane = i; }
      }
      var dur = clamp(w / 110, 6.5, 11);
      dmLanes[lane] = t + dur * 0.55;
      var node = document.createElement('div');
      node.className = 'dmitem';
      node.textContent = d.x;
      node.style.top = (lane * 28 + 6) + 'px';
      if (d.c && d.c !== 16777215) {
        node.style.color = '#' + ('000000' + Number(d.c).toString(16)).slice(-6);
      }
      dmLayer.appendChild(node);
      node.style.setProperty('--dm-shift', '-' + (w + node.offsetWidth + 24) + 'px');
      node.style.animationDuration = dur + 's';
      node.addEventListener('animationend', function () {
        if (node.parentNode) node.parentNode.removeChild(node);
      });
    }

    function dmTick() {
      if (!dmOn || !dmLoaded || !dmLayer) return;
      var t = video.currentTime;
      for (var i = 0; i < dmItems.length; i++) {
        var d = dmItems[i];
        if (d.shown) continue;
        if (d.t > t + 0.4) break;
        if (d.t >= t - 1.2) spawnDm(d);
        d.shown = true;
      }
    }

    function loadDm() {
      if (!dmOn || dmLoaded || dmLoading) return;
      if (!cid) {
        dmUnavailable = true;
        paintDm();
        return;
      }
      dmLoading = true;
      apiGet('/api/bili/danmaku', { cid: cid }, 15000).then(function (d) {
        dmLoading = false;
        var list = (d && d.items) || [];
        dmItems = [];
        list.forEach(function (it) {
          var txt = String((it && it.x) || '').trim();
          var at = Number(it && it.t);
          if (!txt || !isFinite(at) || at < 0) return;
          dmItems.push({ t: at, x: txt.slice(0, 80), c: Number(it.c) || 16777215, shown: false });
        });
        dmItems.sort(function (a, b) { return a.t - b.t; });
        dmLoaded = true;
        dmUnavailable = !dmItems.length;
        paintDm();
        if (dmUnavailable) toast('这个视频暂时没有拉到弹幕');
      }).catch(function () {
        dmLoading = false;
        dmUnavailable = true;
        paintDm();
        toast('弹幕接口暂不可用，可切到 iframe 模式观看');
      });
    }

    if (dmBtn) {
      dmBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        dmOn = !dmOn;
        LS.set('dm', dmOn);
        if (!dmOn) clearDm();
        paintDm();
        if (dmOn) {
          toast('弹幕已开启');
          loadDm();
        } else {
          toast('弹幕已关闭');
        }
      });
    }
    resetDmLanes();
    paintDm();
    loadDm();

    function rateLabel(r) { return (r === 1 ? '1.0' : String(r)) + 'x'; }

    function updateQBtn() {
      var label = '自动';
      qualities.forEach(function (q) { if (String(q.id) === String(currentQ)) label = q.label; });
      qBtn.textContent = label;
    }

    function updateSpeedBtn() { sBtn.textContent = rateLabel(rate); }

    function updateVolIcon() {
      var muted = video.muted || video.volume === 0;
      muteBtn.innerHTML = '<i class="fa-solid ' + (muted ? 'fa-volume-xmark' : 'fa-volume-high') + '"></i>';
      muteBtn.classList.toggle('on', muted);
    }

    function updateSeek() {
      var d = video.duration;
      if (!isFinite(d) || d <= 0) {
        fill.style.width = '0%';
        knob.style.left = '0%';
        timeText.textContent = '--:-- / --:--';
        return;
      }
      var p = clamp(video.currentTime / d, 0, 1);
      fill.style.width = (p * 100) + '%';
      knob.style.left = (p * 100) + '%';
      timeText.textContent = clock(video.currentTime) + ' / ' + clock(d);
      try {
        if (video.buffered.length) {
          buf.style.width = (video.buffered.end(video.buffered.length - 1) / d * 100) + '%';
        }
      } catch (e) {}
    }

    function updatePlayIcon() {
      var paused = video.paused;
      playBtn.innerHTML = '<i class="fa-solid ' + (paused ? 'fa-play' : 'fa-pause') + '"></i>';
      if (!started) {
        bigPlay.classList.remove('hide');
      } else {
        bigPlay.classList.toggle('hide', !paused);
      }
    }

    function showErr(msg) {
      errEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>' +
        '<b>播放失败</b>' +
        '<small>' + esc(msg || '未获取到播放地址') + '</small>' +
        '<button class="retry" id="pErrRetry">重试</button>';
      errEl.classList.add('show');
      var retry = $('#pErrRetry', errEl);
      if (retry) retry.addEventListener('click', function (e) {
        e.stopPropagation();
        retryPlay();
      });
    }

    function hideErr() { errEl.classList.remove('show'); }

    function saveProgress(force) {
      var d = video.duration;
      var t = video.currentTime;
      if (!isFinite(d) || d <= 0 || !t) return;
      if (!force && Date.now() - lastSave < 2500) return;
      lastSave = Date.now();
      remember({
        bvid: detail.bvid,
        title: detail.title,
        cover: detail.cover,
        author: detail.owner && detail.owner.name ? detail.owner.name : detail.author,
        duration: d
      }, t, d);
    }

    function setSource(url, resumeTime) {
      if (!url) { showErr(play.error || '未获取到播放地址'); return; }
      var keep = resumeTime || 0;
      hideErr();
      video.src = url;
      video.load();
      if (keep > 0) {
        video.addEventListener('loadedmetadata', function () {
          try { video.currentTime = keep; } catch (e) {}
          updateSeek();
        }, { once: true });
      }
      video.play().catch(function () { updatePlayIcon(); });
    }

    function retryPlay() {
      hideErr();
      apiGet('/api/bili/play', { bvid: detail.bvid, cid: cid, q: currentQ }, 30000).then(normalizePlay).then(function (np) {
        if (!np.url) throw new Error(np.error || '接口没有返回播放地址');
        if (!np.qualities.length) np.qualities = qualities.slice(1);
        var t = video.currentTime;
        setSource(np.url, t);
        toast('正在重新获取播放地址');
      }).catch(function (e) {
        showErr(reasonText(e));
      });
    }

    function togglePlay() {
      if (!video.src) { showErr(play.error || '未获取到播放地址'); return; }
      if (video.paused) {
        video.play().catch(function () { showErr('无法开始播放，请检查网络后重试'); });
      } else {
        video.pause();
      }
    }

    function toggleFs() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(function () {});
      } else if (stage.requestFullscreen) {
        stage.requestFullscreen().catch(function () { toast('当前环境不支持全屏'); });
      } else {
        toast('当前环境不支持全屏');
      }
    }

    function closeMenus() {
      qualityMenu.classList.remove('show');
      speedMenu.classList.remove('show');
    }

    function buildQualityMenu() {
      qualityMenu.innerHTML = '';
      qualities.forEach(function (q) {
        var b = document.createElement('button');
        b.className = 'pmenu-item' + (String(q.id) === String(currentQ) ? ' on' : '');
        b.innerHTML = '<span>' + esc(q.label) + '</span>' + (String(q.id) === String(currentQ) ? '<i class="fa-solid fa-check"></i>' : '');
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          switchQuality(q);
        });
        qualityMenu.appendChild(b);
      });
    }

    function switchQuality(q) {
      closeMenus();
      if (!video.src) {
        showErr(play.error || '未获取到播放地址');
        return;
      }
      var oldTime = video.currentTime;
      var wasPlaying = !video.paused;
      qBtn.textContent = '切换中';
      apiGet('/api/bili/play', { bvid: detail.bvid, cid: cid, q: q.id }, 30000).then(normalizePlay).then(function (np) {
        if (!np.url) throw new Error('该清晰度暂无播放地址');
        currentQ = q.id;
        updateQBtn();
        buildQualityMenu();
        video.src = np.url;
        video.load();
        video.addEventListener('loadedmetadata', function () {
          try { video.currentTime = oldTime; } catch (e) {}
          if (wasPlaying) video.play().catch(function () {});
          updateSeek();
        }, { once: true });
        toast('已切换到 ' + q.label);
      }).catch(function (e) {
        updateQBtn();
        buildQualityMenu();
        toast('清晰度切换失败：' + ((e && e.message) || '未知错误'));
      });
    }

    function buildSpeedMenu() {
      speedMenu.innerHTML = '';
      rates.forEach(function (r) {
        var b = document.createElement('button');
        b.className = 'pmenu-item' + (r === rate ? ' on' : '');
        b.innerHTML = '<span>' + rateLabel(r) + '</span>' + (r === rate ? '<i class="fa-solid fa-check"></i>' : '');
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          rate = r;
          video.playbackRate = r;
          LS.set('rate', r);
          updateSpeedBtn();
          buildSpeedMenu();
          closeMenus();
          toast('播放速度 ' + rateLabel(r));
        });
        speedMenu.appendChild(b);
      });
    }

    function markStart() {
      started = true;
      poster.classList.add('hide');
      video.classList.add('ready');
      hideErr();
      updatePlayIcon();
    }

    /* --- 事件绑定 --- */
    if (play.url) {
      video.src = play.url;
    } else {
      showErr(play.error || '未获取到播放地址');
    }

    playBtn.addEventListener('click', function (e) { e.stopPropagation(); togglePlay(); });
    bigPlay.addEventListener('click', function (e) { e.stopPropagation(); togglePlay(); });
    stage.addEventListener('click', function (e) {
      if (e.target.closest('.pcontrols, .pmenu, .perr, .bigplay')) return;
      togglePlay();
    });

    video.addEventListener('loadedmetadata', function () {
      updateSeek();
      var h = progressMap()[detail.bvid];
      if (h && h.t > 3 && isFinite(video.duration) && h.t < video.duration - 3) {
        try { video.currentTime = h.t; } catch (e) {}
        toast('已从上次 ' + clock(h.t) + ' 继续播放');
        updateSeek();
      }
    });
    video.addEventListener('durationchange', updateSeek);
    video.addEventListener('timeupdate', function () { updateSeek(); saveProgress(false); dmTick(); });
    video.addEventListener('progress', updateSeek);
    video.addEventListener('playing', markStart);
    video.addEventListener('play', function () {
      updatePlayIcon();
      if (dmLayer) dmLayer.classList.remove('paused');
    });
    video.addEventListener('pause', function () {
      updatePlayIcon();
      saveProgress(true);
      if (dmLayer) dmLayer.classList.add('paused');
    });
    video.addEventListener('seeking', function () {
      clearDm();
      dmItems.forEach(function (d) { d.shown = d.t < video.currentTime; });
    });
    video.addEventListener('seeked', dmTick);
    video.addEventListener('ended', function () { saveProgress(true); updatePlayIcon(); });
    video.addEventListener('error', function () {
      showErr('视频加载失败：播放地址不可用或代理异常，点重试重新获取');
    });

    vol.addEventListener('input', function () {
      var v = Number(vol.value);
      video.volume = v;
      video.muted = v === 0;
      LS.set('volume', v);
      updateVolIcon();
    });
    muteBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      video.muted = !video.muted;
      if (!video.muted && video.volume === 0) {
        video.volume = 0.5;
        vol.value = '0.5';
      }
      LS.set('volume', video.volume);
      updateVolIcon();
    });

    function seekPercent(clientX) {
      var r = track.getBoundingClientRect();
      return clamp((clientX - r.left) / (r.width || 1), 0, 1);
    }
    function seekTo(clientX) {
      if (!isFinite(video.duration) || video.duration <= 0) return;
      video.currentTime = seekPercent(clientX) * video.duration;
      updateSeek();
    }
    seek.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      seek.classList.add('dragging');
      seekTo(e.clientX);
      function move(ev) { seekTo(ev.clientX); }
      function up() {
        dragging = false;
        seek.classList.remove('dragging');
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        saveProgress(true);
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
    seek.addEventListener('pointermove', function (e) {
      if (!isFinite(video.duration) || video.duration <= 0) return;
      var p = seekPercent(e.clientX);
      tip.style.left = (p * 100) + '%';
      tip.textContent = clock(p * video.duration);
    });

    qBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = qualityMenu.classList.contains('show');
      closeMenus();
      if (!open) qualityMenu.classList.add('show');
    });
    sBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = speedMenu.classList.contains('show');
      closeMenus();
      if (!open) speedMenu.classList.add('show');
    });
    fsBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleFs(); });

    buildQualityMenu();
    buildSpeedMenu();
    updateSeek();
    updatePlayIcon();

    if (menuDocHandler) document.removeEventListener('click', menuDocHandler);
    menuDocHandler = function (e) {
      if (!e.target.closest('#qualityMenu, #speedMenu, #qualityBtn, #speedBtn')) closeMenus();
    };
    document.addEventListener('click', menuDocHandler);

    if (fsChangeHandler) document.removeEventListener('fullscreenchange', fsChangeHandler);
    fsChangeHandler = function () {
      var full = !!document.fullscreenElement;
      fsBtn.innerHTML = '<i class="fa-solid ' + (full ? 'fa-compress' : 'fa-expand') + '"></i>';
    };
    document.addEventListener('fullscreenchange', fsChangeHandler);

    window.addEventListener('pagehide', function () { saveProgress(true); });
    window.addEventListener('beforeunload', function () { saveProgress(true); });
  }

  /* ======================= 渲染分发 / 启动 ======================= */
  function render() {
    var token = ++renderToken;
    if (feedIO) { feedIO.disconnect(); feedIO = null; }
    var r = S.route || { view: 'feed', kind: 'recommend', nav: 'recommend' };
    updateChrome(r);
    pendingRestore = (typeof r.scroll === 'number') ? r.scroll : null;
    if (pendingRestore == null) scrollEl.scrollTop = 0;
    try {
      if (r.view === 'feed') viewFeed(r, token);
      else if (r.view === 'cats') viewCats();
      else if (r.view === 'search') viewSearch(r, token);
      else if (r.view === 'history') viewHistory();
      else if (r.view === 'fav') viewFav();
      else if (r.view === 'me') viewMe();
      else if (r.view === 'detail') viewDetail(r, token);
      else viewFeed({ view: 'feed', kind: 'recommend', nav: 'recommend' }, token);
    } catch (e) {
      scrollEl.innerHTML = '<div class="view">' + hardError(e && e.message) + '</div>';
      var hr = $('#hardRetry', scrollEl);
      if (hr) hr.addEventListener('click', function () {
        S.stack = [S.stack[0] || { view: 'feed', kind: 'recommend', nav: 'recommend' }];
        S.idx = 0;
        S.route = S.stack[0];
        render();
      });
    }
  }

  /* ================= 原生 / iframe 模式切换 =================
     默认原生；选择写入 localStorage 的 n26.bili.mode，重开应用保持。
     iframe 用 sandbox 禁掉 popup 与顶层跳转，避免把用户带出应用。 */
  var MODE_KEY = 'n26.bili.mode';
  var APP_MODE = 'native';
  var frameLoaded = false;
  var frameTimer = 0;
  var modeBtn = document.getElementById('modeBtn');
  var modePop = document.getElementById('modePop');
  var paneNative = document.getElementById('paneNative');
  var paneFrame = document.getElementById('paneFrame');
  var frameLoad = document.getElementById('frameLoad');
  var biliFrame = document.getElementById('biliFrame');

  function readMode() {
    /* 明确约束：不允许打开外站，全部走 /api/bili/*。历史遗留的 iframe 记录一律回到原生。 */
    try { localStorage.setItem(MODE_KEY, 'native'); } catch (e) {}
    return 'native';
  }
  function writeMode(m) {
    try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
  }
  function paintMode() {
    var on = APP_MODE === 'iframe';
    document.body.setAttribute('data-bili-mode', APP_MODE);
    if (paneNative) {
      paneNative.classList.toggle('on', !on);
      paneNative.setAttribute('aria-hidden', on ? 'true' : 'false');
    }
    if (paneFrame) {
      paneFrame.classList.toggle('on', on);
      paneFrame.setAttribute('aria-hidden', on ? 'false' : 'true');
    }
    if (modePop) {
      $$('.mode-opt', modePop).forEach(function (b) {
        b.setAttribute('aria-checked', b.getAttribute('data-mode') === APP_MODE ? 'true' : 'false');
      });
    }
    if (modeBtn) modeBtn.setAttribute('aria-expanded', (modePop && !modePop.hidden) ? 'true' : 'false');
  }
  function ensureFrame() {
    if (!biliFrame || biliFrame.getAttribute('src')) return;
    biliFrame.setAttribute('src', 'https://www.bilibili.com/');
  }
  if (biliFrame) {
    biliFrame.addEventListener('load', function () {
      if (!biliFrame.getAttribute('src')) return;
      frameLoaded = true;
      clearTimeout(frameTimer);
      if (frameLoad) frameLoad.classList.add('off');
    });
  }
  function setAppMode(next, opts) {
    /* iframe 网页版入口已关闭：不允许把用户带到外站 */
    next = 'native';
    opts = opts || {};
    APP_MODE = next;
    if (!opts.keepStore) writeMode(next);
    if (next === 'iframe') {
      ensureFrame();
      if (!frameLoaded && frameLoad) {
        frameLoad.classList.remove('off');
        clearTimeout(frameTimer);
        frameTimer = setTimeout(function () {
          if (frameLoaded) return;
          var b = frameLoad.querySelector('b');
          var s = frameLoad.querySelector('small');
          if (b) b.textContent = '网页版加载较慢…';
          if (s) s.textContent = '若一直空白，说明 B 站拒绝被嵌入，请切回原生';
        }, 12000);
      }
    }
    paintMode();
    updateChrome(S.route);
    if (!opts.silent) toast(next === 'iframe' ? '已切到 iframe B 站，重开应用会保持' : '已切回原生 API，重开应用会保持');
  }
  function bindModeSwitch() {
    APP_MODE = readMode();
    writeMode(APP_MODE); /* 首次进入也落盘：默认 native */
    paintMode();
    if (APP_MODE === 'iframe') setAppMode('iframe', { silent: true, keepStore: true });
    if (modeBtn && modePop) {
      modeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        modePop.hidden = !modePop.hidden;
        modeBtn.setAttribute('aria-expanded', modePop.hidden ? 'false' : 'true');
      });
      $$('.mode-opt', modePop).forEach(function (b) {
        b.addEventListener('click', function () {
          modePop.hidden = true;
          modeBtn.setAttribute('aria-expanded', 'false');
          setAppMode(b.getAttribute('data-mode'));
        });
      });
      document.addEventListener('click', function (e) {
        if (modePop.hidden) return;
        if (modePop.contains(e.target) || modeBtn.contains(e.target)) return;
        modePop.hidden = true;
        modeBtn.setAttribute('aria-expanded', 'false');
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !modePop.hidden) {
          modePop.hidden = true;
          modeBtn.setAttribute('aria-expanded', 'false');
        }
      });
    }
    /* iframe 模式下原生导航/搜索已隐藏，不再「点一下就偷偷切回原生」——
       切回原生只能由用户主动点右上角齿轮，选择会被记住。 */
  }

  function bindGestureBus() {
    var tries = 0;
    (function wait() {
      var g = window.N26Gestures;
      if (g && typeof g.on === 'function') {
        /* 左右边缘滑动 → 应用自身的路由前进/后退 */
        g.on('edge', function (d) {
          if (!d || !d.side) return;
          if (d.side === 'left') goBack();
          else if (d.side === 'right') goForward();
        });
        /* 封面捏合由手势层 auto 模式直接缩放 img；点一下复位 */
        var lastPinch = null;
        g.on('pinchend', function (d) {
          if (d && d.target && d.scale && Math.abs(d.scale - 1) > 0.02) lastPinch = d.target;
        });
        document.addEventListener('click', function () {
          if (lastPinch && typeof g.resetPinch === 'function') g.resetPinch(lastPinch);
          lastPinch = null;
        }, true);
        return;
      }
      if (++tries >= 30) return;
      setTimeout(wait, 100);
    })();
  }

  function readQuery() {
    var qp = {};
    try { qp = Object.fromEntries(new URLSearchParams(location.search)); } catch (e) {}
    return qp;
  }

  function initRoute() {
    var qp = readQuery();
    if (qp.view === 'search') return { view: 'search', keyword: qp.q || '', nav: 'search', focus: false };
    if (qp.view === 'video') return { view: 'detail', bvid: qp.bvid || '', nav: 'recommend', item: null };
    if (qp.view === 'detail') return { view: 'detail', bvid: qp.bvid || '', nav: 'recommend', item: null };
    if (qp.view === 'history') return { view: 'history', nav: 'history' };
    if (qp.view === 'me') return { view: 'me', nav: 'me' };
    if (qp.view === 'cats' || qp.view === 'category') return { view: 'cats', nav: 'category' };
    if (qp.view === 'hot') return { view: 'feed', kind: 'hot', nav: 'hot' };
    return { view: 'feed', kind: 'recommend', nav: 'recommend' };
  }

  initTheme();

  S.route = initRoute();
  S.stack = [S.route];
  S.idx = 0;

  $$('.rail-item').forEach(function (btn) {
    btn.addEventListener('click', function () { navTo(btn.getAttribute('data-nav')); });
  });
  if (backBtn) backBtn.addEventListener('click', goBack);
  if (fwdBtn) fwdBtn.addEventListener('click', goForward);
  renderAccountBtn();
  restoreLogin();
  bindModeSwitch();
  bindGestureBus();
  if (acctBtn) acctBtn.addEventListener('click', function () { navTo('me'); });

  if (topSearchForm) {
    topSearchForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var q = topSearch ? topSearch.value.trim() : '';
      if (!q) { if (topSearch) topSearch.focus(); toast('先输入要搜索的内容'); return; }
      navigate({ view: 'search', keyword: q, nav: 'search', focus: true });
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      $$('.pmenu.show', scrollEl).forEach(function (m) { m.classList.remove('show'); });
    }
    if (S.route && S.route.view !== 'detail') return;
    if (e.code !== 'Space' && e.key !== 'k') return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    var v = $('#video', scrollEl);
    if (!v) return;
    e.preventDefault();
    if (v.paused) { v.play().catch(function () {}); } else { v.pause(); }
  });

  window.addEventListener('error', function (e) {
    if (!scrollEl.innerHTML.trim()) {
      scrollEl.innerHTML = '<div class="view">' + hardError(e && e.message) + '</div>';
      var hr = $('#hardRetry', scrollEl);
      if (hr) hr.addEventListener('click', function () { render(); });
    }
  });

  render();
})();
</script>
</body>
