<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配色实验室</title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/glass.css">
<style>
  html, body { height: 100%; margin: 0; font-family: var(--font-sans); }
  body { background: transparent; overflow: hidden; }
  #app { height: 100%; }
  .colorlab-app { padding: 20px; overflow-y: auto; height: 100%; color: white; box-sizing: border-box; }
  .colorlab-section { margin-bottom: 25px; }
  .colorlab-section h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .colorlab-extracted { display: flex; align-items: center; gap: 12px; padding: 14px; background: rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 10px; }
  .colorlab-swatch { width: 56px; height: 56px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: transform var(--dur-fast) var(--ease-spring); }
  .colorlab-swatch:hover { transform: scale(1.08); }
  .colorlab-info { flex: 1; }
  .colorlab-hex { font-size: 16px; font-weight: 600; }
  .colorlab-rgb { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; }
  .colorlab-scheme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .colorlab-scheme-card { padding: 10px; background: rgba(255,255,255,0.06); border-radius: 10px; cursor: pointer; transition: background var(--dur-fast) var(--ease-out-quart); }
  .colorlab-scheme-card:hover { background: rgba(255,255,255,0.12); }
  .colorlab-scheme-color { height: 50px; border-radius: 8px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.1); }
  .colorlab-scheme-label { font-size: 11px; color: rgba(255,255,255,0.7); text-align: center; }
  .colorlab-apply-hint { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 8px; }
  .colorlab-placeholder { color: rgba(255,255,255,0.5); font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../ui/motion.js"></script>
<script src="_bridge.js"></script>
<script src="_app.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  function hexToRgb(hex) { return { r: parseInt(hex.slice(1, 3), 16), g: parseInt(hex.slice(3, 5), 16), b: parseInt(hex.slice(5, 7), 16) }; }
  function rgbToHex(r, g, b) { return '#' + [r, g, b].map(function (x) { return Math.round(x).toString(16).padStart(2, '0'); }).join(''); }
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    function k(n) { return (n + h / 30) % 12; }
    var a = s * Math.min(l, 1 - l);
    function f(n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); }
    return rgbToHex(255 * f(0), 255 * f(8), 255 * f(4));
  }
  function hexToHsl(hex) {
    var c = hexToRgb(hex), rn = c.r / 255, gn = c.g / 255, bn = c.b / 255;
    var max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
    var h, s, l = (max + min) / 2;
    if (max === min) { h = s = 0; }
    else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === rn) h = (gn - bn) / d + (gn < bn ? 6 : 0);
      else if (max === gn) h = (bn - rn) / d + 2;
      else h = (rn - gn) / d + 4;
      h /= 6;
    }
    return { h: h * 360, s: s * 100, l: l * 100 };
  }

  function render() {
    app.innerHTML =
      '<div class="colorlab-app">' +
        '<div class="colorlab-section">' +
          '<h3><i class="fas fa-eye-dropper" style="color:var(--primary);"></i> 壁纸主色调提取</h3>' +
          '<div id="colorlabExtracted"><div class="colorlab-placeholder">点击下方按钮从当前壁纸提取主色调</div></div>' +
          '<button class="glass-btn" style="margin-top:10px;padding:8px 16px;font-size:13px;" id="colorlabExtractBtn"><i class="fas fa-sync-alt"></i> 提取壁纸颜色</button>' +
        '</div>' +
        '<div class="colorlab-section">' +
          '<h3><i class="fas fa-palette" style="color:#ec4899;"></i> 配色方案</h3>' +
          '<div id="colorlabSchemes"><div class="colorlab-placeholder">先提取主色调后生成配色方案</div></div>' +
          '<div class="colorlab-apply-hint">点击任意颜色可直接应用为系统主题色</div>' +
        '</div>' +
      '</div>';
    app.querySelector('#colorlabExtractBtn').addEventListener('click', extract);
  }

  async function extract() {
    var bgUrl = '';
    try { bgUrl = await Nexus.call('getWallpaper'); } catch (e) { bgUrl = ''; }
    if (!bgUrl) {
      var s = (await Nexus.getUserLS('settings')) || {};
      var accent = s.accentColor || 'blue';
      var colorMap = { blue: '#4A9BF5', green: '#34D399', purple: '#A78BFA', orange: '#FB923C', pink: '#F472B6' };
      showExtracted(colorMap[accent] || '#4A9BF5');
      return;
    }
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function () {
      var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
      canvas.width = 100; canvas.height = 60;
      ctx.drawImage(img, 0, 0, 100, 60);
      try {
        var data = ctx.getImageData(0, 0, 100, 60).data;
        var r = 0, g = 0, b = 0, count = 0;
        for (var i = 0; i < data.length; i += 4) {
          var pr = data[i], pg = data[i + 1], pb = data[i + 2];
          var br = (pr + pg + pb) / 3;
          if (br < 30 || br > 230) continue;
          r += pr; g += pg; b += pb; count++;
        }
        if (count === 0) { r = 74; g = 155; b = 245; } else { r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count); }
        showExtracted(rgbToHex(r, g, b));
      } catch (e) { showExtracted('#4A9BF5'); }
    };
    img.onerror = function () { showExtracted('#4A9BF5'); };
    img.src = bgUrl;
  }

  function showExtracted(hex) {
    var c = hexToRgb(hex);
    var container = app.querySelector('#colorlabExtracted');
    if (!container) return;
    container.innerHTML =
      '<div class="colorlab-extracted">' +
        '<div class="colorlab-swatch" style="background:' + hex + ';" data-apply="' + hex + '"></div>' +
        '<div class="colorlab-info"><div class="colorlab-hex">' + hex.toUpperCase() + '</div>' +
        '<div class="colorlab-rgb">RGB(' + c.r + ', ' + c.g + ', ' + c.b + ')</div></div>' +
      '</div>';
    generateSchemes(hex);
  }

  function generateSchemes(hex) {
    var c = hexToHsl(hex), h = c.h, s = c.s, l = c.l;
    var schemes = [
      { label: '主色', color: hex },
      { label: '互补色', color: hslToHex((h + 180) % 360, s, l) },
      { label: '类似色 1', color: hslToHex((h + 30) % 360, s, l) },
      { label: '类似色 2', color: hslToHex((h + 330) % 360, s, l) },
      { label: '三角色 1', color: hslToHex((h + 120) % 360, s, l) },
      { label: '三角色 2', color: hslToHex((h + 240) % 360, s, l) },
      { label: '亮色', color: hslToHex(h, s, Math.min(85, l + 25)) },
      { label: '暗色', color: hslToHex(h, s, Math.max(15, l - 25)) }
    ];
    var container = app.querySelector('#colorlabSchemes');
    if (!container) return;
    container.innerHTML = '<div class="colorlab-scheme-grid">' + schemes.map(function (sc) {
      return '<div class="colorlab-scheme-card" data-apply="' + sc.color + '">' +
        '<div class="colorlab-scheme-color" style="background:' + sc.color + ';"></div>' +
        '<div class="colorlab-scheme-label">' + sc.label + '<br><span style="font-size:10px;opacity:0.6;">' + sc.color.toUpperCase() + '</span></div></div>';
    }).join('') + '</div>';
    app.querySelectorAll('[data-apply]').forEach(function (el) {
      el.addEventListener('click', function () { apply(el.getAttribute('data-apply')); });
    });
  }

  async function apply(color) {
    await Nexus.call('setAccentColor', color);
    Nexus.notify('配色应用', '已将 ' + color.toUpperCase() + ' 设为主题色', 'success');
  }

  Nexus.ready(function () { render(); setTimeout(extract, 300); });
})();
</script>
</body>
</html>
