<!DOCTYPE html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方聊</title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/glass.css">
<link rel="stylesheet" href="../vendor/fontawesome/all.min.css">
<style>
/* ============================================================
   方聊 · 独立 iframe 应用（apps/fangchat.html）
   微信基本盘：会话列表 / 聊天 / 通讯录（拼音索引）/ 我的 / 设置
   强调色取自方聊图标（#33ED00 荧光绿），按钮与文字取可读的深绿档，
   荧光绿只用于选中条、指示点、开关轨道等「色块」。
   ============================================================ */
:root{
  --fc-accent:#0B8A00;
  --fc-accent-ink:#0A6E00;
  --fc-brand:#33ED00;
  --fc-accent-soft:rgba(51,237,0,.13);
  --fc-accent-line:rgba(51,237,0,.50);
  --fc-send-a:#26C600;
  --fc-send-b:#0A6E00;
  --fc-bub-out:#0C7D00;
  --fc-bub-out-fg:#FFFFFF;
  --fc-bub-in:rgba(255,255,255,.86);
  --fc-panel-rail:rgba(255,255,255,.46);
  --fc-panel-side:rgba(255,255,255,.40);
  --fc-panel-main:rgba(255,255,255,.30);
  --fc-border:rgba(255,255,255,.62);
  --fc-border-2:rgba(15,23,42,.07);
  --fc-inner:inset 0 1px 0 rgba(255,255,255,.70);
  --fc-line:rgba(15,23,42,.075);
  --fc-hover:rgba(15,23,42,.045);
  --fc-chip:rgba(15,23,42,.055);
  --fc-text-sub:rgba(15,23,42,.55);
  --fc-text-meta:rgba(15,23,42,.40);
  --fc-shadow:0 6px 20px rgba(20,40,70,.09);
  --fc-danger:#DC2626;
  --fc-danger-soft:rgba(239,68,68,.12);
  --fc-overlay:rgba(15,23,42,.30);
  --fc-modal:rgba(252,252,254,.97);
}
body.dark-mode{
  --fc-accent:#8CFF6E;
  --fc-accent-ink:#DCFFD2;
  --fc-brand:#56FF2E;
  --fc-accent-soft:rgba(51,237,0,.17);
  --fc-accent-line:rgba(86,255,46,.55);
  --fc-send-a:#2FD800;
  --fc-send-b:#0A6E00;
  --fc-bub-out:#0F6B10;
  --fc-bub-out-fg:#F4FFF2;
  --fc-bub-in:rgba(255,255,255,.10);
  --fc-panel-rail:rgba(255,255,255,.055);
  --fc-panel-side:rgba(255,255,255,.045);
  --fc-panel-main:rgba(255,255,255,.030);
  --fc-border:rgba(255,255,255,.12);
  --fc-border-2:rgba(255,255,255,.09);
  --fc-inner:inset 0 1px 0 rgba(255,255,255,.12);
  --fc-line:rgba(255,255,255,.10);
  --fc-hover:rgba(255,255,255,.07);
  --fc-chip:rgba(255,255,255,.08);
  --fc-text-sub:rgba(226,232,240,.62);
  --fc-text-meta:rgba(203,213,225,.42);
  --fc-shadow:0 8px 26px rgba(0,0,0,.36);
  --fc-danger:#FF9A9D;
  --fc-danger-soft:rgba(239,68,68,.18);
  --fc-overlay:rgba(5,8,16,.46);
  --fc-modal:rgba(32,36,48,.97);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;font-family:var(--font-sans);}
body{background:transparent;overflow:hidden;color:var(--text-1);font-size:13px;-webkit-font-smoothing:antialiased;}
#app{height:100%;}
body.fc-solo{background:radial-gradient(130% 120% at 8% 0%,#e7eef9 0%,#d3deef 42%,#b9c8dd 100%);}
body.fc-solo.dark-mode{background:radial-gradient(130% 120% at 8% 0%,#1a2130 0%,#111724 45%,#080b13 100%);}

.fc-root{height:100%;display:flex;gap:8px;padding:8px;min-width:0;}
.fc-rail,.fc-side,.fc-main{
  background:var(--fc-panel-side);
  border:1px solid var(--fc-border);
  border-radius:16px;
  box-shadow:var(--fc-inner),var(--fc-shadow);
  min-height:0;
}
.fc-rail{flex:0 0 62px;width:62px;background:var(--fc-panel-rail);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 5px;}
.fc-side{flex:0 0 240px;width:240px;display:flex;flex-direction:column;overflow:hidden;}
.fc-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--fc-panel-main);}

/* ---------- 左侧竖栏 ---------- */
.fc-myav{width:100%;padding:0;border:0;background:transparent;display:flex;justify-content:center;cursor:pointer;border-radius:14px;margin-bottom:6px;}
.fc-myav .fc-av{box-shadow:0 0 0 2px transparent;transition:box-shadow .18s var(--ease-out);}
.fc-myav.active .fc-av{box-shadow:0 0 0 2px var(--fc-brand);}
.fc-myav:hover .fc-av{box-shadow:0 0 0 2px var(--fc-accent-line);}
.fc-tab{position:relative;width:100%;padding:7px 0 6px;border:0;border-radius:11px;background:transparent;color:var(--text-2);font:inherit;font-size:10.5px;font-weight:500;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:background-color .15s var(--ease-out),color .15s var(--ease-out);}
.fc-tab i{font-size:16px;transition:color .2s var(--ease-out);}
.fc-tab:hover{background:var(--fc-hover);color:var(--text-1);}
.fc-tab.active{background:var(--fc-accent-soft);color:var(--fc-accent-ink);font-weight:600;}
.fc-tab.active i{color:var(--fc-accent);}
.fc-tabdirt{position:absolute;top:5px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--fc-danger);box-shadow:0 0 0 2px rgba(255,255,255,.35);}
body.dark-mode .fc-tabdirt{box-shadow:0 0 0 2px rgba(0,0,0,.35);}
.fc-rail-grow{flex:1 1 auto;}
.fc-cloudbtn{width:30px;height:30px;border:1px solid var(--fc-border-2);border-radius:10px;background:var(--fc-chip);color:var(--fc-text-sub);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;position:relative;transition:background-color .16s var(--ease-out);}
.fc-cloudbtn:hover{background:var(--fc-hover);}
.fc-cloudbtn.ok{color:#0A8A00;}
body.dark-mode .fc-cloudbtn.ok{color:#8CFF6E;}
.fc-cloudbtn.fail{color:var(--fc-danger);}
.fc-cloudbtn.checking{color:#B7791F;}
.fc-cloudbtn .dot{position:absolute;right:5px;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--fc-text-meta);}
.fc-cloudbtn.ok .dot{background:#22C55E;}
.fc-cloudbtn.fail .dot{background:#EF4444;}
.fc-cloudbtn.checking .dot{background:#F59E0B;animation:fcPulse 1.1s var(--ease-out) infinite;}
@keyframes fcPulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- 侧栏头部 / 搜索 ---------- */
.fc-side-head{flex:none;display:flex;align-items:center;gap:8px;padding:14px 12px 10px;}
.fc-side-title{flex:1;min-width:0;font-size:15px;font-weight:700;letter-spacing:.2px;margin:0;}
.fc-icbtn{width:28px;height:28px;flex:none;border:0;border-radius:9px;background:var(--fc-chip);color:var(--fc-text-sub);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:background-color .16s var(--ease-out),color .16s var(--ease-out),transform .12s var(--ease-out);}
.fc-icbtn:hover{background:var(--fc-hover);color:var(--text-1);}
.fc-icbtn:active{transform:scale(.94);}
.fc-icbtn.danger:hover{background:var(--fc-danger-soft);color:var(--fc-danger);}
.fc-search{flex:none;display:flex;align-items:center;gap:7px;margin:0 10px 8px;padding:0 9px;height:30px;border-radius:10px;background:var(--fc-chip);border:1px solid transparent;transition:border-color .16s var(--ease-out),background-color .16s var(--ease-out);}
.fc-search:focus-within{border-color:var(--fc-accent-line);background:var(--fc-panel-side);}
.fc-search i{font-size:11px;color:var(--fc-text-meta);flex:none;}
.fc-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:12px;color:inherit;}
.fc-search input::placeholder{color:var(--fc-text-meta);}
.fc-search .fc-clear{width:18px;height:18px;border:0;border-radius:50%;background:var(--fc-chip);color:var(--fc-text-sub);cursor:pointer;font-size:9px;display:none;align-items:center;justify-content:center;}
.fc-search.has .fc-clear{display:flex;}

/* ---------- 会话列表 ---------- */
.fc-side-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 6px 10px;position:relative;}
.fc-thread{position:relative;display:flex;align-items:center;gap:10px;padding:9px 8px 9px 10px;border-radius:12px;cursor:pointer;transition:background-color .14s var(--ease-out);}
.fc-thread:hover{background:var(--fc-hover);}
.fc-thread.active{background:var(--fc-accent-soft);}
.fc-thread.active::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--fc-brand);}
.fc-thread-main{flex:1;min-width:0;}
.fc-trow{display:flex;align-items:center;gap:6px;min-width:0;}
.fc-tname{flex:0 1 auto;min-width:18px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.1px;}
.fc-thread.active .fc-tname{color:var(--fc-accent-ink);}
.fc-ttime{flex:none;margin-left:auto;font-size:10px;color:var(--fc-text-meta);font-variant-numeric:tabular-nums;}
.fc-tprev{flex:1;min-width:0;font-size:11.5px;color:var(--fc-text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.fc-tflag{flex:none;font-size:9.5px;color:var(--fc-accent);}
.fc-tflag.mute{color:var(--fc-text-meta);}
.fc-badge{flex:none;min-width:16px;height:16px;padding:0 5px;border-radius:99px;background:var(--fc-danger);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;}
.fc-muted-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--fc-text-meta);margin-right:3px;}
.fc-empty-list{padding:30px 14px;text-align:center;color:var(--fc-text-meta);}
.fc-empty-list i{font-size:26px;margin-bottom:10px;display:block;opacity:.6;}
.fc-empty-list p{font-size:11.5px;line-height:1.8;margin:0;}
.fc-empty-list button{margin-top:10px;height:26px;padding:0 11px;border:0;border-radius:8px;background:var(--fc-accent-soft);color:var(--fc-accent-ink);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;}

/* ---------- 通讯录 ---------- */
.fc-contact-wrap{padding-right:18px;}
.fc-letter-head{display:flex;align-items:center;gap:8px;padding:6px 6px 4px;margin-top:4px;}
.fc-letter-head span{font-size:10.5px;font-weight:700;color:var(--fc-text-meta);}
.fc-letter-head::after{content:"";flex:1;height:1px;background:var(--fc-line);}
.fc-contact{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:11px;cursor:pointer;transition:background-color .14s var(--ease-out);}
.fc-contact:hover{background:var(--fc-hover);}
.fc-contact.active{background:var(--fc-accent-soft);}
.fc-cname{flex:0 1 auto;min-width:16px;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-cname-row{display:flex;align-items:center;gap:4px;min-width:0;}
.fc-cnote{flex:1;min-width:0;font-size:11px;color:var(--fc-text-meta);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.fc-cchev{flex:none;font-size:9px;color:var(--fc-text-meta);}
.fc-idx{position:sticky;top:0;float:right;width:16px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;z-index:2;}
.fc-idx button{width:14px;height:14px;border:0;border-radius:5px;background:transparent;color:var(--fc-text-meta);font:inherit;font-size:9.5px;line-height:1;cursor:pointer;padding:0;}
.fc-idx button:hover{background:var(--fc-chip);color:var(--fc-accent-ink);}

/* ---------- 我 ---------- */
.fc-menu{padding:2px 4px;}
.fc-menu-item{width:100%;display:flex;align-items:center;gap:10px;padding:10px 9px;border:0;border-radius:11px;background:transparent;color:var(--text-1);font:inherit;font-size:12.5px;font-weight:500;text-align:left;cursor:pointer;transition:background-color .14s var(--ease-out);}
.fc-menu-item i:first-child{width:20px;text-align:center;color:var(--fc-text-sub);font-size:13px;}
.fc-menu-item:hover{background:var(--fc-hover);}
.fc-menu-item.active{background:var(--fc-accent-soft);color:var(--fc-accent-ink);font-weight:600;}
.fc-menu-item.active i:first-child{color:var(--fc-accent);}
.fc-menu-item .chev{margin-left:auto;font-size:9px;color:var(--fc-text-meta);}
.fc-cloud-mini{margin:12px 6px 4px;padding:10px;border-radius:12px;background:var(--fc-chip);font-size:10.5px;line-height:1.7;color:var(--fc-text-sub);}
.fc-cloud-mini b{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-1);margin-bottom:2px;}
.fc-cloud-mini .st-dot{width:6px;height:6px;border-radius:50%;background:var(--fc-text-meta);}
.fc-cloud-mini.ok .st-dot{background:#22C55E;}
.fc-cloud-mini.fail .st-dot{background:#EF4444;}
.fc-cloud-mini.checking .st-dot{background:#F59E0B;}

/* ---------- 头像 ---------- */
.fc-av{flex:none;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;letter-spacing:.5px;position:relative;}
.fc-av img{width:100%;height:100%;object-fit:cover;display:block;}
.fc-av.brand{background:linear-gradient(145deg,#33ED00 0%,#0E9B00 100%);color:#062B00;}
.fc-av.self{background:linear-gradient(145deg,#33ED00 0%,#0E9B00 100%);color:#062B00;}
.fc-av .fc-dot-pos{position:absolute;right:-2px;bottom:-2px;}

/* ---------- 聊天区 ---------- */
.fc-chat-head{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--fc-line);}
.fc-chat-av .fc-av{width:36px;height:36px;}
.fc-chat-txt{flex:1;min-width:0;}
.fc-chat-name{display:flex;align-items:center;gap:5px;min-width:0;font-size:15px;font-weight:700;letter-spacing:.2px;}
.fc-chat-name > .fc-name{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-chat-sub{font-size:10.5px;color:var(--fc-text-sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-chat-acts{display:flex;align-items:center;gap:2px;flex:none;}
.fc-hbtn{width:28px;height:28px;border:0;border-radius:9px;background:transparent;color:var(--fc-text-meta);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:background-color .14s var(--ease-out),color .14s var(--ease-out);}
.fc-hbtn:hover{background:var(--fc-hover);color:var(--text-1);}
.fc-hbtn.on{background:var(--fc-accent-soft);color:var(--fc-accent);}
.fc-hbtn.danger:hover{background:var(--fc-danger-soft);color:var(--fc-danger);}

.fc-banner{flex:none;display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--fc-danger-soft);color:var(--fc-danger);font-size:11px;border-bottom:1px solid var(--fc-line);}
.fc-banner i{font-size:11px;}
.fc-banner span{flex:1;min-width:0;}
.fc-banner button{flex:none;height:22px;padding:0 9px;border:1px solid currentColor;border-radius:7px;background:transparent;color:inherit;font:inherit;font-size:10.5px;cursor:pointer;}

.fc-msgs{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 18px 10px;display:flex;flex-direction:column;}
.fc-day{display:flex;justify-content:center;margin:10px 0 12px;}
.fc-day span{font-size:9.5px;color:var(--fc-text-meta);background:var(--fc-chip);padding:2px 9px;border-radius:99px;font-variant-numeric:tabular-nums;}
.fc-row{display:flex;align-items:flex-start;gap:7px;margin-bottom:10px;animation:fcMsgIn .2s var(--ease-out) both;}
.fc-row.out{flex-direction:row-reverse;}
.fc-row.run{margin-top:-4px;}
@keyframes fcMsgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fc-row{animation:none}}
body.perf-mode .fc-row{animation:none}
.fc-row .fc-av{width:28px;height:28px;margin-top:1px;}
.fc-row.run .fc-av{visibility:hidden;}
.fc-col{display:flex;flex-direction:column;min-width:0;max-width:66%;}
.fc-row.out .fc-col{align-items:flex-end;}
.fc-who{font-size:9.5px;color:var(--fc-text-meta);margin:0 3px 3px;}
.fc-bub{padding:8px 11px;border-radius:13px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--fc-bub-in);border:1px solid var(--fc-border-2);}
.fc-bub.out{background:var(--fc-bub-out);color:var(--fc-bub-out-fg);border-color:transparent;box-shadow:0 2px 10px rgba(10,110,0,.20);}
.fc-bub.img{padding:3px;background:var(--fc-bub-in);}
.fc-bub.out.img{background:var(--fc-bub-out);}
.fc-bub.file{padding:0;overflow:hidden;background:var(--fc-bub-in);}
.fc-bub.out.file{background:var(--fc-bub-out);}
.fc-meta{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--fc-text-meta);margin:3px 4px 0;font-variant-numeric:tabular-nums;}
.fc-meta button{border:0;background:transparent;color:var(--fc-danger);font:inherit;font-size:9.5px;cursor:pointer;padding:0;}
.fc-imgbtn{display:block;border:0;padding:0;background:transparent;cursor:zoom-in;border-radius:10px;overflow:hidden;}
.fc-imgbtn img{display:block;max-width:230px;max-height:270px;width:auto;height:auto;object-fit:cover;border-radius:10px;}
.fc-filebtn{display:flex;align-items:center;gap:10px;width:228px;max-width:100%;padding:10px 11px;border:0;background:transparent;cursor:pointer;color:inherit;text-align:left;font:inherit;}
.fc-fileic{width:36px;height:36px;flex:none;border-radius:9px;background:var(--fc-chip);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--fc-accent);}
.fc-bub.out .fc-fileic{background:rgba(255,255,255,.16);color:#fff;}
.fc-filetxt{flex:1;min-width:0;}
.fc-filename{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-filesize{font-size:10px;color:var(--fc-text-meta);margin-top:2px;}
.fc-bub.out .fc-filesize{color:rgba(255,255,255,.72);}
.fc-system{display:flex;justify-content:center;margin:8px 0;}
.fc-system span{font-size:10px;color:var(--fc-text-meta);max-width:80%;text-align:center;line-height:1.6;padding:3px 10px;border-radius:9px;background:var(--fc-chip);}

.fc-chat-empty,.fc-main-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--fc-text-sub);}
.fc-main-empty .art{width:88px;height:88px;border-radius:24px;background:var(--fc-accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.fc-main-empty .art i{font-size:34px;color:var(--fc-accent);}
.fc-main-empty h3{font-size:14px;font-weight:700;color:var(--text-1);margin:0 0 4px;}
.fc-main-empty p{font-size:11.5px;line-height:1.8;margin:0;max-width:240px;}
.fc-main-empty button{margin-top:14px;height:30px;padding:0 14px;border:0;border-radius:9px;background:var(--fc-send-b);color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer;}

/* ---------- 输入区 ---------- */
.fc-composer{flex:none;padding:8px 12px 12px;position:relative;}
.fc-inputcard{background:var(--fc-panel-side);border:1px solid var(--fc-border-2);border-radius:14px;box-shadow:var(--fc-inner);transition:border-color .16s var(--ease-out);}
.fc-inputcard:focus-within{border-color:var(--fc-accent-line);}
.fc-composer textarea{display:block;width:100%;resize:none;border:0;outline:0;background:transparent;padding:10px 12px 2px;font-family:inherit;font-size:13px;line-height:1.55;color:inherit;height:44px;max-height:112px;overflow-y:auto;}
.fc-composer textarea::placeholder{color:var(--fc-text-meta);}
.fc-inputbar{display:flex;align-items:center;gap:4px;padding:4px 6px 5px 7px;}
.fc-toolbtn{width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--fc-text-sub);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background-color .14s var(--ease-out),color .14s var(--ease-out);}
.fc-toolbtn:hover{background:var(--fc-hover);color:var(--text-1);}
.fc-toolbtn.disabled{opacity:.38;cursor:not-allowed;}
.fc-inputhint{flex:1;min-width:0;font-size:9.5px;color:var(--fc-text-meta);text-align:right;padding-right:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-send{width:32px;height:32px;flex:none;border:0;border-radius:10px;background:linear-gradient(135deg,var(--fc-send-a),var(--fc-send-b));color:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 9px rgba(10,110,0,.26);transition:filter .16s var(--ease-out),opacity .16s var(--ease-out),transform .1s var(--ease-out);}
.fc-send:hover:not(:disabled){filter:brightness(1.07);}
.fc-send:active:not(:disabled){transform:scale(.94);}

/* ---------- 弹层 ---------- */
.fc-pop{position:absolute;bottom:calc(100% - 2px);left:12px;z-index:14;background:var(--fc-modal);border:1px solid var(--fc-border-2);border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.20);padding:8px;animation:fcPop .16s var(--ease-out) both;}
@keyframes fcPop{from{opacity:0;transform:translateY(5px) scale(.98)}to{opacity:1;transform:none}}
.fc-emoji{width:318px;max-width:calc(100vw - 40px);}
.fc-emoji-cat{font-size:9.5px;color:var(--fc-text-meta);padding:3px 5px 5px;font-weight:600;letter-spacing:.4px;}
.fc-emoji-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;}
.fc-emoji-grid button{border:0;background:transparent;border-radius:7px;font-size:17px;line-height:1;height:30px;cursor:pointer;padding:0;transition:background-color .12s var(--ease-out);}

.fc-attach{width:150px;padding:6px;}
.fc-attach button{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border:0;border-radius:9px;background:transparent;color:var(--text-1);font:inherit;font-size:12px;cursor:pointer;}
.fc-attach button:hover{background:var(--fc-hover);}
.fc-attach button i{width:16px;text-align:center;color:var(--fc-accent);font-size:12px;}

/* ---------- 详情页 / 我的页 ---------- */
.fc-page{flex:1;overflow-y:auto;padding:26px 28px 30px;}
.fc-page h1{font-size:18px;font-weight:750;margin:0 0 3px;letter-spacing:.2px;}
.fc-page .lead{font-size:11.5px;color:var(--fc-text-sub);margin:0 0 20px;line-height:1.7;}
.fc-profile-row{display:flex;align-items:center;gap:16px;padding:16px;border-radius:14px;background:var(--fc-chip);margin-bottom:14px;}
.fc-profile-row .fc-av{width:64px;height:64px;border-radius:16px;font-size:26px;}
.fc-profile-info{flex:1;min-width:0;}
.fc-label{font-size:10.5px;color:var(--fc-text-meta);margin-bottom:4px;letter-spacing:.2px;}
.fc-input{width:100%;height:32px;padding:0 10px;border:1px solid var(--fc-border-2);border-radius:9px;background:var(--fc-panel-side);color:inherit;font:inherit;font-size:12.5px;outline:0;transition:border-color .16s var(--ease-out);}
.fc-input:focus{border-color:var(--fc-accent-line);}
.fc-btn{height:30px;padding:0 14px;border:1px solid var(--fc-border-2);border-radius:9px;background:var(--fc-chip);color:inherit;font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:background-color .16s var(--ease-out),transform .1s var(--ease-out);}
.fc-btn:hover{background:var(--fc-hover);}
.fc-btn:active{transform:scale(.97);}
.fc-btn.primary{background:linear-gradient(135deg,var(--fc-send-a),var(--fc-send-b));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(10,110,0,.22);}
.fc-btn.soft{background:var(--fc-accent-soft);border-color:transparent;color:var(--fc-accent-ink);font-weight:600;}
.fc-btn.danger{background:var(--fc-danger-soft);border-color:transparent;color:var(--fc-danger);font-weight:600;}
.fc-sec{margin-top:20px;}
.fc-sec h3{font-size:12px;font-weight:700;margin:0 0 8px;color:var(--fc-text-sub);letter-spacing:.3px;}
.fc-card{padding:14px;border-radius:14px;background:var(--fc-chip);}
.fc-row-line{display:flex;align-items:center;gap:10px;padding:8px 0;}
.fc-row-line + .fc-row-line{border-top:1px solid var(--fc-line);}
.fc-row-line .t{flex:1;min-width:0;}
.fc-row-line .t b{display:block;font-size:12px;font-weight:600;margin-bottom:2px;}
.fc-row-line .t small{display:block;font-size:10.5px;color:var(--fc-text-sub);line-height:1.6;}
.fc-switch{width:38px;height:22px;flex:none;border:0;border-radius:99px;background:var(--fc-chip);position:relative;cursor:pointer;transition:background-color .2s var(--ease-out);}
.fc-switch.on{background:linear-gradient(135deg,var(--fc-send-a),var(--fc-send-b));}
.fc-switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .22s var(--ease-spring);}
.fc-switch.on::after{transform:translateX(16px);}
.fc-chip-status{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:10.5px;font-weight:600;background:var(--fc-chip);color:var(--fc-text-sub);flex:none;}
.fc-chip-status .st-dot{width:6px;height:6px;border-radius:50%;background:var(--fc-text-meta);}
.fc-chip-status.ok{background:rgba(34,197,94,.14);color:#0A7A38;}
body.dark-mode .fc-chip-status.ok{color:#7CFFA8;}
.fc-chip-status.ok .st-dot{background:#22C55E;}
.fc-chip-status.fail{background:var(--fc-danger-soft);color:var(--fc-danger);}
.fc-chip-status.fail .st-dot{background:#EF4444;}
.fc-chip-status.checking{background:rgba(245,158,11,.14);color:#8A5A00;}
body.dark-mode .fc-chip-status.checking{color:#FFC966;}
.fc-chip-status.checking .st-dot{background:#F59E0B;}
.fc-cloud-row{display:flex;gap:8px;margin-top:10px;}
.fc-cloud-row .fc-input{flex:1;}
.fc-hint{font-size:10.5px;color:var(--fc-text-meta);line-height:1.75;margin:9px 0 0;}
.fc-limit{font-size:10.5px;color:var(--fc-text-sub);line-height:1.9;padding-left:16px;margin:0;}
.fc-limit li{margin-bottom:2px;}
.fc-about-brand{display:flex;align-items:center;gap:12px;margin:6px 0 18px;}
.fc-about-brand .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,#33ED00,#0A8A00);display:flex;align-items:center;justify-content:center;color:#062B00;font-size:24px;box-shadow:0 6px 18px rgba(20,150,0,.25);}
.fc-about-brand b{font-size:16px;display:block;}
.fc-about-brand small{font-size:10.5px;color:var(--fc-text-meta);}
.fc-detail-wrap{flex:1;overflow-y:auto;padding:30px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;}
.fc-detail-wrap .fc-av{width:86px;height:86px;border-radius:22px;font-size:34px;margin-bottom:14px;}
.fc-detail-name{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;max-width:100%;margin:0 0 4px;}
.fc-detail-name h2{font-size:18px;margin:0;font-weight:750;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-detail-wrap .note{font-size:11.5px;color:var(--fc-text-sub);margin:0 0 8px;}
.fc-detail-wrap .meta{font-size:10.5px;color:var(--fc-text-meta);}
.fc-detail-acts{display:flex;gap:8px;margin:22px 0 26px;flex-wrap:wrap;justify-content:center;}

.fc-detail-card .r b{color:var(--text-1);font-weight:600;max-width:72%;overflow-wrap:anywhere;text-align:right;}

/* ---------- 账号身份标记：头衔金标 / 蓝 V ----------
   字段为空时整块不渲染；金标在浅色用暖金底 + 深棕字，
   深色换暗金底 + 浅金字，避免荧光感；长头衔按上下文截断。 */
.fc-id{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;min-width:0;line-height:1;vertical-align:middle;}

.fc-honor{flex:0 1 auto;min-width:0;max-width:100%;height:15px;padding:0 5px;border-radius:5px;font-size:9.5px;font-weight:700;line-height:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4A3200;background:linear-gradient(135deg,#FFF6D2 0%,#FFE190 52%,#EEC14A 100%);border:1px solid rgba(146,100,0,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.85);}
body.dark-mode .fc-honor{color:#FFDD9E;background:linear-gradient(135deg,#5A4310 0%,#483409 55%,#382806 100%);border-color:rgba(255,206,110,.30);box-shadow:inset 0 1px 0 rgba(255,224,150,.10);}
.fc-id-list .fc-honor{max-width:52px;}
.fc-id-list .fc-v{width:13px;height:13px;font-size:8.5px;line-height:13px;}
.fc-id-head .fc-honor{max-width:150px;height:16px;line-height:16px;font-size:10px;}
.fc-id-contact .fc-honor{max-width:58px;}
.fc-id-contact .fc-v{width:13px;height:13px;font-size:8.5px;line-height:13px;}
.fc-id-detail .fc-honor{max-width:210px;height:17px;line-height:17px;font-size:10px;}
.fc-id-detail .fc-v{width:15px;height:15px;font-size:9.5px;line-height:15px;}
.fc-id-profile .fc-honor{max-width:150px;}
.fc-profile-nrow{display:flex;align-items:center;gap:5px;min-width:0;margin-bottom:8px;}
.fc-profile-nrow b{min-width:0;font-size:15px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-detail-name h2{flex:0 1 auto;}

/* ---------- 浮层 / 弹窗 ---------- */
.fc-veil{position:absolute;inset:0;z-index:30;background:var(--fc-overlay);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;animation:fcVeil .16s var(--ease-out) both;}
@keyframes fcVeil{from{opacity:0}to{opacity:1}}
.fc-modal{width:360px;max-width:86%;max-height:86%;overflow-y:auto;padding:18px;border-radius:18px;background:var(--fc-modal);box-shadow:0 24px 60px rgba(0,0,0,.28);border:1px solid var(--fc-border-2);animation:fcModal .22s var(--ease-spring) both;}
@keyframes fcModal{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.fc-modal h4{font-size:14px;margin:0 0 6px;font-weight:750;}
.fc-modal p{font-size:11.5px;color:var(--fc-text-sub);line-height:1.75;margin:0 0 12px;}
.fc-modal .fc-field{margin-top:10px;}
.fc-modal .fc-field label{display:block;font-size:10.5px;color:var(--fc-text-meta);margin-bottom:5px;}
.fc-modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.fc-viewer{max-width:92%;max-height:88%;display:flex;flex-direction:column;align-items:center;gap:10px;}
.fc-viewer img{max-width:100%;max-height:70vh;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.fc-viewer .vc{display:flex;gap:8px;align-items:center;}

/* ---------- 轻提示 ---------- */
.fc-toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,10px);z-index:50;max-width:76%;padding:9px 14px;border-radius:11px;background:var(--fc-modal);border:1px solid var(--fc-border-2);box-shadow:0 10px 30px rgba(0,0,0,.24);font-size:11.5px;line-height:1.6;color:var(--text-1);opacity:0;pointer-events:none;transition:opacity .2s var(--ease-out),transform .24s var(--ease-out);}
.fc-toast.on{opacity:1;transform:translate(-50%,0);}
.fc-toast.err{color:var(--fc-danger);}

/* ---------- 窄窗 ---------- */
@media (max-width: 660px){
  .fc-rail{flex-basis:54px;width:54px;padding:8px 4px;}
  .fc-tab{font-size:0;padding:8px 0;}
  .fc-tab i{font-size:17px;}
  .fc-side{flex-basis:196px;width:196px;}
  .fc-page{padding:20px 18px 24px;}
  .fc-msgs{padding:12px 12px 8px;}
  .fc-col{max-width:72%;}
  .fc-inputhint{display:none;}
}
/* ---------- 消息元信息里的更多按钮（触控板无需右键） ---------- */
.fc-more-in{display:inline-flex;align-items:center;justify-content:center;width:18px;height:16px;margin-left:4px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--fc-text-meta);cursor:pointer;opacity:.55;font-size:10px;vertical-align:middle;}
.fc-more-in:hover,.fc-more-in:focus-visible{opacity:1;background:var(--fc-hover);color:var(--text-1);}

/* ---------- 系统磨砂变量（与主壳 --n26-blur / --n26-glass-alpha / --n26-glass-sat 并接） ---------- */
.fc-rail,.fc-side,.fc-chat-head{
  -webkit-backdrop-filter:blur(var(--n26-blur,18px)) saturate(var(--n26-glass-sat,148%));
  backdrop-filter:blur(var(--n26-blur,18px)) saturate(var(--n26-glass-sat,148%));
}
.fc-side{background:color-mix(in srgb, var(--fc-panel-side) calc(var(--n26-glass-alpha, .55) * 100% + 45%), transparent);}
.fc-rail{background:color-mix(in srgb, var(--fc-panel-rail) calc(var(--n26-glass-alpha, .55) * 100% + 45%), transparent);}

/* ---------- 引用（回复） ---------- */
.fc-quotebar{display:flex;align-items:flex-start;gap:8px;margin:0 0 6px;padding:8px 10px;border-radius:10px;background:var(--fc-accent-soft);border-left:3px solid var(--fc-accent-line);}
.fc-quotebar .qt{flex:1;min-width:0;font-size:10.5px;line-height:1.6;color:var(--fc-text-sub);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.fc-quotebar .qt b{color:var(--fc-accent-ink);font-weight:650;}
.fc-quotebar button{flex:none;width:20px;height:20px;border:0;border-radius:6px;background:transparent;color:var(--fc-text-meta);cursor:pointer;font-size:10px;}
.fc-quotebar button:hover{background:var(--fc-hover);color:var(--text-1);}
.fc-bub .fc-quote{display:block;margin:-1px 0 6px;padding:6px 8px;border-radius:8px;background:rgba(15,23,42,.05);border-left:2px solid var(--fc-accent-line);font-size:11px;line-height:1.55;color:var(--fc-text-sub);cursor:pointer;}
.fc-bub .fc-quote b{color:var(--fc-accent-ink);font-weight:600;}
.fc-bub.out .fc-quote{background:rgba(255,255,255,.14);border-left-color:rgba(255,255,255,.55);color:rgba(255,255,255,.86);}
.fc-bub.out .fc-quote b{color:#fff;}
.fc-bub.quote-hit{outline:2px solid var(--fc-accent-line);outline-offset:2px;}

/* ---------- 消息右键菜单 ---------- */
.fc-ctx{position:fixed;z-index:42;min-width:132px;padding:5px;border-radius:11px;background:var(--fc-modal);border:1px solid var(--fc-border-2);box-shadow:0 14px 36px rgba(0,0,0,.22);animation:fcPop .14s var(--ease-out) both;}
.fc-ctx button{width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;border:0;border-radius:8px;background:transparent;color:var(--text-1);font:inherit;font-size:11.5px;text-align:left;cursor:pointer;}
.fc-ctx button:hover{background:var(--fc-hover);}
.fc-ctx button i{width:15px;text-align:center;font-size:11px;color:var(--fc-text-sub);}
.fc-ctx button.danger{color:var(--fc-danger);}
.fc-ctx button.danger i{color:var(--fc-danger);}
.fc-ctx .sep{height:1px;margin:4px 6px;background:var(--fc-line);}

/* ---------- 群资料面板 ---------- */
.fc-group-panel{flex:0 0 236px;width:236px;background:var(--fc-panel-side);border:1px solid var(--fc-border);border-radius:16px;box-shadow:var(--fc-inner),var(--fc-shadow);display:flex;flex-direction:column;overflow:hidden;animation:fcPanelIn .18s var(--ease-out) both;}
@keyframes fcPanelIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.fc-gp-head{flex:none;display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--fc-line);font-size:12.5px;font-weight:650;}
.fc-gp-head span{flex:1;}
.fc-gp-body{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 14px;}
.fc-gp-ann{margin-bottom:12px;padding:10px;border-radius:11px;background:var(--fc-chip);}
.fc-gp-ann .lbl{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--fc-text-meta);margin-bottom:4px;}
.fc-gp-ann .txt{font-size:11.5px;line-height:1.7;color:var(--text-1);white-space:pre-wrap;word-break:break-word;}
.fc-gp-ann .txt.empty{color:var(--fc-text-meta);}
.fc-gp-ann button{margin-top:7px;height:25px;padding:0 9px;border:1px solid var(--fc-border-2);border-radius:8px;background:transparent;color:var(--fc-text-sub);font:inherit;font-size:10.5px;cursor:pointer;}
.fc-gp-ann button:hover{background:var(--fc-hover);color:var(--text-1);}
.fc-gp-sub{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--fc-text-meta);margin:0 0 6px;}
.fc-gp-sub b{color:var(--text-1);font-weight:600;font-size:11px;}
.fc-gp-member{display:flex;align-items:center;gap:9px;padding:6px 3px;border-radius:9px;}
.fc-gp-member:hover{background:var(--fc-hover);}
.fc-gp-member .nm{flex:1;min-width:0;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-gp-member .tag{flex:none;font-size:9px;padding:1px 6px;border-radius:99px;background:var(--fc-accent-soft);color:var(--fc-accent-ink);}
.fc-gp-note{font-size:10px;line-height:1.7;color:var(--fc-text-meta);padding:8px 2px 0;}

@media (max-width: 860px){
  .fc-group-panel{position:absolute;right:10px;top:10px;bottom:10px;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.26);}
}

<script>
(function () {
'use strict';

var KEY = 'fangchat.v3';
var DEFAULT_WORKER = 'https://fangliao.fanggame.company';
var ANN_TAG = '[[ANN]]';
var S = {
  started: false, ctx: null, db: null,
  tab: 'chats', thread: null, contact: null, me: 'profile',
  search: '', csearch: '', drafts: {},
  pop: null, dialog: null, view: null, ctx: null, quote: null, groupPanel: false,
  demo: false, solo: false,
  cloud: { status: 'off', kv: null, error: '', at: 0, fails: 0 },
  timer: null,
  toastT: 0
};

/* ================= 基础工具 ================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function uid() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function pad(n) { return String(n).padStart(2, '0'); }
function fmtTime(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function dayLabel(ts) {
  var now = new Date(), d = new Date(ts);
  var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var t1 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var diff = Math.round((t0 - t1) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff === 2) return '前天';
  if (diff > 2 && diff < 7) return '星期' + '日一二三四五六'.charAt(d.getDay());
  if (diff < 0) return '今天';
  if (d.getFullYear() !== now.getFullYear()) return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
}
function listTime(ts) {
  if (!ts) return '';
  var now = new Date(), d = new Date(ts);
  var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var t1 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var diff = Math.round((t0 - t1) / 86400000);
  if (diff === 0) return fmtTime(ts);

function msgsHtml(t) {
  var msgs = t.messages.slice().sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
  if (!msgs.length) {
    var hint = t.type === 'self' ? '这里的消息只保存在本机，适合临时存图片和文件。'
      : t.type === 'group' ? '公开频道的消息走 Worker 中转，所有人可见。' : '这是本地会话，只有这台机器上能看到。';
    return '<div class="fc-chat-empty"><div class="art" style="width:72px;height:72px;border-radius:20px;background:var(--fc-accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:14px">' +

      '<h3 style="font-size:14px;margin:0 0 4px;color:var(--text-1)">还没有消息</h3>' +
      '<p style="font-size:11.5px;line-height:1.8;margin:0;max-width:250px">' + esc(hint) + '</p></div>';
  }
  var html = '', lastDay = '';
  msgs.forEach(function (m, i) {
    var ts = m.ts || 0;
    var day = dayKey(ts);
    if (day && day !== lastDay) { html += '<div class="fc-day"><span>' + dayLabel(ts) + '</span></div>'; lastDay = day; }
    if (m.revoked) { html += '<div class="fc-system"><span>' + (m.dir === 'out' ? '你' : esc(m.from || '对方')) + '撤回了一条消息</span></div>'; return; }
    if (m.kind === 'system') { html += '<div class="fc-system"><span>' + esc(m.text) + '</span></div>'; return; }
    var prev = msgs[i - 1], next = msgs[i + 1];
    var same = function (a, b) { return a && b && a.dir === b.dir && (a.dir !== 'in' || a.from === b.from); };
    var run = same(prev, m) && ts && (ts - (prev.ts || 0) < 180000);
    var runEnd = !same(next, m) || !((next.ts || 0) - ts < 180000);
    var out = m.dir === 'out';
    var showWho = t.type === 'group' && !out && !run;
    var av = out ? avatarHtml(myName(), myAvatar(), 28, 'self') : (t.type === 'group' ? avatarHtml(m.from || '匿名', null, 28) : threadAvatar(t, 28));
    html += '<div class="fc-row' + (out ? ' out' : '') + (run ? ' run' : '') + '" data-msg="' + esc(m.id) + '">' + av +
      '<div class="fc-col">' +
        (showWho ? '<div class="fc-who">' + esc(m.from || '匿名') + '</div>' : '') +
        bubbleHtml(m) +

      '</div></div>';
  });
  return html;
}

function compressImage(file) {
  return new Promise(function (resolve, reject) {
    if (!/^image\//.test(file.type)) { reject(new Error('不是图片')); return; }
    if (file.size > 8 * 1048576) { reject(new Error('图片超过 8 MB')); return; }
    if (/image\/(gif|svg\+xml)/.test(file.type)) {
      readDataUrl(file).then(function (u) {
        resolve({ dataUrl: u, w: 0, h: 0, name: file.name, size: file.size });
      }, reject);
      return;
    }
    var obj = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var max = 1400;
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        var k = Math.min(1, max / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        var url = cv.toDataURL('image/jpeg', 0.72);
        URL.revokeObjectURL(obj);
        resolve({ dataUrl: url, w: cw, h: ch, name: file.name.replace(/\.[^.]+$/, '') + '.jpg', size: Math.round(url.length * 0.75) });
      } catch (e) { URL.revokeObjectURL(obj); reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(obj); reject(new Error('图片无法读取')); };
    img.src = obj;
  });
}
function readDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(String(r.result || '')); };
    r.onerror = function () { reject(new Error('文件读取失败')); };
    r.readAsDataURL(file);
  });
}
function attachImage(file) {
  var t = activeThread();
  if (!t) return;
  if (t.delivery === 'cloud') { toast('公开频道只支持文字消息', 'err'); return; }
  toast('正在处理图片…');
  compressImage(file).then(function (im) {
    if (im.dataUrl.length > 1250000) throw new Error('图片压缩后仍过大（>1.2 MB）');
    addMessage(t, {
      id: uid(), dir: 'out', from: myName(), ts: Date.now(), kind: 'image',
      image: { dataUrl: im.dataUrl, w: im.w, h: im.h, name: im.name }, status: 'sent'
    });
    toast('已添加到会话');
  }).catch(function (e) { toast(String(e.message || e), 'err'); });
}
function attachFile(file) {
  var t = activeThread();

      file: { name: file.name, size: file.size, mime: file.type || '', dataUrl: u }, status: 'sent'
    });

  }).catch(function (e) { toast(String(e.message || e), 'err'); });
}

function compressImageSquare(file, size) {
  return new Promise(function (resolve, reject) {
    var obj = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var s = Math.min(img.naturalWidth, img.naturalHeight);
        var sx = (img.naturalWidth - s) / 2, sy = (img.naturalHeight - s) / 2;
        var cv = document.createElement('canvas');
        cv.width = size; cv.height = size;
        cv.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
        var url = cv.toDataURL('image/jpeg', 0.8);
        URL.revokeObjectURL(obj);
        resolve(url);
      } catch (e) { URL.revokeObjectURL(obj); reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(obj); reject(new Error('图片无法读取')); };
    img.src = obj;
  });
}

      S.tab = 'chats';
    }
    try {
      var qp = new URLSearchParams(location.search);
      var th = qp.get('thread');
      if (th && S.db.threads.some(function (x) { return x.id === th; })) { S.thread = th; S.tab = 'chats'; }
    } catch (e) { }
    if (!S.thread) S.thread = sortedThreads().length ? sortedThreads()[0].id : null;
    if (!S.contact && S.db.contacts.length) S.contact = null;
    render();
    if (S.demo || !S.ctx || S.ctx.offline) return;
    if (S.db.settings.autoCloud !== false && cloudWanted()) cloudCheck(true);
    else S.cloud.status = 'off';
  });
}
window.Nexus = window.Nexus || {};
function previewTheme() {
  if (!S.solo || !/[?&]dark=1/.test(location.search)) return;
  document.body.classList.add('dark-mode');
  document.documentElement.setAttribute('data-mode', 'dark');
}
Nexus.ready(function (ctx) {
  if (S.started) { S.ctx = ctx; previewTheme(); render(); return; }
  startWith(ctx);
});
if (window.parent === window) {
  setTimeout(function () {
    if (!S.started) startWith({ offline: true, user: { name: '本地用户' } });
  }, 40);
}
})();
</script>
