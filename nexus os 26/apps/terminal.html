<!DOCTYPE html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终端 · Nexus OS 26</title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/glass.css">
<style>
/* ============================================================
   Nexus OS 26 · 终端（apps/terminal.html）
   设计语言：终端品牌主色 = 经典终端绿（非系统蓝）。
   光标 / 提示符 / 选中 / 成功输出统一绿族；错误保留红族。
   玻璃背景只取中性色，不染色；深浅色各校一次对比度。
   ============================================================ */

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    color: var(--term-fg);
    font-family: var(--font-mono, "Cascadia Code", "JetBrains Mono", Consolas, monospace);
    font-size: var(--term-fs);
    line-height: var(--term-lh);
    -webkit-font-smoothing: antialiased;
    --term-fs: 13px;
    --term-lh: 1.5;
    --term-bg: rgba(251, 252, 254, 0.88);
    --term-sheen: rgba(255, 255, 255, 0.14);
    --term-bar: rgba(241, 245, 249, 0.52);
    --term-panel: rgba(255, 255, 255, 0.95);
    --term-fg: rgba(15, 23, 42, 0.92);
    --term-dim: rgba(15, 23, 42, 0.64);
    --term-faint: rgba(15, 23, 42, 0.42);
    --term-line: rgba(15, 23, 42, 0.10);
    --term-line-strong: rgba(15, 23, 42, 0.18);
    --term-hover: rgba(15, 23, 42, 0.055);
    --term-tab: rgba(15, 23, 42, 0.035);
    --term-accent: hsl(145, 62%, 27%);
    --term-accent-soft: rgba(26, 122, 69, 0.10);
    --term-on-accent: hsl(0, 0%, 100%);
    --term-sel: rgba(26, 122, 69, 0.18);
    --term-hit: rgba(26, 122, 69, 0.18);
    --term-caret: hsl(145, 62%, 30%);
    --term-green: hsl(145, 62%, 27%);
    --term-red: hsl(356, 66%, 42%);
    --term-yellow: hsl(35, 78%, 30%);
    --term-cyan: hsl(187, 58%, 26%);
    --term-magenta: hsl(285, 40%, 38%);
    --term-dir: hsl(145, 63%, 26%);
    --term-focus-ring: rgba(26, 122, 69, 0.55);
    --term-specular: rgba(255, 255, 255, 0.62);
    --term-shadow: var(--sh-pop);
    color-scheme: light;
}
body.dark-mode #term {
    --term-bg: rgba(20, 24, 34, 0.90);
    --term-sheen: rgba(255, 255, 255, 0.035);
    --term-bar: rgba(255, 255, 255, 0.035);
    --term-panel: rgba(24, 29, 40, 0.96);
    --term-fg: rgba(236, 241, 249, 0.92);
    --term-dim: rgba(226, 232, 240, 0.66);
    --term-faint: rgba(203, 213, 225, 0.44);
    --term-line: rgba(255, 255, 255, 0.10);
    --term-line-strong: rgba(255, 255, 255, 0.16);
    --term-hover: rgba(255, 255, 255, 0.065);
    --term-tab: rgba(255, 255, 255, 0.028);
    --term-accent: hsl(145, 45%, 48%);
    --term-accent-soft: rgba(67, 178, 122, 0.14);
    --term-on-accent: hsl(150, 22%, 8%);
    --term-sel: rgba(67, 178, 122, 0.24);
    --term-hit: rgba(67, 178, 122, 0.20);
    --term-caret: hsl(145, 45%, 55%);
    --term-green: hsl(145, 42%, 52%);
    --term-red: hsl(356, 72%, 66%);
    --term-yellow: hsl(40, 78%, 64%);
    --term-cyan: hsl(187, 55%, 60%);
    --term-magenta: hsl(285, 50%, 70%);
    --term-dir: hsl(145, 48%, 58%);
    --term-focus-ring: rgba(67, 178, 122, 0.50);
    --term-specular: rgba(255, 255, 255, 0.08);
    color-scheme: dark;
}

#term {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    color: var(--term-fg);
    background-color: var(--term-bg);
    background-image: linear-gradient(180deg, var(--term-sheen), transparent 26%);
    box-shadow: inset 0 1px 0 var(--term-specular);
}
#term.kbd-focus { outline: 2px solid var(--term-focus-ring); outline-offset: -2px; }

/* ── 标签栏 36 ─────────────────────────────────────────────── */
.term-head {
    flex: 0 0 36px;
    display: flex;
    align-items: center;
    gap: var(--sp-2, 8px);
    padding: 4px var(--sp-2, 8px) 0 var(--sp-2, 8px);
    /* 顶栏磨砂玻璃：直连宿主材质变量（_app.js 注入），材质切“固态”时 blur 归零 */
    background: rgba(255, 255, 255, calc(var(--n26-glass-alpha, .55) * .55));
    -webkit-backdrop-filter: blur(var(--n26-blur, 18px)) saturate(var(--n26-glass-sat, 148%));
    backdrop-filter: blur(var(--n26-blur, 18px)) saturate(var(--n26-glass-sat, 148%));
    border-bottom: 1px solid var(--term-line);
    position: relative;
    z-index: 2;
}
body.dark-mode .term-head {
    background: rgba(20, 24, 34, calc(var(--n26-glass-alpha, .55) * .75));
}
body.perf-mode .term-head {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
}
.tabs {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
}
.tabs::-webkit-scrollbar { width: 0; height: 0; }
.tab {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 6px 0 10px;
    border: 0;
    border-radius: var(--r-sm, 10px) var(--r-sm, 10px) 0 0;
    background: transparent;
    color: var(--term-dim);
    font-family: inherit;
    font-size: var(--fs-11, 11px);
    line-height: 1;
    cursor: pointer;
    position: relative;
    white-space: nowrap;
}
.tab:hover { background: var(--term-hover); color: var(--term-fg); }
.tab[aria-selected="true"] {
    background: var(--term-accent-soft);
    color: var(--term-fg);
    box-shadow: inset 0 -2px 0 var(--term-accent);
}
.tab-title {
    max-width: 128px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.tab-x {
    display: grid;
    place-items: center;
    width: 16px;
    height: 16px;
    border-radius: 4px;
    font-size: 10px;
    opacity: 0.42;
}
.tab:hover .tab-x, .tab[aria-selected="true"] .tab-x { opacity: 0.78; }
.tab-x:hover { background: rgba(180, 48, 48, 0.12); color: var(--term-red); opacity: 1; }
.tab-add {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    margin-left: 2px;
    border: 0;
    border-radius: var(--r-xs, 6px);
    background: transparent;
    color: var(--term-dim);
    font-size: 11px;
    cursor: pointer;
}
.tab-add:hover { background: var(--term-hover); color: var(--term-accent); }
.tools { flex: 0 0 auto; display: flex; gap: 2px; }
.tool {
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: var(--r-xs, 6px);
    background: transparent;
    color: var(--term-dim);
    font-size: 11px;
    cursor: pointer;
}
.tool:hover { background: var(--term-hover); color: var(--term-fg); }
.tool.accent:hover { color: var(--term-accent); }

/* ── 输出搜索条 ────────────────────────────────────────────── */
.findbar {
    flex: 0 0 34px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 var(--sp-2, 8px);
    background: var(--term-bar);
    border-bottom: 1px solid var(--term-line);
    color: var(--term-dim);
    z-index: 2;
}
.findbar:focus-within { box-shadow: inset 0 -1px 0 var(--term-accent); }
.findbar > i { font-size: 11px; color: var(--term-accent); }
#find-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 26px;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--term-fg);
    font: inherit;
    font-size: var(--fs-12, 12px);
}
#find-input::placeholder { color: var(--term-faint); }
#find-input::-webkit-search-cancel-button { display: none; }
.find-count {
    flex: 0 0 auto;
    min-width: 46px;
    text-align: right;
    font-size: var(--fs-11, 11px);
    color: var(--term-dim);
    font-variant-numeric: tabular-nums;
}
.find-count.none { color: var(--term-red); }
.find-btn {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--term-dim);
    font-size: 10px;
    cursor: pointer;
}
.find-btn:hover { background: var(--term-hover); color: var(--term-fg); }

/* ── 输出区 ────────────────────────────────────────────────── */
.term-out {
    flex: 1 1 auto;
    min-height: 0;
    overflow-x: auto;
    overflow-y: auto;
    padding: 10px var(--sp-3, 12px) 8px;
    outline: none;
    scrollbar-gutter: stable;
    overscroll-behavior: contain;
    touch-action: pan-y pinch-zoom;
}
.line {
    white-space: pre-wrap;
    word-break: break-word;
    min-height: calc(var(--term-fs) * var(--term-lh));
}
.line.cmd-line { margin-top: 2px; }
.line.blank { min-height: calc(var(--term-fs) * 0.75); }
#term.edge-drag, #term.edge-drag * { user-select: none; }

.dim { color: var(--term-dim); }
.faint { color: var(--term-faint); }
.err { color: var(--term-red); }
.ok { color: var(--term-green); }
.warn { color: var(--term-yellow); }
.accent { color: var(--term-accent); }
.green { color: var(--term-green); }
.cyan { color: var(--term-cyan); }
.mag { color: var(--term-magenta); }
.b { font-weight: 600; }
.group { color: var(--term-dim); font-weight: 600; }
.dir { color: var(--term-dir); font-weight: 600; }
.puser { color: var(--term-green); font-weight: 600; }
.ppath { color: var(--term-accent); font-weight: 600; }
.psign { color: var(--term-green); font-weight: 600; }
.psign.root { color: var(--term-green); font-weight: 700; }
.term-brand { color: var(--term-green); font-weight: 700; }

#scroll mark.hit {
    background: var(--term-hit);
    color: var(--term-fg);
    border-radius: 2px;
    padding: 0 1px;
}
#scroll mark.hit.current {
    background: var(--term-accent);
    color: var(--term-on-accent);
}

/* ── 反向搜索条 ────────────────────────────────────────────── */
.rs-bar {
    flex: 0 0 30px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 var(--sp-3, 12px);
    background: var(--term-bar);
    border-top: 1px solid var(--term-line);
}
.rs-label { flex: 0 0 auto; color: var(--term-green); font-size: var(--fs-12, 12px); }
#rs-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 24px;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--term-fg);
    font: inherit;
    font-size: var(--fs-12, 12px);
}
#rs-input::placeholder { color: var(--term-faint); }
.rs-hint { flex: 0 0 auto; color: var(--term-dim); font-size: var(--fs-11, 11px); }

/* ── 输入行 ────────────────────────────────────────────────── */
.term-entry {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0;
    padding: 1px var(--sp-3, 12px) 9px;
    position: relative;
}
.prompt {
    flex: 0 1 auto;
    max-width: 58%;
    min-width: 0;
    display: block;
    overflow: hidden;
    white-space: pre;
    text-overflow: ellipsis;
    user-select: none;
}
.cmd-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
}
#cmd {
    width: 100%;
    height: calc(var(--term-fs) * var(--term-lh));
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--term-fg);
    font: inherit;
    line-height: var(--term-lh);
    caret-color: var(--term-caret);
    appearance: none;
}
#cmd:focus-visible { outline: none; }
body:not([data-cursor="system"]) #cmd { caret-color: transparent; }
#cmd::selection { background: var(--term-sel); color: inherit; }

.fake-cursor {
    position: absolute;
    left: 0;
    top: 50%;
    width: 2px;
    height: 1.2em;
    transform: translateY(-50%);
    transform-origin: center;
    border-radius: 1px;
    background: var(--term-caret);
    opacity: 0;
    pointer-events: none;
    animation: termBlink 1.06s step-end infinite;
}
body[data-cursor="block"] .fake-cursor,
body[data-cursor="bar"] .fake-cursor,
body[data-cursor="underline"] .fake-cursor { opacity: 1; }
body[data-cursor="block"] .fake-cursor {
    height: 1.18em;
    background: var(--term-caret);
    opacity: 0.30;
}
body[data-cursor="underline"] .fake-cursor {
    top: auto;
    bottom: 0.04em;
    height: 2px;
    transform: none;
    background: var(--term-caret);
    opacity: 0.92;
}
.fake-cursor.hide { opacity: 0; animation: none; }
.fake-cursor.typing { animation: none; opacity: 1; }

.term-measure {
    position: absolute;
    left: -9999px;
    top: 0;
    visibility: hidden;
    white-space: pre;
    font: inherit;
    font-size: var(--term-fs);
}

.busy {
    flex: 0 0 auto;
    width: 13px;
    height: 13px;
    margin-left: var(--sp-2, 8px);
    border: 1.5px solid var(--term-line-strong);
    border-top-color: var(--term-accent);
    border-radius: 50%;
    animation: termSpin 0.9s steps(8, end) infinite;
}

/* ── 状态栏 26 ────────────────────────────────────────────── */
.term-status {
    flex: 0 0 26px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 var(--sp-3, 12px);
    background: var(--term-bar);
    border-top: 1px solid var(--term-line);
    color: var(--term-dim);
    font-size: var(--fs-11, 11px);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
}
.term-status .spacer { flex: 1 1 auto; }
.term-status .st-dot {
    flex: 0 0 auto;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--term-faint);
}
#st-cwd {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--term-dim);
}
#st-exit.ok { color: var(--term-green); }
#st-exit.err { color: var(--term-red); }
#st-mode.accent { color: var(--term-accent); }
#st-fs { color: var(--term-faint); }

/* ── 设置浮层 ──────────────────────────────────────────────── */
.settings-overlay {
    position: absolute;
    inset: 0;
    z-index: var(--z-modal, 1100);
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 42px 10px 10px;
    background: rgba(15, 23, 42, 0.14);
}
body.dark-mode .settings-overlay { background: rgba(0, 0, 0, 0.32); }
.settings-card {
    width: 308px;
    max-width: calc(100% - 20px);
    border: 1px solid var(--term-line-strong);
    border-radius: var(--r-md, 14px);
    background: var(--term-panel);
    box-shadow: var(--term-shadow);
    overflow: hidden;
    animation: termPop 160ms cubic-bezier(0.16, 1, 0.3, 1) both;
}
.settings-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--term-line);
}
.settings-head h2 {
    margin: 0;
    font-size: var(--fs-13, 13px);
    font-weight: 600;
    color: var(--term-fg);
    letter-spacing: 0.02em;
}
.set-close {
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--term-dim);
    cursor: pointer;
}
.set-close:hover { background: var(--term-hover); color: var(--term-fg); }
.settings-body { padding: 4px 14px 12px; }
.set-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--term-line);
}
.set-row:last-of-type { border-bottom: 0; }
.set-row.column {
    display: block;
    padding-bottom: 12px;
}
.set-label {
    display: block;
    font-size: var(--fs-11, 11px);
    color: var(--term-dim);
    letter-spacing: 0.04em;
}
.set-row.column .set-label { margin-bottom: 7px; }
.stepper {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    border: 1px solid var(--term-line-strong);
    border-radius: var(--r-xs, 6px);
    overflow: hidden;
}
.stepper button {
    width: 26px;
    height: 26px;
    border: 0;
    background: transparent;
    color: var(--term-fg);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
}
.stepper button:hover { background: var(--term-hover); }
#font-val {
    min-width: 52px;
    text-align: center;
    font-size: var(--fs-12, 12px);
    color: var(--term-fg);
    font-variant-numeric: tabular-nums;
}
.seg { display: flex; gap: 4px; }
.seg button {
    flex: 1 1 0;
    min-width: 0;
    height: 27px;
    padding: 0 6px;
    border: 1px solid var(--term-line-strong);
    border-radius: var(--r-xs, 6px);
    background: transparent;
    color: var(--term-dim);
    font: inherit;
    font-size: var(--fs-11, 11px);
    cursor: pointer;
    white-space: nowrap;
}
.seg button:hover { background: var(--term-hover); color: var(--term-fg); }
.seg button[aria-pressed="true"] {
    border-color: var(--term-accent);
    background: var(--term-accent-soft);
    color: var(--term-accent);
    font-weight: 600;
}
.set-hint {
    margin-top: 2px;
    padding-top: 10px;
    border-top: 1px solid var(--term-line);
    color: var(--term-faint);
    font-size: var(--fs-11, 11px);
    line-height: 1.65;
}
.settings-foot {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 10px 14px 14px;
    border-top: 1px solid var(--term-line);
}
.settings-foot .glass-btn { height: 28px; font-size: var(--fs-11, 11px); }
.settings-foot .glass-btn.accent {
    border-color: var(--term-accent);
    color: var(--term-accent);
}

/* ── 动效（克制：只有光标闪烁、加载圈、浮层 160ms） ───────── */
@keyframes termBlink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
}
@keyframes termSpin { to { transform: rotate(360deg); } }
@keyframes termPop {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ── 无障碍 / 降级 ─────────────────────────────────────────── */
#term :focus-visible { outline-color: var(--term-focus-ring); }
#term ::selection {
    background: var(--term-sel);
    color: inherit;
}
body.dark-mode #term ::selection { background: var(--term-sel); color: inherit; }
[hidden] { display: none; }

body.perf-mode .fake-cursor { animation: none; opacity: 1; }
body.perf-mode .settings-card { animation: none; }

@media (prefers-reduced-motion: reduce) {
    .fake-cursor { animation: none; opacity: 1; }
    .settings-card { animation: none; }
    .busy { animation-duration: 1.8s; }
}

@media (max-width: 560px) {
    .term-head { gap: 4px; padding-inline: 4px; }
    .tab { padding: 0 5px 0 8px; }
    .tab-title { max-width: 76px; }
    .prompt { max-width: 50%; }
    #st-fs { display: none; }
    .settings-card { width: 280px; }
}
</style>
</head>
<body>
<div id="term" data-app-id="terminal">
    <div class="term-head">
        <div class="tabs" id="tabs" role="tablist" aria-label="终端标签"></div>
        <div class="tools">
            <button type="button" class="tool" id="btn-clear" title="清屏（Ctrl+L）" aria-label="清屏">
                <i class="fa-solid fa-eraser" aria-hidden="true"></i>
            </button>
            <button type="button" class="tool" id="btn-find" title="搜索输出（Ctrl+Shift+F）" aria-label="搜索输出">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            </button>
            <button type="button" class="tool accent" id="btn-settings" title="终端设置" aria-label="终端设置">
                <i class="fa-solid fa-sliders" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <div class="findbar" id="findbar" role="search" hidden>
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="find-input" type="search" placeholder="在当前输出中搜索…" aria-label="搜索输出内容" autocomplete="off" spellcheck="false">
        <span class="find-count" id="find-count" aria-live="polite"></span>
        <button type="button" class="find-btn" id="find-prev" title="上一个（Shift+Enter）" aria-label="上一个匹配">
            <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
        </button>

<script>
(function () {
'use strict';

var N = window.Nexus;
var termEl = document.getElementById('term');
var tabsEl = document.getElementById('tabs');
var scrollEl = document.getElementById('scroll');
var promptEl = document.getElementById('prompt');
var cmdEl = document.getElementById('cmd');
var fakeEl = document.getElementById('fake-cursor');
var busyEl = document.getElementById('busy');
var statusCwd = document.getElementById('st-cwd');
var statusExit = document.getElementById('st-exit');
var statusMode = document.getElementById('st-mode');
var statusFs = document.getElementById('st-fs');
var findbar = document.getElementById('findbar');
var findInput = document.getElementById('find-input');
var findCount = document.getElementById('find-count');
var rsbar = document.getElementById('rsbar');
var rsInput = document.getElementById('rs-input');
var rsHint = document.getElementById('rs-hint');
var settingsEl = document.getElementById('settings');
var fontValEl = document.getElementById('font-val');

var FONT_STEPS = [11, 12, 13, 14, 16, 18];
var CURSORS = ['system', 'block', 'bar', 'underline'];
var SCHEMES = ['auto', 'light', 'dark'];
var MAX_LINES = 2500;

var state = {
    started: false,
    ctx: null,
    user: { name: 'user', role: 'standard' },
    hostDark: false,
    bridgeReady: false,
    fsOffline: false,
    fs: null,
    home: 'C:',
    apps: null,
    tabs: [],
    active: 0,
    nextTabId: 1,
    nextTabNo: 1,
    recent: [],
    prefs: { fs: 13, cursor: 'system', scheme: 'auto' },
    bootAt: Date.now(),
    scrollTarget: 0,
    scrollRAF: 0,
    scrollAnimating: false,
    cursorRAF: 0,
    findOpen: false,
    searchMarks: [],
    searchIndex: -1,
    searchTimer: 0,
    rsActive: false,
    rsDraft: '',
    rsMatches: [],
    rsIndex: 0,
    busyTimer: 0,
    statusTimer: 0,
    recentTimer: 0,
    edgeAcc: 0,
    edgeLock: 0,
    edgePtr: null,
    lastTitle: ''
};

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function pad(s, n) {
    s = String(s);
    while (s.length < n) s = ' ' + s;
    return s;
}
function humanSize(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' K';
    return (n / 1048576).toFixed(1) + ' M';
}
function fmtDuration(ms) {
    var sec = Math.max(0, Math.floor(ms / 1000));
    if (sec < 60) return sec + 's';
    var m = Math.floor(sec / 60), s = sec % 60;
    if (m < 60) return m + 'm ' + (s < 10 ? '0' : '') + s + 's';
    var h = Math.floor(m / 60); m = m % 60;
    return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
}
function fmtDate(ts) {
    if (!ts) return '—';
    try { return new Date(ts).toISOString().slice(0, 10); } catch (e) { return '—'; }
}
function nowText() {
    try {
        return new Date().toLocaleString('zh-CN', { hour12: false });
    } catch (e) { return new Date().toString(); }
}

/* ── Shell 语法辅助 ───────────────────────────────────────── */

function tokenize(s) {
    var out = [], cur = '', q = null, has = false;
    for (var i = 0; i < s.length; i++) {
        var c = s.charAt(i);
        if (q) {
            if (c === q) { q = null; }
            else if (c === '\\' && q === '"' && i + 1 < s.length) { cur += s.charAt(++i); }
            else { cur += c; }
            continue;
        }
        if (c === '"' || c === "'") { q = c; has = true; continue; }
        if (c === ' ' || c === '\t') {
            if (cur || has) { out.push(cur); cur = ''; has = false; }
            continue;
        }
        if (c === '\\' && i + 1 < s.length) { cur += s.charAt(++i); has = true; continue; }
        cur += c; has = true;
    }
    if (cur || has) out.push(cur);
    return out;
}

function splitTop(s, sep) {
    var out = [], cur = '', q = null;
    for (var i = 0; i < s.length; i++) {
        var c = s.charAt(i);
        if (q) {
            cur += c;
            if (c === q && s.charAt(i - 1) !== '\\') q = null;
            continue;
        }
        if (c === '"' || c === "'") { q = c; cur += c; continue; }
        if (c === sep) { out.push(cur); cur = ''; continue; }
        if (c === '\\' && i + 1 < s.length) { cur += c + s.charAt(i + 1); i++; continue; }
        cur += c;
    }
    out.push(cur);
    return out;
}

function splitChain(s) {
    var out = [], cur = '', q = null, op = null;
    for (var i = 0; i < s.length; i++) {
        var c = s.charAt(i);
        if (q) {
            cur += c;
            if (c === q && s.charAt(i - 1) !== '\\') q = null;
            continue;
        }
        if (c === '"' || c === "'") { q = c; cur += c; continue; }
        if (c === '&' && s.charAt(i + 1) === '&') { out.push({ cmd: cur, op: op }); cur = ''; op = '&&'; i++; continue; }
        if (c === '|' && s.charAt(i + 1) === '|') { out.push({ cmd: cur, op: op }); cur = ''; op = '||'; i++; continue; }
        if (c === ';') { out.push({ cmd: cur, op: op }); cur = ''; op = ';'; continue; }
        if (c === '\\' && i + 1 < s.length) { cur += c + s.charAt(i + 1); i++; continue; }
        cur += c;
    }
    out.push({ cmd: cur, op: op });
    return out;
}

function extractRedirect(s) {
    var q = null, last = -1, len = 1;
    for (var i = 0; i < s.length; i++) {
        var c = s.charAt(i);
        if (q) {
            if (c === q && s.charAt(i - 1) !== '\\') q = null;
            continue;
        }
        if (c === '"' || c === "'") { q = c; continue; }
        if (c === '\\' && i + 1 < s.length) { i++; continue; }
        if (c === '>') {
            len = s.charAt(i + 1) === '>' ? 2 : 1;
            last = i;
            if (len === 2) i++;
        }
    }
    if (last < 0) return null;
    var target = s.slice(last + len).trim();
    var cmd = s.slice(0, last).trim();
    if (!target) return { bad: '缺少重定向目标文件' };
    if (!cmd) return { bad: '缺少重定向前的命令' };
    return { cmd: cmd, target: target, append: len === 2 };
}

function ShellError(message, code) {
    this.message = message;
    this.code = code || 1;
}

/* ── 路径与虚拟文件系统 ───────────────────────────────────── */

function getNode(fs, p) {
    if (!fs || !p) return null;
    var m = /^([A-Za-z]):/.exec(p);
    if (!m) return null;
    var node = fs[m[1].toUpperCase()];
    if (!node) return null;
    var rest = p.slice(2).split('/');
    for (var i = 0; i < rest.length; i++) {
        var seg = rest[i];
        if (!seg) continue;
        if (!node.children || !node.children[seg]) return null;
        node = node.children[seg];
    }
    return node;
}

function isDir(node) {
    return !!node && (node.type === 'folder' || node.type === 'drive');
}

function normalizeAbs(abs) {
    var drive = abs.charAt(0).toUpperCase();
    var rest = abs.slice(2).split('/');
    var out = [];
    for (var i = 0; i < rest.length; i++) {
        var seg = rest[i];
        if (!seg || seg === '.') continue;
        if (seg === '..') { if (out.length) out.pop(); continue; }
        out.push(seg);
    }
    return drive + ':' + (out.length ? '/' + out.join('/') : '');
}

function resolvePath(arg, tab) {
    if (!arg) return tab.cwd;
    var a = String(arg).replace(/\\/g, '/');
    if (a === '~') return tab.home;
    if (a === '-') return tab.oldpwd || tab.cwd;
    var abs;
    if (/^[A-Za-z]:/.test(a)) abs = a;
    else if (a.charAt(0) === '/') abs = tab.cwd.charAt(0) + ':' + a;
    else abs = tab.cwd + '/' + a;
    return normalizeAbs(abs);
}

function parentPath(p) {
    var i = p.lastIndexOf('/');
    if (i < 0) return null;
    return i === 2 ? p.slice(0, 2) : p.slice(0, i);
}

function baseName(p) {
    var i = p.lastIndexOf('/');
    if (i < 0) return p;
    return p.slice(i + 1);
}

function joinPath(dir, name) {
    return dir + '/' + name;
}

function displayPath(tab, p) {
    p = p || tab.cwd;
    if (!p) return '/';
    if (tab.home && p === tab.home) return '~';
    if (tab.home && p.indexOf(tab.home + '/') === 0) return '~' + p.slice(tab.home.length);
    if (p === 'C:') return '/';
    if (/^C:/.test(p)) return p.slice(2);
    if (/^[A-Za-z]:$/.test(p)) return p + '/';
    return p;
}

function pickHome(fs, name) {
    var candidates = ['C:/Users/' + name, 'C:/Users/user', 'C:/文档', 'C:'];
    for (var i = 0; i < candidates.length; i++) {
        if (getNode(fs, candidates[i])) return candidates[i];
    }
    var keys = Object.keys(fs);
    return keys.length ? keys[0].toUpperCase() + ':' : 'C:';
}

function envValue(name, tab) {
    switch (name) {
        case 'USER': return state.user.name || 'user';
        case 'HOME': return tab.home || 'C:';
        case 'PWD': return tab.cwd;
        case 'OLDPWD': return tab.oldpwd || '';
        case 'SHELL': return 'nexus-sh';
        case 'TERM': return 'nexus-256color';
        case 'HOSTNAME': return 'nexus';
        case 'LANG': return 'zh-CN.UTF-8';
        case 'TZ': return 'Asia/Shanghai';
        case '?': return String(tab.exit || 0);
        default: return '';
    }
}

function expandVars(s, tab) {
    return String(s).replace(/\$([A-Za-z?][A-Za-z0-9_]*)/g, function (_, k) {
        var v = envValue(k, tab);
        return v == null ? '' : v;
    });
}

function readDirNames(node, all) {
    var names = Object.keys((node && node.children) || {});
    if (!all) {
        names = names.filter(function (n) {
            var c = node.children[n];
            return !(c && c.hidden === true);
        });
    }
    names.sort(function (a, b) { return a.localeCompare(b, 'zh-CN'); });
    return names;
}

/* ── 桥接 ─────────────────────────────────────────────────── */

function bridgeMs(promise, ms, label) {
    return new Promise(function (resolve, reject) {
        var done = false;
        var timer = setTimeout(function () {
            if (done) return;
            done = true;
            reject(new Error((label || 'bridge') + ' timeout'));
        }, ms);
        Promise.resolve(promise).then(function (v) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            resolve(v);
        }, function (e) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            reject(e);
        });
    });
}

function offlineMessage() {
    return '本地桥离线：文件系统命令不可用。\n请从 Nexus OS 桌面打开终端；help / echo / theme 等内建命令仍可使用。';
}

async function refreshFS(tab) {
    if (!state.bridgeReady) throw new ShellError(offlineMessage(), 1);
    try {
        var fs = await bridgeMs(N.getUserLS('filesystem'), 5000, 'filesystem');
        if (!fs || typeof fs !== 'object') throw new Error('empty filesystem');
        state.fs = fs;
        state.fsOffline = false;
        if (!getNode(fs, tab.cwd)) {
            var home = tab.home && getNode(fs, tab.home) ? tab.home : pickHome(fs, state.user.name);
            tab.cwd = home;
            tab.home = home;
        }
        return fs;
    } catch (e) {
        state.fsOffline = true;
        updateStatus(tab);
        throw new ShellError('无法读取 Nexus 虚拟文件系统：本地桥无响应。\n文件系统命令不可用，未显示任何假数据。', 1);
    }
}

async function saveFS() {
    if (!state.bridgeReady) throw new ShellError(offlineMessage(), 1);
    try {
        await bridgeMs(N.setUserLS('filesystem', state.fs), 5000, 'filesystem-write');
    } catch (e) {
        throw new ShellError('写入虚拟文件系统失败：本地桥无响应。', 1);
    }
}

async function readTrashStrict() {
    if (!state.bridgeReady) throw new ShellError(offlineMessage(), 1);
    try {
        var t = await bridgeMs(N.getUserLS('trash'), 4000, 'trash');
        return Array.isArray(t) ? t : [];
    } catch (e) {
        throw new ShellError('回收站不可用，已取消删除。', 1);
    }
}

async function writeTrashStrict(trash) {
    try {
        await bridgeMs(N.setUserLS('trash', trash), 4000, 'trash-write');
    } catch (e) {
        throw new ShellError('写入回收站失败，已取消删除。', 1);
    }
}

/* ── 标签页与会话 ─────────────────────────────────────────── */

function activeTab() { return state.tabs[state.active] || null; }
function isActive(tab) { return state.tabs[state.active] === tab; }
function tabById(id) {
    for (var i = 0; i < state.tabs.length; i++) if (state.tabs[i].id === id) return state.tabs[i];
    return null;
}
function indexById(id) {
    for (var i = 0; i < state.tabs.length; i++) if (state.tabs[i].id === id) return i;
    return -1;
}

function makeTab(cwd) {
    var t = {
        id: state.nextTabId++,
        title: 'shell ' + state.nextTabNo++,
        home: state.home || 'C:',
        cwd: cwd || state.home || 'C:',
        oldpwd: '',
        history: [],
        histIdx: 0,
        lineDraft: '',
        input: '',
        nodes: [],
        scrollTop: 0,
        exit: 0,
        dirBack: [],
        dirFwd: [],
        runId: 0,
        busy: false,
        busyStarted: 0,
        startedAt: Date.now()
    };
    t.histIdx = t.history.length;
    return t;
}

function welcome(tab) {
    printLine(tab, '<span class="term-brand">Nexus Terminal</span> <span class="dim">26.1 · nexus-sh</span>');
    if (state.started) {
        if (!state.bridgeReady) {
            printLine(tab, '<span class="warn">● 本地桥离线</span> <span class="dim">文件系统命令不可用；内建命令仍可使用。</span>');
        } else if (!state.fs) {
            printLine(tab, '<span class="warn">● 文件系统未连接</span> <span class="dim">ls / cd / cat 等命令会明确报错。</span>');
        } else {
            printLine(tab, '<span class="ok">● 已连接</span> <span class="dim">' + esc(state.user.name) + '@nexus · 虚拟文件系统 · ' + esc(displayPath(tab, tab.cwd)) + '</span>');
        }
        printLine(tab, '<span class="dim">输入 help 查看命令 · Tab 补全 · ↑↓ 历史 · Ctrl+R 反向搜索</span>');
    } else {
        printLine(tab, '<span class="dim">' + esc(nowText()) + ' · 会话 ' + tab.id + '</span>');
        printLine(tab, '<span class="warn">正在连接 Nexus 系统…</span>');
    }
}

function printLine(tab, html, cls) {
    if (!tab) return;
    var n = { html: html == null ? ' ' : String(html), cls: cls || '' };
    tab.nodes.push(n);
    if (tab.nodes.length > MAX_LINES) tab.nodes.splice(0, tab.nodes.length - MAX_LINES);
    if (!isActive(tab)) return;
    var atBottom = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 30;
    scrollEl.appendChild(makeLineEl(n));
    if (atBottom) {
        scrollEl.scrollTop = scrollEl.scrollHeight;
        state.scrollTarget = scrollEl.scrollTop;
    }
    if (state.findOpen && findInput.value.trim()) scheduleSearch(false);
}

function makeLineEl(n) {
    var d = document.createElement('div');
    d.className = 'line' + (n.cls ? ' ' + n.cls : '');
    d.innerHTML = n.html;
    return d;
}

function printText(tab, text, cls) {
    if (text == null) return;
    var parts = String(text).split('\n');
    if (parts.length > 1 && parts[parts.length - 1] === '') parts.pop();
    for (var i = 0; i < parts.length; i++) printLine(tab, parts[i] === '' ? ' ' : esc(parts[i]), cls);
}

function printHtml(tab, html) {
    if (html == null) return;
    var parts = String(html).split('\n');
    if (parts.length > 1 && parts[parts.length - 1] === '') parts.pop();
    for (var i = 0; i < parts.length; i++) printLine(tab, parts[i] === '' ? ' ' : parts[i]);
}

function clearTab(tab) {
    if (!tab) return;
    tab.nodes = [];
    if (isActive(tab)) {
        cancelScrollAnim();
        scrollEl.innerHTML = '';
        state.searchMarks = [];
        state.searchIndex = -1;
        findCount.textContent = '';
        state.scrollTarget = 0;
    }
}

function echoLine(tab, line) {
    var html = promptHTML(tab) + (line ? '<span class="cmd-text">' + esc(line) + '</span>' : '');
    printLine(tab, html, 'cmd-line');
}

function promptHTML(tab) {
    var role = String(state.user.role || '').toLowerCase();
    var root = role === 'admin' || role === 'root';
    var sign = root ? '#' : '$';
    return '<span class="puser">' + esc(state.user.name || 'user') + '@nexus</span>' +
        '<span class="dim">:</span>' +
        '<span class="ppath">' + esc(displayPath(tab, tab.cwd)) + '</span>' +
        '<span class="psign' + (root ? ' root' : '') + '">' + sign + '</span> ';
}

function refreshPrompt(tab) {
    promptEl.innerHTML = promptHTML(tab);
    promptEl.title = (state.user.name || 'user') + '@nexus:' + displayPath(tab, tab.cwd);
}

function updateStatus(tab) {
    tab = tab || activeTab();
    if (!tab) return;
    statusCwd.textContent = displayPath(tab, tab.cwd);
    statusCwd.title = tab.cwd;
    statusExit.textContent = '退出 ' + tab.exit;
    statusExit.className = tab.exit === 0 ? 'ok' : 'err';
    if (!state.bridgeReady) {
        statusMode.textContent = '桥离线';
        statusMode.className = '';
        statusMode.title = '本地桥离线：文件系统命令不可用';
    } else if (state.fsOffline || !state.fs) {
        statusMode.textContent = 'FS 离线';
        statusMode.className = 'err';
        statusMode.title = '虚拟文件系统未连接';
    } else {
        statusMode.textContent = '虚拟 FS';
        statusMode.className = 'accent';
        statusMode.title = 'Nexus 虚拟文件系统（与文件管理器共用）';
    }
    statusFs.textContent = state.prefs.fs + 'px';
}

function statusFlash(text) {
    statusMode.textContent = text;
    statusMode.className = 'accent';
    clearTimeout(state.statusTimer);
    state.statusTimer = setTimeout(function () { updateStatus(activeTab()); }, 1400);
}

function saveActive() {
    var t = activeTab();
    if (!t) return;
    t.input = cmdEl.value;
    t.scrollTop = scrollEl.scrollTop;
}

function renderTab(tab) {
    cancelScrollAnim();
    scrollEl.innerHTML = '';
    var frag = document.createDocumentFragment();
    for (var i = 0; i < tab.nodes.length; i++) frag.appendChild(makeLineEl(tab.nodes[i]));
    scrollEl.appendChild(frag);
    scrollEl.scrollTop = tab.scrollTop || 0;
    state.scrollTarget = scrollEl.scrollTop;
}

function renderTabs() {
    tabsEl.innerHTML = '';
    state.tabs.forEach(function (t, idx) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'tab';
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', idx === state.active ? 'true' : 'false');
        b.setAttribute('aria-label', t.title + '，点击切换，按 Delete 关闭');
        b.tabIndex = idx === state.active ? 0 : -1;
        var name = document.createElement('span');
        name.className = 'tab-title';
        name.textContent = t.title;
        var x = document.createElement('span');
        x.className = 'tab-x';
        x.setAttribute('aria-hidden', 'true');
        x.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        b.appendChild(name);
        b.appendChild(x);
        b.addEventListener('click', function (e) {
            if (e.target && e.target.closest && e.target.closest('.tab-x')) closeTab(t.id);
            else switchTab(indexById(t.id));
        });
        b.addEventListener('keydown', function (e) {
            if (e.key === 'Delete') { e.preventDefault(); closeTab(t.id); return; }
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
                var i = indexById(t.id);
                var ni = (i + (e.key === 'ArrowRight' ? 1 : -1) + state.tabs.length) % state.tabs.length;
                switchTab(ni);
                var btns = tabsEl.querySelectorAll('.tab');
                if (btns[ni]) btns[ni].focus();
            }
        });
        tabsEl.appendChild(b);
    });
    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'tab-add';
    add.title = '新建标签（Ctrl+T）';
    add.setAttribute('aria-label', '新建标签');
    add.innerHTML = '<i class="fa-solid fa-plus" aria-hidden="true"></i>';
    add.addEventListener('click', createTab);
    tabsEl.appendChild(add);
}

function switchTab(index) {
    if (index < 0 || index >= state.tabs.length) return;
    if (index === state.active) { focusCmd(); return; }
    saveActive();
    state.active = index;
    var t = activeTab();
    renderTabs();
    renderTab(t);
    cmdEl.value = t.input || '';
    t.histIdx = t.history.length;
    refreshPrompt(t);
    updateStatus(t);
    syncBusy();
    scheduleCursor();
    focusCmd();
    if (state.findOpen && findInput.value.trim()) runSearch(false);
    updateWindowTitle();
}

function createTab() {
    saveActive();
    var t = makeTab(state.home || 'C:');
    state.tabs.push(t);
    state.active = state.tabs.length - 1;
    renderTabs();
    renderTab(t);
    welcome(t);
    cmdEl.value = '';
    refreshPrompt(t);
    updateStatus(t);
    syncBusy();
    scheduleCursor();
    focusCmd();
    scrollBottom(t, true);
    updateWindowTitle();
}

function closeTab(id) {
    var idx = indexById(id);
    if (idx < 0) return;
    saveActive();
    if (state.tabs.length === 1) {
        var only = state.tabs[0];
        only.runId++;
        only.nodes = [];
        only.exit = 0;
        only.input = '';
        only.cwd = only.home || state.home || 'C:';
        only.oldpwd = '';
        only.dirBack = [];
        only.dirFwd = [];
        only.busy = false;
        only.history = state.recent.slice(-200);
        only.histIdx = only.history.length;
        renderTab(only);
        welcome(only);
        printLine(only, '<span class="dim">已重置当前会话（至少保留一个标签）。</span>');
        cmdEl.value = '';
        refreshPrompt(only);
        updateStatus(only);
        syncBusy();
        focusCmd();
        scrollBottom(only, true);
        return;
    }
    var wasActive = idx === state.active;
    state.tabs.splice(idx, 1);
    if (wasActive) state.active = Math.min(idx, state.tabs.length - 1);
    else if (idx < state.active) state.active--;
    var t = activeTab();
    renderTabs();
    renderTab(t);
    cmdEl.value = t.input || '';
    t.histIdx = t.history.length;
    refreshPrompt(t);
    updateStatus(t);
    syncBusy();
    scheduleCursor();
    focusCmd();
    if (state.findOpen && findInput.value.trim()) runSearch(false);
    updateWindowTitle();
}

function updateWindowTitle() {
    var t = activeTab();
    if (!t || t.title === state.lastTitle) return;
    state.lastTitle = t.title;
    if (N && N.setWindowTitle) {
        try { N.setWindowTitle('终端 · ' + t.title).catch(function () {}); } catch (e) {}
    }
}

/* ── 滚动 ─────────────────────────────────────────────────── */

function cancelScrollAnim() {
    if (state.scrollRAF) {
        cancelAnimationFrame(state.scrollRAF);
        state.scrollRAF = 0;
    }
    state.scrollAnimating = false;
}

function startScrollAnim() {
    if (state.scrollRAF) return;
    state.scrollAnimating = true;
    var step = function () {
        var diff = state.scrollTarget - scrollEl.scrollTop;
        if (Math.abs(diff) < 0.6) {
            scrollEl.scrollTop = state.scrollTarget;
            state.scrollAnimating = false;
            state.scrollRAF = 0;
            return;
        }
        scrollEl.scrollTop += diff * 0.2;
        state.scrollRAF = requestAnimationFrame(step);
    };
    state.scrollRAF = requestAnimationFrame(step);
}

function scrollBottom(tab, force) {
    if (!isActive(tab)) return;
    cancelScrollAnim();
    scrollEl.scrollTop = scrollEl.scrollHeight;
    state.scrollTarget = scrollEl.scrollTop;
}

function pageScroll(dir) {
    if (!state.scrollAnimating) state.scrollTarget = scrollEl.scrollTop;
    var max = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
    var page = Math.max(48, scrollEl.clientHeight * 0.86);
    state.scrollTarget = clamp(state.scrollTarget + dir * page, 0, max);
    startScrollAnim();
}

/* ── 主题 / 字号 / 光标 ───────────────────────────────────── */

/* 深链/截图预览：?theme=dark / light 临时覆盖配色，不影响已保存偏好 */
var forcedTheme = (function () {
    try {
        var t = new URLSearchParams(location.search).get('theme');
        return (t === 'dark' || t === 'light') ? t : null;
    } catch (e) { return null; }
})();

function applyScheme() {
    var scheme = state.prefs.scheme;
    var dark = forcedTheme ? forcedTheme === 'dark'
        : (scheme === 'dark' || (scheme === 'auto' && state.hostDark));
    if (dark) document.body.classList.add('dark-mode');
    else document.body.classList.remove('dark-mode');
    document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
}

function applyPrefs() {
    var fs = clamp(Math.round(state.prefs.fs || 13), 11, 18);
    state.prefs.fs = fs;
    document.body.style.setProperty('--term-fs', fs + 'px');
    document.body.setAttribute('data-cursor', state.prefs.cursor);
    applyScheme();
    syncSettingsUI();
    scheduleCursor();
}

function persistPrefs() {
    if (!state.bridgeReady || !N || !N.setUserLS) return;
    try { N.setUserLS('terminal.prefs', state.prefs).catch(function () {}); } catch (e) {}
}

function snapFont(px) {
    var n = parseInt(px, 10);
    if (!isFinite(n)) return state.prefs.fs;
    var best = FONT_STEPS[0], dist = 999;
    for (var i = 0; i < FONT_STEPS.length; i++) {
        var d = Math.abs(FONT_STEPS[i] - n);
        if (d < dist) { dist = d; best = FONT_STEPS[i]; }
    }
    return best;
}

function setFont(px, silent) {
    state.prefs.fs = snapFont(px);
    applyPrefs();
    persistPrefs();
    if (!silent) statusFlash('字号 ' + state.prefs.fs + 'px');
    return state.prefs.fs;
}

function stepFont(dir) {
    var idx = FONT_STEPS.indexOf(state.prefs.fs);
    if (idx < 0) idx = 2;
    idx = clamp(idx + dir, 0, FONT_STEPS.length - 1);
    return setFont(FONT_STEPS[idx]);
}

function setCursor(v) {
    if (CURSORS.indexOf(v) < 0) return false;
    state.prefs.cursor = v;
    applyPrefs();
    persistPrefs();
    return true;
}

function setScheme(v) {
    if (SCHEMES.indexOf(v) < 0) return false;
    state.prefs.scheme = v;
    applyScheme();
    persistPrefs();
    return true;
}

/* ── 自定义光标 ───────────────────────────────────────────── */

var measureEl = document.createElement('span');
measureEl.className = 'term-measure';
document.body.appendChild(measureEl);

function measureText(s) {
    measureEl.textContent = s;
    var r = measureEl.getBoundingClientRect();
    return r.width;
}

function scheduleCursor() {
    if (state.cursorRAF) return;
    state.cursorRAF = requestAnimationFrame(function () {
        state.cursorRAF = 0;
        updateCursor();
    });
}

function updateCursor() {
    if (state.prefs.cursor === 'system' || document.activeElement !== cmdEl ||
        cmdEl.selectionStart !== cmdEl.selectionEnd) {
        fakeEl.classList.add('hide');
        return;
    }
    fakeEl.classList.remove('hide');
    var x = measureText(cmdEl.value.slice(0, cmdEl.selectionStart)) - cmdEl.scrollLeft;
    var max = Math.max(0, cmdEl.clientWidth);
    if (x < -2 || x > max + 2) { fakeEl.classList.add('hide'); return; }
    fakeEl.style.left = clamp(x, 0, Math.max(0, max - 1)) + 'px';
    if (state.prefs.cursor === 'block' || state.prefs.cursor === 'underline') {
        fakeEl.style.width = Math.max(4, measureText('M')) + 'px';
    } else {
        fakeEl.style.width = '2px';
    }
}

function focusCmd() {
    if (!settingsEl.hidden || !findbar.hidden || state.rsActive) return;
    try { cmdEl.focus(); } catch (e) {}
    scheduleCursor();
}

/* ── 输出搜索 ─────────────────────────────────────────────── */

function clearMarks() {
    var marks = scrollEl.querySelectorAll('mark.hit');
    for (var i = marks.length - 1; i >= 0; i--) {
        var m = marks[i];
        if (m.parentNode) m.parentNode.replaceChild(document.createTextNode(m.textContent), m);
    }
    if (marks.length) scrollEl.normalize();
    state.searchMarks = [];
    state.searchIndex = -1;
}

function openFind() {
    if (!settingsEl.hidden) closeSettings();
    if (state.rsActive) cancelRS();
    state.findOpen = true;
    findbar.hidden = false;
    var sel = '';
    try { sel = String(window.getSelection() || ''); } catch (e) {}
    if (sel && sel.length < 80 && sel.indexOf('\n') < 0) findInput.value = sel;
    findInput.focus();
    findInput.select();
    if (findInput.value.trim()) runSearch(true);
}

function closeFind() {
    clearMarks();
    findCount.textContent = '';
    findCount.classList.remove('none');
    findbar.hidden = true;
    state.findOpen = false;
    focusCmd();
}

function runSearch(reset) {
    if (findbar.hidden) return;
    clearMarks();
    var q = findInput.value.trim();
    if (!q) {
        findCount.textContent = '';
        findCount.classList.remove('none');
        return;
    }
    var walker = document.createTreeWalker(scrollEl, NodeFilter.SHOW_TEXT, {
        acceptNode: function (node) {
            if (!node.nodeValue || !node.nodeValue.length) return NodeFilter.FILTER_REJECT;
            if (node.parentNode && node.parentNode.nodeName === 'MARK') return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
        }
    });
    var nodes = [];
    var n;
    while ((n = walker.nextNode())) {
        nodes.push(n);
        if (nodes.length > 4000) break;
    }
    var lowerQ = q.toLowerCase();
    var marks = [];
    for (var ni = 0; ni < nodes.length && marks.length < 600; ni++) {
        var textNode = nodes[ni];
        var text = textNode.nodeValue;
        var lower = text.toLowerCase();
        var positions = [];
        var at = 0;
        while ((at = lower.indexOf(lowerQ, at)) !== -1) {
            positions.push(at);
            at += Math.max(1, lowerQ.length);
            if (marks.length + positions.length >= 600) break;
        }
        if (!positions.length) continue;
        var local = [];
        for (var pi = positions.length - 1; pi >= 0; pi--) {
            var mid = textNode.splitText(positions[pi]);
            var rest = mid.splitText(q.length);
            var mark = document.createElement('mark');
            mark.className = 'hit';
            mid.parentNode.insertBefore(mark, mid);
            mark.appendChild(mid);
            local.unshift(mark);
            void rest;
        }
        for (var li = 0; li < local.length; li++) marks.push(local[li]);
    }
    state.searchMarks = marks;
    if (!marks.length) {
        state.searchIndex = -1;
        findCount.textContent = '0 / 0';
        findCount.classList.add('none');
        return;
    }
    findCount.classList.remove('none');
    state.searchIndex = reset ? 0 : clamp(state.searchIndex, 0, marks.length - 1);
    if (!isFinite(state.searchIndex) || state.searchIndex < 0) state.searchIndex = 0;
    applySearchCurrent();
}

function applySearchCurrent() {
    var marks = state.searchMarks;
    if (!marks.length) return;
    for (var i = 0; i < marks.length; i++) marks[i].classList.remove('current');
    var m = marks[state.searchIndex];
    if (!m) return;
    m.classList.add('current');
    findCount.textContent = (state.searchIndex + 1) + ' / ' + marks.length;
    try { m.scrollIntoView({ block: 'center', behavior: 'auto' }); } catch (e) {
        scrollEl.scrollTop = m.offsetTop - scrollEl.clientHeight / 2;
    }
}

function findNext(dir) {
    if (!state.searchMarks.length) return;
    state.searchIndex = (state.searchIndex + dir + state.searchMarks.length) % state.searchMarks.length;
    applySearchCurrent();
}

function scheduleSearch(reset) {
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(function () { runSearch(!!reset); }, 120);
}

/* ── 反向搜索 ─────────────────────────────────────────────── */

function openRS() {
    if (state.rsActive) return;
    if (!settingsEl.hidden) closeSettings();
    if (state.findOpen) closeFind();
    var t = activeTab();
    if (!t) return;
    state.rsActive = true;
    state.rsDraft = cmdEl.value;
    rsbar.hidden = false;
    rsInput.value = '';
    rsHint.textContent = '';
    rsInput.focus();
    updateRS();
}

function updateRS() {
    var t = activeTab();
    if (!t) return;
    var q = rsInput.value.trim().toLowerCase();
    var list = t.history.slice().reverse();
    state.rsMatches = q ? list.filter(function (h) { return h.toLowerCase().indexOf(q) >= 0; }) : list.slice();
    state.rsIndex = 0;
    if (state.rsMatches.length) {
        cmdEl.value = state.rsMatches[0];
        rsHint.textContent = '1 / ' + state.rsMatches.length;
    } else {
        cmdEl.value = state.rsDraft;
        rsHint.textContent = '无匹配';
    }
    scheduleCursor();
}

function cycleRS() {
    if (!state.rsMatches.length) return;
    state.rsIndex = (state.rsIndex + 1) % state.rsMatches.length;
    cmdEl.value = state.rsMatches[state.rsIndex];
    rsHint.textContent = (state.rsIndex + 1) + ' / ' + state.rsMatches.length;
    scheduleCursor();
}

function cancelRS() {
    if (!state.rsActive) return;
    state.rsActive = false;
    rsbar.hidden = true;
    cmdEl.value = state.rsDraft || '';
    state.rsDraft = '';
    focusCmd();
    scheduleCursor();
}

function acceptRS() {
    var line = cmdEl.value;
    state.rsActive = false;
    rsbar.hidden = true;
    state.rsDraft = '';
    focusCmd();
    executeLine(line);
}

/* ── 设置面板 ─────────────────────────────────────────────── */

function syncSettingsUI() {
    if (!fontValEl) return;
    fontValEl.textContent = state.prefs.fs + ' px';
    var cBtns = settingsEl.querySelectorAll('[data-cursor]');
    for (var i = 0; i < cBtns.length; i++) {
        cBtns[i].setAttribute('aria-pressed', cBtns[i].getAttribute('data-cursor') === state.prefs.cursor ? 'true' : 'false');
    }
    var sBtns = settingsEl.querySelectorAll('[data-scheme]');
    for (var j = 0; j < sBtns.length; j++) {
        sBtns[j].setAttribute('aria-pressed', sBtns[j].getAttribute('data-scheme') === state.prefs.scheme ? 'true' : 'false');
    }
}

function trapFocus(container, e) {
    var items = container.querySelectorAll('button:not(:disabled), input:not(:disabled), [tabindex="0"]');
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function openSettings() {
    if (!settingsEl.hidden) return;
    if (state.findOpen) closeFind();
    if (state.rsActive) cancelRS();
    syncSettingsUI();
    settingsEl.hidden = false;
    var first = settingsEl.querySelector('.set-close');
    if (first) first.focus();
}

function closeSettings() {
    if (settingsEl.hidden) return;
    settingsEl.hidden = true;
    focusCmd();
}

/* ── 命令基础设施 ─────────────────────────────────────────── */

var CMD = Object.create(null);
var ALIAS = Object.create(null);

function def(name, spec) {
    spec.name = name;
    CMD[name] = spec;
    return spec;
}
function defAlias(name, target) { ALIAS[name] = target; }

function makeIO(tab, stdin) {
    return {
        tab: tab,
        stdin: stdin == null ? '' : String(stdin),
        lines: [],
        clear: false,
        exitTab: false,
        runId: tab.runId,
        write: function (text, cls) {
            if (text == null) return;
            var parts = String(text).split('\n');
            if (parts.length > 1 && parts[parts.length - 1] === '') parts.pop();
            for (var i = 0; i < parts.length; i++) {
                this.lines.push([{ t: parts[i], c: cls || '' }]);
            }
        },
        row: function (segs) { this.lines.push(segs || []); },
        blank: function () { this.lines.push([]); }
    };
}

function ioText(io) {
    var out = [];
    for (var i = 0; i < io.lines.length; i++) {
        var line = io.lines[i], s = '';
        for (var j = 0; j < line.length; j++) s += line[j].t;
        out.push(s);
    }
    return out.join('\n');
}

function charWidth(c) {
    var code = c.charCodeAt(0);
    return (code >= 0x1100 && (
        code <= 0x115F || (code >= 0x2E80 && code <= 0xA4CF) ||
        (code >= 0xAC00 && code <= 0xD7A3) || (code >= 0xF900 && code <= 0xFAFF) ||
        (code >= 0xFE30 && code <= 0xFE4F) || (code >= 0xFF00 && code <= 0xFF60) ||
        (code >= 0xFFE0 && code <= 0xFFE6)
    )) ? 2 : 1;
}

function strWidth(s) {
    s = String(s == null ? '' : s);
    var w = 0;
    for (var i = 0; i < s.length; i++) w += charWidth(s.charAt(i));
    return w;
}

function padR(s, n) {
    s = String(s);
    var w = strWidth(s);
    while (w < n) { s += ' '; w++; }
    return s;
}

function padL(s, n) {
    s = String(s);
    var w = strWidth(s);
    while (w < n) { s = ' ' + s; w++; }
    return s;
}

function parseFlags(args, allowed) {
    var flags = {}, rest = [], i = 0;
    for (; i < args.length; i++) {
        var a = args[i];
        if (a === '--') { for (var k = i + 1; k < args.length; k++) rest.push(args[k]); break; }
        if (a.length > 1 && a.charAt(0) === '-' && !/^-\d/.test(a)) {
            var letters = a.slice(1);
            for (var j = 0; j < letters.length; j++) {
                var ch = letters.charAt(j);
                if (!allowed[ch]) throw new ShellError('不支持的选项：-' + ch, 2);
                flags[ch] = true;
            }
            continue;
        }
        rest.push(a);
    }
    return { flags: flags, rest: rest };
}

function nodeTime(node) {
    var keys = ['mtime', 'modifiedAt', 'updatedAt', 'createdAt', 'created'];
    for (var i = 0; i < keys.length; i++) {
        var v = node && node[keys[i]];
        if (v) {
            var t = typeof v === 'number' ? v : Date.parse(v);
            if (isFinite(t)) return t;
        }
    }
    return 0;
}

function fmtStamp(ts) {
    if (!ts) return '—';
    try {
        var d = new Date(ts);
        var p = function (n) { return (n < 10 ? '0' : '') + n; };
        return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    } catch (e) { return '—————'; }
}

function nodeBytes(node) {
    if (!node) return 0;
    if (node.type === 'file' || (!isDir(node) && node.content != null)) {
        var c = node.content;
        if (typeof c === 'string') return c.length;
        if (c == null) return 0;
        try { return JSON.stringify(c).length; } catch (e) { return 0; }
    }
    var total = 0, keys = Object.keys(node.children || {});
    for (var i = 0; i < keys.length; i++) total += nodeBytes(node.children[keys[i]]);
    return total;
}

function childCount(node) {
    return Object.keys((node && node.children) || {}).length;
}

async function needFS() {
    if (state.fs) return state.fs;
    return refreshFS(activeTab());
}

function nodeAt(p, tab) {
    var n = getNode(state.fs, p);
    if (!n) throw new ShellError('没有这个文件或目录：' + displayPath(tab, p), 1);
    return n;
}

function parentOf(p, tab) {
    var pp = parentPath(p);
    if (!pp) throw new ShellError('不能这样操作根目录：' + displayPath(tab, p), 1);
    var parent = getNode(state.fs, pp);
    if (!parent || !isDir(parent)) throw new ShellError('父目录不存在：' + displayPath(tab, pp), 1);
    return parent;
}

function splitName(p) {
    var i = p.lastIndexOf('/');
    return { dir: i < 0 ? '' : p.slice(0, i), name: i < 0 ? p : p.slice(i + 1) };
}

function pushDirHistory(tab, from) {
    tab.dirBack.push(from);
    if (tab.dirBack.length > 40) tab.dirBack.shift();
    tab.dirFwd = [];
}

function goDirBack(tab) {
    if (!tab.dirBack.length) return false;
    var target = tab.dirBack.pop();
    tab.dirFwd.push(tab.cwd);
    tab.cwd = target;
    return true;
}

function goDirFwd(tab) {
    if (!tab.dirFwd.length) return false;
    var target = tab.dirFwd.pop();
    tab.dirBack.push(tab.cwd);
    tab.cwd = target;
    return true;
}

/* ── 文件与目录 ─────────────────────────────────────────── */

def('ls', {
    group: '文件与目录',
    usage: 'ls [-l] [-a] [-h] [路径]',
    desc: '列出目录内容。ll / la 为常用别名。',
    run: async function (args, io) {
        var o = parseFlags(args, { l: 1, a: 1, h: 1 });
        await needFS();
        var p = resolvePath(o.rest[0], io.tab);
        var node = nodeAt(p, io.tab);
        if (!isDir(node)) {
            io.row([{ t: baseName(p), c: '' }]);
            return;
        }
        var names = readDirNames(node, o.flags.a);
        if (!names.length) return;
        var tab = io.tab;
        if (o.flags.l) {
            for (var i = 0; i < names.length; i++) {
                var n = node.children[names[i]];
                var dir = isDir(n);
                var bytes = dir ? childCount(n) + '项' : (o.flags.h ? humanSize(nodeBytes(n)) : String(nodeBytes(n)));
                io.row([
                    { t: (dir ? 'd' : '-') + '  ', c: 'dim' },
                    { t: padL(bytes, 7) + '  ', c: 'faint' },
                    { t: padR(fmtStamp(nodeTime(n)), 13) + '  ', c: 'dim' },
                    { t: names[i] + (dir ? '/' : ''), c: dir ? 'dir' : '' }
                ]);
            }
            return;
        }
        var maxw = 0;
        for (var j = 0; j < names.length; j++) maxw = Math.max(maxw, strWidth(names[j]) + (isDir(node.children[names[j]]) ? 1 : 0));
        var colw = maxw + 3;
        var perRow = clamp(Math.floor(78 / colw), 1, 8);
        for (var r = 0; r < names.length; r += perRow) {
            var segs = [];
            for (var c = 0; c < perRow && r + c < names.length; c++) {
                var nm = names[r + c];
                var dd = isDir(node.children[nm]);
                var label = nm + (dd ? '/' : '');
                if (c < perRow - 1 && r + c < names.length - 1) label = padR(label, colw);
                segs.push({ t: label, c: dd ? 'dir' : '' });
            }
            io.row(segs);
        }
    }
});

def('cat', {

function readLinesFor(args, io, fromEnd) {
    var count = 10, files = [], i = 0;
    for (; i < args.length; i++) {
        if (args[i] === '-n' || args[i] === '-c') {
            var v = args[++i];
            if (v == null) throw new ShellError(args[i - 1] + ': 缺少行数', 2);
            count = parseInt(v, 10);
            if (!isFinite(count) || count < 0) throw new ShellError('行数必须是正整数', 2);
            continue;
        }
        files.push(args[i]);
    }
    return { count: count, files: files, fromEnd: fromEnd };
}

function emitHeadTail(io, text, count, fromEnd, label) {
    var lines = String(text).split('\n');
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    var out = fromEnd ? lines.slice(Math.max(0, lines.length - count)) : lines.slice(0, count);
    if (label) io.write('==> ' + label + ' <==', 'dim');
    for (var i = 0; i < out.length; i++) io.write(out[i]);
}

def('head', {

def('wc', {
    group: '文本处理',
    usage: 'wc [-l] [-w] [-c] [文件…]',
    desc: '统计行数 / 单词数 / 字符数；无文件时读管道。',
    run: async function (args, io) {
        var o = parseFlags(args, { l: 1, w: 1, c: 1 });
        var wantAll = !o.flags.l && !o.flags.w && !o.flags.c;
        var specs = [];
        if (!o.rest.length) {
            if (!io.stdin) throw new ShellError('wc: 缺少输入（请指定文件或使用管道）', 1);
            specs.push({ text: io.stdin, label: '' });
        } else {
            await needFS();
            for (var i = 0; i < o.rest.length; i++) {
                var p = resolvePath(o.rest[i], io.tab);
                var n = nodeAt(p, io.tab);
                if (isDir(n)) throw new ShellError('wc: ' + displayPath(io.tab, p) + ': 是一个目录', 1);
                specs.push({ text: n.content == null ? '' : String(n.content), label: o.rest[i] });
            }
        }
        var totals = { l: 0, w: 0, c: 0 };
        for (var j = 0; j < specs.length; j++) {
            var text = specs[j].text;
            var ln = (text.match(/\n/g) || []).length;
            var wd = text.split(/\s+/).filter(function (s) { return s.length; }).length;
            var ch = text.length;
            totals.l += ln; totals.w += wd; totals.c += ch;
            var segs = [];
            if (wantAll || o.flags.l) segs.push({ t: padL(String(ln), 7) + ' ' });
            if (wantAll || o.flags.w) segs.push({ t: padL(String(wd), 7) + ' ' });
            if (wantAll || o.flags.c) segs.push({ t: padL(String(ch), 7) + ' ' });
            if (specs[j].label) segs.push({ t: specs[j].label });
            io.row(segs);
        }
        if (specs.length > 1) {
            var ts = [];
            if (wantAll || o.flags.l) ts.push({ t: padL(String(totals.l), 7) + ' ' });
            if (wantAll || o.flags.w) ts.push({ t: padL(String(totals.w), 7) + ' ' });
            if (wantAll || o.flags.c) ts.push({ t: padL(String(totals.c), 7) + ' ' });
            ts.push({ t: '总计' });
            io.blank();
            io.row(ts);
        }
    }
});

/* ── 检索 ─────────────────────────────────────────────────── */

function globToRe(pat) {
    var s = String(pat).replace(/[.+^${}()|[\]\\]/g, '\\$&');
    s = s.replace(/\*/g, '.*').replace(/\?/g, '.');
    return new RegExp('^' + s + '$', 'i');
}

function grepLine(io, prefix, text, re, reG) {
    var segs = [{ t: prefix, c: 'dim' }];
    var last = 0, m;
    reG.lastIndex = 0;
    while ((m = reG.exec(text)) !== null) {
        if (m[0] === '') { reG.lastIndex++; continue; }
        if (m.index > last) segs.push({ t: text.slice(last, m.index) });
        segs.push({ t: m[0], c: 'ok' });
        last = m.index + m[0].length;
    }
    if (last < text.length) segs.push({ t: text.slice(last) });
    io.row(segs);
}

def('grep', {
    group: '文本处理',
    usage: 'grep [-i] [-n] [-v] 模式 [文件…]',
    desc: '在文件或管道输入中查找匹配行。',
    run: async function (args, io) {
        var o = parseFlags(args, { i: 1, n: 1, v: 1 });
        if (!o.rest.length) throw new ShellError('grep: 缺少搜索模式', 2);
        var pattern = o.rest[0];
        var files = o.rest.slice(1);
        var flags = 'i' in o.flags ? 'i' : '';
        var re, reG;
        try {
            re = new RegExp(pattern, flags);
            reG = new RegExp(pattern, flags + 'g');
        } catch (e) {
            throw new ShellError('grep: 正则表达式无效：' + pattern, 2);
        }
        var sources = [];
        if (!files.length) {
            if (!io.stdin) throw new ShellError('grep: 缺少输入（请指定文件或使用管道）', 1);
            sources.push({ label: '(标准输入)', text: io.stdin, showLabel: false });
        } else {
            await needFS();
            for (var i = 0; i < files.length; i++) {
                var p = resolvePath(files[i], io.tab);
                var n = nodeAt(p, io.tab);
                if (isDir(n)) throw new ShellError('grep: ' + displayPath(io.tab, p) + ': 是一个目录', 1);
                sources.push({ label: files[i], text: n.content == null ? '' : String(n.content), showLabel: files.length > 1 });
            }
        }
        var found = false;
        for (var s = 0; s < sources.length; s++) {
            var lines = sources[s].text.split('\n');
            if (lines.length && lines[lines.length - 1] === '') lines.pop();
            for (var ln = 0; ln < lines.length; ln++) {
                var hit = re.test(lines[ln]);
                if (o.flags.v ? hit : !hit) continue;
                found = true;
                var prefix = (sources[s].showLabel ? sources[s].label + ':' : '') + (o.flags.n ? (ln + 1) + ':' : '');
                if (o.flags.v) io.row([{ t: prefix, c: 'dim' }, { t: lines[ln] }]);
                else grepLine(io, prefix, lines[ln], re, reG);
            }
        }
        if (!found) throw new ShellError('', 1);
    }
});

def('find', {
    group: '文件与目录',
    usage: 'find [路径] [-name 模式]',
    desc: '递归查找目录下的文件与文件夹。',
    run: async function (args, io) {
        await needFS();
        var rootArg = null, pattern = '*', i = 0;
        for (; i < args.length; i++) {
            if (args[i] === '-name') { pattern = args[++i]; if (pattern == null) throw new ShellError('find: -name 缺少模式', 2); }
            else if (rootArg == null && args[i].charAt(0) !== '-') rootArg = args[i];
            else throw new ShellError('find: 不支持的参数：' + args[i], 2);
        }
        var root = resolvePath(rootArg, io.tab);
        var start = nodeAt(root, io.tab);
        var re = pattern === '*' ? null : globToRe(pattern);
        var count = 0;
        (function walk(p, node, depth) {
            if (count > 5000 || depth > 60) return;
            var name = baseName(p);
            if (re && re.test(name)) {
                io.row([{ t: displayPath(io.tab, p) + (isDir(node) ? '/' : ''), c: isDir(node) ? 'dir' : '' }]);
                count++;
            }
            if (!isDir(node)) return;
            var names = readDirNames(node, false);
            for (var k = 0; k < names.length; k++) walk(joinPath(p, names[k]), node.children[names[k]], depth + 1);
        })(root, start, 0);
        if (!count) throw new ShellError('', 1);
    }
});

def('tree', {
    group: '文件与目录',
    usage: 'tree [路径] [-L 深度]',
    desc: '以树形展示目录结构（默认 3 层）。',
    run: async function (args, io) {
        await needFS();
        var rootArg = null, limit = 3, i = 0, shown = 0;
        for (; i < args.length; i++) {
            if (args[i] === '-L') { limit = parseInt(args[++i], 10); if (!isFinite(limit) || limit < 1) throw new ShellError('tree: -L 需要正整数', 2); }
            else if (rootArg == null && args[i].charAt(0) !== '-') rootArg = args[i];
            else throw new ShellError('tree: 不支持的参数：' + args[i], 2);
        }
        var root = resolvePath(rootArg, io.tab);
        var start = nodeAt(root, io.tab);
        io.row([{ t: displayPath(io.tab, root) + (isDir(start) ? '/' : ''), c: 'dir' }]);
        if (!isDir(start)) return;
        var dirs = 0, files = 0;
        (function walk(node, prefix, depth) {
            if (depth >= limit || shown > 800) return;
            var names = readDirNames(node, false);
            for (var k = 0; k < names.length; k++) {
                if (shown++ > 800) { io.row([{ t: prefix + '…', c: 'dim' }]); return; }
                var last = k === names.length - 1;
                var child = node.children[names[k]];
                var branch = last ? '└── ' : '├── ';
                io.row([{ t: prefix + branch, c: 'faint' }, { t: names[k] + (isDir(child) ? '/' : ''), c: isDir(child) ? 'dir' : '' }]);
                if (isDir(child)) { dirs++; walk(child, prefix + (last ? '    ' : '│   '), depth + 1); }
                else files++;
            }
        })(start, '', 0);
        io.blank();
        io.row([{ t: dirs + ' 个目录, ' + files + ' 个文件', c: 'dim' }]);
    }
});

/* ── 变更操作 ─────────────────────────────────────────────── */

function cloneNode(node) {
    try { return JSON.parse(JSON.stringify(node)); } catch (e) {
        throw new ShellError('复制失败：节点包含无法序列化的数据', 1);
    }
}

function removeNode(p) {
    var sp = splitName(p);
    var parent = getNode(state.fs, sp.dir);
    if (!parent || !parent.children) throw new ShellError('无法删除：父目录不存在', 1);
    delete parent.children[sp.name];
}

def('mkdir', {
    group: '文件与目录',
    usage: 'mkdir [-p] 路径…',
    desc: '创建目录；-p 自动创建缺失的父目录。',
    run: async function (args, io) {
        var o = parseFlags(args, { p: 1 });
        if (!o.rest.length) throw new ShellError('mkdir: 缺少目录名', 2);
        await needFS();
        for (var i = 0; i < o.rest.length; i++) {
            var p = resolvePath(o.rest[i], io.tab);
            var existed = getNode(state.fs, p);
            if (existed) {
                if (o.flags.p && isDir(existed)) continue;
                throw new ShellError('mkdir: 已存在：' + displayPath(io.tab, p), 1);
            }
            var segs = p.slice(2).split('/');
            var curNode = state.fs[p.charAt(0).toUpperCase()];
            if (!curNode) throw new ShellError('mkdir: 磁盘不存在：' + p, 1);
            for (var s = 0; s < segs.length; s++) {
                if (!segs[s]) continue;
                if (!curNode.children) curNode.children = {};
                var next = curNode.children[segs[s]];
                if (!next) {
                    if (!o.flags.p && s < segs.length - 1) {
                        throw new ShellError('mkdir: 父目录不存在：' + segs.slice(0, s + 1).join('/'), 1);
                    }
                    next = { type: 'folder', children: {}, mtime: Date.now() };
                    curNode.children[segs[s]] = next;
                } else if (!isDir(next)) {
                    throw new ShellError('mkdir: 路径中存在同名文件：' + segs[s], 1);
                }
                curNode = next;
            }
        }
        await saveFS();
        refreshFS(io.tab).catch(function () {});
    }
});

def('touch', {
    group: '文件与目录',
    usage: 'touch 文件…',
    desc: '创建空文件；已存在时更新时间。',
    run: async function (args, io) {
        if (!args.length) throw new ShellError('touch: 缺少文件名', 2);
        await needFS();
        for (var i = 0; i < args.length; i++) {
            var p = resolvePath(args[i], io.tab);
            var sp = splitName(p);
            var parent = getNode(state.fs, sp.dir);
            if (!parent || !isDir(parent)) throw new ShellError('touch: 父目录不存在：' + displayPath(io.tab, sp.dir), 1);
            var node = parent.children[sp.name];
            if (node) {
                if (isDir(node)) throw new ShellError('touch: 是一个目录：' + args[i], 1);
                node.mtime = Date.now();
            } else {
                parent.children[sp.name] = { type: 'file', content: '', mtime: Date.now() };
            }
        }
        await saveFS();
    }
});

def('rm', {
    group: '文件与目录',
    usage: 'rm [-r] [-f] 路径…',
    desc: '删除文件或目录（移入回收站）；目录需要 -r。',
    run: async function (args, io) {
        var o = parseFlags(args, { r: 1, f: 1 });
        if (!o.rest.length) throw new ShellError('rm: 缺少操作对象', 2);
        await needFS();
        var trash = await readTrashStrict();
        var originalTrash = cloneNode(trash);
        var removed = [];
        for (var i = 0; i < o.rest.length; i++) {
            var p = resolvePath(o.rest[i], io.tab);
            if (/^[A-Za-z]:$/.test(p)) throw new ShellError('rm: 不能删除磁盘根目录：' + p, 1);
            if (p === io.tab.cwd) throw new ShellError('rm: 不能删除当前工作目录：' + displayPath(io.tab, p), 1);
            var n = getNode(state.fs, p);
            if (!n) {
                if (o.flags.f) continue;
                throw new ShellError('rm: 没有这个文件或目录：' + displayPath(io.tab, p), 1);
            }
            if (isDir(n) && !o.flags.r) throw new ShellError('rm: 是一个目录，请加 -r：' + displayPath(io.tab, p), 1);
            var sp = splitName(p);
            trash.push({
                name: sp.name,
                type: n.type,
                content: n.content,
                children: cloneNode(n.children || {}),
                originalPath: sp.dir,
                deletedAt: Date.now()
            });
            removed.push({ path: p, node: n });
        }
        if (!removed.length) return;
        var tempTrash = trash;
        for (var r = 0; r < removed.length; r++) removeNode(removed[r].path);
        try {
            await writeTrashStrict(tempTrash);
            await saveFS();
        } catch (e) {
            try {
                state.fs = await bridgeMs(N.getUserLS('filesystem'), 4000, 'filesystem-restore');
                await writeTrashStrict(originalTrash);
            } catch (e2) {}
            throw e;
        }
        for (var m = 0; m < removed.length; m++) {
            io.row([{ t: '已移入回收站：', c: 'dim' }, { t: displayPath(io.tab, removed[m].path), c: 'ok' }]);
        }
    }
});

def('rmdir', {
    group: '文件与目录',
    usage: 'rmdir 目录…',
    desc: '删除空目录（移入回收站）。',
    run: async function (args, io) {
        if (!args.length) throw new ShellError('rmdir: 缺少目录名', 2);
        await needFS();
        for (var i = 0; i < args.length; i++) {
            var p = resolvePath(args[i], io.tab);
            if (p === io.tab.cwd) throw new ShellError('rmdir: 不能删除当前工作目录', 1);
            var n = nodeAt(p, io.tab);
            if (!isDir(n)) throw new ShellError('rmdir: 不是目录：' + displayPath(io.tab, p), 1);
            if (childCount(n)) throw new ShellError('rmdir: 目录不为空（用 rm -r）：' + displayPath(io.tab, p), 1);
        }
      var rm = CMD['rm'];
        await rm.run(['-r'].concat(args), io);
    }
});

def('cp', {
    group: '文件与目录',
    usage: 'cp [-r] 源 目标',
    desc: '复制文件或目录（-r 复制目录）。',
    run: async function (args, io) {
        var o = parseFlags(args, { r: 1 });
        if (o.rest.length < 2) throw new ShellError('cp: 需要源和目标', 2);
        if (o.rest.length > 2) throw new ShellError('cp: 一次只支持一个源和一个目标', 2);
        await needFS();
        var src = resolvePath(o.rest[0], io.tab);
        var dst = resolvePath(o.rest[1], io.tab);
        var sn = nodeAt(src, io.tab);
        if (isDir(sn) && !o.flags.r) throw new ShellError('cp: 源是目录，请加 -r', 1);
        var dn = getNode(state.fs, dst);
        var target = dst;
        if (dn && isDir(dn)) target = joinPath(dst, baseName(src));
        if (target === src) throw new ShellError('cp: 源和目标是同一个路径', 1);
        if (isDir(sn) && (target.indexOf(src + '/') === 0)) throw new ShellError('cp: 不能把目录复制到自己的子目录中', 1);
        var sp = splitName(target);
        var parent = getNode(state.fs, sp.dir);
        if (!parent || !isDir(parent)) throw new ShellError('cp: 目标父目录不存在：' + displayPath(io.tab, sp.dir), 1);
        parent.children[sp.name] = cloneNode(sn);
        await saveFS();
        io.row([{ t: '已复制 ', c: 'dim' }, { t: displayPath(io.tab, src), c: 'accent' }, { t: ' → ', c: 'dim' }, { t: displayPath(io.tab, target), c: 'ok' }]);

});

def('mv', {
    group: '文件与目录',
    usage: 'mv 源 目标',
    desc: '移动或重命名文件 / 目录。',
    run: async function (args, io) {
        if (args.length < 2) throw new ShellError('mv: 需要源和目标', 2);
        if (args.length > 2) throw new ShellError('mv: 一次只支持一个源和一个目标', 2);
        await needFS();
        var src = resolvePath(args[0], io.tab);
        var dst = resolvePath(args[1], io.tab);
        var sn = nodeAt(src, io.tab);
        if (src === io.tab.cwd) throw new ShellError('mv: 不能移动当前工作目录', 1);
        var dn = getNode(state.fs, dst);
        var target = dst;
        if (dn && isDir(dn)) target = joinPath(dst, baseName(src));
        if (target === src) throw new ShellError('mv: 源和目标是同一个路径', 1);
        if (isDir(sn) && target.indexOf(src + '/') === 0) throw new ShellError('mv: 不能移动到自己的子目录中', 1);
        var sp = splitName(target);
        var parent = getNode(state.fs, sp.dir);
        if (!parent || !isDir(parent)) throw new ShellError('mv: 目标父目录不存在：' + displayPath(io.tab, sp.dir), 1);
        if (parent.children[sp.name] && isDir(parent.children[sp.name]) && !isDir(sn)) {
            throw new ShellError('mv: 目标已存在同名目录', 1);
        }
        parent.children[sp.name] = sn;
        removeNode(src);
        if (state.tabs.length) {
            for (var i = 0; i < state.tabs.length; i++) {
                var t = state.tabs[i];
                if (t.cwd === src || t.cwd.indexOf(src + '/') === 0) {
                    t.cwd = target + t.cwd.slice(src.length);
                    if (isActive(t)) { refreshPrompt(t); updateStatus(t); }
                }
            }
        }
        await saveFS();
        io.row([{ t: '已移动 ', c: 'dim' }, { t: displayPath(io.tab, src), c: 'accent' }, { t: ' → ', c: 'dim' }, { t: displayPath(io.tab, target), c: 'ok' }]);
    }
});

    usage: 'printf 格式 [参数…]',
    desc: '按格式输出；支持 %s %d 与 \\n \\t。',
    run: async function (args, io) {
        if (!args.length) throw new ShellError('printf: 缺少格式字符串', 2);
        var fmt = args[0].replace(/\\n/g, '\n').replace(/\\t/g, '\t').replace(/\\\\/g, '\\');
        var vals = args.slice(1), vi = 0;
        fmt = fmt.replace(/%[sd]/g, function (m) {

            return m === '%d' ? String(parseInt(v, 10) || 0) : v;
