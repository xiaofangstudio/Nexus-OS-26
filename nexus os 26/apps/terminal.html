function evalArith(src) {
    var s = String(src).replace(/\s+/g, '');
    if (!s) throw new ShellError('bc: 表达式为空', 2);
    if (/[^0-9.+\-*/%^()]/.test(s)) throw new ShellError('bc: 只支持数字与 + - * / % ^ ( )', 2);
    var pos = 0;
    function peek() { return s.charAt(pos); }
    function num() {
        var start = pos;
        while (/[0-9.]/.test(peek())) pos++;
        if (start === pos) throw new ShellError('bc: 语法错误，位置 ' + (pos + 1), 2);
        var v = parseFloat(s.slice(start, pos));
        if (!isFinite(v)) throw new ShellError('bc: 无效数字', 2);
        return v;
    }
    function atom() {
        if (peek() === '(') {
            pos++;
            var v = expr();
            if (peek() !== ')') throw new ShellError('bc: 缺少右括号', 2);
            pos++;
            return v;
        }
        if (peek() === '+' || peek() === '-') {
            var sign = peek() === '-' ? -1 : 1;
            pos++;
            return sign * factor();
        }
        return num();
    }
    function power() {
        var base = atom();
        if (peek() === '^') {
            pos++;
            return Math.pow(base, factor());
        }
        return base;
    }
    function factor() {
        var left = power();
        while (peek() === '*' || peek() === '/' || peek() === '%') {
            var op = peek(); pos++;
            var right = power();
            if ((op === '/' || op === '%') && right === 0) throw new ShellError('bc: 除数为零', 2);
            if (op === '*') left *= right;
            else if (op === '/') left /= right;
            else left %= right;
        }
        return left;
    }
    function expr() {
        var left = factor();
        while (peek() === '+' || peek() === '-') {
            var op = peek(); pos++;
            var right = factor();
            left = op === '+' ? left + right : left - right;
        }
        return left;
    }
    var result = expr();
    if (pos < s.length) throw new ShellError('bc: 语法错误，位置 ' + (pos + 1), 2);
    if (!isFinite(result)) throw new ShellError('bc: 结果超出范围', 2);
    return Math.abs(result - Math.round(result)) < 1e-10 ? String(Math.round(result)) : String(Number(result.toFixed(10)));
}

function waitAbortable(ms, tab, runId) {
    return new Promise(function (resolve, reject) {
        var deadline = Date.now() + ms;
        function tick() {
            if (tab.runId !== runId) { reject(new ShellError('已中断', 130)); return; }
            var left = deadline - Date.now();
            if (left <= 0) { resolve(); return; }
            setTimeout(tick, Math.min(120, left));
        }
        tick();
    });
}

});

var GROUP_ORDER = ['文件与目录', '文本处理', '系统信息', '终端设置', '系统交互', '会话', '受限命令'];

function groupNames() {
    var names = Object.keys(CMD);
    var byGroup = {};
    for (var i = 0; i < names.length; i++) {
        var g = CMD[names[i]].group || '其他';
        if (!byGroup[g]) byGroup[g] = [];
        byGroup[g].push(names[i]);
    }
    var order = GROUP_ORDER.slice();
    Object.keys(byGroup).forEach(function (g) { if (order.indexOf(g) < 0) order.push(g); });
    return order.filter(function (g) { return byGroup[g]; }).map(function (g) {
        return { name: g, items: byGroup[g].sort() };
    });
}

/* ── 输出渲染 ─────────────────────────────────────────────── */

function segHtml(line) {
    var html = '';
    for (var i = 0; i < line.length; i++) {
        var seg = line[i];
        html += seg.c ? '<span class="' + seg.c + '">' + esc(seg.t) + '</span>' : esc(seg.t);
    }
    return html;
}

function printIO(tab, io) {
    if (!tab || !io) return;
    for (var i = 0; i < io.lines.length; i++) {
        var line = io.lines[i];
        printLine(tab, line.length ? segHtml(line) : ' ');
    }
}

function printError(tab, msg) {
    var parts = String(msg == null ? '' : msg).split('\n');
    for (var i = 0; i < parts.length; i++) {
        if (!parts[i]) continue;
        printLine(tab, '<span class="' + (i === 0 ? 'err' : 'dim') + '">' + esc(parts[i]) + '</span>');
    }
}

function appendIO(dst, src) {
    if (!src) return;
    for (var i = 0; i < src.lines.length; i++) dst.lines.push(src.lines[i]);
}

/* ── 重定向 ───────────────────────────────────────────────── */

async function writeRedirect(targetArg, append, text, tab) {
    var tokens = tokenize(targetArg);
    if (!tokens.length) throw new ShellError('重定向：缺少目标文件', 2);
    if (tokens.length > 1) throw new ShellError('重定向：目标只能是一个文件（名称含空格请加引号）', 2);
    await needFS();
    var p = resolvePath(expandVars(tokens[0], tab), tab);
    var sp = splitName(p);
    var parent = getNode(state.fs, sp.dir);
    if (!parent || !isDir(parent)) throw new ShellError('重定向失败：目录不存在：' + displayPath(tab, sp.dir), 1);
    var existing = parent.children[sp.name];
    if (existing && isDir(existing)) throw new ShellError('重定向失败：目标是一个目录：' + displayPath(tab, p), 1);
    var body = text;
    if (append && existing) {
        var old = existing.content == null ? '' : String(existing.content);
        if (old && old.charAt(old.length - 1) !== '\n') old += '\n';
        body = old + body;
    }
    if (body && body.charAt(body.length - 1) !== '\n') body += '\n';
    if (!existing) {
        existing = { type: 'file', content: '', mtime: 0 };
        parent.children[sp.name] = existing;
    }
    existing.content = body;
    existing.type = 'file';
    existing.mtime = Date.now();
    await saveFS();
}

/* ── 执行引擎 ─────────────────────────────────────────────── */

function resolveAlias(argv) {
    var a = argv.slice(), guard = 0;
    while (a.length && ALIAS[a[0].toLowerCase()] && guard++ < 6) {
        var rep = tokenize(ALIAS[a[0].toLowerCase()]);
        a = rep.concat(a.slice(1));
    }
    return a;
}

async function runSegment(cmdText, tab, runId) {
    var redir = extractRedirect(cmdText);
    if (redir && redir.bad) throw new ShellError(redir.bad, 2);
    var parts = splitTop(redir ? redir.cmd : cmdText, '|');
    var stdin = '';
    var lastIO = makeIO(tab, '');
    var clear = false, exitTab = false;
    for (var i = 0; i < parts.length; i++) {
        if (tab.runId !== runId) return { io: lastIO, code: 130, clear: clear, exitTab: exitTab };
        var argv = tokenize(parts[i]).map(function (a) { return expandVars(a, tab); });
        if (!argv.length) throw new ShellError('语法错误：管道中缺少命令', 2);
        argv = resolveAlias(argv);
        if (!argv.length || !argv[0]) throw new ShellError('语法错误：缺少命令', 2);
        var name = argv[0].toLowerCase();
        var spec = CMD[name];
        if (!spec) {
            throw new ShellError('nexus-sh: ' + argv[0] + ': command not found\n输入 help 查看可用命令。', 127);
        }
        var io = makeIO(tab, stdin);
        io.runId = runId;
        await spec.run(argv.slice(1), io);
        if (io.clear) clear = true;
        if (io.exitTab) exitTab = true;
        lastIO = io;
        stdin = ioText(io);
    }
    if (redir) {
        await writeRedirect(redir.target, redir.append, stdin, tab);
        return { io: makeIO(tab, ''), code: 0, clear: clear, exitTab: exitTab };
    }
    return { io: lastIO, code: 0, clear: clear, exitTab: exitTab };
}

async function runChain(line, tab, runId) {
    var segs = splitChain(line);
    var combined = makeIO(tab, '');
    var prevCode = 0, error = null;
    for (var i = 0; i < segs.length; i++) {
        var text = segs[i].cmd.trim();
        var op = segs[i].op;
        if (op === '&&' && prevCode !== 0) continue;
        if (op === '||' && prevCode === 0) continue;
        if (!text) continue;
        if (tab.runId !== runId) return { io: combined, code: 130, clear: false, exitTab: false, error: null };
        var r;
        try {
            r = await runSegment(text, tab, runId);
        } catch (e) {
            if (e instanceof ShellError) {
                error = e;
                prevCode = e.code || 1;
                break;
            }
            throw e;
        }
        appendIO(combined, r.io);
        if (r.clear) combined.clear = true;
        prevCode = r.code;
        if (r.exitTab) { combined.exitTab = true; break; }
    }
    return { io: combined, code: prevCode, clear: combined.clear, exitTab: combined.exitTab, error: error };
}

/* ── 历史 ─────────────────────────────────────────────────── */

function pushHistory(tab, line) {
    if (!line) return;
    if (tab.history.length && tab.history[tab.history.length - 1] === line) {
        tab.histIdx = tab.history.length;
        return;
    }
    tab.history.push(line);
    if (tab.history.length > 200) tab.history.splice(0, tab.history.length - 200);
    tab.histIdx = tab.history.length;
    tab.lineDraft = '';
    state.recent = tab.history.slice(-200);
    scheduleRecentSave();
}

function scheduleRecentSave() {
    clearTimeout(state.recentTimer);
    state.recentTimer = setTimeout(function () {
        if (!state.bridgeReady || !state.recent.length) return;
        try { N.setUserLS('terminal.recent', state.recent).catch(function () {}); } catch (e) {}
    }, 900);
}

function abortRun(tab) {
    tab = tab || activeTab();
    if (!tab || !tab.running) return false;
    tab.runId++;
    tab.running = false;
    tab.busy = false;
    tab.busyStarted = 0;
    tab.exit = 130;
    clearTimeout(state.busyTimer);
    printLine(tab, '<span class="dim">^C</span> <span class="warn">已中断</span>');
    if (isActive(tab)) { syncBusy(); updateStatus(tab); }
    return true;
}

function syncBusy() {
    var t = activeTab();
    var show = !!(t && t.busy);
    busyEl.hidden = !show;
    cmdEl.setAttribute('aria-busy', show ? 'true' : 'false');
}

/* ── 执行入口 ─────────────────────────────────────────────── */

async function executeLine(raw) {
    var tab = activeTab();
    if (!tab) return;
    var line = String(raw == null ? '' : raw).replace(/[\r\n]+/g, ' ');
    if (tab.running) {
        printLine(tab, '<span class="warn">上一命令仍在运行；按 Ctrl+C 中断，或稍候。</span>');
        scrollBottom(tab);
        focusCmd();
        return;
    }
    cmdEl.value = '';
    tab.input = '';
    scheduleCursor();
    echoLine(tab, line);
    var cmd = line.trim();
    if (!cmd) { scrollBottom(tab); return; }
    pushHistory(tab, cmd);
    tab.running = true;
    tab.runId++;
    var runId = tab.runId;
    tab.busy = false;
    clearTimeout(state.busyTimer);
    state.busyTimer = setTimeout(function () {
        if (tab.runId !== runId) return;
        tab.busy = true;
        tab.busyStarted = Date.now();
        if (isActive(tab)) syncBusy();
    }, 320);
    var res = null;
    try {
        res = await runChain(cmd, tab, runId);
    } catch (e) {
        res = { io: makeIO(tab, ''), code: 1, clear: false, exitTab: false, error: e };
    } finally {
        clearTimeout(state.busyTimer);
        tab.busy = false;
        tab.busyStarted = 0;
        tab.running = false;
        if (tab.runId !== runId) {
            if (isActive(tab)) { syncBusy(); updateStatus(tab); }
            return;
        }
        if (res) {
            if (res.clear) {
                clearTab(tab);
            } else {
                printIO(tab, res.io);
            }
            if (res.error) {
                if (res.error instanceof ShellError) {
                    if (res.error.message) printError(tab, res.error.message);
                    tab.exit = res.error.code || 1;
                } else {
                    printError(tab, '内部错误：' + (res.error && res.error.message ? res.error.message : String(res.error)));
                    tab.exit = 1;
                }
            } else {
                tab.exit = res.code || 0;
            }
        }
        if (isActive(tab)) { syncBusy(); updateStatus(tab); }
        scrollBottom(tab);
        if (res && res.exitTab) {
            if (state.tabs.length > 1) {
                closeTab(tab.id);
            } else if (state.bridgeReady && N.closeWindow) {
                try { N.closeWindow(); } catch (e) {}
            } else {
                closeTab(tab.id);
            }
        } else {
            focusCmd();
        }
    }
}

/* ── 补全 ─────────────────────────────────────────────────── */

function currentToken() {
    var value = cmdEl.value;
    var caret = cmdEl.selectionStart;
    var head = value.slice(0, caret);
    var m = /([^\s]*)$/.exec(head);
    var token = m ? m[1] : '';
    return {
        value: value,
        caret: caret,
        token: token,
        start: caret - token.length,
        before: head.slice(0, caret - token.length)
    };
}

function commonPrefix(list) {
    if (!list.length) return '';
    var p = list[0];
    for (var i = 1; i < list.length; i++) {
        while (p && list[i].indexOf(p) !== 0) p = p.slice(0, -1);
    }
    return p;
}

function quoteName(name) {
    if (!/\s/.test(name)) return name;
    return "'" + name.replace(/'/g, "'\\''") + "'";
}

function replaceToken(ctx, insert) {
    cmdEl.value = ctx.value.slice(0, ctx.start) + insert + ctx.value.slice(ctx.caret);
    var pos = ctx.start + insert.length;
    try { cmdEl.setSelectionRange(pos, pos); } catch (e) {}
    var t = activeTab();
    if (t) t.input = cmdEl.value;
    scheduleCursor();
}

function printCandidates(tab, items) {
    var names = items.map(function (it) { return it.name + (it.kind === 'dir' ? '/' : ''); });
    var maxw = 0;
    for (var i = 0; i < names.length; i++) maxw = Math.max(maxw, strWidth(names[i]));
    var colw = maxw + 3;
    var perRow = clamp(Math.floor(78 / colw), 1, 4);
    var io = makeIO(tab, '');
    for (var r = 0; r < items.length; r += perRow) {
        var segs = [];
        for (var c = 0; c < perRow && r + c < items.length; c++) {
            var it = items[r + c];
            var label = it.name + (it.kind === 'dir' ? '/' : '');
            if (r + c < items.length - 1) label = padR(label, colw);
            segs.push({ t: label, c: it.kind === 'dir' ? 'dir' : '' });
        }
        io.row(segs);
    }
    printIO(tab, io);
    scrollBottom(tab);
}

function completeCommand() {
    var tab = activeTab();
    var ctx = currentToken();
    var looksPath = ctx.token.indexOf('/') >= 0 || ctx.token.indexOf('~') >= 0 || ctx.token.indexOf('\\') >= 0;
    var firstWord = ctx.before.trim() === '' && !looksPath;
    if (firstWord) {
        var token = ctx.token.toLowerCase();
        var cmds = Object.keys(CMD).concat(Object.keys(ALIAS)).filter(function (n) {
            return n.indexOf(token) === 0;
        }).sort();
        var items = cmds.map(function (n) { return { name: n, kind: 'cmd' }; });
        if (!items.length) {
            statusFlash('没有匹配的命令');
            return;
        }
        if (items.length === 1) {
            replaceToken(ctx, items[0].name + ' ');
            return;
        }
        var prefix = commonPrefix(cmds);
        if (prefix.length > ctx.token.length) {
            replaceToken(ctx, prefix);
            return;
        }
        printCandidates(tab, items);
        return;
    }
    if (!state.fs) {
        statusFlash('文件系统未连接，无法补全路径');
        return;
    }
    var slash = ctx.token.lastIndexOf('/');
    var dirPart = slash >= 0 ? ctx.token.slice(0, slash + 1) : '';
    var base = slash >= 0 ? ctx.token.slice(slash + 1) : ctx.token;
    var dirArg = dirPart || '.';
    if (dirArg.slice(0, 2) === '~/') dirArg = tab.home + '/' + dirArg.slice(2);
    else if (dirArg === '~') dirArg = tab.home;
    var dirPath = resolvePath(dirArg, tab);
    var dirNode = getNode(state.fs, dirPath);
    if (!dirNode || !isDir(dirNode)) {
        statusFlash('目录不存在：' + dirArg);
        return;
    }
    var names = readDirNames(dirNode, true).filter(function (n) {
        if (base.charAt(0) !== '.' && n.charAt(0) === '.') return false;
        return n.toLowerCase().indexOf(base.toLowerCase()) === 0;
    });
    var pItems = names.map(function (n) {
        return { name: n, kind: isDir(dirNode.children[n]) ? 'dir' : 'file' };
    });
    if (!pItems.length) {
        statusFlash('没有匹配的文件');
        return;
    }
    if (pItems.length === 1) {
        var it = pItems[0];
        replaceToken(ctx, dirPart + quoteName(it.name) + (it.kind === 'dir' ? '/' : ' '));
        return;
    }
    var pPrefix = commonPrefix(names);
    if (pPrefix.length > base.length) {
        replaceToken(ctx, dirPart + pPrefix);
        return;
    }
    printCandidates(tab, pItems);
}

/* ── 历史导航 / 光标移动 ─────────────────────────────────── */

function moveCaretEnd() {
    var n = cmdEl.value.length;
    try { cmdEl.setSelectionRange(n, n); } catch (e) {}
    scheduleCursor();
}

function histPrev(tab) {
    if (!tab.history.length) return;
    if (tab.histIdx >= tab.history.length) {
        tab.lineDraft = cmdEl.value;
        tab.histIdx = tab.history.length;
    }
    if (tab.histIdx > 0) {
        tab.histIdx--;
        cmdEl.value = tab.history[tab.histIdx];
        moveCaretEnd();
    }
}

function histNext(tab) {
    if (tab.histIdx < tab.history.length - 1) {
        tab.histIdx++;
        cmdEl.value = tab.history[tab.histIdx];
    } else {
        tab.histIdx = tab.history.length;
        cmdEl.value = tab.lineDraft || '';
    }
    moveCaretEnd();
}

function deleteWordBefore() {
    var v = cmdEl.value;
    var start = cmdEl.selectionStart, end = cmdEl.selectionEnd;
    if (start !== end) {
        cmdEl.value = v.slice(0, start) + v.slice(end);
        cmdEl.setSelectionRange(start, start);
    } else {
        var left = v.slice(0, start);
        var trimmed = left.replace(/\s+$/, '');
        var cut = trimmed.length;
        cmdEl.value = v.slice(0, cut) + v.slice(start);
        cmdEl.setSelectionRange(cut, cut);
    }
    scheduleCursor();
}

function jumpWord(dir) {
    var v = cmdEl.value;
    var p = cmdEl.selectionStart;
    if (dir < 0) {
        var left = v.slice(0, p);
        var m = /\S+$/.exec(left);
        p = m ? p - m[0].length : 0;
    } else {
        var right = v.slice(p);
        var n = /^\S+/.exec(right);
        if (n) {
            p += n[0].length;
            var ws = right.slice(n[0].length).match(/^\s+/);
            if (ws) p += ws[0].length;
        } else p = v.length;
    }
    try { cmdEl.setSelectionRange(p, p); } catch (e) {}
    scheduleCursor();
}

/* ── 目录历史（边缘手势） ─────────────────────────────────── */

function doDirHistory(dir) {
    var tab = activeTab();
    if (!tab) return;
    var target = dir < 0 ? tab.dirBack[tab.dirBack.length - 1] : tab.dirFwd[tab.dirFwd.length - 1];
    if (target && state.fs && !getNode(state.fs, target)) {
        if (dir < 0) tab.dirBack.pop();
        else tab.dirFwd.pop();
        statusFlash('目标目录已不存在');
        return;
    }
    var ok = dir < 0 ? goDirBack(tab) : goDirFwd(tab);
    if (!ok) {
        statusFlash(dir < 0 ? '没有更早的目录' : '没有更晚的目录');
        return;
    }
    refreshPrompt(tab);
    updateStatus(tab);
    updateWindowTitle();
    statusFlash(dir < 0 ? '← 返回上一目录' : '下一目录 →');
}

/* ── 输入 / 键盘 ─────────────────────────────────────────── */

cmdEl.addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    var tab = activeTab();
    if (!tab) return;
    var key = e.key;
    var lower = key.length === 1 ? key.toLowerCase() : key;
    var ctrl = e.ctrlKey || e.metaKey;

    if (key === 'Enter') {
        e.preventDefault();
        executeLine(cmdEl.value);
        return;
    }
    if (key === 'Tab') {
        e.preventDefault();
        completeCommand();
        return;
    }
    if (ctrl && !e.shiftKey && lower === 'c') {
        e.preventDefault();
        if (abortRun(tab)) return;
        var v = cmdEl.value;
        if (v) {
            echoLine(tab, v + '^C');
            cmdEl.value = '';
            tab.input = '';
        }
        scheduleCursor();
        return;
    }
    if (ctrl && !e.shiftKey && lower === 'l') {
        e.preventDefault();
        clearTab(tab);
        scheduleCursor();
        return;
    }
    if (ctrl && !e.shiftKey && lower === 'r') {
        e.preventDefault();
        openRS();
        return;
    }
    if (ctrl && e.shiftKey && lower === 'f') {
        e.preventDefault();
        if (state.findOpen) closeFind();
        else openFind();
        return;
    }
    if (ctrl && !e.shiftKey && lower === 't') {
        e.preventDefault();
        createTab();
        return;
    }
    if (ctrl && lower === 'w') {
        e.preventDefault();
        if (cmdEl.value) deleteWordBefore();
        else closeTab(tab.id);
        return;
    }
    if (ctrl && (key === '=' || key === '+')) {
        e.preventDefault();
        stepFont(1);
        return;
    }
    if (ctrl && (key === '-' || key === '_')) {
        e.preventDefault();
        stepFont(-1);
        return;
    }
    if (ctrl && !e.shiftKey && lower === 'a') {
        e.preventDefault();
        try { cmdEl.setSelectionRange(0, 0); } catch (err) {}
        scheduleCursor();
        return;
    }
    if (ctrl && !e.shiftKey && lower === 'e') {
        e.preventDefault();
        moveCaretEnd();
        return;
    }
    if (ctrl && !e.shiftKey && lower === 'u') {
        e.preventDefault();
        cmdEl.value = cmdEl.value.slice(cmdEl.selectionStart);
        try { cmdEl.setSelectionRange(0, 0); } catch (err) {}
        scheduleCursor();
        return;
    }
    if (ctrl && !e.shiftKey && lower === 'k') {
        e.preventDefault();
        cmdEl.value = cmdEl.value.slice(0, cmdEl.selectionStart);
        scheduleCursor();
        return;
    }
    if (ctrl && key === 'ArrowLeft') { e.preventDefault(); jumpWord(-1); return; }
    if (ctrl && key === 'ArrowRight') { e.preventDefault(); jumpWord(1); return; }
    if (ctrl && key === 'Backspace') { e.preventDefault(); deleteWordBefore(); return; }
    if (key === 'ArrowUp') {
        e.preventDefault();
        histPrev(tab);
        return;
    }
    if (key === 'ArrowDown') {
        e.preventDefault();
        histNext(tab);
        return;
    }
    if (key === 'PageUp') {
        e.preventDefault();
        pageScroll(-1);
        return;
    }
    if (key === 'PageDown') {
        e.preventDefault();
        pageScroll(1);
        return;
    }
    if (key === 'Escape') {
        if (tab.running) { e.preventDefault(); abortRun(tab); }
    }
});

cmdEl.addEventListener('input', function () {
    var t = activeTab();
    if (t) t.input = cmdEl.value;
    if (!state.rsActive) scheduleCursor();
});

cmdEl.addEventListener('click', scheduleCursor);
cmdEl.addEventListener('keyup', scheduleCursor);
cmdEl.addEventListener('select', scheduleCursor);
cmdEl.addEventListener('scroll', updateCursor, { passive: true });
cmdEl.addEventListener('focus', scheduleCursor);
cmdEl.addEventListener('blur', function () { fakeEl.classList.add('hide'); });
document.addEventListener('selectionchange', function () {
    if (document.activeElement === cmdEl) scheduleCursor();
});

scrollEl.addEventListener('mouseup', function (e) {
    if (e.button !== 0) return;
    var sel = null;
    try { sel = window.getSelection(); } catch (err) {}
    if (sel && !sel.isCollapsed) return;
    if (e.target && e.target.closest && e.target.closest('mark.hit')) return;
    focusCmd();
});

/* ── 工具按钮 / 搜索 / 反向搜索 ──────────────────────────── */

document.getElementById('btn-clear').addEventListener('click', function () {
    var t = activeTab();
    if (t) clearTab(t);
    focusCmd();
});

document.getElementById('btn-find').addEventListener('click', function () {
    if (state.findOpen) closeFind();
    else openFind();
});

document.getElementById('btn-settings').addEventListener('click', function () {
    openSettings();
});

findInput.addEventListener('input', function () { scheduleSearch(true); });
findInput.addEventListener('keydown', function (e) {
    if (e.isComposing) return;
    if (e.key === 'Enter') {
        e.preventDefault();
        findNext(e.shiftKey ? -1 : 1);
    } else if (e.key === 'Escape') {
        e.preventDefault();
        closeFind();
    }
});
document.getElementById('find-prev').addEventListener('click', function () { findNext(-1); });
document.getElementById('find-next').addEventListener('click', function () { findNext(1); });
document.getElementById('find-close').addEventListener('click', closeFind);

rsInput.addEventListener('input', updateRS);
rsInput.addEventListener('keydown', function (e) {
    if (e.isComposing) return;
    if (e.key === 'Enter') {
        e.preventDefault();
        acceptRS();
        return;
    }
    if (e.key === 'Escape' || (e.ctrlKey && e.key.toLowerCase() === 'g')) {
        e.preventDefault();
        cancelRS();
        return;
    }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || (e.ctrlKey && e.key.toLowerCase() === 'r')) {
        e.preventDefault();
        cycleRS();
        return;
    }
});

/* ── 触控板：惯性滚动 / 边缘返回 ──────────────────────────── */

scrollEl.addEventListener('wheel', function (e) {
    if (e.ctrlKey) return;
    var dx = e.deltaX, dy = e.deltaY;
    if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
    else if (e.deltaMode === 2) { dx *= scrollEl.clientHeight; dy *= scrollEl.clientHeight; }
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 1) {
        e.preventDefault();
        var now = Date.now();
        if (now < state.edgeLock) return;
        clearTimeout(state.edgeTimer);
        state.edgeAcc += dx;
        state.edgeTimer = setTimeout(function () { state.edgeAcc = 0; }, 380);
        if (state.edgeAcc > 120) {
            state.edgeAcc = 0;
            state.edgeLock = now + 650;
            doDirHistory(-1);
        } else if (state.edgeAcc < -120) {
            state.edgeAcc = 0;
            state.edgeLock = now + 650;
            doDirHistory(1);
        }
        return;
    }
    if (!dy) return;
    e.preventDefault();
    var max = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
    if (Math.abs(dy) <= 30) {
        cancelScrollAnim();
        scrollEl.scrollTop = clamp(scrollEl.scrollTop + dy, 0, max);
        state.scrollTarget = scrollEl.scrollTop;
    } else {
        if (!state.scrollAnimating) state.scrollTarget = scrollEl.scrollTop;
        state.scrollTarget = clamp(state.scrollTarget + dy, 0, max);
        startScrollAnim();
    }
}, { passive: false });

termEl.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var t = e.target;
    if (t && t.closest && t.closest('button, input, .settings-card, .settings-overlay')) return;
    if (e.clientY < 36) return;
    var w = termEl.clientWidth;
    var side = 0;
    if (e.clientX <= 26) side = -1;
    else if (e.clientX >= w - 26) side = 1;
    if (!side) return;
    state.edgePtr = { id: e.pointerId, x: e.clientX, y: e.clientY, side: side, done: false };
    termEl.classList.add('edge-drag');
    try { termEl.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: true });

termEl.addEventListener('pointermove', function (e) {
    var g = state.edgePtr;
    if (!g || g.id !== e.pointerId || g.done) return;
    var dx = e.clientX - g.x;
    var dy = e.clientY - g.y;
    if (Math.abs(dy) > 30) {
        state.edgePtr = null;
        termEl.classList.remove('edge-drag');
        return;
    }
    if (g.side < 0 && dx >= 36) {
        g.done = true;
        termEl.classList.remove('edge-drag');
        doDirHistory(-1);
    } else if (g.side > 0 && dx <= -36) {
        g.done = true;
        termEl.classList.remove('edge-drag');
        doDirHistory(1);
    }
}, { passive: true });

function endEdgeGesture() {
    state.edgePtr = null;
    termEl.classList.remove('edge-drag');
}
termEl.addEventListener('pointerup', endEdgeGesture, { passive: true });
termEl.addEventListener('pointercancel', endEdgeGesture, { passive: true });

/* ── 设置面板事件 ─────────────────────────────────────────── */

var fontBtns = settingsEl.querySelectorAll('[data-font]');
for (var fi = 0; fi < fontBtns.length; fi++) {
    (function (btn) {
        btn.addEventListener('click', function () {
            stepFont(btn.getAttribute('data-font') === '+' ? 1 : -1);
        });
    })(fontBtns[fi]);
}

var cursorBtns = settingsEl.querySelectorAll('[data-cursor]');
for (var ci = 0; ci < cursorBtns.length; ci++) {
    (function (btn) {
        btn.addEventListener('click', function () {
            setCursor(btn.getAttribute('data-cursor'));
        });
    })(cursorBtns[ci]);
}

var schemeBtns = settingsEl.querySelectorAll('[data-scheme]');
for (var si = 0; si < schemeBtns.length; si++) {
    (function (btn) {
        btn.addEventListener('click', function () {
            setScheme(btn.getAttribute('data-scheme'));
        });
    })(schemeBtns[si]);
}

document.getElementById('settings-x').addEventListener('click', closeSettings);
document.getElementById('settings-ok').addEventListener('click', closeSettings);
document.getElementById('reset-prefs').addEventListener('click', function () {
    state.prefs.fs = 13;
    state.prefs.cursor = 'system';
    state.prefs.scheme = 'auto';
    applyPrefs();
    persistPrefs();
    statusFlash('已恢复默认设置');
});

settingsEl.addEventListener('click', function (e) {
    if (e.target === settingsEl) closeSettings();
});

document.addEventListener('keydown', function (e) {
    if (settingsEl.hidden) return;
    if (e.key === 'Escape') {
        e.preventDefault();
        closeSettings();
        return;
    }
    if (e.key === 'Tab') {
        trapFocus(settingsEl.querySelector('.settings-card'), e);
    }
});

tabsEl.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    var idx = clamp(state.active + (e.key === 'ArrowRight' ? 1 : -1), 0, state.tabs.length - 1);
    switchTab(idx);
});

/* ── 启动 ─────────────────────────────────────────────────── */

var booted = false;

async function loadPrefs() {
    if (!state.bridgeReady) return;
    try {
        var p = await bridgeMs(N.getUserLS('terminal.prefs'), 3000, 'prefs');
        if (p && typeof p === 'object') {
            if (typeof p.fs === 'number') state.prefs.fs = snapFont(p.fs);
            if (CURSORS.indexOf(p.cursor) >= 0) state.prefs.cursor = p.cursor;
            if (SCHEMES.indexOf(p.scheme) >= 0) state.prefs.scheme = p.scheme;
        }
    } catch (e) {}
}

async function loadRecent() {
    if (!state.bridgeReady) return;
    try {
        var r = await bridgeMs(N.getUserLS('terminal.recent'), 3000, 'recent');
        if (Array.isArray(r)) {
            state.recent = r.filter(function (x) { return typeof x === 'string'; }).slice(-200);
        }
    } catch (e) {}
}

async function boot(ctx) {
    if (booted) return;
    booted = true;
    state.ctx = ctx || null;
    state.user = (ctx && ctx.user) || { name: '本地用户', role: 'guest' };
    state.hostDark = !!(ctx && ctx.dark);
    state.bridgeReady = !!(ctx && !ctx.offline);

    var tab = makeTab('C:');
    state.tabs.push(tab);
    state.active = 0;
    renderTabs();
    renderTab(tab);
    welcome(tab);
    state.started = true;

    await loadPrefs();
    applyPrefs();
    await loadRecent();

    if (state.bridgeReady) {
        try {
            await refreshFS(tab);
        } catch (e) {
            state.fs = null;
            state.fsOffline = true;
        }
    } else {
        state.fs = null;
        state.fsOffline = true;
    }

    if (state.fs) state.home = pickHome(state.fs, userName());
    tab.home = state.home;
    tab.cwd = state.home;
    tab.oldpwd = '';
    tab.dirBack = [];
    tab.dirFwd = [];
    tab.history = state.recent.slice(-200);
    tab.histIdx = tab.history.length;

    if (!state.bridgeReady) {
        printLine(tab, '<span class="warn">● 本地桥离线</span> <span class="dim">文件系统命令不可用；help / echo / theme 等内建命令仍可使用。</span>');
    } else if (!state.fs) {
        printLine(tab, '<span class="warn">● 文件系统未连接</span> <span class="dim">ls / cd / cat 会明确报错，不会显示假数据。</span>');
    } else {
        printLine(tab, '<span class="ok">● 已连接</span> <span class="dim">' + esc(userName()) + '@nexus · 虚拟文件系统 · ' + esc(displayPath(tab, tab.cwd)) + '</span>');
    }
    printLine(tab, '<span class="dim">输入 help 查看命令 · Tab 补全 · ↑↓ 历史 · Ctrl+R 反向搜索</span>');
    refreshPrompt(tab);
    updateStatus(tab);
    updateWindowTitle();
    syncBusy();
    scheduleCursor();
    focusCmd();
    scrollBottom(tab, true);
}

if (N && N.on) {
    N.on('theme', function (d) {
        state.hostDark = !!(d && d.dark);
        applyScheme();
        scheduleCursor();
    });
}

window.addEventListener('resize', scheduleCursor);

Nexus.ready(boot);
focusCmd();

})();
</script>
</body>
