<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>备忘录</title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/glass.css">
<link rel="stylesheet" href="_polish.css">
<style>
/* ===== 备忘录 · 独立样式（三栏 / 玻璃侧栏 / 深浅色） ===== */
.qn{/* 品牌主色：暖琥珀（不做整页发黄，只用于选中/当前/状态） */
  --qn-accent:rgb(245,158,11);--qn-accent-press:rgb(217,119,6);--qn-accent-ink:rgb(180,83,9);
  --qn-on-accent:rgb(48,32,7);
  --qn-line:rgba(15,23,42,.075);--qn-line-strong:rgba(15,23,42,.15);--qn-well:rgba(255,255,255,.34);
  --qn-hover:rgba(255,255,255,.72);--qn-editor:rgba(255,255,255,.56);--qn-seg-on:rgba(255,255,255,.82);
  --qn-accent-weak:rgba(245,158,11,.13);--qn-accent-weak2:rgba(245,158,11,.3);--qn-mark:rgba(245,158,11,.24);
  --qn-shadow:rgba(15,23,42,.1);--qn-top-bg:rgba(255,255,255,var(--n26-glass-alpha,.55));--qn-top-ink:var(--text-1);height:100%;display:flex;flex-direction:column;min-height:0;position:relative;color:var(--text-1);font-family:var(--font-sans);font-size:12px}
body.dark-mode .qn,html[data-mode="dark"] .qn{--qn-accent:rgb(251,191,36);--qn-accent-press:rgb(245,158,11);
  --qn-accent-ink:rgb(252,211,77);--qn-on-accent:rgb(40,28,8);
  --qn-line:rgba(255,255,255,.12);--qn-line-strong:rgba(255,255,255,.22);
  --qn-well:rgba(255,255,255,.07);--qn-hover:rgba(255,255,255,.11);--qn-editor:rgba(255,255,255,.035);
  --qn-seg-on:rgba(255,255,255,.12);--qn-accent-weak:rgba(251,191,36,.15);--qn-accent-weak2:rgba(251,191,36,.32);
  --qn-mark:rgba(251,191,36,.26);--qn-shadow:rgba(0,0,0,.36);
  --qn-top-bg:rgba(20,24,34,var(--n26-glass-alpha,.55));--qn-top-ink:rgba(240,244,252,.96);
  --text-1:rgba(240,244,252,.96);--text-2:rgba(226,232,240,.72);--text-3:rgba(200,210,224,.5)}
.qn *{box-sizing:border-box}
.qn [hidden],.qn-mask[hidden],.qn-menu[hidden],.qn-toast[hidden],.qn-modal-input[hidden],.qn-modal p[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:transparent;overflow:hidden;-webkit-font-smoothing:antialiased}
body.qn-standalone{background:linear-gradient(160deg,rgb(240,243,249),rgb(227,232,241))}
body.qn-standalone.dark-mode{background:linear-gradient(160deg,rgb(24,28,38),rgb(12,15,21))}

/* 顶栏 */
.qn-top{height:48px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--qn-line);background:var(--qn-top-bg);color:var(--qn-top-ink);-webkit-backdrop-filter:blur(var(--n26-blur,18px)) saturate(var(--n26-glass-sat,148%));backdrop-filter:blur(var(--n26-blur,18px)) saturate(var(--n26-glass-sat,148%))}
.qn-brand{display:flex;align-items:center;gap:7px;padding:0 2px;flex-shrink:0}
.qn-brand i{font-size:14px;color:var(--qn-accent-ink)}
.qn-brand b{font-size:14px;font-weight:600;letter-spacing:.2px}
.qn-search{flex:1;min-width:64px;max-width:330px;height:32px;display:flex;align-items:center;gap:7px;padding:0 9px;border:1px solid var(--qn-line);border-radius:var(--r-sm);background:var(--qn-well);transition:border-color var(--dur-fast) var(--ease-out-expo),box-shadow var(--dur-fast) var(--ease-out-expo)}
.qn-search:focus-within{border-color:var(--qn-accent);box-shadow:0 0 0 3px var(--qn-accent-weak)}
.qn-search>i{font-size:12px;color:var(--text-3);flex-shrink:0}
.qn-search input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-family:inherit;font-size:13px;color:var(--text-1);padding:0}
.qn-search input::placeholder{color:var(--text-3)}
.qn-search kbd{flex-shrink:0;font-family:var(--font-mono);font-size:10px;line-height:1;color:var(--text-3);border:1px solid var(--qn-line);border-radius:5px;padding:3px 4px}
.qn-search-clear{width:18px;height:18px;flex-shrink:0;border:0;border-radius:5px;background:transparent;color:var(--text-3);font-size:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.qn-search-clear:hover{background:var(--qn-hover);color:var(--text-1)}
.qn-btn{height:32px;padding:0 11px;border:1px solid var(--qn-line);border-radius:var(--r-sm);background:var(--qn-well);color:var(--text-1);font-family:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background-color var(--dur-fast) var(--ease-out-expo),border-color var(--dur-fast) var(--ease-out-expo)}
.qn-btn:hover{background:var(--qn-hover)}
.qn-btn i{font-size:12px}
.qn-btn-primary{background:var(--qn-accent);border-color:transparent;color:var(--qn-on-accent);font-weight:600;box-shadow:0 1px 2px var(--qn-shadow)}
.qn-btn-primary:hover{background:var(--qn-accent-press)}
.qn-icon-btn{width:30px;height:30px;flex-shrink:0;border:0;border-radius:var(--r-sm);background:transparent;color:var(--text-2);font-size:13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color var(--dur-fast) var(--ease-out-expo),color var(--dur-fast) var(--ease-out-expo)}
.qn-icon-btn:hover{background:var(--qn-hover);color:var(--text-1)}
.qn-icon-btn.on{color:var(--qn-accent-ink);background:var(--qn-accent-weak)}
.qn-icon-btn.danger:hover{color:var(--danger);background:rgba(239,68,68,.12)}

/* 三栏 */
.qn-cols{flex:1;min-height:0;display:flex}
.qn-side{width:clamp(206px,30%,320px);flex-shrink:0;min-width:0;display:flex;border-right:1px solid var(--qn-line)}
.qn-folders{width:72px;flex-shrink:0;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--qn-line);padding-bottom:10px}
.qn-fscroll{flex:1;overflow-y:auto;padding:6px 5px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.qn-f-row{position:relative;flex-shrink:0}
.qn-folder{width:100%;height:52px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--text-2);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;cursor:pointer;transition:background-color var(--dur-fast) var(--ease-out-expo),color var(--dur-fast) var(--ease-out-expo)}
.qn-folder i{font-size:15px;transition:color var(--dur-fast) var(--ease-out-expo)}
body.dark-mode .qn-folder i,html[data-mode="dark"] .qn-folder i{color:rgba(240,244,252,.84)}
body.dark-mode .qn-folder .qn-f-name,html[data-mode="dark"] .qn-folder .qn-f-name{color:rgba(226,232,240,.8)}
body.dark-mode .qn-icon-btn,html[data-mode="dark"] .qn-icon-btn{color:rgba(240,244,252,.86)}
body.dark-mode .qn-fadd,html[data-mode="dark"] .qn-fadd{color:rgba(240,244,252,.78)}
.qn-f-name{font-size:10.5px;line-height:1.15;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qn-f-count{position:absolute;top:3px;right:5px;font-size:10px;line-height:1;color:var(--text-3);transition:opacity var(--dur-fast) var(--ease-out-expo)}
.qn-folder:hover{background:var(--qn-hover);color:var(--text-1)}
.qn-f-row.on .qn-folder{background:var(--qn-accent-weak);color:var(--text-1)}
.qn-f-row.on .qn-folder i{color:var(--qn-accent-ink)}
.qn-f-more{position:absolute;top:2px;right:1px;width:18px;height:18px;border:0;border-radius:6px;background:transparent;color:var(--text-3);font-size:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity var(--dur-fast) var(--ease-out-expo),background-color var(--dur-fast) var(--ease-out-expo)}
.qn-f-more:hover{background:var(--qn-hover);color:var(--text-1)}
.qn-f-row:hover .qn-f-more,.qn-f-more:focus-visible{opacity:1}
.qn-f-row:hover .qn-f-count{opacity:0}
.qn-fadd{height:44px;flex-shrink:0;border:0;border-top:1px solid var(--qn-line);background:transparent;color:var(--text-2);font-family:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:background-color var(--dur-fast) var(--ease-out-expo),color var(--dur-fast) var(--ease-out-expo)}
.qn-fadd i{font-size:11px}
.qn-fadd:hover{background:var(--qn-hover);color:var(--qn-accent-ink)}
.qn-listpane{flex:1;min-width:0;display:flex;flex-direction:column}
.qn-list-head{height:36px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--qn-line)}
.qn-list-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qn-list-count{font-size:10.5px;color:var(--text-3);flex-shrink:0;font-variant-numeric:tabular-nums}
.qn-list{flex:1;overflow-y:auto;padding:6px 6px 8px;overscroll-behavior:contain}
.qn-list:focus-visible{outline-offset:-2px}
.qn-group{font-size:10.5px;line-height:1.1;color:var(--text-3);padding:7px 8px 4px;letter-spacing:.4px}
.qn-item{position:relative;padding:7px 8px;margin-bottom:2px;border-radius:var(--r-sm);cursor:pointer;transition:background-color var(--dur-fast) var(--ease-out-expo)}
.qn-item:hover{background:var(--qn-hover)}
.qn-item.active{background:var(--qn-accent-weak)}
.qn-item.active:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--qn-accent)}
.qn-item.new{animation:qnItemIn var(--dur-fast) var(--ease-out-expo) both}
.qn-item-row{display:flex;align-items:center;gap:4px}
.qn-item-title{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qn-item-snippet{font-size:11.5px;line-height:1.4;color:var(--text-2);margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qn-item-snippet mark{background:var(--qn-mark);color:inherit;border-radius:3px;padding:0 1px}
.qn-item-meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;line-height:1.2;color:var(--text-3);min-width:0}
.qn-item-folder{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qn-item-tag{color:var(--qn-accent-ink);flex-shrink:0;max-width:70px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qn-item-time{margin-left:auto;flex-shrink:0;font-variant-numeric:tabular-nums}
.qn-item-pin{width:18px;height:18px;flex-shrink:0;border:0;border-radius:5px;background:transparent;color:var(--text-3);font-size:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity var(--dur-fast) var(--ease-out-expo),color var(--dur-fast) var(--ease-out-expo)}
.qn-item:hover .qn-item-pin,.qn-item.active .qn-item-pin,.qn-item-pin.on,.qn-item-pin:focus-visible{opacity:1}
.qn-item-pin.on{color:var(--qn-accent-ink)}
.qn-list-empty{padding:26px 10px;text-align:center;color:var(--text-3);font-size:12px;line-height:1.7}
.qn-list-empty i{font-size:20px;color:var(--text-2);opacity:.5;display:block;margin-bottom:8px}
.qn-list-empty .qn-mini-link{margin-top:8px;height:26px;padding:0 10px;border:1px solid var(--qn-line);border-radius:var(--r-sm);background:var(--qn-well);color:var(--text-1);font-family:inherit;font-size:11.5px;cursor:pointer}
.qn-list-empty .qn-mini-link:hover{background:var(--qn-hover)}
.qn-list-foot{height:34px;flex-shrink:0;display:flex;align-items:center;padding:0 10px 10px;border-top:1px solid var(--qn-line);font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qn-skel-item{height:56px;margin:2px 0;border-radius:var(--r-sm);background:var(--qn-well);position:relative;overflow:hidden}
.qn-skel-item:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:qnShimmer 1.4s var(--ease-in-out-quart) infinite}
body.dark-mode .qn-skel-item:after,html[data-mode="dark"] .qn-skel-item:after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
/* 编辑区 */
.qn-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--qn-editor);min-height:0}
.qn-editor-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.qn-head{height:54px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 10px 0 16px;border-bottom:1px solid var(--qn-line)}
.qn-title{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-family:inherit;font-size:18px;font-weight:600;line-height:1.3;color:var(--text-1);padding:0}
.qn-title::placeholder{color:var(--text-3);font-weight:500}
.qn-head-actions{display:flex;gap:1px;flex-shrink:0}
.qn-meta{height:34px;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--qn-line);overflow:hidden}
.qn-folder-pick{display:flex;align-items:center;gap:5px;flex-shrink:0;color:var(--text-2);font-size:11.5px}
.qn-folder-pick>i{font-size:11px;color:var(--text-3)}
.qn-folder-sel{height:24px;max-width:112px;border:1px solid var(--qn-line);border-radius:var(--r-sm);background:var(--qn-well);color:var(--text-1);font-family:inherit;font-size:11.5px;padding:0 4px;cursor:pointer;outline:none}
.qn-tags{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.qn-tags::-webkit-scrollbar{display:none}
.qn-tag{display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 4px 0 7px;border-radius:var(--r-full);background:var(--qn-accent-weak);color:var(--qn-accent-ink);font-size:11px;line-height:1;white-space:nowrap;cursor:pointer;flex-shrink:0;border:1px solid transparent;transition:background-color var(--dur-fast) var(--ease-out-expo)}
.qn-tag.on{background:var(--qn-accent);border-color:var(--qn-accent-press);color:var(--qn-on-accent)}
.qn-tag-del{width:14px;height:14px;border:0;border-radius:50%;background:transparent;color:inherit;font-family:inherit;font-size:9px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.qn-tag-del:hover{background:rgba(15,23,42,.12)}
.qn-tag-add{height:20px;padding:0 7px;border:1px dashed var(--qn-line-strong);border-radius:var(--r-full);background:transparent;color:var(--text-3);font-family:inherit;font-size:11px;display:inline-flex;align-items:center;gap:3px;cursor:pointer;flex-shrink:0}
.qn-tag-add:hover{color:var(--qn-accent-ink);border-color:var(--qn-accent-weak2);background:var(--qn-accent-weak)}
.qn-viewbar{height:31px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--qn-line)}
.qn-seg{display:inline-flex;padding:2px;border:1px solid var(--qn-line);border-radius:var(--r-sm);background:var(--qn-well)}
.qn-seg button{height:21px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--text-2);font-family:inherit;font-size:11.5px;font-weight:500;cursor:pointer;transition:background-color var(--dur-fast) var(--ease-out-expo),color var(--dur-fast) var(--ease-out-expo)}
.qn-seg button[aria-selected="true"]{background:var(--qn-seg-on);color:var(--text-1);box-shadow:0 1px 1px var(--qn-shadow)}
.qn-mark-hint{margin-left:auto;font-size:10.5px;color:var(--text-3)}
.qn-panes{flex:1;min-height:0;position:relative;overflow:hidden;box-shadow:inset 0 0 0 0 transparent;transition:box-shadow var(--dur-fast) var(--ease-out-expo)}
.qn-panes:focus-within{box-shadow:inset 0 0 0 1px var(--qn-accent-weak2)}
.qn-pane{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:12px 16px 16px;border:0;background:transparent;color:var(--text-1);font-family:inherit;font-size:14px;line-height:1.7;overflow-y:auto;overscroll-behavior:contain;transition:opacity var(--dur-fast) var(--ease-out-expo),translate var(--dur-fast) var(--ease-out-expo)}
.qn-pane:focus-visible{outline:none}
.qn-editor{resize:none;caret-color:var(--qn-accent-ink)}
.qn-editor::placeholder{color:var(--text-3)}
.qn-preview{opacity:0;pointer-events:none;translate:0 4px}
.qn-panes.previewing .qn-editor{opacity:0;pointer-events:none;translate:0 -4px}
.qn-panes.previewing .qn-preview{opacity:1;pointer-events:auto;translate:0 0}
.qn-foot{height:34px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px 10px;border-top:1px solid var(--qn-line);font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.qn-save{display:inline-flex;align-items:center;gap:5px;color:var(--qn-accent-ink);font-size:10.5px}
.qn-save-dot{width:6px;height:6px;border-radius:50%;background:var(--qn-accent);flex-shrink:0}
.qn-save[data-state="idle"]{color:var(--text-3)}
.qn-save[data-state="idle"] .qn-save-dot{background:var(--text-3)}
.qn-save[data-state="saving"] .qn-save-dot{animation:qnPulse 1.1s var(--ease-in-out-quart) infinite}
.qn-save[data-state="error"]{color:var(--danger)}
.qn-save[data-state="error"] .qn-save-dot{background:var(--danger);animation:none}
.qn-updated{margin-left:auto;overflow:hidden;text-overflow:ellipsis}

/* Markdown 预览 */
.qn-preview h1,.qn-preview h2,.qn-preview h3,.qn-preview h4{margin:15px 0 6px;font-weight:600;line-height:1.35;color:var(--text-1)}
.qn-preview h1{font-size:19px}
.qn-preview h2{font-size:16px}
.qn-preview h3{font-size:14.5px}
.qn-preview h4{font-size:14px}
.qn-preview h1:first-child,.qn-preview h2:first-child,.qn-preview h3:first-child{margin-top:0}
.qn-preview p{margin:0 0 9px}
.qn-preview ul,.qn-preview ol{margin:0 0 9px;padding-left:20px}
.qn-preview li{margin:2px 0}
.qn-preview li::marker{color:var(--qn-accent-ink)}
.qn-preview code{font-family:var(--font-mono);font-size:12.5px;background:var(--qn-well);border-radius:4px;padding:1px 4px}
.qn-preview pre{margin:0 0 10px;padding:10px 12px;border:1px solid var(--qn-line);border-radius:var(--r-sm);background:var(--qn-well);overflow:auto}
.qn-preview pre code{background:transparent;padding:0;font-size:12.5px;line-height:1.6}
.qn-preview blockquote{margin:0 0 9px;padding-left:10px;border-left:2px solid var(--qn-accent-weak2);color:var(--text-2)}
.qn-preview a{color:var(--qn-accent-ink);text-decoration:underline;text-underline-offset:2px}
.qn-preview hr{border:0;border-top:1px solid var(--qn-line);margin:14px 0}
.qn-preview strong{font-weight:600}
.qn-preview del{color:var(--text-3)}
.qn-preview .qn-md-empty{color:var(--text-3);font-size:12px}

/* 空态 / 加载态 */
.qn-empty{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:36px 24px;text-align:center;background:var(--qn-editor)}
.qn-empty>i{font-size:34px;color:var(--text-2);opacity:.4}
.qn-empty b{font-size:14px;font-weight:600;color:var(--text-1)}
.qn-empty p{margin:0;font-size:12px;line-height:1.6;color:var(--text-2);max-width:250px}
.qn-empty .qn-btn{margin-top:4px;height:30px;font-size:12px}
.qn-empty .qn-btn i{font-size:11px}

/* 存储异常提示条 */
.qn-banner{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;background:rgba(239,68,68,.1);border-bottom:1px solid rgba(239,68,68,.22);font-size:11.5px;line-height:1.4;color:var(--text-1)}
.qn-banner>i{font-size:12px;color:var(--danger);flex-shrink:0}
.qn-banner .qn-banner-msg{flex:1;min-width:0}
.qn-banner button{height:24px;padding:0 9px;border:1px solid rgba(239,68,68,.3);border-radius:var(--r-sm);background:transparent;color:var(--danger);font-family:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
.qn-banner button:hover{background:rgba(239,68,68,.1)}
.qn-banner .qn-banner-x{width:24px;padding:0;border-color:transparent;color:var(--text-2)}

.qn-mask{position:fixed;inset:0;z-index:var(--z-modal,1100);display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(8,12,20,.42);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px) saturate(1.1);opacity:0;transition:opacity var(--dur-fast) var(--ease-out-expo)}

body.dark-mode .qn-modal,html[data-mode="dark"] .qn-modal{background:rgba(26,31,42,.96)}
.qn-mask.show .qn-modal{opacity:1;transform:none}
.qn-modal h3{margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.4;color:var(--text-1)}
.qn-modal p{margin:0;font-size:12.5px;line-height:1.6;color:var(--text-2);overflow-wrap:anywhere}
.qn-modal-input{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.qn-modal-input input{height:34px;width:100%;border:1px solid var(--qn-line-strong);border-radius:var(--r-sm);background:var(--qn-well);color:var(--text-1);font-family:inherit;font-size:13px;padding:0 10px;outline:none}
.qn-modal-input input:focus{border-color:var(--qn-accent);box-shadow:0 0 0 3px var(--qn-accent-weak)}
.qn-modal-err{min-height:16px;font-size:11.5px;line-height:1.3;color:var(--danger)}
.qn-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.qn-modal-actions .qn-btn{height:30px;font-size:12px}
.qn-btn-danger{background:var(--danger);border-color:transparent;color:rgb(255,255,255);font-weight:600}
.qn-btn-danger:hover{background:rgb(220,38,38)}
.qn-menu{position:fixed;z-index:var(--z-menu,1200);min-width:128px;padding:4px;border:1px solid var(--qn-line-strong);border-radius:var(--r-sm);background:rgba(252,253,255,.97);box-shadow:0 8px 24px var(--qn-shadow)}
body.dark-mode .qn-menu,html[data-mode="dark"] .qn-menu{background:rgba(26,31,42,.97)}
.qn-menu button{display:block;width:100%;height:30px;padding:0 9px;border:0;border-radius:7px;background:transparent;color:var(--text-1);font-family:inherit;font-size:12px;text-align:left;cursor:pointer}
.qn-menu button:hover{background:var(--qn-hover)}

.qn-toast{position:fixed;left:50%;bottom:40px;z-index:var(--z-toast,1300);max-width:360px;min-width:160px;padding:9px 14px;border:1px solid var(--qn-line-strong);border-radius:12px;background:rgba(252,253,255,.94);box-shadow:0 10px 30px var(--qn-shadow);font-size:12px;line-height:1.4;color:var(--text-1);text-align:center;opacity:0;translate:-50% 8px;pointer-events:none;transition:opacity var(--dur-fast) var(--ease-out-expo),translate var(--dur-fast) var(--ease-out-expo)}
body.dark-mode .qn-toast,html[data-mode="dark"] .qn-toast{background:rgba(26,31,42,.94)}
.qn-toast.show{opacity:1;translate:-50% 0}

@keyframes qnShimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes qnItemIn{from{opacity:.55;translate:0 -4px}to{opacity:1;translate:0 0}}
@keyframes qnPulse{0%,100%{opacity:1}50%{opacity:.35}}

@media (max-width:620px){

<body>
<div class="qn" id="qnRoot">
  <header class="qn-top">
    <div class="qn-brand"><i class="fa-solid fa-feather-pointed" aria-hidden="true"></i><b>备忘录</b></div>
    <div class="qn-search">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input id="qnSearch" type="search" placeholder="搜索标题、正文、标签" aria-label="搜索便签" autocomplete="off">
      <button id="qnSearchClear" class="qn-search-clear" aria-label="清除搜索" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      <kbd>Ctrl F</kbd>
    </div>
    <button id="qnNew" class="qn-btn qn-btn-primary" title="新建便签 (Ctrl+N)"><i class="fa-solid fa-plus" aria-hidden="true"></i><span>新建</span></button>
    <button id="qnExport" class="qn-icon-btn" title="导出当前便签为 Markdown (Ctrl+E)" aria-label="导出当前便签"><i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i></button>
  </header>

  <div class="qn-banner" id="qnBanner" role="alert" hidden>
    <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
    <span class="qn-banner-msg">本地存储已满，改动未能保存。请导出备份后清理空间。</span>
    <button id="qnBannerBackup">导出备份</button>
    <button id="qnBannerX" class="qn-banner-x" aria-label="关闭提示"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
  </div>

  <div class="qn-cols">
    <aside class="qn-side">
      <nav class="qn-folders" aria-label="文件夹">
        <div class="qn-fscroll" id="qnFScroll"></div>
        <button class="qn-fadd" id="qnFAdd" title="新建文件夹"><i class="fa-solid fa-folder-plus" aria-hidden="true"></i><span>新建</span></button>
      </nav>
      <div class="qn-listpane">
        <div class="qn-list-head">
          <span id="qnListTitle" class="qn-list-title">全部便签</span>
          <span id="qnListCount" class="qn-list-count">0</span>
        </div>
        <div class="qn-list" id="qnList" role="listbox" aria-label="便签列表" tabindex="0"></div>
        <div class="qn-list-foot" id="qnListFoot"></div>
      </div>
    </aside>

    <main class="qn-main">
      <div class="qn-empty" id="qnMainEmpty" hidden>
        <i class="fa-solid fa-feather-pointed" aria-hidden="true"></i>
        <b id="qnEmptyTitle">还没有便签</b>
        <p id="qnEmptyDesc">记下一句话，下次一定找得到。</p>
        <button id="qnEmptyBtn" class="qn-btn qn-btn-primary"><i class="fa-solid fa-plus" aria-hidden="true"></i><span id="qnEmptyBtnText">新建第一篇</span></button>
      </div>

      <div class="qn-editor-wrap" id="qnEditorWrap" hidden>
        <div class="qn-head">
          <input id="qnTitle" class="qn-title" placeholder="便签标题" aria-label="便签标题" maxlength="200" autocomplete="off">
          <div class="qn-head-actions">
            <button id="qnPin" class="qn-icon-btn" title="置顶便签" aria-label="置顶便签" aria-pressed="false"><i class="fa-solid fa-thumbtack" aria-hidden="true"></i></button>
            <button id="qnDelete" class="qn-icon-btn danger" title="删除便签 (Ctrl+Shift+D)" aria-label="删除便签"><i class="fa-solid fa-trash-can" aria-hidden="true"></i></button>
          </div>
        </div>

        <div class="qn-meta">
          <div class="qn-folder-pick">
            <i class="fa-solid fa-folder" aria-hidden="true"></i>
            <select id="qnFolderSel" class="qn-folder-sel" aria-label="所属文件夹"></select>
          </div>
          <div class="qn-tags" id="qnTags"></div>
        </div>

        <div class="qn-viewbar">
          <div class="qn-seg" role="tablist" aria-label="编辑或预览">
            <button id="qnTabEdit" role="tab" aria-selected="true" aria-controls="qnBody" tabindex="0">编辑</button>
            <button id="qnTabView" role="tab" aria-selected="false" aria-controls="qnPreview" tabindex="-1">预览</button>
          </div>
          <span class="qn-mark-hint">Markdown · 自动保存</span>
        </div>

        <div class="qn-panes" id="qnPanes">
          <textarea id="qnBody" class="qn-pane qn-editor" role="tabpanel" aria-labelledby="qnTabEdit" placeholder="写点什么，支持 Markdown…" spellcheck="false"></textarea>
          <div id="qnPreview" class="qn-pane qn-preview" role="tabpanel" aria-labelledby="qnTabView" tabindex="0"></div>
        </div>

        <footer class="qn-foot">
          <span id="qnWords">0 字</span>
          <span class="qn-save" id="qnSave" data-state="idle"><span class="qn-save-dot" aria-hidden="true"></span><span id="qnSaveText">已保存</span></span>
          <span class="qn-updated" id="qnUpdated"></span>
        </footer>
      </div>
    </main>
  </div>
</div>

<div class="qn-mask" id="qnModalMask" hidden>
  <div class="qn-modal" id="qnModal" role="dialog" aria-modal="true" aria-labelledby="qnModalTitle" aria-describedby="qnModalDesc">
    <h3 id="qnModalTitle">删除便签？</h3>
    <p id="qnModalDesc"></p>
    <div class="qn-modal-input" id="qnModalInputWrap" hidden>
      <input id="qnModalInput" type="text" maxlength="24" autocomplete="off">
      <div class="qn-modal-err" id="qnModalErr"></div>
    </div>
    <div class="qn-modal-actions">
      <button id="qnModalCancel" class="qn-btn">取消</button>
      <button id="qnModalOk" class="qn-btn qn-btn-danger">删除</button>
    </div>
  </div>
</div>

<div class="qn-menu" id="qnMenu" role="menu" hidden>
  <button role="menuitem" data-act="rename">重命名</button>
  <button role="menuitem" data-act="delete" class="danger">删除文件夹</button>
</div>
<div class="qn-toast" id="qnToast" role="status" aria-live="polite" hidden></div>

<script src="../ui/motion.js"></script>

<script>
/* ===== 备忘录 · 数据与渲染 ===== */
(function () {

  var KEY = 'quicknote_v3';
  var LEGACY = ['quicknotes_v2', 'quicknotes'];
  var UNCAT = 'uncat';

    storageError: false, bannerDismissed: false, dirty: false, saveTimer: 0, saveAt: 0,

  var el = {};
  var modalState = { open: false, onOk: null, focused: null };
  var toastTimer = 0, menuFolderId = null, menuTimer = 0;

  var IDS = ['qnRoot', 'qnSearch', 'qnSearchClear', 'qnNew', 'qnExport', 'qnBanner', 'qnBannerBackup',
    'qnBannerX', 'qnFScroll', 'qnFAdd', 'qnListTitle', 'qnListCount', 'qnList', 'qnListFoot',
    'qnMainEmpty', 'qnEmptyTitle', 'qnEmptyDesc', 'qnEmptyBtn', 'qnEmptyBtnText', 'qnEditorWrap',
    'qnTitle', 'qnPin', 'qnDelete', 'qnFolderSel', 'qnTags', 'qnTabEdit', 'qnTabView', 'qnPanes',
    'qnBody', 'qnPreview', 'qnWords', 'qnSave', 'qnSaveText', 'qnUpdated',
    'qnModalMask', 'qnModal', 'qnModalTitle', 'qnModalDesc', 'qnModalInputWrap', 'qnModalInput',
    'qnModalErr', 'qnModalCancel', 'qnModalOk', 'qnMenu', 'qnToast'];
  IDS.forEach(function (id) { el[id] = document.getElementById(id); });

  function $id(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function fmtFull(ts) {

  }
  function bucket(ts) {

    var a = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
    var b = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var diff = Math.round((a - b) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff < 7) return '本周';

  }
  function byUpdated(a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }

    for (var i = 0; i < state.notes.length; i++) if (state.notes[i].id === id) return state.notes[i];
    return null;
  }
  function currentNote() { return findNote(state.currentId); }
  function folderById(id) {
    for (var i = 0; i < state.folders.length; i++) if (state.folders[i].id === id) return state.folders[i];

  }
  function folderName(id) { var f = folderById(id); return f ? f.name : '未分类'; }
  function noteTitle(n) { return String(n && n.title || '').trim() || '无标题'; }

      folders: state.folders.map(function (f) { return { id: f.id, name: f.name }; }),
      notes: state.notes.map(function (n) {

  function setSaveState(kind, text) {
    state.saveStatus = kind;
    if (!el.qnSave) return;
    el.qnSave.dataset.state = kind;
    el.qnSaveText.textContent = text || (kind === 'saving' ? '保存中…' :

  }
  function toast(msg) {
    if (!el.qnToast) return;
    el.qnToast.textContent = msg;
    el.qnToast.hidden = false;
    clearTimeout(toastTimer);
    requestAnimationFrame(function () { el.qnToast.classList.add('show'); });
    toastTimer = setTimeout(function () {
      el.qnToast.classList.remove('show');
      setTimeout(function () { el.qnToast.hidden = true; }, 170);
    }, 1900);
  }
  function showBanner() {
    if (!el.qnBanner || state.bannerDismissed) return;
    el.qnBanner.hidden = false;
  }
  function hideBanner() {
    if (!el.qnBanner) return;
    el.qnBanner.hidden = true;
    state.bannerDismissed = false;
  }
  function onStorageError(e) {
    state.storageError = true;
    state.dirty = true;

    updateFooter();

    }

    } catch (e) {

      return false;
    }

    state.storageError = false;
    state.saveAt = now();
    setSaveState('saved');
    hideBanner();

      } catch (e) { markHostLost(); }
    }
    if (!opts.silent) {
      if (typeof renderFolders === 'function') renderFolders();
      if (typeof renderList === 'function') renderList();

      Nexus.ready(function (ctx) {
        if (!ctx || ctx.offline || !ctx.windowId) {
          state.host = false; state.offline = true; state.loading = false; applyAll();
          return;
        }
        state.host = true;
        loadHost();
      });
    } else {
      state.loading = false;
      applyAll();
    }
    setTimeout(function () {
      if (state.loading) { state.loading = false; state.offline = true; applyAll(); }
    }, 3400);
  }
  boot();

})();
</script>
</body>
