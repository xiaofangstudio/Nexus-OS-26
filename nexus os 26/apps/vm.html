<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虚拟机</title>
<script src="_bridge.js"></script>
<script src="_app.js"></script>
<style>
  :root {
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --primary: #6366f1;
    /* ★ 变量加前缀，防 fangUI tokens.css 注入后 --bg/--text 类通用名被覆盖 */
    --vm-bg: #0b0e1a;
    --line: rgba(255, 255, 255, 0.14);
    --vm-text: #f1f5f9;
    --sub: rgba(226, 232, 240, 0.62);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--vm-bg);
    color: var(--vm-text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  /* ===== 选择系统（首屏） ===== */
  .vm-pick {
    flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    background:
      radial-gradient(1100px 560px at 22% -8%, rgba(99,102,241,0.22), transparent 62%),
      radial-gradient(880px 480px at 100% 108%, rgba(139,92,246,0.16), transparent 60%),
      linear-gradient(160deg, #0d1124, #0a0d18);
    padding: 30px;
  }
  .vm-pick h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.4px; }
  .vm-pick .tip { font-size: 12.5px; color: var(--sub); margin-top: -16px; text-align: center; max-width: 480px; }
  .vm-os-grid { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .vm-os-card {
    width: 250px; border-radius: 16px; overflow: hidden; cursor: pointer;
    background: rgba(255,255,255,0.07); border: 1px solid var(--line);
    transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-out), border-color 0.2s;
    text-align: left; color: var(--vm-text); font-family: inherit;
    flex: none;
  }
  .vm-os-card:hover {
    transform: translateY(-6px); border-color: rgba(129,140,248,0.65);
    box-shadow: 0 18px 44px rgba(0,0,0,0.5), 0 0 0 1px rgba(129,140,248,0.3);
  }
  .vm-os-card .shot {
    height: 118px; display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800; color: #fff;
    border-bottom: 1px solid var(--line); position: relative; overflow: hidden;
  }
  .vm-os-card.os26 .shot { background: linear-gradient(140deg, #4f46e5 0%, #7c3aed 55%, #0ea5e9 130%); }
  .vm-os-card.os1  .shot { background: linear-gradient(140deg, #0e7490 0%, #155e75 60%, #083344 130%); }
  .vm-os-card .shot::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(140px 60px at 70% 20%, rgba(255,255,255,0.22), transparent 70%);
  }
  .vm-os-card .meta { padding: 13px 15px 15px; }
  .vm-os-card .nm { font-size: 14.5px; font-weight: 750; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .vm-os-card .tag {
    font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600;
    background: rgba(255,255,255,0.12); color: #c7d2fe;
  }
  .vm-os-card .ds { font-size: 11.5px; color: var(--sub); margin-top: 7px; line-height: 1.65; }
  .vm-os-card .go {
    margin-top: 11px; font-size: 11.5px; font-weight: 700; color: #a5b4fc;
    display: flex; align-items: center; gap: 5px;
  }

  /* ===== 运行中 ===== */
  .vm-run { flex: 1 1 0; min-height: 0; display: none; flex-direction: column; }
  .vm-run.on { display: flex; }
  .vm-top {
    flex: none; height: 38px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    background: rgba(255,255,255,0.06);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(18px);
    position: relative; z-index: 20;
  }
  .vm-top .vm-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vm-top .vm-badge {
    flex: none; font-size: 10.5px; color: #a5f3fc;
    background: rgba(34, 211, 238, 0.14);
    border: 1px solid rgba(34, 211, 238, 0.4);
    padding: 2px 8px; border-radius: 20px; white-space: nowrap;
  }
  .vm-top .sp { margin-left: auto; }
  .vm-tool {
    border: 1px solid var(--line); background: rgba(255,255,255,0.08);
    color: var(--vm-text); border-radius: 8px; padding: 5px 11px;
    font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: all 0.22s var(--ease-out); flex: none;
  }
  .vm-tool:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
  .vm-tool.danger { color: #fecaca; border-color: rgba(239,68,68,0.5); background: rgba(239,68,68,0.18); }

  /* 虚拟机屏幕：iframe 真正再开一台系统 */
  .vm-screen { flex: 1 1 0; min-height: 0; position: relative; background: #000; }
  .vm-screen iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: none; background: #000; display: block;
  }
  /* 开机遮罩 */
  .vm-boot {
    position: absolute; inset: 0; z-index: 80;
    background: radial-gradient(circle at 50% 40%, #1b2240, #070a14 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
    transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out);
  }
  .vm-boot.gone { opacity: 0; transform: scale(1.06); pointer-events: none; }
  .vm-logo {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, #818cf8, #c084fc);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #fff; font-weight: 800;
    box-shadow: 0 12px 40px rgba(99, 102, 241, 0.55);
    animation: bootPulse 1.6s ease-in-out infinite;
  }
  .vm-os1 .vm-logo { background: linear-gradient(135deg, #22d3ee, #0e7490); box-shadow: 0 12px 40px rgba(14, 116, 144, 0.55); }
  @keyframes bootPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .vm-boot .t { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
  .vm-boot .s { font-size: 12px; color: var(--sub); }
  .vm-prog { width: 220px; height: 5px; border-radius: 4px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .vm-prog > i { display: block; height: 100%; width: 0%; border-radius: 4px;
    background: linear-gradient(90deg, #818cf8, #c084fc);
    transition: width 0.3s var(--ease-out); }

  .toast {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(16px);
    background: rgba(15, 18, 30, 0.92); color: #fff; padding: 9px 16px; border-radius: 10px;
    font-size: 12.5px; opacity: 0; transition: all 0.35s var(--ease-spring); z-index: 90;
    border: 1px solid var(--line); pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 窄窗口适配：卡片竖排 */
  @media (max-width: 620px) {
    .vm-os-grid { flex-direction: column; align-items: center; }
    .vm-os-card { width: 100%; max-width: 380px; }
    .vm-pick h1 { font-size: 17px; }
    .vm-pick { padding: 20px; gap: 18px; }
  }
</style>
</head>
<body>
  <!-- 选择系统版本 -->
  <div class="vm-pick" id="pick">
    <h1>虚拟机</h1>
    <div class="tip">选择要启动的系统版本 —— 独立内存实例，与这台机器完全隔离，关机即焚</div>
    <div class="vm-os-grid">
      <button class="vm-os-card os26" onclick="vmStart('os26')">
        <div class="shot">26</div>
        <div class="meta">
          <div class="nm">Nexus OS 26 <span class="tag">当前世代</span></div>
          <div class="ds">液态玻璃 · 全屏磁贴开始菜单 · AI 小方 · 51 个应用。虚拟机里跑的就是你眼前这套系统的完整副本。</div>
          <div class="go">启动 <i class="fas fa-arrow-right"></i></div>
        </div>
      </button>
      <button class="vm-os-card os1" onclick="vmStart('os1')">
        <div class="shot">初代</div>
        <div class="meta">
          <div class="nm">初代 Nexus OS <span class="tag">经典</span></div>
          <div class="ds">2025 年的那台机器——伪系统的起点，标杆之作。回头看看我们从哪里出发。</div>
          <div class="go">启动 <i class="fas fa-arrow-right"></i></div>
        </div>
      </button>
    </div>
  </div>

  <!-- 运行中 -->
  <div class="vm-run" id="run">
    <div class="vm-top">
      <span class="vm-title" id="vmt">🖥 虚拟机</span>
      <span class="vm-badge"><i class="fas fa-shield-alt"></i> 与宿主隔离</span>
      <span class="sp"></span>
      <button class="vm-tool" onclick="vmReboot()"><i class="fas fa-redo"></i>重启</button>
      <button class="vm-tool" onclick="vmToggleFs()"><i class="fas fa-expand"></i>全屏</button>
      <button class="vm-tool" onclick="vmBack()"><i class="fas fa-arrow-left"></i>换系统</button>
      <button class="vm-tool danger" onclick="vmPowerOff()"><i class="fas fa-power-off"></i>关机即焚</button>
    </div>
    <div class="vm-screen" id="screen">
      <iframe id="vmFrame" title="虚拟机屏幕" allow="geolocation; clipboard-read; clipboard-write"></iframe>
      <div class="vm-boot" id="boot">
        <div class="vm-logo" id="bootLogo">26</div>
        <div class="t" id="bootT">Nexus OS 26 · 虚拟机</div>
        <div class="s">正在初始化独立内存实例…</div>
        <div class="vm-prog"><i id="prog"></i></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var cur = null;           // 'os26' | 'os1'

  var OS = {
    os26: {
      src: '../Nexus OS 26.html',
      title: 'Nexus OS 26 · 虚拟机',
      logo: '26', cls: ''
    },
    os1: {
      src: 'vm-os1/Nexus OS.html',
      title: '初代 Nexus OS · 虚拟机',
      logo: '初', cls: 'vm-os1'
    }
  };

  function $(id) { return document.getElementById(id); }
  function toast(m) {
    var t = $('toast'); t.textContent = m; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }

  /* 开机进度条 */
  function runBoot() {
    var b = $('boot'), p = $('prog');
    b.classList.remove('gone');
    p.style.width = '0%';
    var v = 0;
    var iv = setInterval(function () {
      v = Math.min(100, v + 9 + Math.random() * 15);
      p.style.width = v + '%';
      if (v >= 100) {
        clearInterval(iv);
        setTimeout(function () { b.classList.add('gone'); }, 280);
      }
    }, 105);
  }

  /* ===== 启动一台系统 ===== */
  window.vmStart = function (which) {
    var o = OS[which]; if (!o) return;
    cur = which;
    $('pick').style.display = 'none';
    $('run').classList.add('on');
    $('vmt').textContent = '🖥 ' + o.title;
    $('bootT').textContent = o.title;
    $('bootLogo').textContent = o.logo;
    $('boot').className = 'vm-boot ' + (o.cls || '');
    var f = $('vmFrame');
    f.src = 'about:blank';
    // 先挂遮罩再换 src，避免闪一下上一台机器的画面
    setTimeout(function () { f.src = o.src; }, 60);
    runBoot();
    toast('已启动 ' + o.title.replace(' · 虚拟机', '') + '，里面的一切关机即焚');
  };

  window.vmBack = function () {
    $('vmFrame').src = 'about:blank';
    $('run').classList.remove('on');
    $('pick').style.display = '';
    cur = null;
  };

  window.vmReboot = function () {
    if (!cur) return;
    var f = $('vmFrame');
    f.src = 'about:blank';
    setTimeout(function () { f.src = OS[cur].src; }, 80);
    runBoot();
    toast('虚拟机已重启，内存已清空');
  };

  window.vmToggleFs = function () {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  };

  window.vmPowerOff = function () {
    // 关闭即焚：卸载系统、清空引用，然后关掉这个窗口
    $('vmFrame').src = 'about:blank';
    cur = null;
    if (window.Nexus && Nexus.closeWindow) Nexus.closeWindow();
    else window.close();
  };
})();
</script>
</body>
</html>
