<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玩机技巧</title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/glass.css">
<style>
  html, body { height: 100%; margin: 0; font-family: var(--font-sans); }
  body { background: transparent; overflow: hidden; }
  .tips-content {
    padding: 16px 18px 24px; color: #1a1a1a; overflow-y: auto; height: 100%;
    box-sizing: border-box; background: transparent;
  }
  body.dark-mode .tips-content { color: #f0f0f0; }

  /* 顶部：搜索 + 分类 */
  .tips-top { position: sticky; top: -16px; z-index: 5; margin: -16px -18px 0; padding: 14px 18px 10px;
    background: linear-gradient(180deg, rgba(245,245,247,.96) 0%, rgba(245,245,247,.86) 70%, rgba(245,245,247,0) 100%); }
  body.dark-mode .tips-top { background: linear-gradient(180deg, rgba(20,22,30,.96) 0%, rgba(20,22,30,.86) 70%, rgba(20,22,30,0) 100%); }
  .tips-search {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px;
    background: rgba(120,130,150,.12); border: 1px solid rgba(120,130,150,.20);
  }
  .tips-search i { opacity: .55; font-size: 12px; }
  .tips-search input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 13px; color: inherit;
  }
  body.dark-mode .tips-search { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); }
  .tips-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tips-cat {
    padding: 5px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
    background: rgba(120,130,150,.10); border: 1px solid transparent;
    transition: all .18s var(--ease-out);
  }
  .tips-cat:hover { background: rgba(120,130,150,.18); }
  .tips-cat.on { background: linear-gradient(180deg,#60a5fa,#3b82f6); color: #fff; border-color: rgba(59,130,246,.6); }
  body:not(.dark-mode) .tips-cat { background: rgba(0,0,0,.04); color: rgba(0,0,0,.72); }
  body:not(.dark-mode) .tips-cat:hover { background: rgba(0,0,0,.08); }
  body:not(.dark-mode) .tips-cat.on { background: linear-gradient(180deg,#60a5fa,#3b82f6); color: #fff; }

  /* 实时状态条 */
  .tips-stat {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin: 14px 0 4px;
  }
  .tips-stat-i {
    padding: 9px 10px; border-radius: 12px; text-align: center;
    background: rgba(120,130,150,.10); border: 1px solid rgba(120,130,150,.16);
  }
  .tips-stat-v { font-size: 15px; font-weight: 700; }
  .tips-stat-l { font-size: 10px; opacity: .6; margin-top: 2px; }
  body:not(.dark-mode) .tips-stat-i { background: rgba(0,0,0,.03); border-color: rgba(0,0,0,.07); }

  /* 精选技巧卡 */
  .tips-sec-h {
    display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700;
    margin: 18px 0 10px;
  }
  .tips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .tip-card {
    padding: 12px 13px; border-radius: 14px; cursor: pointer;
    background: rgba(120,130,150,.11); border: 1px solid rgba(120,130,150,.16);
    transition: transform .22s var(--ease-out), background .22s var(--ease-out), box-shadow .22s var(--ease-out);
    animation: tipCardIn .36s var(--ease-out) both;
  }
  .tip-card:hover {
    transform: translateY(-2px);
    background: rgba(120,130,150,.18);
    box-shadow: 0 8px 22px rgba(0,0,0,.14);
  }
  .tip-card-t { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  .tip-card-t i { font-size: 14px; }
  .tip-card-d { font-size: 11.5px; opacity: .72; line-height: 1.6; margin-top: 6px; }
  .tip-card-ic {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.22);
  }
  .tip-card-ic img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes tipCardIn {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: translateY(0); }
  }
  .tips-empty {
    padding: 26px 14px; text-align: center; font-size: 12.5px; opacity: .6;
    background: rgba(120,130,150,.08); border-radius: 14px;
  }
  .tips-hint { font-size: 11px; opacity: .55; margin-top: 8px; line-height: 1.6; }
  @media (prefers-reduced-motion: reduce) { .tip-card { animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="../ui/motion.js"></script>
<script src="_bridge.js"></script>
<script src="_app.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var state = { q: '', cat: 'all', apps: [] };

  /* —— 精选技巧：只写系统里确实存在的能力 —— */
  var FEATURED = [
    { id: 'widget-resize', icon: 'fa-up-right-and-down-left-from-center', cat: 'desktop',
      title: '小组件自由拉伸',
      desc: '把鼠标移到小组件右下角，会出现拉伸手柄。默认最大 9×9、最小 1×2；壁纸推荐、智能设备、作息计划这类宽屏组件可以拉到 18×9。尺寸会自动记住。' },
    { id: 'widget-panel', icon: 'fa-table-cells-large', cat: 'desktop',
      title: '一键添加小组件',
      desc: '桌面右键 →「小组件」，或点 Dock 右侧的小组件胶囊，就能在网格里挑组件往桌面加。' },
    { id: 'ai-covi', icon: 'fa-comment-dots', cat: 'ai',
      title: 'AI 小方 Covi',
      desc: 'Dock 左侧第一个就是 AI 小方。输入框可以按 Shift+Enter 换行，点 ⛶ 按钮能铺满聊天区，方便写长内容。' },
    { id: 'dock-style', icon: 'fa-sliders', cat: 'personalize',
      title: 'Dock 位置与风格',
      desc: 'Dock 可以放底部 / 顶部 / 左侧 / 右侧。三段里中间那一段是液态玻璃材质，左右两个胶囊是信息入口。' },
    { id: 'glass-style', icon: 'fa-droplet', cat: 'personalize',
      title: '三种界面风格',
      desc: '设置 → 个性化 → 界面风格：液态玻璃（半透模糊 + 颗粒）、扁平化（纯色无阴影）、拟物化（多层阴影）。' },
    { id: 'wallpaper', icon: 'fa-image', cat: 'personalize',
      title: '桌面 / 锁屏分开设壁纸',
      desc: '设置 → 个性化里可分别导入桌面壁纸和锁屏壁纸，锁屏选「独立上传」就能跟桌面用不同的图。' },
    { id: 'terminal', icon: 'fa-terminal', cat: 'dev',
      title: '终端不只是摆设',
      desc: '支持管道、重定向、Tab 补全、历史命令。rm 删掉的文件会进回收站，不是真删。输入 neofetch 看系统信息。' },
    { id: 'shortcuts', icon: 'fa-keyboard', cat: 'system',
      title: '常用快捷键',
      desc: 'Ctrl+Space 聚焦搜索；Esc 关弹窗 / 退出全屏；F11 全屏；终端里 Tab 自动补全。' },
    { id: 'safemode', icon: 'fa-shield-halved', cat: 'system',
      title: '安全模式',
      desc: '开机动画时按 4 进入安全模式，只保留核心应用，方便排查问题。' },
    { id: 'account', icon: 'fa-user-circle', cat: 'system',
      title: '账号与好友',
      desc: '开始菜单头像里可以登录 / 注册，支持用账户名、7 位账户号或 UID 登录，也能按账户名加好友。' }
  ];

  var CATS = [
    { k: 'all', n: '全部', i: 'fa-layer-group' },
    { k: 'desktop', n: '桌面与组件', i: 'fa-table-cells-large' },
    { k: 'system', n: '系统', i: 'fa-gear' },
    { k: 'efficiency', n: '效率工具', i: 'fa-bolt' },
    { k: 'media', n: '影音娱乐', i: 'fa-music' },
    { k: 'dev', n: '开发者', i: 'fa-code' },
    { k: 'personalize', n: '个性化', i: 'fa-palette' },
    { k: 'ai', n: 'AI', i: 'fa-brain' }
  ];

  /* 应用 → 技巧映射（真实收录系统里登记的应用） */
  var APP_TIPS = {
    files: '右键文件可以重命名 / 删除 / 查看详情，删除的东西会进回收站。',
    terminal: '支持管道和重定向，Tab 补全，上下箭头翻历史命令。',
    browser: '内置书签，也可以在地址栏直接搜。',
    calculator: '支持键盘输入，回车直接算。',
    music: '播放列表存在本地，刷新不会丢。',
    video: '支持本地视频文件播放。',
    image: '图片可以缩放、旋转，右键设为壁纸。',
    camera: '需要授权摄像头，拍完自动进相册。',
    album: '相册右键图片可直接设为桌面壁纸。',
    settings: '左侧标签切换分类，右上角搜索可以直接找设置项。',
    defender: '扫描会真实统计文件系统占用，不是写死的假数字。',
    monitor: '实时看 CPU / 内存 / 磁盘，还可以结束进程。',
    taskmgr: '按占用排序，右键结束进程。',
    'ppt-editor': '支持拖拽移动元素，拖的时候会显示对齐辅助线。',
    'word-editor': '选中文字再点工具栏，格式不会跑偏。',
    'excel-editor': '双击单元格编辑，方向键可以在格子之间走。',
    ide: '支持 HTML / CSS / JS 实时预览。',
    notes: '自动保存到本地。',
    todo: '勾选有动画，数据存本地。',
    clock: '可以看时间、设闹钟、用秒表。',
    pomodoro: '25 分钟专注 + 5 分钟休息，结束有提醒。',
    focus: '开启后不能切应用，适合强制专注。',
    pdf: '支持打开本地 PDF 阅读。',
    recorder: '录音保存在本地。',
    calendar: '月历视图，今天会高亮。',
    appstore: '这里装的应用会自动出现在启动台。',
    trash: '清空前可以再确认，别误删。'
  };

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function iconHtml(id, cls) {
    var img = (typeof window.N26_APP_ICONS !== 'undefined' && window.N26_APP_ICONS[id]) || '';
    if (img) {
      var fixed = img.replace('../Desktop icon/', '../../Desktop icon/');
      return '<span class="tip-card-ic"><img src="' + fixed + '" alt=""></span>';
    }
    return '<i class="fas ' + (cls || 'fa-cube') + '"></i>';
  }

  function render() {
    var q = String(state.q || '').trim().toLowerCase();
    var cards = '';

    // 精选技巧
    FEATURED.forEach(function (f) {
      if (state.cat !== 'all' && state.cat !== f.cat) return;
      if (q && (f.title + f.desc).toLowerCase().indexOf(q) < 0) return;
      cards += '<div class="tip-card" onclick="n26TipOpen(\'' + f.id + '\')">'
        + '<div class="tip-card-t">' + iconHtml(f.id, f.icon) + '<span>' + esc(f.title) + '</span></div>'
        + '<div class="tip-card-d">' + esc(f.desc) + '</div></div>';
    });

    // 应用速查（来自真实 appRegistry）
    state.apps.forEach(function (a) {
      if (state.cat !== 'all' && state.cat !== (a.category || 'other')) return;
      if (q && (a.name + a.id).toLowerCase().indexOf(q) < 0) return;
      cards += '<div class="tip-card" onclick="n26TipLaunch(\'' + a.id + '\')">'
        + '<div class="tip-card-t">' + iconHtml(a.id, a.icon) + '<span>' + esc(a.name) + '</span></div>'
        + '<div class="tip-card-d">' + esc(APP_TIPS[a.id] || '双击桌面图标或在这里点一下就能打开。') + '</div></div>';
    });

    if (!cards) {
      cards = '<div class="tips-empty">没有匹配「' + esc(state.q) + '」的技巧<br><small>换个关键词试试</small></div>';
    }

    var catsHtml = CATS.map(function (c) {
      return '<div class="tips-cat' + (state.cat === c.k ? ' on' : '') + '" onclick="n26TipCat(\'' + c.k + '\')">'
        + '<i class="fas ' + c.i + '"></i> ' + esc(c.n) + '</div>';
    }).join('');

    app.innerHTML = '<div class="tips-content">'
      + '<div class="tips-top">'
      + '<div class="tips-search"><i class="fas fa-magnifying-glass"></i>'
      + '<input id="tipsQ" placeholder="搜索技巧或应用…" value="' + esc(state.q) + '" '
      + 'oninput="n26TipSearch(this.value)"></div>'
      + '<div class="tips-cats">' + catsHtml + '</div>'
      + '</div>'
      + '<div class="tips-stat" id="tipsStat"></div>'
      + '<div class="tips-grid">' + cards + '</div>'
      + '<div class="tips-hint">提示：小组件都可以拖动位置，右下角手柄可以拉伸大小。</div>'
      + '</div>';
    renderStats();
  }

  // 注意：本文件跑在 iframe 里，拿不到宿主的 appRegistry / WIDGET_TYPES 等变量，
  // 所有系统数据必须走 Nexus 桥，否则会 ReferenceError。
  function paintStats(items) {
    var box = document.getElementById('tipsStat');
    if (!box) return;
    box.innerHTML = items.map(function (it) {
      return '<div class="tips-stat-i"><div class="tips-stat-v">' + esc(it[0]) + '</div>'
        + '<div class="tips-stat-l">' + esc(it[1]) + '</div></div>';
    }).join('');
  }
  function renderStats() {
    var installed = state.apps.filter(function (a) { return a.installed; }).length;
    paintStats([
      [state.apps.length || '—', '系统应用'],
      [installed || '—', '已安装'],
      ['—', '桌面组件'],
      ['—', '当前风格']
    ]);
    if (!window.Nexus || !Nexus.getUserLS) return;
    Promise.all([
      Nexus.getUserLS('desktopWidgets').catch(function () { return []; }),
      Nexus.getUserLS('settings').catch(function () { return {}; })
    ]).then(function (r) {
      var widgets = Array.isArray(r[0]) ? r[0].length : 0;
      var s = r[1] || {};
      var style = s.style === 'flat' ? '扁平' : (s.style === 'skeuomorphic' ? '拟物' : '玻璃');
      paintStats([
        [state.apps.length || '—', '系统应用'],
        [installed || '—', '已安装'],
        [widgets, '桌面组件'],
        [style, '当前风格']
      ]);
    }).catch(function () {});
  }

  window.n26TipSearch = function (v) {
    state.q = v;
    render();
    var el = document.getElementById('tipsQ');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  };
  window.n26TipCat = function (k) { state.cat = k; render(); };
  window.n26TipLaunch = function (id) { try { Nexus.openApp(id); } catch (e) {} };
  window.n26TipOpen = function (id) {
    if (id === 'ai-covi') { try { Nexus.openApp('agent'); } catch (e) {} }
  };

  Nexus.ready(function (ctx) {
    var c = ctx || {};
    app.innerHTML = '<div class="tips-content">'
      + '<div class="tips-top">'
      + '<div class="tips-search"><i class="fas fa-magnifying-glass"></i>'
      + '<input id="tipsQ" placeholder="搜索技巧或应用…" oninput="n26TipSearch(this.value)"></div>'
      + '<div class="tips-cats">' + CATS.map(function (cc) {
        return '<div class="tips-cat' + (cc.k === 'all' ? ' on' : '') + '" onclick="n26TipCat(\'' + cc.k + '\')">'
          + '<i class="fas ' + cc.i + '"></i> ' + esc(cc.n) + '</div>';
      }).join('') + '</div></div>'
      + '<div class="tips-stat" id="tipsStat"></div>'
      + '<div class="tips-grid"></div>'
      + '</div>';

    // 拉取真实应用清单后重绘
    Nexus.getApps().then(function (list) {
      state.apps = Array.isArray(list) ? list : [];
      render();
    }).catch(function () {
      state.apps = [];
      render();
    });
  });
})();
</script>
</body>
</html>
