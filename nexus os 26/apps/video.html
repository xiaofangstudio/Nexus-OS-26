<!DOCTYPE html>
<html lang="zh-CN" data-ui="liquid" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title data-i18n="doc_title">视频</title>
<link rel="stylesheet" href="../vendor/fontawesome/all.min.css">
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/glass.css">
<script src="_bridge.js"></script>
<script src="_app.js?v=2.9.57"></script>
<style>
  /* ============================================================
     视频播放器（apps/video.html）
     令牌来源：ui/tokens.css（颜色/圆角/间距/时长/动效）
     语义色只在 :root 声明一次：舞台墨色、玻璃底、视频上的白字层级
     ============================================================ */
  :root {
    --v-page:      rgba(242, 246, 252, 1);
    --v-surface:   rgba(255, 255, 255, 0.86);
    --v-surface-2: rgba(255, 255, 255, 0.58);
    --v-line:      rgba(15, 23, 42, 0.10);
    --v-line-2:    rgba(15, 23, 42, 0.06);
    --v-hover:     rgba(15, 23, 42, 0.045);
    --v-active:    rgba(15, 23, 42, 0.08);
    /* 视频应用主色：靛蓝紫（取自应用图标，只用于小面积强调） */
    --v-accent:        rgba(79, 70, 229, 1);
    --v-accent-press:  rgba(67, 56, 202, 1);
    --v-accent-soft:   rgba(99, 102, 241, 0.10);
    --v-accent-on:     rgba(129, 140, 248, 1);
    /* 实心填充（白字在其上仍需 ≥4.5:1） */
    --v-accent-fill:       rgba(79, 70, 229, 1);
    --v-accent-fill-press: rgba(67, 56, 202, 1);
    --v-ink:       rgba(7, 9, 14, 1);
    --v-fg:        rgba(255, 255, 255, 0.94);
    --v-fg-2:      rgba(255, 255, 255, 0.62);
    --v-fg-3:      rgba(255, 255, 255, 0.38);
    --v-scrim:     rgba(5, 7, 11, 0.82);
    --v-glass-bg:  rgba(16, 20, 28, 0.74);
    --v-glass-line:rgba(255, 255, 255, 0.14);
    --v-track:     rgba(255, 255, 255, 0.13);
    --v-track-buf: rgba(255, 255, 255, 0.20);
    /* 接入 Nexus 个性化玻璃滑杆（与主壳 --n26-* 实时联动） */
    --v-a:   calc(var(--n26-glass-alpha, .55) * var(--n26-alpha-k, 1));
    --v-blur: calc(var(--n26-blur, 18px) * var(--n26-k, 1) * .9);
    --v-sat: var(--n26-glass-sat, 148%);
    --v-top-bg: rgba(255, 255, 255, calc(var(--v-a) * .92));
  }
  html[data-mode="dark"] {
    --v-page:      rgba(17, 20, 26, 1);
    --v-surface:   rgba(30, 34, 43, 0.92);
    --v-surface-2: rgba(40, 45, 56, 0.72);
    --v-line:      rgba(255, 255, 255, 0.12);
    --v-line-2:    rgba(255, 255, 255, 0.07);
    --v-hover:     rgba(255, 255, 255, 0.07);
    --v-active:    rgba(255, 255, 255, 0.12);
    --v-accent:        rgba(129, 140, 248, 1);
    --v-accent-press:  rgba(99, 102, 241, 1);
    --v-accent-soft:   rgba(129, 140, 248, 0.16);
    --v-accent-on:     rgba(129, 140, 248, 1);
    --v-accent-fill:       rgba(99, 102, 241, 1);
    --v-accent-fill-press: rgba(79, 70, 229, 1);
    --v-ink:       rgba(9, 11, 17, 1);
    --v-scrim:     rgba(3, 5, 9, 0.88);
    --v-glass-bg:  rgba(20, 24, 33, 0.80);
    --v-top-bg:    rgba(24, 28, 35, calc(var(--v-a) * .88));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--v-page);
    color: var(--text-1);
    font-family: var(--font-sans);
    font-size: var(--fs-14);
    line-height: 1.6;
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  input { font: inherit; color: inherit; }

  .v-app { height: 100%; display: flex; flex-direction: column; min-height: 0; }

  /* ---------- 顶栏 48 ---------- */
  .v-top {
    height: 48px; flex: 0 0 48px;
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 0 var(--sp-4) 0 var(--sp-3);
    border-bottom: 1px solid var(--v-line);
    background: var(--v-top-bg);
    -webkit-backdrop-filter: blur(var(--v-blur)) saturate(var(--v-sat));
    backdrop-filter: blur(var(--v-blur)) saturate(var(--v-sat));
  }
  body.perf-mode .v-top, body.mat-solid .v-top {
    -webkit-backdrop-filter: none; backdrop-filter: none;
    background: var(--v-surface);
  }
  .v-top-l { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; flex: 1 1 auto; }
  .v-top-mark {
    width: 24px; height: 24px; flex: 0 0 24px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm);
    background: var(--v-accent-soft); color: var(--v-accent);
    font-size: var(--fs-12);
  }
  .v-top-text { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; }
  .v-top-title {
    font-size: var(--fs-14); font-weight: 600; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 42vw;
  }
  .v-top-meta {
    font-size: var(--fs-12); color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .v-top-r { display: flex; align-items: center; gap: var(--sp-1); flex: 0 0 auto; }

  .v-ibtn {
    width: 32px; height: 32px; flex: 0 0 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--r-sm);
    background: transparent; color: var(--text-2);
    font-size: var(--fs-12); cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out-expo),
                color var(--dur-fast) var(--ease-out-expo),
                opacity var(--dur-fast) var(--ease-out-expo);
  }
  .v-ibtn:hover { background: var(--v-hover); color: var(--text-1); }
  .v-ibtn:disabled, .v-ibtn[aria-disabled="true"] { color: var(--text-3); cursor: not-allowed; background: none; }
  .v-ibtn.on { color: var(--v-accent); background: var(--v-accent-soft); }

  .v-tbtn {
    height: 32px; padding: 0 var(--sp-3);
    display: inline-flex; align-items: center; gap: var(--sp-1);
    border: none; border-radius: var(--r-sm);
    background: transparent; color: var(--text-2);
    font-size: var(--fs-12); cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out-expo), color var(--dur-fast) var(--ease-out-expo);
  }
  .v-tbtn:hover { background: var(--v-hover); color: var(--text-1); }
  .v-tbtn.on { color: var(--v-accent); background: var(--v-accent-soft); }
  .v-tbtn i { font-size: var(--fs-12); }

  /* ---------- 主体 ---------- */
  .v-body { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }

  /* ---------- 舞台（视频） ---------- */
  .v-stage {
    position: absolute; inset: 0;
    background: var(--v-ink);
    overflow: hidden;
    cursor: default;
  }
  .v-stage.ui-hidden { cursor: none; }
  .v-stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: var(--v-ink);
  }
  .v-stage video::-webkit-media-controls { display: none !important; }
  .v-stage::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.34), transparent 18%, transparent 62%, rgba(0,0,0,.42));
    opacity: 1; transition: opacity var(--dur-base) var(--ease-out-expo);
  }
  .v-stage.ui-hidden::before { opacity: 0; }

  /* ---------- 控制条 ---------- */
  .v-ctrl {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
    padding: var(--sp-2) var(--sp-4) var(--sp-3);
    color: var(--v-fg);
    transition: opacity var(--dur-base) var(--ease-out-expo),
                transform var(--dur-base) var(--ease-out-expo);
  }
  .v-stage.ui-hidden .v-ctrl { opacity: 0; transform: translateY(10px); pointer-events: none; }

  .v-seek {
    position: relative; height: 18px;
    display: flex; align-items: center;
    cursor: pointer; touch-action: none;
  }
  .v-seek-track {
    position: relative; width: 100%; height: 4px;
    border-radius: var(--r-full);
    background: var(--v-track);
    transition: height var(--dur-fast) var(--ease-out-expo);
  }
  .v-seek:hover .v-seek-track,
  .v-seek.dragging .v-seek-track { height: 6px; }
  .v-seek-buf {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    border-radius: var(--r-full); background: var(--v-track-buf);
  }
  .v-seek-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    border-radius: var(--r-full); background: var(--v-accent-on);
  }
  .v-seek-knob {
    position: absolute; top: 50%; left: 0;
    width: 12px; height: 12px; border-radius: var(--r-full);
    background: rgba(255, 255, 255, 1);
    transform: translate(-50%, -50%) scale(0);
    transition: transform var(--dur-fast) var(--ease-spring);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
  }
  .v-seek:hover .v-seek-knob,
  .v-seek.dragging .v-seek-knob { transform: translate(-50%, -50%) scale(1); }
  .v-seek-tip {
    position: absolute; bottom: 22px; left: 0;
    transform: translateX(-50%);
    padding: 2px var(--sp-2);
    border-radius: var(--r-xs);
    background: var(--v-glass-bg);
    border: 1px solid var(--v-glass-line);
    font-size: var(--fs-11); line-height: 1.4;
    white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity var(--dur-fast) var(--ease-out-expo);
    font-variant-numeric: tabular-nums;
  }
  .v-seek:hover .v-seek-tip, .v-seek.dragging .v-seek-tip { opacity: 1; }

  .v-row { display: flex; align-items: center; gap: var(--sp-1); margin-top: var(--sp-1); }
  .v-grow { flex: 1 1 auto; }

  .v-cbtn {
    width: 34px; height: 34px; flex: 0 0 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--r-sm);
    background: transparent; color: var(--v-fg);
    font-size: var(--fs-13); cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out-expo),
                color var(--dur-fast) var(--ease-out-expo);
  }
  .v-cbtn:hover { background: rgba(255, 255, 255, .14); }
  .v-cbtn.on { color: var(--v-accent-on); }
  /* 播放按钮激活态：仅图标着色，面积小 */
  .v-cbtn-play[aria-pressed="true"] { color: var(--v-accent-on); }
  .v-cbtn:disabled, .v-cbtn[aria-disabled="true"] { color: var(--v-fg-3); cursor: not-allowed; }
  .v-cbtn-play { width: 38px; height: 38px; flex-basis: 38px; }
  .v-cbtn-play .fa-pause, .v-cbtn-play .fa-play { font-size: var(--fs-14); }
  .v-cbtn-txt { width: auto; padding: 0 var(--sp-2); font-size: var(--fs-12); font-weight: 600; min-width: 38px; }

  .v-time {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: var(--fs-12); color: var(--v-fg-2);
    margin: 0 var(--sp-2) 0 var(--sp-1);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .v-time-sep { opacity: .55; }

  .v-vol { display: flex; align-items: center; gap: 2px; }
  .v-vol-track {
    position: relative; width: 68px; height: 16px;
    display: flex; align-items: center; cursor: pointer;
    touch-action: none;
  }
  .v-vol-track::before {
    content: ''; position: absolute; left: 0; right: 0; height: 4px;
    border-radius: var(--r-full); background: var(--v-track);
  }
  .v-vol-fill {
    position: absolute; left: 0; height: 4px; width: 0;
    border-radius: var(--r-full); background: var(--v-accent-on);
  }
  .v-vol-knob {
    position: absolute; top: 50%; left: 0;
    width: 10px; height: 10px; border-radius: var(--r-full);
    background: rgba(255, 255, 255, 1); transform: translate(-50%, -50%);
    box-shadow: 0 1px 4px rgba(0, 0, 0, .4);
  }

  /* ---------- 中央播放钮 ---------- */
  .v-bigplay {
    position: absolute; left: 50%; top: 50%; z-index: 3;
    width: 68px; height: 68px;
    display: none; align-items: center; justify-content: center;
    border: none; border-radius: var(--r-full);
    background: rgba(20, 26, 38, .62);
    border: 1px solid var(--v-glass-line);
    -webkit-backdrop-filter: blur(var(--v-blur)) saturate(var(--v-sat));
    backdrop-filter: blur(var(--v-blur)) saturate(var(--v-sat));
    color: rgba(255, 255, 255, 1); font-size: var(--fs-22); cursor: pointer;
    transform: translate(-50%, -50%) scale(.92);
    opacity: 0;
    transition: opacity var(--dur-base) var(--ease-out-expo),
                transform var(--dur-base) var(--ease-spring);
    box-shadow: var(--sh-pop);
  }
  .v-bigplay.show { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .v-bigplay:hover { background: rgba(28, 36, 52, .72); }

  /* ---------- 字幕层 ---------- */
  .v-sub {
    position: absolute; left: 6%; right: 6%; bottom: 96px; z-index: 2;
    text-align: center; pointer-events: none;
    font-size: var(--fs-22); line-height: 1.5; font-weight: 500;
    color: rgba(255, 255, 255, 1);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 12px rgba(0, 0, 0, .55);
    white-space: pre-line;
    transition: opacity var(--dur-fast) var(--ease-out-expo);
  }
  .v-sub:empty { opacity: 0; }
  .v-sub[data-size="s"] { font-size: var(--fs-16); }
  .v-sub[data-size="l"] { font-size: var(--fs-28); }
  .v-stage.ui-hidden .v-sub { bottom: 34px; }

  /* ---------- 播放列表抽屉 ---------- */
  .v-panel {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 6;
    width: 320px;
    display: flex; flex-direction: column;
    background: var(--v-surface);
    border-left: 1px solid var(--v-line);
    transform: translateX(100%);
    transition: transform var(--dur-base) var(--ease-out-expo), opacity var(--dur-base) var(--ease-out-expo);
    opacity: 0; pointer-events: none;
  }
  .v-panel.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .v-panel-head {
    height: 48px; flex: 0 0 48px;
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 0 var(--sp-2) 0 var(--sp-4);
    border-bottom: 1px solid var(--v-line);
    font-size: var(--fs-13); font-weight: 600;
  }
  .v-panel-count { font-size: var(--fs-12); font-weight: 400; color: var(--text-2); }
  .v-panel-list { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-1) var(--sp-2) var(--sp-3); }
  .v-panel-foot {
    flex: 0 0 auto; padding: var(--sp-2) var(--sp-4) var(--sp-4);
    border-top: 1px solid var(--v-line);
    font-size: var(--fs-11); color: var(--text-3); line-height: 1.5;
  }
  .v-panel-empty {
    padding: var(--sp-8) var(--sp-4); text-align: center;
    color: var(--text-2); font-size: var(--fs-12); line-height: 1.6;
  }
  .v-panel-empty i { display: block; font-size: 34px; opacity: .32; margin-bottom: var(--sp-3); color: var(--text-3); }

  .v-pl-item {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2);
    border-radius: var(--r-sm);
    cursor: grab; color: var(--text-1);
    transition: background var(--dur-fast) var(--ease-out-expo), opacity var(--dur-fast) var(--ease-out-expo);
  }
  .v-pl-item:hover { background: var(--v-hover); }
  .v-pl-item.active { background: var(--v-accent-soft); }
  .v-pl-item.active .v-pl-name { font-weight: 600; }
  .v-pl-item.dragging { opacity: .4; }
  .v-pl-item.drop-before { box-shadow: inset 0 2px 0 var(--v-accent); }
  .v-pl-item.drop-after { box-shadow: inset 0 -2px 0 var(--v-accent); }
  .v-pl-idx {
    width: 18px; flex: 0 0 18px; text-align: right;
    font-size: var(--fs-11); color: var(--text-3); font-variant-numeric: tabular-nums;
  }
  .v-pl-item.active .v-pl-idx { color: var(--v-accent); }
  .v-pl-main {
    flex: 1 1 auto; min-width: 0;
    border: 0; background: none; padding: 0;
    text-align: left; cursor: pointer; color: inherit;
  }
  .v-pl-name {
    display: block;
    font-size: var(--fs-13); line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .v-pl-sub { display: block; font-size: var(--fs-11); color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v-pl-x {
    width: 26px; height: 26px; flex: 0 0 26px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--r-xs);
    background: transparent; color: var(--text-3); cursor: pointer;
    font-size: var(--fs-11); opacity: 0;
    transition: opacity var(--dur-fast) var(--ease-out-expo), background var(--dur-fast) var(--ease-out-expo);
  }
  .v-pl-item:hover .v-pl-x, .v-pl-x:focus-visible { opacity: 1; }
  .v-pl-x:hover { background: var(--v-active); color: var(--danger); }

  /* ---------- 媒体库 ---------- */
  .v-lib {
    position: absolute; inset: 0; z-index: 7;
    background: var(--v-page);
    overflow-y: auto; overscroll-behavior: contain;
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur-base) var(--ease-out-expo);
  }
  .v-lib.open { opacity: 1; pointer-events: auto; }
  .v-lib-inner {
    max-width: 1120px; margin: 0 auto; padding: 18px 20px 24px;
    min-height: 100%; display: flex; flex-direction: column;
  }
  #libBody { flex: 1 1 auto; min-height: 0; }
  #libBody.is-blank { display: flex; flex-direction: column; }

  .v-drop {
    display: flex; align-items: center; gap: var(--sp-4);
    padding: var(--sp-4);
    border: 1px dashed var(--v-line);
    border-radius: var(--r-md);
    background: var(--v-surface-2);
    transition: border-color var(--dur-fast) var(--ease-out-expo), background var(--dur-fast) var(--ease-out-expo);
  }
  .v-drop.hover { border-color: var(--v-accent); background: var(--v-accent-soft); }
  .v-drop-ico {
    width: 44px; height: 44px; flex: 0 0 44px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-md);
    background: var(--v-accent-soft); color: var(--v-accent);
    font-size: var(--fs-18);
  }
  .v-drop-t { flex: 1 1 auto; min-width: 0; }
  .v-drop-t .t {
    display: block; font-size: var(--fs-14); font-weight: 600; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .v-drop-t .d {
    display: block; font-size: var(--fs-12); color: var(--text-2); line-height: 1.6;
    margin-top: 2px;
  }
  .v-drop-btns { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }

  .v-lib.compact .v-drop { padding: var(--sp-2) var(--sp-3); }
  .v-lib.compact .v-drop-ico { width: 32px; height: 32px; flex-basis: 32px; font-size: var(--fs-13); }
  .v-lib.compact .v-drop-t .d { display: none; }

  .v-btn {
    height: 32px; padding: 0 var(--sp-3);
    display: inline-flex; align-items: center; gap: var(--sp-1);
    border: 1px solid var(--v-line);
    border-radius: var(--r-sm);
    background: var(--v-surface);
    color: var(--text-1);
    font-size: var(--fs-12); font-weight: 500; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out-expo),
                border-color var(--dur-fast) var(--ease-out-expo),
                transform var(--dur-fast) var(--ease-out-expo);
  }
  .v-btn:hover { background: var(--v-hover); }
  .v-btn-primary {
    background: var(--v-accent-fill); border-color: transparent; color: rgba(255, 255, 255, 1);
  }
  .v-btn-primary:hover { background: var(--v-accent-fill-press); }
  .v-btn i { font-size: var(--fs-12); }

  .v-sec-head {
    display: flex; align-items: baseline; gap: var(--sp-2);
    margin: var(--sp-5) 0 var(--sp-3);
  }
  .v-sec-head .t { font-size: var(--fs-16); font-weight: 600; line-height: 1.3; }
  .v-sec-head .d { font-size: var(--fs-12); color: var(--text-2); }
  .v-sec-head .v-btn { margin-left: auto; }

  /* 继续观看 */
  .v-cont { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-3); }
  .v-ccard {
    display: block; width: 100%; text-align: left;
    border: 1px solid var(--v-line-2); border-radius: var(--r-md);
    background: var(--v-surface); padding: 0; overflow: hidden; cursor: pointer;
    transition: transform var(--dur-fast) var(--ease-out-expo), box-shadow var(--dur-fast) var(--ease-out-expo);
  }
  .v-ccard:hover { transform: translateY(-2px); box-shadow: var(--sh-card); }
  .v-ccard .thumb {
    position: relative; aspect-ratio: 16 / 9; background: var(--v-active);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: var(--fs-18); overflow: hidden;
  }
  .v-ccard .thumb img, .v-row-thumb img, .v-gcard .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .v-ccard .thumb::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: rgba(0, 0, 0, .25);
  }
  .v-ccard .thumb .bar {
    position: absolute; left: 0; bottom: 0; height: 4px; z-index: 2;
    background: var(--v-accent);
  }
  .v-ccard .meta { display: block; padding: var(--sp-2) var(--sp-3) var(--sp-3); }
  .v-ccard .n {
    display: block;
    font-size: var(--fs-12); font-weight: 500; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .v-ccard .s { display: block; font-size: var(--fs-11); color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 媒体库工具栏 */
  .v-toolbar {
    display: flex; align-items: center; gap: var(--sp-2);
    margin: var(--sp-5) 0 var(--sp-2);
  }
  .v-search {
    position: relative; flex: 0 1 260px; min-width: 140px;
  }
  .v-search i {
    position: absolute; left: var(--sp-2); top: 50%; transform: translateY(-50%);
    font-size: var(--fs-11); color: var(--text-3); pointer-events: none;
  }
  .v-search input {
    width: 100%; height: 32px;
    padding: 0 var(--sp-2) 0 26px;
    border: 1px solid var(--v-line); border-radius: var(--r-sm);
    background: var(--v-surface); font-size: var(--fs-12);
    outline: none;
    transition: border-color var(--dur-fast) var(--ease-out-expo), box-shadow var(--dur-fast) var(--ease-out-expo);
  }
  .v-search input::placeholder { color: var(--text-3); }
  .v-search input:focus { border-color: var(--v-accent); box-shadow: 0 0 0 3px var(--v-accent-soft); }
  .v-chips { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
  .v-chip {
    height: 28px; padding: 0 var(--sp-2);
    border: none; border-radius: var(--r-full);
    background: transparent; color: var(--text-2);
    font-size: var(--fs-12); cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out-expo), color var(--dur-fast) var(--ease-out-expo);
  }
  .v-chip:hover { background: var(--v-hover); }
  .v-chip[aria-pressed="true"] { background: var(--v-accent-soft); color: var(--v-accent); font-weight: 600; }
  .v-view { display: flex; gap: 2px; flex: 0 0 auto; margin-left: auto; }
  .v-view .v-ibtn { width: 28px; height: 28px; flex-basis: 28px; color: var(--text-2); }
  .v-view .v-ibtn[aria-pressed="true"] { background: var(--v-accent-soft); color: var(--v-accent); }

  /* 列表 */
  .v-list { display: flex; flex-direction: column; gap: 2px; }
  .v-rowitem {
    display: flex; align-items: center; gap: var(--sp-3);
    width: 100%; padding: var(--sp-2);
    border: none; border-radius: var(--r-sm); background: transparent;
    text-align: left; cursor: pointer; color: var(--text-1);
    transition: background var(--dur-fast) var(--ease-out-expo);
  }
  .v-rowitem:hover { background: var(--v-hover); }
  .v-rowitem.active { background: var(--v-accent-soft); }
  .v-row-thumb {
    width: 88px; aspect-ratio: 16 / 9; flex: 0 0 88px;
    border-radius: var(--r-xs); overflow: hidden;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    background: var(--v-active); color: var(--text-3); font-size: var(--fs-12);
  }
  .v-row-thumb .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--v-accent); z-index: 2; }
  .v-row-main { flex: 1 1 auto; min-width: 0; }
  .v-row-name {
    display: block;
    font-size: var(--fs-13); font-weight: 500; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .v-row-sub {
    display: block;
    font-size: var(--fs-11); color: var(--text-2); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .v-row-tag {
    flex: 0 0 auto; padding: 1px var(--sp-2);
    border-radius: var(--r-full); font-size: var(--fs-11);
    color: var(--text-2); background: var(--v-hover);
  }
  .v-row-tag.resume { color: var(--v-accent); background: var(--v-accent-soft); }

  /* 网格 */
  .v-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: var(--sp-3); align-content: start; }
  .v-gcard {
    display: block; width: 100%; padding: 0; text-align: left; cursor: pointer;
    border: 1px solid var(--v-line-2); border-radius: var(--r-md);
    background: var(--v-surface); overflow: hidden;
    transition: transform var(--dur-fast) var(--ease-out-expo), box-shadow var(--dur-fast) var(--ease-out-expo);
  }
  .v-gcard:hover { transform: translateY(-2px); box-shadow: var(--sh-card); }
  .v-gcard .thumb {
    position: relative; aspect-ratio: 16 / 9;
    display: flex; align-items: center; justify-content: center;
    background: var(--v-active); color: var(--text-3); font-size: var(--fs-18); overflow: hidden;
  }
  .v-gcard .thumb .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--v-accent); }
  .v-gcard .meta { display: block; padding: var(--sp-2) var(--sp-3) var(--sp-3); }
  .v-gcard .n { display: block; font-size: var(--fs-12); font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v-gcard .s { display: block; font-size: var(--fs-11); color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .v-status {
    display: flex; align-items: center; gap: var(--sp-2);
    margin-top: auto; padding-top: var(--sp-3);
    border-top: 1px solid var(--v-line-2);
    font-size: var(--fs-11); color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  /* 空 / 错误（媒体库内） */
  .v-blank {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--sp-3); padding: 40px 20px; text-align: center;
    flex: 1 1 auto;
  }
  .v-blank i.ico {
    width: 48px; height: 48px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--v-accent-soft); color: var(--v-accent); font-size: 20px;
  }
  .v-blank .t { font-size: var(--fs-14); font-weight: 600; line-height: 1.3; }
  .v-blank .d { font-size: var(--fs-12); color: var(--text-2); line-height: 1.6; max-width: 440px; }
  .v-blank .v-btn { margin-top: var(--sp-1); }

  /* ---------- 播放器内：加载 / 错误 ---------- */
  .v-loader, .v-error {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: rgba(5, 7, 11, .58);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity var(--dur-fast) var(--ease-out-expo);
    pointer-events: none;
  }
  .v-loader.show, .v-error.show { opacity: 1; pointer-events: auto; }
  .v-loader-card {
    width: min(320px, 70%);
    padding: var(--sp-4);
    border-radius: var(--r-md);
    background: var(--v-glass-bg);
    border: 1px solid var(--v-glass-line);
    box-shadow: var(--sh-pop);
  }
  .v-skel {
    height: 96px; border-radius: var(--r-sm); overflow: hidden; position: relative;
    background: rgba(255, 255, 255, .16);
  }
  .v-skel::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .32), transparent);
    animation: vShimmer 1.5s var(--ease-in-out-quart) infinite;
  }
  @keyframes vShimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .v-load-line {
    display: flex; align-items: center; gap: var(--sp-2);
    margin-top: var(--sp-3); font-size: var(--fs-12); color: var(--v-fg-2);
  }
  .v-spin {
    width: 12px; height: 12px; border-radius: var(--r-full);
    border: 2px solid rgba(255, 255, 255, .22); border-top-color: var(--v-accent-on);
    animation: vSpin .9s linear infinite;
  }
  @keyframes vSpin { to { transform: rotate(360deg); } }
  .v-load-line .pct { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--v-fg); }
  .v-load-bar { margin-top: var(--sp-2); height: 4px; border-radius: var(--r-full); background: rgba(255, 255, 255, .18); overflow: hidden; }
  .v-load-bar > span { display: block; height: 100%; width: 0; background: var(--v-accent-on); border-radius: var(--r-full); }

  .v-error-card {
    width: min(460px, 86%);
    padding: var(--sp-5) var(--sp-5) var(--sp-4);
    border-radius: var(--r-md);
    background: var(--v-glass-bg);
    border: 1px solid var(--v-glass-line);
    box-shadow: var(--sh-window);
    text-align: center; color: var(--v-fg);
  }
  .v-error-card .ico { font-size: 38px; color: var(--danger); opacity: .9; }
  .v-error-card .t { display: block; margin-top: var(--sp-2); font-size: var(--fs-16); font-weight: 600; line-height: 1.3; }
  .v-error-card .d { display: block; margin-top: var(--sp-1); font-size: var(--fs-13); color: var(--v-fg-2); line-height: 1.65; }
  .v-error-btns { display: flex; justify-content: center; gap: var(--sp-2); margin-top: var(--sp-4); flex-wrap: wrap; }
  .v-error-btns .v-btn {
    background: rgba(255, 255, 255, .10);
    border-color: var(--v-glass-line);
    color: var(--v-fg);
  }
  .v-error-btns .v-btn:hover { background: rgba(255, 255, 255, .16); }
  .v-error-btns .v-btn-primary { background: var(--v-accent-fill); border-color: transparent; color: rgba(255, 255, 255, 1); }
  .v-error-btns .v-btn-primary:hover { background: var(--v-accent-fill-press); }

  /* ---------- 拖放提示 ---------- */
  .v-dropmask {
    position: absolute; inset: 0; z-index: 9;
    display: none; align-items: center; justify-content: center;
    gap: var(--sp-2);
    background: rgba(99, 102, 241, .12);
    border: 2px dashed rgba(99, 102, 241, .55);
    font-size: var(--fs-16); font-weight: 600; color: var(--v-accent);
    pointer-events: none;
  }
  .v-dropmask.show { display: flex; }

  /* ---------- 菜单 ---------- */
  .v-menu {
    position: absolute; z-index: 8;
    min-width: 132px; padding: 4px;
    border-radius: var(--r-md);
    background: var(--v-glass-bg);
    border: 1px solid var(--v-glass-line);
    -webkit-backdrop-filter: blur(var(--v-blur)) saturate(var(--v-sat));
    backdrop-filter: blur(var(--v-blur)) saturate(var(--v-sat));
    box-shadow: var(--sh-window);
    opacity: 0; transform: translateY(6px) scale(.97);
    transform-origin: bottom right;
    transition: opacity var(--dur-fast) var(--ease-out-expo),
                transform var(--dur-fast) var(--ease-out-expo);
    pointer-events: none;
    color: var(--v-fg);
  }
  .v-menu.open { opacity: 1; transform: none; pointer-events: auto; }
  /* 字幕菜单条目最多、带快捷键提示，132px 会把「移除这个视频的字幕」挤成两行 */
  #subMenu { min-width: 196px; }
  #subMenu .v-mi { white-space: nowrap; }
  .v-menu-title {
    padding: 4px var(--sp-2) 2px; font-size: var(--fs-11); color: var(--v-fg-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .v-mi {
    display: flex; align-items: center; gap: var(--sp-2);
    width: 100%; padding: 6px var(--sp-2);
    border: none; border-radius: var(--r-xs);
    background: transparent; color: var(--v-fg);
    font-size: var(--fs-12); text-align: left; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out-expo);
  }
  .v-mi:hover { background: rgba(255, 255, 255, .12); }
  /* 没有字幕时这些项不可点（同步调整 / 开关），要有明确的禁用态 */
  .v-mi:disabled { opacity: .38; cursor: not-allowed; }
  .v-mi:disabled:hover { background: transparent; }
  .v-mi.danger { color: #ff8f8f; }
  .v-mi.danger:hover { background: rgba(239, 68, 68, .16); }
  .v-mi .k { margin-left: auto; font-size: var(--fs-11); color: var(--v-fg-3); font-variant-numeric: tabular-nums; }
  .v-mi .ck { margin-left: auto; color: var(--v-accent-on); opacity: 0; font-size: var(--fs-11); }
  .v-mi[aria-checked="true"] .ck { opacity: 1; }
  .v-mi[aria-checked="true"] { color: rgba(255, 255, 255, 1); }
  .v-sep { height: 1px; margin: 4px 6px; background: var(--v-glass-line); }

  /* ---------- 模态 ---------- */
  .v-modal-wrap {
    position: fixed; inset: 0; z-index: 1100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .58);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    opacity: 0; transition: opacity var(--dur-base) var(--ease-out-expo);
  }
  .v-modal-wrap.show { opacity: 1; }
  .v-modal {
    width: min(480px, calc(100% - 40px));
    padding: var(--sp-5);
    border-radius: var(--r-lg);
    background: var(--v-surface);
    border: 1px solid var(--v-line);
    box-shadow: var(--sh-window);
    transform: scale(.96);
    transition: transform var(--dur-base) var(--ease-spring);
  }
  .v-modal-wrap.show .v-modal { transform: none; }
  .v-modal h3 { font-size: var(--fs-18); font-weight: 600; line-height: 1.3; }
  .v-field-label { display: block; margin: var(--sp-4) 0 var(--sp-1); font-size: var(--fs-12); color: var(--text-2); }
  .v-field {
    width: 100%; height: 38px; padding: 0 var(--sp-3);
    border: 1px solid var(--v-line); border-radius: var(--r-sm);
    background: var(--v-surface-2); font-size: var(--fs-13); outline: none;
    transition: border-color var(--dur-fast) var(--ease-out-expo), box-shadow var(--dur-fast) var(--ease-out-expo);
  }
  .v-field:focus { border-color: var(--v-accent); box-shadow: 0 0 0 3px var(--v-accent-soft); }
  .v-field-help { margin-top: var(--sp-2); font-size: var(--fs-11); color: var(--text-3); line-height: 1.6; }
  .v-field-help.err { color: var(--danger); }
  .v-modal-btns { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-5); }

  /* ---------- Toast（贴底部控制条上方，避开画面视觉中心） ---------- */
  .v-toasts {
    position: absolute; left: var(--sp-4); right: var(--sp-4); bottom: 88px; z-index: 10;
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1);
    pointer-events: none;
  }
  .v-toast {
    min-width: 200px; max-width: min(360px, 52vw);
    display: flex; align-items: flex-start; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--r-sm);
    background: var(--v-glass-bg);
    border: 1px solid var(--v-glass-line);
    -webkit-backdrop-filter: blur(var(--v-blur)) saturate(var(--v-sat));
    backdrop-filter: blur(var(--v-blur)) saturate(var(--v-sat));
    box-shadow: var(--sh-pop);
    color: var(--v-fg); font-size: var(--fs-12); line-height: 1.5;
    opacity: 0; transform: translateY(6px);
    transition: opacity var(--dur-base) var(--ease-out-expo), transform var(--dur-base) var(--ease-out-expo);
  }
  .v-toast.show { opacity: 1; transform: none; }
  .v-toast.warn { border-color: rgba(245, 158, 11, .5); }
  .v-toast .m { flex: 1 1 auto; min-width: 0; }
  /* 错误/警告类常驻，直到用户手动关闭 */
  .v-toast.sticky { pointer-events: auto; }
  .v-toast-x {
    flex: 0 0 18px; width: 18px; height: 18px; margin: 2px -3px 0 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--r-xs); background: transparent;
    color: var(--v-fg-2); font-size: var(--fs-11); cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out-expo), color var(--dur-fast) var(--ease-out-expo);
  }
  .v-toast-x:hover { background: rgba(255, 255, 255, .14); color: var(--v-fg); }

  /* ---------- 内容站（首页 / 详情） ---------- */
  .v-nav { display: flex; gap: 2px; margin-left: var(--sp-2); }
  .v-nav .v-tbtn { padding: 0 10px; }
  .v-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: var(--sp-3); scrollbar-width: none; }
  .v-tabs::-webkit-scrollbar { display: none; }
  .v-tab {
    flex: 0 0 auto; height: 30px; padding: 0 var(--sp-3);
    border: 1px solid var(--v-line); border-radius: var(--r-full);
    background: var(--v-surface); color: var(--text-2);
    font-size: var(--fs-12); cursor: pointer;
  }
  .v-tab[aria-pressed="true"] { background: var(--v-accent-soft); border-color: var(--v-accent); color: var(--v-accent); font-weight: 600; }
  .v-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: var(--sp-3); }
  .v-card { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: var(--text-1); }
  .v-card .cov { position: relative; display: block; aspect-ratio: 16 / 10; border-radius: var(--r-md); overflow: hidden; background: var(--v-surface-2); }
  .v-card .cov img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--dur-base) var(--ease-out-expo); }
  .v-card:hover .cov img { transform: scale(1.04); }
  .v-card .dur { position: absolute; right: 6px; bottom: 6px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.68); color: #fff; font-size: var(--fs-11); font-variant-numeric: tabular-nums; }
  .v-card .tt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 6px; font-size: var(--fs-13); font-weight: 600; line-height: 1.35; }
  .v-card .mt { display: flex; gap: 6px; margin-top: 2px; font-size: var(--fs-11); color: var(--text-3); }
  .v-card .mt span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v-empty { padding: var(--sp-6) 0; text-align: center; color: var(--text-3); font-size: var(--fs-12); }
  .v-more { padding: var(--sp-4) 0 var(--sp-2); text-align: center; color: var(--text-3); font-size: var(--fs-12); }
  /* 详情 */
  .v-det { display: flex; gap: var(--sp-4); align-items: flex-start; flex-wrap: wrap; }
  .v-det .hero { width: 240px; flex: 0 0 240px; aspect-ratio: 16 / 10; border-radius: var(--r-md); overflow: hidden; background: var(--v-surface-2); }
  .v-det .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .v-det .info { flex: 1 1 320px; min-width: 0; }
  .v-det h2 { font-size: var(--fs-18); line-height: 1.35; font-weight: 700; margin: 0 0 var(--sp-2); }
  .v-det .meta { display: flex; flex-wrap: wrap; gap: 4px var(--sp-3); font-size: var(--fs-12); color: var(--text-2); margin-bottom: var(--sp-2); }
  .v-det .score { color: var(--text-2); }
  .v-det .up { display: flex; align-items: center; gap: 6px; font-size: var(--fs-12); color: var(--text-2); margin-bottom: var(--sp-2); }
  .v-det .desc { font-size: var(--fs-12); line-height: 1.7; color: var(--text-2); white-space: pre-line; max-height: 6.8em; overflow: hidden; }
  .v-det .acts { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
  .v-eps { margin-top: var(--sp-5); }
  .v-eps .v-sec-head .t { font-size: var(--fs-14); }
  .v-ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 8px; }
  .v-ep {
    height: 34px; padding: 0 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    border: 1px solid var(--v-line); border-radius: var(--r-sm);
    background: var(--v-surface); color: var(--text-1); font-size: var(--fs-12); cursor: pointer;
  }
  .v-ep:hover { background: var(--v-hover); }
  .v-ep[aria-current="true"] { border-color: var(--v-accent); color: var(--v-accent); background: var(--v-accent-soft); }
  /* 播放器：选集浮层 */
  .v-epbar {
    position: absolute; left: 0; right: 0; bottom: 66px; z-index: 5;
    max-height: 54%; overflow-y: auto;
    padding: var(--sp-3) var(--sp-4) var(--sp-4);
    background: var(--v-glass-bg); border-top: 1px solid var(--v-glass-line);
    border-radius: var(--r-md) var(--r-md) 0 0;
    -webkit-backdrop-filter: blur(var(--v-blur)) saturate(var(--v-sat));
    backdrop-filter: blur(var(--v-blur)) saturate(var(--v-sat));
    color: rgba(255,255,255,1);
    transform: translateY(8px); opacity: 0; pointer-events: none;
    transition: transform var(--dur-base) var(--ease-out-expo), opacity var(--dur-base) var(--ease-out-expo);
  }
  .v-epbar.open { transform: none; opacity: 1; pointer-events: auto; }
  .v-epbar .hd { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); font-size: var(--fs-13); }
  .v-epbar .v-ep-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .v-epbar .v-ep { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.18); color: rgba(255,255,255,.92); }
  .v-epbar .v-ep:hover { background: rgba(255,255,255,.2); }
  .v-epbar .v-ep[aria-current="true"] { border-color: var(--v-accent-on); color: var(--v-accent-on); background: rgba(255,255,255,.16); }
  .v-stage.ui-hidden .v-epbar { bottom: 12px; }
  /* 字幕翻译 */
  .v-sub .ol { display: block; }
  .v-sub .tl { display: block; margin-top: 2px; font-size: .78em; line-height: 1.45; opacity: .96; }
  .v-sub .tl.pending { opacity: .5; }
  .v-sub[data-tr="trans"] .ol { display: none; }
  .v-sub[data-tr="orig"] .tl { display: none; }
  .v-sub[data-tr="trans"] .tl:empty { display: none; }
  /* 翻译进度（字幕菜单内） */
  .v-trbar { height: 4px; border-radius: var(--r-full); background: var(--v-line); overflow: hidden; margin: 6px 0 4px; }
  .v-trbar > span { display: block; height: 100%; width: 0; background: var(--v-accent-fill); transition: width var(--dur-base) linear; }
  .v-mnote { padding: 2px var(--sp-3) 6px; font-size: var(--fs-11); color: var(--text-3); line-height: 1.5; }
  .v-mnote.err { color: rgba(220, 38, 38, 1); }
  .v-sec-head { display: flex; align-items: baseline; gap: var(--sp-2); margin: var(--sp-4) 0 var(--sp-2); }
  .v-sec-head .t { font-size: var(--fs-16); font-weight: 600; }
  .v-sec-head .d { font-size: var(--fs-11); color: var(--text-3); }
  .v-btn { height: 32px; padding: 0 var(--sp-3); border: 1px solid var(--v-line); border-radius: var(--r-sm); background: var(--v-surface); color: var(--text-1); font-size: var(--fs-12); cursor: pointer; }
  .v-btn:hover { background: var(--v-hover); }
  .v-btn-primary { background: var(--v-accent-fill); border-color: transparent; color: #fff; }
  .v-btn-primary:hover { background: var(--v-accent-fill-press); }

  .v-epnav { display: inline-flex; gap: 2px; }
  .v-epnav[hidden] { display: none; }

  /* ---------- 全屏 ---------- */
  .v-stage:fullscreen { background: rgba(0, 0, 0, 1); }
  .v-stage:fullscreen .v-sub { bottom: 120px; }
  .v-stage:fullscreen.ui-hidden .v-sub { bottom: 40px; }

  /* ---------- 宽窄 ---------- */
  @media (max-width: 900px) {
    .v-cont { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .v-top-meta { display: none; }
  }
  @media (max-width: 760px) {
    .v-lib-inner { padding: 12px 12px 16px; }
    .v-panel { width: 100%; }
    .v-cont { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .v-tbtn span { display: none; }
    .v-tbtn { padding: 0 var(--sp-2); }
    .v-drop { flex-wrap: wrap; }
    .v-drop-btns { width: 100%; }
    .v-vol-track { width: 44px; }
    .v-search { flex: 1 1 auto; }
    .v-toolbar { flex-wrap: wrap; }
  }

  /* 窄窗口：控制条按优先级收敛，避免溢出 */
  @media (max-width: 640px) {
    .v-vol-track { display: none; }
    .v-toast { max-width: 70vw; }
  }
  @media (max-width: 540px) {
    .v-ctrl { padding-left: var(--sp-3); padding-right: var(--sp-3); }
    #btnB10, #btnF10 { display: none; }
  }
  @media (max-width: 440px) {
    #btnPip { display: none; }
  }

  /* ---------- 降级 ---------- */
  body.perf-mode .v-bigplay,
  body.perf-mode .v-menu,
  body.perf-mode .v-toast,
  body.perf-mode .v-loader,
  body.perf-mode .v-modal-wrap .v-modal,
  body.perf-mode .v-panel { -webkit-backdrop-filter: none; backdrop-filter: none; }
  body.perf-mode .v-skel::after { animation: none; }
  body.perf-mode .v-ccard:hover,
  body.perf-mode .v-gcard:hover { transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .v-spin, .v-skel::after { animation: none; }
    .v-bigplay, .v-menu, .v-panel, .v-lib, .v-ctrl, .v-toast, .v-modal, .v-modal-wrap { transition-duration: .001ms; }
  }
</style>

<body>
<div class="v-app" id="app" data-view="library">

  <!-- 顶栏 -->
  <header class="v-top">
    <div class="v-top-l">
      <button class="v-ibtn" id="btnBack" aria-label="返回媒体库" title="返回媒体库（Esc）">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
      <span class="v-top-mark" id="topMark" aria-hidden="true"><i class="fa-solid fa-film"></i></span>
      <div class="v-top-text">
        <span class="v-top-title" id="topTitle">媒体库</span>
        <span class="v-top-meta" id="topMeta"></span>
      </div>
    </div>
    <div class="v-top-r">
      <nav class="v-nav" id="vNav" aria-label="主导航">
        <button class="v-tbtn" id="navHome" aria-label="首页" title="首页（发现）">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
          <span>首页</span>
        </button>
        <button class="v-tbtn" id="navLib" aria-label="我的视频" title="我的视频">
          <i class="fa-solid fa-photo-film" aria-hidden="true"></i>
          <span>我的视频</span>
        </button>
      </nav>
      <button class="v-tbtn" id="btnSubTop" aria-label="字幕">
        <i class="fa-solid fa-closed-captioning" aria-hidden="true"></i>
        <span data-i18n="sub">字幕</span>
      </button>
      <button class="v-tbtn" id="btnPanelTop" aria-label="播放列表（L）">
        <i class="fa-solid fa-list-ul" aria-hidden="true"></i>
        <span data-i18n="playlist">播放列表</span>
      </button>
      <button class="v-ibtn" id="btnFsTop" aria-label="全屏（F）" title="全屏（F）">
        <i class="fa-solid fa-expand" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div class="v-body">

    <!-- 舞台 -->
    <section class="v-stage" id="stage">
      <video id="video" playsinline preload="metadata"></video>
      <div class="v-sub" id="subLayer" aria-live="off" data-size="m"></div>

      <div class="v-epbar" id="epBar" aria-label="选集">
        <div class="hd">
          <span>选集</span>
          <span id="epBarTitle"></span>
          <div class="v-grow"></div>
          <button class="v-ibtn" id="epClose" aria-label="关闭选集">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div class="v-ep-grid" id="epGrid"></div>
      </div>

      <button class="v-bigplay" id="bigPlay" aria-label="播放">
        <i class="fa-solid fa-play" aria-hidden="true"></i>
      </button>

      <!-- 加载 -->
      <div class="v-loader" id="loader" aria-hidden="true">
        <div class="v-loader-card">
          <div class="v-skel"></div>
          <div class="v-load-line">
            <span class="v-spin" aria-hidden="true"></span>
            <span id="loadText">正在读取视频…</span>
            <span class="pct" id="loadPct"></span>
          </div>
          <div class="v-load-bar"><span id="loadBar"></span></div>
        </div>
      </div>

      <!-- 错误 -->
      <div class="v-error" id="errCard" role="alertdialog" aria-labelledby="errTitle" aria-describedby="errDesc" aria-hidden="true">
        <div class="v-error-card">
          <span class="ico"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i></span>
          <span class="t" id="errTitle">无法播放</span>
          <span class="d" id="errDesc"></span>
          <div class="v-error-btns">
            <button class="v-btn v-btn-primary" id="errRetry">重试</button>
            <button class="v-btn" id="errOpen">用浏览器打开</button>
            <button class="v-btn" id="errPick">换个文件</button>
          </div>
        </div>
      </div>

      <!-- 控制条 -->
      <div class="v-ctrl" id="controls">
        <div class="v-seek" id="seek" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <div class="v-seek-track">
            <div class="v-seek-buf" id="seekBuf"></div>
            <div class="v-seek-fill" id="seekFill"></div>
            <div class="v-seek-knob" id="seekKnob"></div>
          </div>
          <div class="v-seek-tip" id="seekTip">0:00</div>
        </div>
        <div class="v-row">
          <button class="v-cbtn v-cbtn-play" id="btnPlay" aria-label="播放" aria-pressed="false">
            <i class="fa-solid fa-play" aria-hidden="true"></i>
          </button>
          <button class="v-cbtn" id="btnB10" aria-label="后退 10 秒" title="后退 10 秒（←）">
            <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
          </button>
          <button class="v-cbtn" id="btnF10" aria-label="前进 10 秒" title="前进 10 秒（→）">
            <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
          </button>
          <span class="v-time n26-num"><span id="tCur">0:00</span><span class="v-time-sep">/</span><span id="tDur">0:00</span></span>
          <span class="v-epnav" id="epNav" hidden>
            <button class="v-cbtn" id="btnPrevEp" aria-label="上一集" title="上一集">
              <i class="fa-solid fa-backward-step" aria-hidden="true"></i>
            </button>
            <button class="v-cbtn v-cbtn-txt" id="btnEp" aria-label="选集" title="选集">选集</button>
            <button class="v-cbtn" id="btnNextEp" aria-label="下一集" title="下一集">
              <i class="fa-solid fa-forward-step" aria-hidden="true"></i>
            </button>
          </span>
          <div class="v-grow"></div>
          <div class="v-vol">
            <button class="v-cbtn" id="btnMute" aria-label="静音（M）">
              <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
            </button>
            <div class="v-vol-track" id="volTrack" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
              <div class="v-vol-fill" id="volFill"></div>
              <div class="v-vol-knob" id="volKnob"></div>
            </div>
          </div>
          <button class="v-cbtn" id="btnPanelSm" aria-label="播放列表（L）" title="播放列表（L）">
            <i class="fa-solid fa-list-ul" aria-hidden="true"></i>
          </button>
          <button class="v-cbtn" id="btnSub" aria-label="字幕（C）" title="字幕（C）">
            <i class="fa-solid fa-closed-captioning" aria-hidden="true"></i>
          </button>
          <button class="v-cbtn v-cbtn-txt" id="btnRate" aria-label="播放速度（[ / ]）" title="播放速度（[ / ]）">1×</button>
          <button class="v-cbtn" id="btnShot" aria-label="截取当前画面（S）" title="截取当前画面（S）">
            <i class="fa-solid fa-camera" aria-hidden="true"></i>
          </button>
          <button class="v-cbtn" id="btnPip" aria-label="画中画（P）" title="画中画（P）">
            <i class="fa-solid fa-clone" aria-hidden="true"></i>
          </button>
          <button class="v-cbtn" id="btnFs" aria-label="全屏（F）" title="全屏（F）">
            <i class="fa-solid fa-expand" aria-hidden="true"></i>
          </button>
        </div>

        <!-- 菜单 -->
        <div class="v-menu" id="rateMenu" role="menu" aria-label="播放速度"></div>
        <div class="v-menu" id="subMenu" role="menu" aria-label="字幕"></div>
      </div>

      <div class="v-toasts" id="toasts" aria-live="polite"></div>
      <div class="v-dropmask" id="stageDrop">松开以播放</div>
    </section>

    <!-- 媒体库 -->
    <section class="v-lib" id="lib" aria-label="媒体库">
      <div class="v-lib-inner">
        <div class="v-drop" id="dropZone">
          <div class="v-drop-ico"><i class="fa-solid fa-file-video" aria-hidden="true"></i></div>
          <div class="v-drop-t">
            <span class="t" data-i18n="drop_title">把视频拖到这里</span>
            <span class="d" data-i18n="drop_desc">支持浏览器可解码的格式（MP4 / WebM / MOV / OGG），也可以打开网络直链；字幕请拖入 .srt / .vtt。</span>
          </div>
          <div class="v-drop-btns">
            <button class="v-btn v-btn-primary" id="btnPick">
              <i class="fa-solid fa-folder-open" aria-hidden="true"></i><span data-i18n="pick">选择视频</span>
            </button>
            <button class="v-btn" id="btnUrl">
              <i class="fa-solid fa-link" aria-hidden="true"></i><span data-i18n="open_url">打开链接</span>
            </button>
            <button class="v-btn" id="btnFilesApp">
              <i class="fa-solid fa-folder-tree" aria-hidden="true"></i><span data-i18n="open_files">文件管理</span>
            </button>
          </div>
        </div>

        <div id="continueWrap">
          <div class="v-sec-head">
            <span class="t" data-i18n="continue">继续观看</span>
            <span class="d" id="contMeta"></span>
          </div>
          <div class="v-cont" id="contList"></div>
        </div>

        <div class="v-toolbar">
          <div class="v-search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input id="search" type="search" autocomplete="off" placeholder="搜索视频" aria-label="搜索视频">
          </div>
          <div class="v-chips" role="group" aria-label="筛选">
            <button class="v-chip" data-filter="all" aria-pressed="true">全部</button>
            <button class="v-chip" data-filter="unfinished" aria-pressed="false">未看完</button>
            <button class="v-chip" data-filter="local" aria-pressed="false">本地</button>
            <button class="v-chip" data-filter="net" aria-pressed="false">网络</button>
          </div>
          <div class="v-view">
            <button class="v-ibtn" id="btnViewList" aria-label="列表视图" aria-pressed="true"><i class="fa-solid fa-list" aria-hidden="true"></i></button>
            <button class="v-ibtn" id="btnViewGrid" aria-label="网格视图" aria-pressed="false"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i></button>
          </div>
        </div>

        <div id="libBody"></div>
        <div class="v-status" id="libStatus"></div>
      </div>
    </section>

    <!-- 首页（内容站） -->
    <section class="v-lib" id="home" aria-label="发现">
      <div class="v-lib-inner">
        <div class="v-tabs" id="homeTabs" role="tablist" aria-label="分类">
          <button class="v-tab" data-tab="rec" aria-pressed="true">推荐</button>
          <button class="v-tab" data-tab="177" aria-pressed="false">纪录片</button>
          <button class="v-tab" data-tab="181" aria-pressed="false">影视</button>
          <button class="v-tab" data-tab="1" aria-pressed="false">动画</button>
          <button class="v-tab" data-tab="168" aria-pressed="false">国创</button>
          <button class="v-tab" data-tab="36" aria-pressed="false">科技</button>
          <button class="v-tab" data-tab="0" aria-pressed="false">排行榜</button>
        </div>
        <div id="homeBody"></div>
        <div class="v-more" id="homeMore"></div>
      </div>
    </section>

    <!-- 详情页 -->
    <section class="v-lib" id="detail" aria-label="视频详情">
      <div class="v-lib-inner" id="detailBody"></div>
    </section>

    <!-- 播放列表 -->
    <aside class="v-panel" id="panel" aria-label="播放列表">
      <div class="v-panel-head">
        <span data-i18n="playlist">播放列表</span>
        <span class="v-panel-count n26-num" id="plCount">0</span>
        <div class="v-grow"></div>
        <button class="v-ibtn" id="plClear" aria-label="清空播放列表" title="清空">
          <i class="fa-solid fa-broom" aria-hidden="true"></i>
        </button>
        <button class="v-ibtn" id="plClose" aria-label="关闭播放列表">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="v-panel-list" id="plList"></div>
      <div class="v-panel-foot" id="plFoot"></div>
    </aside>

  </div>
</div>

<!-- 网络地址 -->
<div class="v-modal-wrap" id="urlModal" hidden>
  <div class="v-modal" role="dialog" aria-modal="true" aria-labelledby="urlTitle">
    <h3 id="urlTitle">打开网络视频</h3>
    <label class="v-field-label" for="urlInput">视频地址（http / https）</label>
    <input class="v-field" id="urlInput" type="url" inputmode="url" placeholder="https://example.com/video.mp4" spellcheck="false">
    <p class="v-field-help" id="urlHelp">仅支持可直接访问的视频直链（MP4 / WebM / OGG）。网页播放器请使用对应应用。</p>
    <div class="v-modal-btns">
      <button class="v-btn" id="urlCancel">取消</button>
      <button class="v-btn v-btn-primary" id="urlOk">打开</button>
    </div>
  </div>
</div>

<input type="file" id="filePicker" accept="video/*,.mkv,.mov,.m4v" multiple hidden>
<input type="file" id="subPicker" accept=".srt,.vtt,text/vtt" hidden>

      tag = '<span class="v-row-tag resume">' + T('resume') + ' ' + pct + '%</span>';
    }
    return { meta: parts.filter(Boolean).join(' · '), tag: tag };
  }

  function renderLib() {

    renderContinue();

          '<span class="v-row-thumb">' + thumbHTML(it) + barHTML(rec) + '</span>' +

  /* ---------------- 内容站（首页 / 详情 / 剧集） ----------------
   * 数据全部来自我们自己的 Worker（/api/bili/*），前端不直连 B站。
   * 评分：B站接口没有评分类字段，详情页固定写「评分暂无」，不编数字。
   * 演职员：接口只有 UP 主，写「UP 主」，不硬凑「主演」。
   * 剧集来源：B1 分P（pages）/ B2 UGC 合集（season）；官方 PGC（B4）不做。
   * 本地多文件按 SxxEyy / 第x集 聚合（B3），与 B站剧集共用同一套选集浮层。
   * ------------------------------------------------------------ */
  var K_TR = 'video.trans';
  var API_BASE = 'https://ai.fanggame.company';
  var homeEl = $('home'), detailEl = $('detail');
  var homeBody = $('homeBody'), homeMoreEl = $('homeMore'), homeTabs = $('homeTabs');
  var detailBody = $('detailBody');
  var CAT_NAME = { '177': '纪录片', '181': '影视', '1': '动画', '168': '国创', '36': '科技', '0': '排行榜' };
  var homeState = { tab: 'rec', page: 0, loading: false, hasMore: true, feed: [], cats: {} };
  var detState = { bvid: '', data: null, eps: [], loading: false };
  var series = { title: '', entries: [], cur: -1 };

  function fmtNum(n) {
    n = Number(n) || 0;
    if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '亿';
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
    return String(n);
  }
  function yearOf(ts) {
    var d = new Date((Number(ts) || 0) * 1000);
    return d.getFullYear() || '';
  }
  function biliImg(u) {
    if (!u) return '';
    return API_BASE + '/api/bili/img?url=' + encodeURIComponent(u);
  }
  function apiGet(path, params) {
    var parts = [];
    if (params) {
      Object.keys(params).forEach(function (k) {
        var v = params[k];
        if (v == null || v === '') return;
        parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
      });
    }
    var url = API_BASE + path + (parts.length ? '?' + parts.join('&') : '');
    return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (r) {
      return r.text().then(function (txt) {
        var j = null;
        try { j = JSON.parse(txt); } catch (e) { j = null; }
        if (!r.ok || !j || j.ok !== true) {
          throw new Error((j && j.error) || ('HTTP ' + r.status));
        }
        return j.data;
      });
    });
  }

  function pageOpen(el, open) { if (el) el.classList.toggle('open', !!open); }

  function showHome(tab) {
    if (tab && tab !== homeState.tab) { homeState.tab = tab; }
    if (state.view === 'player') {
      saveProgress(true); video.pause(); closeMenus(); setPanel(false); closeEp();
    }
    state.view = 'home';
    app.setAttribute('data-view', 'home');
    lib.classList.remove('open');
    pageOpen(detailEl, false);
    pageOpen(homeEl, true);
    renderHomeTabs();
    renderHome();
    updateTop();
    if (homeState.tab === 'rec' && !homeState.feed.length) loadFeed(true);
    if (homeState.tab !== 'rec' && !homeState.cats[homeState.tab]) loadRank(homeState.tab);
  }

  function showDetail(bvid) {
    if (!bvid) return;
    if (state.view === 'player') { saveProgress(true); video.pause(); closeMenus(); setPanel(false); closeEp(); }
    state.view = 'detail';
    app.setAttribute('data-view', 'detail');
    lib.classList.remove('open');
    pageOpen(homeEl, false);
    pageOpen(detailEl, true);
    detState.bvid = bvid;
    detState.data = null;
    detState.eps = [];
    detailBody.innerHTML = '<div class="v-empty">正在加载详情…</div>';
    updateTop();
    fetchDetail(bvid);
  }

  function fetchDetail(bvid) {
    var want = bvid;
    apiGet('/api/bili/video', { bvid: bvid }).then(function (d) {
      if (detState.bvid !== want) return;
      detState.data = d;
      detState.eps = episodesOf(d);
      renderDetail();
      loadRelated(bvid, want);
    }).catch(function (e) {
      if (detState.bvid !== want) return;
      detailBody.innerHTML = '<div class="v-empty">详情加载失败：' + esc(e.message) + '</div>';
    });
  }

  /** B2 UGC 合集优先；没有合集就退回 B1 分P */
  function episodesOf(d) {
    var eps = [];
    var season = d && d.season;
    if (season && Array.isArray(season.sections) && season.sections.length) {
      season.sections.forEach(function (sec) {
        (sec.episodes || []).forEach(function (e) {
          eps.push({
            bvid: e.bvid, cid: e.cid,
            name: e.title || ('第 ' + (eps.length + 1) + ' 集'),
            cover: e.cover || '', dur: e.duration || 0, sec: sec.title || ''
          });
        });
      });
    }
    if (!eps.length && d && Array.isArray(d.pages) && d.pages.length) {
      d.pages.forEach(function (p) {
        eps.push({
          bvid: d.bvid, cid: p.cid,
          name: d.pages.length > 1 ? (p.part || ('P' + p.page)) : '正片',
          cover: d.cover || '', dur: p.duration || d.duration || 0, sec: ''
        });
      });
    }
    return eps;
  }

  function cardHTML(v) {
    if (!v || !v.bvid) return '';
    return '<button class="v-card" data-bvid="' + esc(v.bvid) + '">' +
      '<span class="cov"><img loading="lazy" src="' + esc(biliImg(v.cover)) + '" alt="">' +
      '<span class="dur">' + esc(fmt(v.duration || 0)) + '</span></span>' +
      '<span class="tt">' + esc(v.title || '') + '</span>' +
      '<span class="mt"><span>' + esc(v.author || 'UP 主') + '</span><span>' + fmtNum(v.view) + '</span></span>' +
      '</button>';

  function resumeHTML() {
    var recs = progress.slice().sort(function (a, b) { return (b.at || 0) - (a.at || 0); }).slice(0, 8);
    var out = [];
    recs.forEach(function (r) {

          ' data-name="' + esc(r.epName || r.name || '') + '">' +
          '<span class="cov"><img loading="lazy" src="' + esc(biliImg(r.cover || '')) + '" alt="">' +
          '<span class="dur">' + esc(fmt(r.pos || 0)) + '</span></span>' +

          '<span class="mt"><span>看到 ' + fmt(r.pos) + ' · ' + esc(r.epName || '') + '</span></span></button>');
      } else if (itemById(r.id)) {
        out.push('<button class="v-card" data-open="' + esc(r.id) + '">' +
          '<span class="cov"><i class="fa-solid fa-film" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-3)"></i></span>' +
          '<span class="tt">' + esc(r.name || '') + '</span>' +

    return '<div class="v-sec-head"><span class="t">继续观看</span><span class="d">按最近观看排序</span></div>' +
      '<div class="v-cards">' + out.join('') + '</div>';
  }

  function renderHomeTabs() {
    Array.prototype.forEach.call(homeTabs.querySelectorAll('.v-tab'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-tab') === homeState.tab ? 'true' : 'false');
    });
  }

  function renderHome() {
    var tab = homeState.tab;
    var head = '';
    if (tab === 'rec') {
      homeMoreEl.textContent = homeState.hasMore
        ? (homeState.loading ? '加载中…' : '继续下滑加载更多')
        : (homeState.feed.length ? '已经到底了' : '');
      if (!homeState.feed.length) {
        homeBody.innerHTML = resumeHTML() + '<div class="v-empty">' +
          (homeState.loading ? '正在加载推荐…' : '暂无推荐内容') + '</div>';
        return;
      }
      head = resumeHTML() +
        '<div class="v-sec-head"><span class="t">推荐</span><span class="d">B站热门 · 下滑更多</span></div>';
      homeBody.innerHTML = head + '<div class="v-cards">' + homeState.feed.map(cardHTML).join('') + '</div>';
      return;
    }
    homeMoreEl.textContent = '';
    var list = homeState.cats[tab];
    if (!list) {
      homeBody.innerHTML = (tab === 'rec' ? resumeHTML() : '') +
        '<div class="v-empty">' + (homeState.loading ? '正在加载…' : '暂无内容') + '</div>';
      return;
    }
    head = '<div class="v-sec-head"><span class="t">' + esc(CAT_NAME[tab] || '分类') + '</span>' +
      '<span class="d">按 B站排行 · ' + list.length + ' 条</span></div>';
    homeBody.innerHTML = head + '<div class="v-cards">' + list.map(cardHTML).join('') + '</div>';
  }

  function loadFeed(reset) {
    if (homeState.loading) return;
    if (!reset && !homeState.hasMore) return;
    homeState.loading = true;
    if (reset) {
      homeState.page = 0;
      homeState.feed = [];
      homeState.hasMore = true;
    }
    homeMoreEl.textContent = '加载中…';
    var page = homeState.page + 1;
    apiGet('/api/bili/feed', { page: page, ps: 20 }).then(function (d) {
      homeState.page = page;
      homeState.hasMore = d.hasMore !== false;
      homeState.feed = homeState.feed.concat((d && d.items) || []);
      homeState.loading = false;
      if (homeState.tab === 'rec') renderHome();
    }).catch(function (e) {
      homeState.loading = false;
      homeMoreEl.textContent = '加载失败：' + e.message + '（下滑重试）';
      if (!homeState.feed.length && homeState.tab === 'rec') renderHome();
    });
  }

  function loadRank(rid) {
    if (homeState.cats[rid] || homeState.loading) return;
    homeState.loading = true;
    renderHome();
    apiGet('/api/bili/ranking', { rid: rid }).then(function (d) {
      homeState.cats[rid] = (d && d.items) || [];
      homeState.loading = false;
      if (homeState.tab === rid) renderHome();
    }).catch(function (e) {
      homeState.loading = false;
      homeBody.innerHTML = '<div class="v-empty">' + esc(CAT_NAME[rid] || '分类') + ' 加载失败：' + esc(e.message) + '</div>';
    });
  }

  function loadRelated(bvid, want) {
    apiGet('/api/bili/related', { bvid: bvid }).then(function (d) {
      if (detState.bvid !== want) return;

      if (!box) return;

      box.innerHTML = list.length
        ? list.slice(0, 12).map(cardHTML).join('')

      if (box) box.innerHTML = '<div class="v-empty">相关推荐加载失败</div>';

  function renderDetail() {

    var lastRec = null;
    progress.forEach(function (r) {
      if (!r || r.kind !== 'bili' || r.bvid !== d.bvid || (r.pos || 0) < 3) return;
      if (!lastRec || (r.at || 0) > (lastRec.at || 0)) lastRec = r;
    });
    var html = '<div class="v-det">';
    html += '<div class="hero"><img src="' + esc(biliImg(d.cover)) + '" alt=""></div>';
    html += '<div class="info">';
    html += '<h2>' + esc(d.title || '') + '</h2>';
    html += '<div class="meta">';
    html += '<span class="score">评分暂无</span>';
    if (d.duration) html += '<span>' + esc(fmt(d.duration)) + '</span>';
    if (d.pubdate) html += '<span>' + esc(String(yearOf(d.pubdate))) + ' 年</span>';
    if (d.stat && d.stat.view != null) html += '<span>' + fmtNum(d.stat.view) + ' 播放</span>';
    if (d.stat && d.stat.danmaku != null) html += '<span>' + fmtNum(d.stat.danmaku) + ' 弹幕</span>';
    if (d.videos) html += '<span>' + d.videos + ' 个视频</span>';
    html += '</div>';
    html += '<div class="up"><i class="fa-solid fa-user" aria-hidden="true"></i>UP 主：' +
      esc((d.author && d.author.name) || '未知') + '</div>';
    if (d.tname) html += '<div class="meta"><span>' + esc(d.tname) + '</span></div>';
    if (d.desc) html += '<div class="desc">' + esc(d.desc) + '</div>';
    html += '<div class="acts"><button class="v-btn v-btn-primary" id="detPlay">立即播放</button>';
    if (lastRec) {
      html += '<button class="v-btn" id="detResume">继续观看 · ' + esc(lastRec.epName || '上次') + ' ' + fmt(lastRec.pos) + '</button>';
      html += '<button class="v-btn" id="detClearResume">清除进度</button>';
    }
    html += '</div></div></div>';

    if (eps.length) {
      html += '<div class="v-eps"><div class="v-sec-head"><span class="t">' +
        esc((d.season && d.season.title) || (eps.length > 1 ? '剧集' : '播放')) + '</span>' +
        '<span class="d">' + eps.length + ' 集</span></div><div class="v-ep-grid">';
      eps.forEach(function (e, i) {
        html += '<button class="v-ep" data-ep="' + i + '" title="' + esc(e.name) + '">' +
          esc((i + 1) + '. ' + e.name) + '</button>';
      });
      html += '</div></div>';
    }

    html += '<div class="v-eps"><div class="v-sec-head"><span class="t">相关推荐</span></div>' +
      '<div class="v-cards" id="detRelated"><div class="v-empty">加载中…</div></div></div>';
    detailBody.innerHTML = html;

    $('detPlay').addEventListener('click', function () {
      var first = eps.length ? eps[0] : { bvid: d.bvid, cid: d.cid, name: d.title };
      openBili(first.bvid, first.cid, first.name);
    });
    var rb = $('detResume');
    if (rb) rb.addEventListener('click', function () {
      openBili(lastRec.bvid, lastRec.cid, lastRec.epName || lastRec.name, lastRec.pos);
    });
    var cb = $('detClearResume');
    if (cb) cb.addEventListener('click', function () {
      progress = progress.filter(function (r) { return !(r && r.kind === 'bili' && r.bvid === d.bvid); });
      persistProgress();
      renderDetail();
      toast('已清除这部片的观看进度');
    });
    Array.prototype.forEach.call(detailBody.querySelectorAll('[data-ep]'), function (b) {
      b.addEventListener('click', function () {
        var e = eps[parseInt(b.getAttribute('data-ep'), 10)];
        if (e) openBili(e.bvid, e.cid, e.name);
      });

    updateTop();
  }

  /* ---- 剧集上下文（B站 + 本地文件共用） ---- */
  function setSeries(title, entries, cur) {
    series.title = title || '';
    series.entries = entries || [];
    series.cur = cur >= 0 ? cur : -1;
    $('epBarTitle').textContent = series.title;
    $('epNav').hidden = series.entries.length < 2;
    renderEpBar();
  }
  function renderEpBar() {
    var grid = $('epGrid');
    if (!series.entries.length) { grid.innerHTML = ''; return; }
    grid.innerHTML = series.entries.map(function (e, i) {
      return '<button class="v-ep" data-sep="' + i + '" aria-current="' +
        (i === series.cur ? 'true' : 'false') + '" title="' + esc(e.name) + '">' +
        esc((i + 1) + '. ' + e.name) + '</button>';
    }).join('');
  }
  function openEpBar(open) {
    var bar = $('epBar');
    bar.classList.toggle('open', !!open);
    bar.setAttribute('aria-hidden', open ? 'false' : 'true');
    if (open) showUI();
  }
  function closeEp() { openEpBar(false); }
  function openSeriesEntry(i) {
    var e = series.entries[i];
    if (!e) return;
    closeEp();
    series.cur = i;
    renderEpBar();
    if (e.id) { openItem(e.id); return; }
    openBili(e.bvid, e.cid, e.name);
  }
  function nextEpisode(auto) {
    if (!series.entries.length || series.cur < 0 || series.cur >= series.entries.length - 1) return false;
    openSeriesEntry(series.cur + 1);
    return true;
  }
  function prevEpisode() {
    if (!series.entries.length || series.cur <= 0) { toast('已经是第一集'); return; }
    openSeriesEntry(series.cur - 1);
  }

  function epInfo(name) {
    var n = String(name || '').replace(/\.[a-z0-9]{2,5}$/i, '');
    var num = 0;
    var m = /[Ss](\d{1,2})[Ee](\d{1,3})/.exec(n);
    if (m) { num = parseInt(m[2], 10); n = n.replace(m[0], ' '); }
    if (!num) { m = /第\s*(\d{1,3})\s*[集话話]/.exec(n); if (m) { num = parseInt(m[1], 10); n = n.replace(m[0], ' '); } }
    if (!num) { m = /(?:^|[^0-9A-Za-z])[Ee][Pp]?\s*0*(\d{1,3})(?![0-9])/.exec(n); if (m) { num = parseInt(m[1], 10); n = n.replace(m[0], ' '); } }
    var base = n.replace(/[\[\](){}【】._\-—–]+/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
    return { num: num, base: base };
  }
  /** B3：本地多文件按 SxxEyy / 第x集 聚合成一个剧集 */
  function localSeriesOf(it) {
    if (!it || it.kind === 'url' || it.kind === 'bili') return null;
    var info = epInfo(it.name);
    if (!info.num || !info.base) return null;
    var list = [];
    for (var i = 0; i < items.length; i++) {
      var x = items[i];
      if (!x || x.kind === 'url' || x.kind === 'bili') continue;
      var xi = epInfo(x.name);
      if (xi.base === info.base && xi.num) list.push({ id: x.id, name: x.name, num: xi.num });
    }
    if (list.length < 2) return null;
    list.sort(function (a, b) { return a.num - b.num; });
    return { title: info.base, entries: list.map(function (e) { return { id: e.id, name: e.name }; }) };
  }
  function syncSeriesForItem(id) {
    var it = itemById(id);
    if (!it) return;
    if (it.kind === 'bili') {
      if (!series.entries.length) setSeries('', [], -1);
      else { renderEpBar(); $('epNav').hidden = series.entries.length < 2; }
      return;
    }
    var s = localSeriesOf(it);
    if (!s) { setSeries('', [], -1); return; }
    var cur = -1;
    s.entries.forEach(function (e, i) { if (e.id === id) cur = i; });
    setSeries(s.title, s.entries, cur);
  }

  function biliEpId(bvid, cid) { return 'b:' + bvid + ':' + (cid || 0); }

  /** 当前详情页的剧集表对「合集中的任意一集」都有效（合集里每集 bvid 不同） */
  function epsFor(bvid) {
    var eps = detState.eps || [];
    if (!eps.length) return [];
    if (detState.bvid === bvid) return eps;
    for (var i = 0; i < eps.length; i++) if (eps[i].bvid === bvid) return eps;
    return [];
  }

  function openBili(bvid, cid, name, seekTo) {
    if (!bvid) return;
    var eps = epsFor(bvid);
    var inDet = !!(detState.data && eps.length);
    var idx = -1;
    for (var i = 0; i < eps.length; i++) {
      if (String(eps[i].cid) === String(cid)) { idx = i; break; }
    }
    if (idx < 0 && eps.length !== 1) idx = 0;
    var epName = name || (idx >= 0 ? eps[idx].name : '');
    toast('正在解析播放地址…');
    apiGet('/api/bili/play', { bvid: bvid, cid: cid }).then(function (d) {
      var u = (d && d.durl && d.durl[0] && d.durl[0].proxy) || '';
      if (!u) {
        toast((d && d.note) || '这个视频暂时拿不到可直接播放的地址', true);
        return;
      }
      var id = biliEpId(bvid, d.cid || cid);
      var title = (inDet && detState.data.title) || epName || bvid;
      var cover = (inDet && detState.data.cover) || '';
      var author = (inDet && detState.data.author && detState.data.author.name) || '';
      addItem({
        id: id, name: title, src: u, kind: 'bili', bvid: bvid, cid: d.cid || cid,
        cover: cover, author: author, epName: epName || ''
      });
      if (eps.length > 1) {
        setSeries((inDet && detState.data.season && detState.data.season.title) || (inDet && detState.data.title) || '', eps, idx);
      } else {
        setSeries('', [], -1);
      }
      state.ret = 'detail';
      if (seekTo && seekTo > 3) {
        upsertRec({
          id: id, name: title, dur: Math.round((eps[idx] && eps[idx].dur) || 0), pos: Math.round(seekTo),
          at: Date.now(), kind: 'bili', ext: '', src: '', bvid: bvid, cid: d.cid || cid,
          cover: cover, epName: epName || ''
        });
        persistProgress();
      }
      openItem(id, { autoplay: true, restart: true });
      renderEpBar();
    }).catch(function (e) {
      toast('播放地址解析失败：' + e.message, true);
    });
  }

  /* ---- 视图返回 ---- */
  function goBack() {
    if (state.view === 'player') {
      if (state.ret === 'detail' && detState.bvid) showDetail(detState.bvid);
      else if (state.ret === 'home') showHome();
      else showLibrary();
      return;
    }
    if (state.view === 'detail') { showHome(); return; }
  }

  /* ---- 首页 / 详情交互 ---- */
  homeTabs.addEventListener('click', function (e) {

  homeBody.addEventListener('click', function (e) {

  detailBody.addEventListener('click', function (e) {

  homeEl.addEventListener('scroll', function () {

  $('navHome').addEventListener('click', function () { showHome(); });
  $('navLib').addEventListener('click', function () { showLibrary(); });
  $('btnEp').addEventListener('click', function () {
    if (!series.entries.length) { toast('当前视频没有剧集信息'); return; }
    setPanel(false);
    openEpBar(!$('epBar').classList.contains('open'));

  $('epClose').addEventListener('click', closeEp);
  $('btnPrevEp').addEventListener('click', prevEpisode);
  $('btnNextEp').addEventListener('click', function () {

  });
  $('epGrid').addEventListener('click', function (e) {
