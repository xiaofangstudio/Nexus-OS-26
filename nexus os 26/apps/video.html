  /* ---------------- 播放列表渲染 ---------------- */
  var panel = $('panel'), plList = $('plList');

  function renderPanel() {
    $('plCount').textContent = queue.length;
    if (!queue.length) {
      plList.innerHTML = '<div class="v-panel-empty"><i class="fa-solid fa-list-ul" aria-hidden="true"></i>' +
        T('pl_empty') + '<br>' + T('pl_empty_d') + '</div>';
    } else {
      plList.innerHTML = queue.map(function (id, i) {
        var it = itemById(id);
        if (!it) return '';
        var rec = getRec(id);
        var sub = [];
        if (it.dur) sub.push(fmt(it.dur));
        if (it.ext) sub.push(it.ext.toUpperCase());
        if (recAlive(rec) && rec.dur) sub.push(Math.round(rec.pos / rec.dur * 100) + '%');
        return '<div class="v-pl-item' + (id === state.curId ? ' active' : '') + '" draggable="true" data-id="' + esc(id) + '">' +
          '<span class="v-pl-idx">' + (i + 1) + '</span>' +
          '<button class="v-pl-main" type="button" data-play="' + esc(id) + '">' +
          '<span class="v-pl-name">' + esc(it.name) + '</span>' +
          '<span class="v-pl-sub">' + esc(sub.join(' · ')) + '</span></button>' +
          '<button class="v-pl-x" type="button" data-rm="' + esc(id) + '" aria-label="移出播放列表"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>' +
          '</div>';
      }).join('');
    }
    $('plFoot').textContent = T('pl_foot');
    $('btnPanelTop').classList.toggle('on', panel.classList.contains('open'));
    $('btnPanelSm').classList.toggle('on', panel.classList.contains('open'));
  }

  function setPanel(open) {
    panel.classList.toggle('open', !!open);
    prefs.panel = !!open;
    persistPrefs();
    if (open) renderPanel();
    $('btnPanelTop').classList.toggle('on', !!open);
    $('btnPanelSm').classList.toggle('on', !!open);
  }

  function ensureQueue(id) {
    if (queue.indexOf(id) < 0) queue.push(id);
    persistQueue();
    renderPanel();
  }

  /* 播放列表持久化：以前关掉再打开只剩当前一条，队列白排一次 */
  function persistQueue() {
    prefs.queue = queue.slice(0, 200);
    persistPrefs();
  }
  /* 恢复队列：只留仍能解析的条目（本地导入的文件重启后必须重新选文件，
     留着只会是一行点不动的死项） */
  function restoreQueue() {
    var saved = prefs.queue;
    if (!Array.isArray(saved) || !saved.length) return;
    var keep = saved.filter(function (id) { return !!itemById(id); });
    if (!keep.length) return;
    queue = keep;
    if (state.curId && keep.indexOf(state.curId) < 0) queue.push(state.curId);
    renderPanel();
  }

  function addMany(files) {
    var first = null;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (!f) continue;
      if (!isVideoName(f.name) && !/^video\//.test(f.type || '')) continue;
      var url = URL.createObjectURL(f);
      var it = addItem({
        name: f.name, src: url, kind: 'local',
        size: f.size, dur: 0
      });
      if (!first) first = it;
      ensureQueue(it.id);
    }
    renderLib();
    return first;
  }

  function needsReselect(msg) {
    toast(msg || T('need_reselect'), true);
    $('filePicker').click();
  }

  /* ---------------- 播放器 ---------------- */
  var playBtn = $('btnPlay'), bigPlay = $('bigPlay'), loader = $('loader'), errCard = $('errCard');
  var seek = $('seek'), seekFill = $('seekFill'), seekBuf = $('seekBuf'), seekKnob = $('seekKnob'), seekTip = $('seekTip');
  var tCur = $('tCur'), tDur = $('tDur');
  var volFill = $('volFill'), volKnob = $('volKnob'), volTrack = $('volTrack');
  var hideTimer = 0, loadTimer = 0, lastSave = 0, seeking = false, seekWasPlaying = false;
  var RATES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3];

  function duration() {
    var d = video.duration;
    if (!isFinite(d) || d <= 0) {
      var it = itemById(state.curId);
      d = (it && it.dur) || 0;
    }
    return d;
  }

  function updateTop() {
    var inPlayer = state.view === 'player';
    if (inPlayer) {
      var it = itemById(state.curId);
      $('topTitle').textContent = it ? it.name : T('lib_title');
      var bits = [];
      if (it && it.kind === 'bili') bits.push('B站');
      if (it && it.ext) bits.push(it.ext.toUpperCase());
      if (duration()) bits.push(fmt(duration()));
      if (it && it.size) bits.push(bytes(it.size));
      if (it && it.kind === 'url') bits.push('URL');
      $('topMeta').textContent = bits.join(' · ');
      $('topMark').innerHTML = '<i class="fa-solid fa-play" aria-hidden="true"></i>';
      $('btnBack').hidden = false;
    } else if (state.view === 'home') {
      $('topTitle').textContent = '首页';
      $('topMeta').textContent = '发现 · 推荐 / 分类 / 排行榜';
      $('topMark').innerHTML = '<i class="fa-solid fa-house" aria-hidden="true"></i>';
      $('btnBack').hidden = true;
    } else if (state.view === 'detail') {
      var d = detState.data;
      $('topTitle').textContent = d ? d.title : '视频详情';
      $('topMeta').textContent = d ? ('UP 主：' + ((d.author && d.author.name) || '未知')) : '';
      $('topMark').innerHTML = '<i class="fa-solid fa-circle-info" aria-hidden="true"></i>';
      $('btnBack').hidden = false;
    } else {
      $('topTitle').textContent = T('lib_title');
      $('topMeta').textContent = items.length ? T('status_cnt', { n: items.length }) : '';
      $('topMark').innerHTML = '<i class="fa-solid fa-film" aria-hidden="true"></i>';
      $('btnBack').hidden = true;
    }
    $('vNav').hidden = inPlayer;
    $('btnSubTop').hidden = !inPlayer;
    $('btnPanelTop').hidden = !inPlayer;
    $('btnFsTop').hidden = !inPlayer;
  }

  function enterPlayer() {
    state.view = 'player';
    app.setAttribute('data-view', 'player');
    lib.classList.remove('open');
    pageOpen(homeEl, false);
    pageOpen(detailEl, false);
    closeEp();
    updateTop();
    showUI();
  }

  function showLibrary() {
    if (state.view === 'library') return;
    saveProgress(true);
    video.pause();
    closeMenus();
    setPanel(false);
    closeEp();
    state.view = 'library';
    app.setAttribute('data-view', 'library');
    pageOpen(homeEl, false);
    pageOpen(detailEl, false);
    lib.classList.add('open');
    renderLib();
    updateTop();
  }

  function showUI() {
    stage.classList.remove('ui-hidden');
    clearTimeout(hideTimer);
    if (!video.paused) {
      hideTimer = setTimeout(function () {
        if (!seeking && !menuOpen()) stage.classList.add('ui-hidden');
      }, 1500);
    }
  }

  function pendLoader() {
    clearTimeout(loadTimer);
    loadTimer = setTimeout(function () {
      if (video.readyState < 3 && !errCard.classList.contains('show')) {
        loader.classList.add('show');
        loader.setAttribute('aria-hidden', 'false');
        if (!bufferedPct()) updateLoadPct(0, true);
      }
    }, 240);
  }
  function hideLoader() {
    clearTimeout(loadTimer);
    loader.classList.remove('show');
    loader.setAttribute('aria-hidden', 'true');
  }
  function updateLoadPct(pct) {
    var p = Math.max(0, Math.min(100, Math.round(pct || 0)));
    $('loadPct').textContent = p ? p + '%' : '';
    $('loadBar').style.width = p + '%';
    $('loadText').textContent = p ? T('loading_pct', { n: p }) : T('loading');
  }
  function bufferedPct() {
    var d = duration();
    if (!d || !video.buffered || !video.buffered.length) return 0;
    try {
      var end = video.buffered.end(video.buffered.length - 1);
      return Math.max(0, Math.min(100, end / d * 100));
    } catch (e) { return 0; }
  }

  function showError(title, desc) {
    hideLoader();
    setBigPlay(false);
    $('errTitle').textContent = title || T('err_title');
    $('errDesc').textContent = desc || '';
    errCard.classList.add('show');
    errCard.setAttribute('aria-hidden', 'false');
  }
  function hideError() {
    errCard.classList.remove('show');
    errCard.setAttribute('aria-hidden', 'true');
  }

  function setBigPlay(on) {
    bigPlay.classList.toggle('show', !!on);
    bigPlay.querySelector('i').className = video.paused ? 'fa-solid fa-play' : 'fa-solid fa-pause';
  }
  function setPlaying(p) {
    playBtn.querySelector('i').className = p ? 'fa-solid fa-pause' : 'fa-solid fa-play';
    playBtn.setAttribute('aria-label', p ? '暂停' : '播放');
    playBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
    bigPlay.querySelector('i').className = p ? 'fa-solid fa-pause' : 'fa-solid fa-play';
    bigPlay.classList.toggle('show', !p && !errCard.classList.contains('show') && duration() > 0 && !seeking);
    showUI();
    renderSeek();
    broadcastNow();
    if (!p) saveProgress(true);
  }

  function renderSeek() {
    var d = duration(), t = video.currentTime || 0;
    var r = d ? Math.min(1, Math.max(0, t / d)) : 0;
    seekFill.style.width = (r * 100).toFixed(3) + '%';
    seekKnob.style.left = (r * 100).toFixed(3) + '%';
    seek.setAttribute('aria-valuenow', Math.round(r * 100));
    seek.setAttribute('aria-valuemax', 100);
    seek.setAttribute('aria-valuetext', fmt(t) + ' / ' + fmt(d));
    tCur.textContent = fmt(t);
    tDur.textContent = fmt(d);
    seekBuf.style.width = bufferedPct().toFixed(2) + '%';
  }

  function setTime(t) {
    var d = duration();
    if (!d) return;
    video.currentTime = Math.max(0, Math.min(d - 0.05, t));
    renderSeek();
  }
  function bumpTime(delta) {
    setTime((video.currentTime || 0) + delta);
    showUI();
  }

  function loadSrc(it, allowPlay) {
    hideError();
    state.ended = false;
    restoreSubs(it);
    if (it.kind === 'url' && !navigator.onLine) {
      showError(T('offline_t'), T('offline_d'));
      return;
    }
    try {
      video.pause();
      video.removeAttribute('src');
      video.load();
      video.src = it.src;
      video.load();
    } catch (e) {
      showError(T('err_title'), T('import_fail'));
      return;
    }
    renderSeek();
    updateLoadPct(0);
    pendLoader();
    if (allowPlay !== false) {
      claimMedia();
      var pr = video.play();
      if (pr && pr.catch) pr.catch(function () { setPlaying(false); showUI(); });
    } else {
      setPlaying(false);
    }
    broadcastNow();
  }

  function openItem(id, opts) {
    opts = opts || {};
    var it = itemById(id);
    if (!it) return;
    if (!it.src) { needsReselect(); return; }
    if (id === state.curId && state.view === 'player' && !opts.restart) { togglePlay(); return; }
    if (state.curId && state.curId !== id) saveProgress(true);
    state.curId = id;
    ensureQueue(id);
    if (!opts.ret) state.ret = it.kind === 'bili'
      ? (detState.bvid === it.bvid ? 'detail' : 'home') : 'library';
    var rec = getRec(id);
    state.pendingSeek = (!opts.restart && rec && rec.pos > 3 && (!rec.dur || rec.dur - rec.pos > 4)) ? rec.pos : 0;
    enterPlayer();
    updateTop();
    renderPanel();
    syncSeriesForItem(id);
    loadSrc(it, opts.autoplay !== false);
  }

  function nextItem(auto) {
    var i = queue.indexOf(state.curId);
    for (var j = i + 1; j < queue.length; j++) {
      var it = itemById(queue[j]);
      if (it && it.src) { openItem(it.id); return true; }
    }
    if (auto) toast(T('queue_full'));
    return false;
  }
  function prevItem() {
    if ((video.currentTime || 0) > 3) { setTime(0); return; }
    var i = queue.indexOf(state.curId);
    for (var j = i - 1; j >= 0; j--) {
      var it = itemById(queue[j]);
      if (it && it.src) { openItem(it.id); return; }
    }
  }

  function togglePlay() {
    if (!state.curId) return;
    if (video.paused) {
      claimMedia();
      var pr = video.play();
      if (pr && pr.catch) pr.catch(function () { showError(T('err_title'), T('import_fail')); });
    } else {
      video.pause();
    }
    showUI();
  }

  /* ---------------- 进度持久化 ---------------- */
  function saveProgress(force) {
    var it = itemById(state.curId);
    if (!it) return;
    var now = Date.now();
    if (!force && now - lastSave < 5000) return;
    lastSave = now;
    var d = duration();
    if (!d) return;
    var p = video.currentTime || 0;
    if (p > 3 && p < d - 4) {
      upsertRec({
        id: it.id, name: it.name, dur: Math.round(d), pos: Math.round(p), at: now,
        path: it.path || '', size: it.size || 0, kind: it.kind, ext: it.ext,
        src: it.kind === 'url' ? it.src : '',
        bvid: it.bvid || '', cid: it.cid || 0, cover: it.cover || '',
        epName: it.epName || '', author: it.author || ''
      });
      persistProgress();
      scheduleLibRender();
    } else if (p >= d - 4) {
      dropRec(it.id);
      persistProgress();
      scheduleLibRender();
    }
  }

  function broadcastNow() {
    var it = itemById(state.curId);
    if (!it) return;
    write(K_NOW, {
      name: it.name, dur: Math.round(duration()),
      pos: Math.round(video.currentTime || 0),
      playing: !video.paused, hue: 249, ts: Date.now()
    });
  }

  /* ---------------- 视频事件 ---------------- */
  video.addEventListener('loadedmetadata', function () {
    var it = itemById(state.curId);
    if (it && isFinite(video.duration)) it.dur = Math.round(video.duration || 0);
    if (state.pendingSeek > 3) {
      var target = state.pendingSeek;
      state.pendingSeek = 0;
      try { video.currentTime = target; toast(T('resume_toast', { t: fmt(target) })); } catch (e) {}
    }
    renderSeek();
    updateTop();
    // 元数据就绪后刷新中央播放钮（深链/自动播放关闭时也能看到可点击的播放键）
    setPlaying(!video.paused);
    scheduleLibRender();
    if (video.readyState < 3) pendLoader();
  });
  video.addEventListener('durationchange', function () { renderSeek(); updateTop(); });
  video.addEventListener('timeupdate', function () { renderSeek(); saveProgress(false); });
  video.addEventListener('progress', function () {
    var bp = bufferedPct();
    seekBuf.style.width = bp.toFixed(2) + '%';
    if (bp && video.readyState < 3) updateLoadPct(bp);
  });
  video.addEventListener('waiting', function () {
    if (!errCard.classList.contains('show')) { pendLoader(); updateLoadPct(bufferedPct()); }
  });
  video.addEventListener('canplay', function () { hideLoader(); });
  video.addEventListener('playing', function () { hideLoader(); setPlaying(true); });
  video.addEventListener('play', function () { claimMedia(); setPlaying(true); if (sub.on) startSubLoop(); });
  video.addEventListener('pause', function () { releaseMedia(); setPlaying(false); });
  video.addEventListener('seeked', function () { renderSeek(); renderCue(); });
  video.addEventListener('ratechange', function () { updateRateUI(); });
  video.addEventListener('ended', function () {
    state.ended = true;
    dropRec(state.curId);
    persistProgress();
    renderLib();
    // 剧集自动连播优先，其次才走普通队列
    if (nextEpisode(true)) return;
    if (!nextItem(true)) { setPlaying(false); setBigPlay(true); }
  });
  video.addEventListener('error', function () {
    hideLoader();
    var c = video.error && video.error.code;
    var title = T('err_title'), desc = T('err_unknown');
    if (c === 1) desc = T('err_aborted');
    else if (c === 2) desc = navigator.onLine ? T('err_network') : T('offline_d');
    else if (c === 3) desc = T('err_decode');
    else if (c === 4) desc = T('err_src');
    showError(title, desc);
  });

  /* ---------------- 进度条 ---------------- */
  function seekRatio(e) {
    var r = seek.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / Math.max(1, r.width)));
  }
  function tipAt(ratio) {
    var d = duration();
    seekTip.style.left = (ratio * 100).toFixed(2) + '%';
    seekTip.textContent = fmt(ratio * d);
  }
  seek.addEventListener('pointermove', function (e) {
    if (!duration()) return;
    var r = seekRatio(e);
    tipAt(r);
    if (seeking) setTime(r * duration());
  });
  seek.addEventListener('pointerdown', function (e) {
    if (!duration()) return;
    e.preventDefault();
    seeking = true;
    seekWasPlaying = !video.paused;
    video.pause();
    seek.classList.add('dragging');
    try { seek.setPointerCapture(e.pointerId); } catch (err) {}
    var r = seekRatio(e);
    tipAt(r);
    setTime(r * duration());
    showUI();
  });
  seek.addEventListener('pointerup', function (e) {
    if (!seeking) return;
    seeking = false;
    seek.classList.remove('dragging');
    try { seek.releasePointerCapture(e.pointerId); } catch (err) {}
    if (seekWasPlaying) { var pr = video.play(); if (pr && pr.catch) pr.catch(function () {}); }
    showUI();
  });
  seek.addEventListener('pointercancel', function () {
    seeking = false;
    seek.classList.remove('dragging');
  });
  seek.addEventListener('keydown', function (e) {
    var d = duration();
    if (!d) return;
    var step = e.shiftKey ? 30 : 5;
    if (e.key === 'ArrowLeft') { e.preventDefault(); setTime((video.currentTime || 0) - step); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setTime((video.currentTime || 0) + step); }
    else if (e.key === 'Home') { e.preventDefault(); setTime(0); }
    else if (e.key === 'End') { e.preventDefault(); setTime(d - 1); }
    showUI();
  });

  /* ---------------- 音量 ---------------- */
  function volRatio(e) {
    var r = volTrack.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / Math.max(1, r.width)));
  }
  function applyVolume(v, unmute) {
    prefs.volume = Math.min(1, Math.max(0, v));
    if (unmute && prefs.volume > 0) prefs.muted = false;
    video.volume = prefs.volume;
    video.muted = !!prefs.muted;
    updateVolUI();
    persistPrefs();
  }
  function updateVolUI() {
    var v = prefs.muted ? 0 : prefs.volume;
    volFill.style.width = (v * 100).toFixed(1) + '%';
    volKnob.style.left = (v * 100).toFixed(1) + '%';
    volTrack.setAttribute('aria-valuenow', Math.round(v * 100));
    volTrack.setAttribute('aria-valuetext', Math.round(v * 100) + '%');
    var ic = $('btnMute').querySelector('i');
    ic.className = 'fa-solid ' + (v === 0 ? 'fa-volume-xmark' : (v < 0.5 ? 'fa-volume-low' : 'fa-volume-high'));
    $('btnMute').setAttribute('aria-label', v === 0 ? '取消静音' : '静音');
  }

            (tr.total ? Math.round(tr.done / tr.total * 100) : 0) + '%"></span></div>' +
          '<div class="v-mnote' + (tr.err ? ' err' : '') + '">' +
            esc(tr.err ? ('翻译失败：' + tr.err) : trProgressText()) + '</div>' +
          (tr.err ? '<button class="v-mi" type="button" role="menuitem" data-tr="retry">' +
            '<i class="fa-solid fa-rotate-right" aria-hidden="true"></i>重试翻译</button>' : '') +
          '<button class="v-mi" type="button" role="menuitem" data-tr="here">' +
            '<i class="fa-solid fa-crosshairs" aria-hidden="true"></i>只翻当前句</button>' +
          '<div class="v-menu-title">译文显示</div>' +
          Object.keys(TR_MODES).map(function (m) {
            return '<button class="v-mi" type="button" role="menuitemradio" data-trmode="' + m + '" aria-checked="' +
              (tr.mode === m ? 'true' : 'false') + '">' + TR_MODES[m] +
              '<span class="ck"><i class="fa-solid fa-check" aria-hidden="true"></i></span></button>';
          }).join('')
        : '<div class="v-mnote">先载入字幕文件才能翻译（B站 CC 字幕接口需要登录 Cookie，当前一般拿不到）</div>');
  }

  /* ---------------- 拖放 ---------------- */
  var mask = $('stageDrop'), dragDepth = 0;
  function showMask(on) { mask.classList.toggle('show', !!on); }
  app.addEventListener('dragenter', function (e) {
    e.preventDefault();
    dragDepth++;
    showMask(true);
    $('dropZone').classList.add('hover');
  });
  app.addEventListener('dragover', function (e) {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
  });
  app.addEventListener('dragleave', function (e) {
    dragDepth--;
    if (dragDepth <= 0) { dragDepth = 0; showMask(false); $('dropZone').classList.remove('hover'); }
  });
  app.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    showMask(false);
    $('dropZone').classList.remove('hover');
    handleDropped(e.dataTransfer && e.dataTransfer.files);
  });

  function handleDropped(files) {
    if (!files || !files.length) return;
    var vids = [], subs = [];
    Array.prototype.forEach.call(files, function (f) {
      if (/\.(srt|vtt)$/i.test(f.name) || /text\/vtt/.test(f.type || '')) subs.push(f);
      else vids.push(f);
    });
    if (subs.length && state.curId) loadSubFile(subs[0]);
    if (vids.length) {
      var first = addMany(vids);
      if (first) openItem(first.id);
    } else if (subs.length && !state.curId) {
      toast(T('sub_none'), true);
    }
  }

  /* ---------------- 网络地址 ---------------- */
  function openUrlModal() {
    var m = $('urlModal');
    m.hidden = false;
    var help = $('urlHelp');
    help.classList.remove('err');
    help.textContent = T('url_help');
    $('urlInput').value = '';
    requestAnimationFrame(function () { m.classList.add('show'); });
    setTimeout(function () { try { $('urlInput').focus(); } catch (e) {} }, 80);
  }
  function closeUrlModal() {
    var m = $('urlModal');
    m.classList.remove('show');
    setTimeout(function () { m.hidden = true; }, 280);
  }
  function submitUrl() {
    var v = $('urlInput').value.trim();
    if (!/^https?:\/\/\S+/i.test(v)) {
      var help = $('urlHelp');
      help.classList.add('err');
      help.textContent = T('url_bad');
      return;
    }
    var name = urlName(v);
    closeUrlModal();
    var it = addItem({ name: name, src: v, kind: 'url', path: '' });
    renderLib();
    openItem(it.id);
  }

  /* ---------------- 继续观看 ---------------- */
  function resumeRec(rec) {
    if (!rec) return;
    var it = itemById(rec.id);
    if (!it && rec.path) {
      for (var i = 0; i < items.length; i++) if (items[i].path === rec.path) { it = items[i]; break; }
    }
    if (!it && rec.src) {
      it = addItem({ name: rec.name, src: rec.src, kind: 'url', size: rec.size || 0 });
      renderLib();
    }
    if (it && it.src) { openItem(it.id); return; }
    needsReselect();
  }

  /* ---------------- 交互绑定 ---------------- */
  $('btnPlay').addEventListener('click', togglePlay);
  $('bigPlay').addEventListener('click', togglePlay);
  $('btnB10').addEventListener('click', function () { bumpTime(-10); });
  $('btnF10').addEventListener('click', function () { bumpTime(10); });
  $('btnRate').addEventListener('click', function () { toggleMenu('rateMenu', $('btnRate')); });
  $('btnSub').addEventListener('click', function () { toggleMenu('subMenu', $('btnSub')); });
  $('btnSubTop').addEventListener('click', function () { toggleMenu('subMenu', $('btnSubTop')); });
  $('btnShot').addEventListener('click', captureFrame);
  $('btnPip').addEventListener('click', togglePip);
  $('btnFs').addEventListener('click', toggleFs);
  $('btnFsTop').addEventListener('click', toggleFs);
  $('btnBack').addEventListener('click', goBack);
  $('plClose').addEventListener('click', function () { setPanel(false); });
  $('plClear').addEventListener('click', function () {
    queue = (state.curId && itemById(state.curId)) ? [state.curId] : [];
    persistQueue();
    renderPanel();
  });
  $('btnPanelTop').addEventListener('click', function () { setPanel(!panel.classList.contains('open')); });
  $('btnPanelSm').addEventListener('click', function () { setPanel(!panel.classList.contains('open')); });

  $('btnPick').addEventListener('click', function () { $('filePicker').click(); });
  $('btnUrl').addEventListener('click', openUrlModal);
  $('btnFilesApp').addEventListener('click', function () {
    if (N.openApp) { try { N.openApp('files'); return; } catch (e) {} }
    toast(T('open_files'), true);
  });
  $('errPick').addEventListener('click', function () { $('filePicker').click(); });
  $('errRetry').addEventListener('click', function () {
    var it = itemById(state.curId);
    if (it) loadSrc(it);
  });
  $('errOpen').addEventListener('click', function () {
    var it = itemById(state.curId);
    if (!it || !it.src) return;
    try {
      if (isHttp(it.src) && N.openUrl) { N.openUrl(it.src); return; }
      var w = window.open(it.src, '_blank');
      if (!w) toast(T('fs_fail'), true);
    } catch (e) { toast(T('fs_fail'), true); }
  });

  $('urlCancel').addEventListener('click', closeUrlModal);
  $('urlOk').addEventListener('click', submitUrl);
  $('urlInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitUrl(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeUrlModal(); }
    e.stopPropagation();
  });
  $('urlModal').addEventListener('pointerdown', function (e) {
    if (e.target === $('urlModal')) closeUrlModal();
  });

  $('filePicker').addEventListener('change', function () {
    var files = Array.prototype.slice.call(this.files || []);
    this.value = '';
    if (!files.length) return;
    var first = addMany(files);
    if (first) openItem(first.id);
  });
  $('subPicker').addEventListener('change', function () {
    var f = (this.files || [])[0];
    this.value = '';
    if (f) loadSubFile(f);
  });

  $('search').addEventListener('input', function () {
    renderLib();
    updateTop();
  });
  $('search').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { this.value = ''; this.blur(); renderLib(); updateTop(); }
    e.stopPropagation();
  });
  var chips = document.querySelectorAll('.v-chip');
  Array.prototype.forEach.call(chips, function (c) {
    c.addEventListener('click', function () {
      prefs.filter = c.getAttribute('data-filter');
      persistPrefs();
      Array.prototype.forEach.call(chips, function (x) {
        x.setAttribute('aria-pressed', x === c ? 'true' : 'false');
      });
      renderLib();
      updateTop();
    });
  });
  $('btnViewList').addEventListener('click', function () {
    prefs.layout = 'list'; persistPrefs();
    $('btnViewList').setAttribute('aria-pressed', 'true');
    $('btnViewGrid').setAttribute('aria-pressed', 'false');
    renderLib();
  });
  $('btnViewGrid').addEventListener('click', function () {
    prefs.layout = 'grid'; persistPrefs();
    $('btnViewList').setAttribute('aria-pressed', 'false');
    $('btnViewGrid').setAttribute('aria-pressed', 'true');
    renderLib();
  });

  libBody.addEventListener('click', function (e) {
    var b = e.target.closest('[data-id]');
    if (b) openItem(b.getAttribute('data-id'));
  });
  contVal.addEventListener('click', function (e) {
    var b = e.target.closest('[data-rid]');
    if (!b) return;
    resumeRec(getRec(b.getAttribute('data-rid')));
  });

  $('rateMenu').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rate]');
    if (!b) return;
    setRate(parseFloat(b.getAttribute('data-rate')));
    closeMenus();
    showUI();
  });
  $('subMenu').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sub],[data-size],[data-off],[data-tr],[data-trmode]');
    if (!b || b.disabled) return;
    if (b.hasAttribute('data-tr')) {
      var act = b.getAttribute('data-tr');
      if (act === 'start' || act === 'retry') { tr.err = ''; translateAll(); }
      else if (act === 'here') translateCurrent();
      buildSubMenu();
      return;
    }
    if (b.hasAttribute('data-trmode')) {
      setTrMode(b.getAttribute('data-trmode'));
      if (!tr.on) {
        if (tr.done > 0) {
          tr.on = true; prefs.trOn = true; persistPrefs();
          subLayer.setAttribute('data-tr', tr.mode);
          tr.last = null; renderCue();
        } else {
          toast('先点「翻译整片字幕」或「只翻当前句」', true);
        }
      }
      buildSubMenu();
      return;
    }
    if (b.hasAttribute('data-off')) {
      if (!sub.cues.length) { toast(T('sub_none'), true); return; }
      var d = b.getAttribute('data-off');
      sub.off = (d === 'reset') ? 0 : Math.round(((sub.off || 0) + parseFloat(d)) * 10) / 10;
      sub.last = null;
      rememberSub();
      renderCue();
      buildSubMenu();
      toast(T('sub_sync_toast', { v: (sub.off > 0 ? '+' : '') + sub.off.toFixed(1) + 's' }));
      return;
    }
    if (b.hasAttribute('data-size')) {
      prefs.subSize = b.getAttribute('data-size');
      persistPrefs();
      applySubSize();
      buildSubMenu();
      closeMenus();
      toast(T('sub_size') + ' · ' + T('size_' + prefs.subSize));
      return;
    }
    if (b.getAttribute('data-sub') === 'open') {
      closeMenus();
      $('subPicker').click();
    } else if (b.getAttribute('data-sub') === 'forget') {
      clearSubs();
      sub.off = 0;
      rememberSub();
      updateSubButtons();
      buildSubMenu();
      closeMenus();
      toast(T('sub_forgot'));
    } else {
      toggleSubs();
      buildSubMenu();
      closeMenus();
    }
  });

  /* 播放列表面板 */
  var dragId = '';
  plList.addEventListener('click', function (e) {
    var rm = e.target.closest('[data-rm]');
    if (rm) {
      var id = rm.getAttribute('data-rm');
      queue = queue.filter(function (x) { return x !== id; });
      persistQueue();
      renderPanel();
      toast(T('removed'));
      return;
    }
    var pb = e.target.closest('[data-play]');
    if (pb) openItem(pb.getAttribute('data-play'));
  });
  plList.addEventListener('dragstart', function (e) {
    var el = e.target.closest('.v-pl-item');
    if (!el) return;
    dragId = el.getAttribute('data-id');
    el.classList.add('dragging');
    if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); }
  });
  plList.addEventListener('dragover', function (e) {
    if (!dragId) return;
    e.preventDefault();
    var el = e.target.closest('.v-pl-item');
    Array.prototype.forEach.call(plList.children, function (x) { x.classList.remove('drop-before'); });
    if (el && el.getAttribute('data-id') !== dragId) el.classList.add('drop-before');
  });
  plList.addEventListener('drop', function (e) {
    e.preventDefault();
    var el = e.target.closest('.v-pl-item');
    if (!el || !dragId) return;
    var before = el.getAttribute('data-id');
    if (before === dragId) return;
    var from = queue.indexOf(dragId);
    if (from < 0) return;
    queue.splice(from, 1);
    var to = queue.indexOf(before);
    queue.splice(to < 0 ? queue.length : to, 0, dragId);
    dragId = '';
    persistQueue();
    renderPanel();
  });
  plList.addEventListener('dragend', function () {
    dragId = '';
    Array.prototype.forEach.call(plList.children, function (x) {
      x.classList.remove('dragging'); x.classList.remove('drop-before');
    });
  });

  /* 舞台点按 / 双指边缘返回 */
  stage.addEventListener('click', function (e) {
    if (e.target === stage || e.target === video) togglePlay();
  });
  stage.addEventListener('dblclick', function (e) {
    if (e.target === stage || e.target === video) toggleFs();
  });
  stage.addEventListener('pointermove', function () { showUI(); });
  var edgeAcc = 0;
  stage.addEventListener('wheel', function (e) {
    if (!state.curId) return;
    if (e.clientX < 40 && e.deltaX > 2) {
      edgeAcc += e.deltaX;
      if (edgeAcc > 110) {
        edgeAcc = 0;
        if (isFs()) toggleFs();
        else showLibrary();
      }
    } else { edgeAcc = 0; }
  }, { passive: true });

  window.addEventListener('online', function () {
    var it = itemById(state.curId);
    if (it && it.kind === 'url' && errCard.classList.contains('show')) {
      hideError();
      loadSrc(it);
    }
  });
  window.addEventListener('offline', function () {
    var it = itemById(state.curId);
    if (it && it.kind === 'url') showError(T('offline_t'), T('offline_d'));
  });

  /* ---------------- 键盘 ---------------- */
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('input, textarea, select')) return;
    var k = e.key;

    if (menuOpen()) {
      if (k === 'Escape') { e.preventDefault(); closeMenus(); showUI(); return; }
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault();
        var ms = [].slice.call(document.querySelector('.v-menu.open').querySelectorAll('.v-mi'));
        var i = ms.indexOf(document.activeElement);
        var n = (i + (k === 'ArrowDown' ? 1 : -1) + ms.length) % ms.length;
        ms[n].focus();
        return;
      }
    }
    if (k === 'Escape') {
      if (!$('urlModal').hidden) { closeUrlModal(); return; }
      if (panel.classList.contains('open')) { setPanel(false); return; }
      if ($('epBar').classList.contains('open')) { closeEp(); return; }
      if (state.view === 'player' || state.view === 'detail') { goBack(); return; }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) {
      if ((e.ctrlKey || e.metaKey) && (k === 'o' || k === 'O') && state.view === 'player') {
        e.preventDefault();
        $('filePicker').click();
      }
      return;
    }
    if (state.view !== 'player') {
      if (state.view === 'home' || state.view === 'detail') return;
      if (k === 'o' || k === 'O') { e.preventDefault(); $('filePicker').click(); }
      return;
    }
    if (t && t.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return;

    switch (k) {
      case ' ': case 'k': case 'K': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': e.preventDefault(); bumpTime(e.shiftKey ? -30 : -5); break;
      case 'ArrowRight': e.preventDefault(); bumpTime(e.shiftKey ? 30 : 5); break;
      case 'ArrowUp': e.preventDefault(); applyVolume(prefs.volume + 0.05, true); showUI(); break;
      case 'ArrowDown': e.preventDefault(); applyVolume(prefs.volume - 0.05, true); showUI(); break;
      case 'm': case 'M':
        e.preventDefault();
        $('btnMute').click();
        break;
      case 'f': case 'F': e.preventDefault(); toggleFs(); break;
      case 'p': case 'P': e.preventDefault(); togglePip(); break;
      case 's': case 'S': e.preventDefault(); captureFrame(); break;
      case 'c': case 'C': e.preventDefault(); toggleSubs(); break;
      case '[': e.preventDefault(); stepRate(-1); break;
      case ']': e.preventDefault(); stepRate(1); break;
      case 'l': case 'L': e.preventDefault(); setPanel(!panel.classList.contains('open')); break;
      default: break;
    }
  });

  /* ---------------- 宿主集成 ---------------- */
  window.addEventListener('storage', function (e) {
    if (e.key !== K_CMD || !e.newValue) return;
    var cmd = null;
    try { cmd = JSON.parse(e.newValue); } catch (err) { return; }
    if (!cmd) return;
    if (cmd.act === 'toggle') togglePlay();
    else if (cmd.act === 'next') nextItem(false);
    else if (cmd.act === 'prev') prevItem();
    else if (cmd.act === 'fs') toggleFs();
  });

  // 宿主关闭/最小化窗口时，通过 media-pause 消息立即暂停并释放
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d && d.__nexusEvt && d.name === 'media-pause') leaveApp(true);
  });

  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.setActionHandler('play', function () { togglePlay(); });
      navigator.mediaSession.setActionHandler('pause', function () { video.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function () { bumpTime(-10); });
      navigator.mediaSession.setActionHandler('seekforward', function () { bumpTime(10); });
      navigator.mediaSession.setActionHandler('nexttrack', function () { nextItem(false); });
    } catch (e) {}
  }

  /* ---------------- 文件系统扫描 ---------------- */
  function scanFS() {
    if (!N.getUserLS) return;
    var p;
    try { p = N.getUserLS('filesystem'); } catch (e) { return; }
    if (!p || !p.then) return;
    p.then(function (fs) {
      if (!fs) return;
      var n = walkNode(fs['C'] || fs, 'C:/', 0);
      state.fsScanned = true;
      state.scanCount = n;
      renderLib();
      restoreQueue();
      updateTop();
    }).catch(function () {});
  }
  function walkNode(node, path, depth) {
    if (!node || typeof node !== 'object' || depth > 14) return 0;
    var count = 0;
    if (node.type === 'folder' || node.children) {
      var ch = node.children || {};
      Object.keys(ch).forEach(function (k) {
        count += walkNode(ch[k], path + k + '/', depth + 1);
      });
      return count;
    }
    var name = node.name || path.split('/').filter(Boolean).pop() || '未命名视频';
    var content = node.content || node.data || '';
    if (typeof content === 'string' && (/^data:/.test(content) || isHttp(content)) && isVideoName(name)) {
      addItem({ name: name, path: path.replace(/\/$/, ''), src: content, kind: 'fs', size: node.size || 0 });
      count++;
    }
    return count;
  }

  function loadUserProgress() {
    if (!N.getUserLS) return;
    var p;
    try { p = N.getUserLS(K_PROG); } catch (e) { return; }
    if (!p || !p.then) return;
    p.then(function (v) {
      if (!Array.isArray(v)) return;
      v.forEach(function (r) {
        if (!r || !r.id) return;
        var ex = getRec(r.id);
        if (ex && (ex.at || 0) >= (r.at || 0)) return;
        upsertRec(r);
      });
      /* 网络视频重启后要还能在列表里点——以前只留在「继续观看」条上 */
      progress.forEach(function (r) {
        if (!r || !r.id || r.kind !== 'url' || !isHttp(r.src)) return;
        if (itemById(r.id)) return;
        addItem({ name: r.name || urlName(r.src), src: r.src, kind: 'url', path: '', dur: r.dur || 0 });
      });
      persistProgress();
      renderLib();
      renderPanel();
      restoreQueue();
      updateTop();
    }).catch(function () {});
  }

  /* ---------------- 主题 / 启动 ---------------- */
  function applyTheme(dark) {
    document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
    document.body.classList.toggle('dark-mode', !!dark);
  }
  function themeFromParam() {
    try {
      var q = new URLSearchParams(location.search).get('theme');
      if (q === 'dark' || q === 'light') return q;
    } catch (e) {}
    return '';
  }
  function openFromParam() {
    try {
      var v = new URLSearchParams(location.search).get('open') || '';
      if (/^https?:\/\/\S+/i.test(v)) return v;
    } catch (e) {}
    return '';
  }
  function urlName(v) {
    try {
      var s = v.split(/[?#]/)[0].split('/').pop();
      return (s && decodeURIComponent(s)) || v;
    } catch (e) { return v; }
  }

  var themeParam = themeFromParam();
  applyTheme(themeParam === 'dark');

  applySubSize();
  video.volume = prefs.volume;
  video.muted = !!prefs.muted;
  video.playbackRate = prefs.rate || 1;
  applyVolume(prefs.volume, false);
  updateRateUI();
  updateSubButtons();
  $('btnViewList').setAttribute('aria-pressed', prefs.layout === 'list' ? 'true' : 'false');
  $('btnViewGrid').setAttribute('aria-pressed', prefs.layout === 'grid' ? 'true' : 'false');
  Array.prototype.forEach.call(chips, function (x) {
    x.setAttribute('aria-pressed', x.getAttribute('data-filter') === prefs.filter ? 'true' : 'false');
  });
  if (prefs.panel) setPanel(true);
  if (!pipSupported()) $('btnPip').hidden = true;
  renderLib();
  renderPanel();
  showHome();
  setupMediaSession();
  stopHostBackground();
  watchLeave();

  var deepOpen = openFromParam();
  if (deepOpen) {
    var deepItem = addItem({ name: urlName(deepOpen), src: deepOpen, kind: 'url', path: '' });
    renderLib();
    openItem(deepItem.id, { autoplay: false });
  }

  var hostReady = false;
  function onHostReady() {
    if (hostReady) return;
    hostReady = true;
    loadUserProgress();
    scanFS();
  }
  if (N.ready) {
    N.ready(function (ctx) {
      if (themeParam) applyTheme(themeParam === 'dark');
      else if (ctx && typeof ctx.dark === 'boolean') applyTheme(ctx.dark);
      onHostReady();
    });
  } else {
    onHostReady();
  }
  setTimeout(function () { if (!hostReady) onHostReady(); }, 2800);

})();
</script>

</body>
</html>
