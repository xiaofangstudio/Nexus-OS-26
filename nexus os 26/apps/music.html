<!DOCTYPE html>
<html lang="zh-CN" data-ui="liquid" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music · Nexus OS 26</title>
<link rel="stylesheet" href="../vendor/fontawesome/all.min.css">
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/glass.css">
<link rel="stylesheet" href="../ui/n26-ui.css?v=2976">
<script src="_bridge.js"></script>
<script src="_app.js?v=2.9.97"></script>
<!-- v2.9.96：同步挂载 DOM 保持层，音乐搜索/切页零刷新感（_app.js 会自动跳过重复注入） -->
<script src="../ui/n26-dom-keep.js?v=dk1"></script>
<script src="../ui/n26-ui.js?v=2978"></script>
<style>
/* ============================================================
   Nexus OS 26 · 音乐（apps/music.html 自有样式）
   - 只消费 tokens / 个性化玻璃变量，不改共享 ui/n26-*.css
   - 玻璃系数：0.8（侧栏/播放条/抽屉），随个性化滑杆实时变化
   ============================================================ */
:root{
  --m-coef: 0.8;
  --m-a: calc(var(--n26-glass-alpha, .55) * var(--n26-alpha-k, 1) * var(--m-coef));
  --m-blur: calc(var(--n26-blur, 18px) * var(--n26-k, 1) * var(--m-coef));
  --m-sat: calc(var(--n26-glass-sat, 148%) * var(--n26-sat-k, 1));
  --m-hi: calc(var(--n26-glass-hi, .35) * .62);
  --m-line: rgba(28, 40, 62, .10);
  --m-line-soft: rgba(28, 40, 62, .06);
  --m-hover: rgba(28, 40, 62, .055);
  --m-card: rgba(255, 255, 255, .58);
  --m-card-line: rgba(255, 255, 255, .70);
  --m-shadow: 0 1px 2px rgba(18, 30, 52, .05), 0 10px 30px rgba(18, 30, 52, .07);
  --m-shadow-lift: 0 18px 46px rgba(18, 30, 52, .16), 0 2px 8px rgba(18, 30, 52, .06);
  /* 音乐品牌色：薄荷绿 → 青绿（低饱和、高明度，只用于小面积强调）
     浅色底 #0D6B57 ≈ 6.4:1（文字）/ 绿底上用深色字 #053B31 ≈ 6.4:1 */
  --m-accent: #57c3ae;
  --m-accent-2: #a9e8d9;
  --m-grad: linear-gradient(135deg, #b3ebdc 0%, #57c3ae 100%);
  --m-accent-text: #0d6b57;
  --m-accent-soft: rgba(87, 195, 174, .14);
  --m-accent-ring: rgba(87, 195, 174, .34);
  --m-glow: rgba(87, 195, 174, .22);
  --m-on-accent: #053b31;
  --m-eq: var(--m-accent-text);
}
body.dark-mode{
  --m-line: rgba(255, 255, 255, .10);
  --m-line-soft: rgba(255, 255, 255, .06);
  --m-hover: rgba(255, 255, 255, .07);
  --m-card: rgba(255, 255, 255, .05);
  --m-card-line: rgba(255, 255, 255, .09);
  --m-shadow: 0 1px 2px rgba(0, 0, 0, .28), 0 12px 30px rgba(0, 0, 0, .26);
  --m-shadow-lift: 0 22px 54px rgba(0, 0, 0, .48), 0 2px 8px rgba(0, 0, 0, .3);
  /* 深色：绿得更淡一档，避免在深底上发灰或发荧光（#93DCCB ≈ 10.9:1 on #131519） */
  --m-accent: #63c9b6;
  --m-accent-2: #9ce2d3;
  --m-grad: linear-gradient(135deg, #9ce2d3 0%, #54c0ad 100%);
  --m-accent-text: #93dccb;
  --m-accent-soft: rgba(131, 220, 203, .16);
  --m-accent-ring: rgba(131, 220, 203, .32);
  --m-glow: rgba(147, 220, 203, .18);
  --m-on-accent: #053b31;
  --m-eq: var(--m-accent-text);
}

*{box-sizing:border-box}
html, body{height:100%; margin:0}
body{
  font-family: var(--font-sans, "SF Pro Text", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif);
  font-size: var(--fs-14, 14px);
  color: var(--text-1, #1b1f26);
  background: var(--bg, #eef0f3);
  overflow: hidden;
  position: relative; /* 全屏播放层用 absolute inset:0 相对应用根，不用 fixed */
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
body.dark-mode{ background: #131519; color: var(--text-1, #e8ebf0); }
button{font-family:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--m-accent, #57c3ae); outline-offset:2px; border-radius:6px}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,132,150,.30); border-radius:8px; border:3px solid transparent; background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,132,150,.46); background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

#app{height:100%; display:flex; flex-direction:column; min-height:0}
#shellMount{flex:1 1 0; min-height:0; padding:10px 10px 0; display:flex}
#shellMount > .n26ui-shell{flex:1 1 auto; height:100%; min-height:0}

/* ---------- 侧栏：76px 轨道 + 玻璃随滑杆 ---------- */
.n26ui-sidebar{
  background: rgba(255, 255, 255, calc(var(--m-a) * .94));
  border: 1px solid rgba(255, 255, 255, .58);
  -webkit-backdrop-filter: blur(var(--m-blur)) saturate(var(--m-sat)) var(--n26-grain-fn, opacity(1));
  backdrop-filter: blur(var(--m-blur)) saturate(var(--m-sat)) var(--n26-grain-fn, opacity(1));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, var(--m-hi)), 0 8px 24px rgba(18, 30, 52, .08);
}
body.dark-mode .n26ui-sidebar{
  background: rgba(32, 36, 44, calc(var(--m-a) * .86));
  border-color: rgba(255, 255, 255, .10);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, var(--m-hi)), 0 10px 26px rgba(0, 0, 0, .32);
}
body.mat-solid .n26ui-sidebar,
body.perf-mode .n26ui-sidebar{
  -webkit-backdrop-filter: none; backdrop-filter: none;
  background: rgba(247, 248, 250, .98);
}
body.dark-mode.mat-solid .n26ui-sidebar,
body.dark-mode.perf-mode .n26ui-sidebar{ background: rgba(32, 36, 44, .98); }

/* 当前 Tab 用音乐自己的品牌色（改的是变量，不覆写共享规则） */
.n26ui-shell{ gap: 10px; }
.n26ui-sidebar{ --n26dock-accent: var(--m-accent-text); }
.n26ui-sidebar .n26ui-tab.active{ color: var(--m-accent-text); }
.n26ui-sidebar .n26ui-indicator{ background: var(--m-accent-soft); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.n26ui-sidebar .n26ui-tab:focus-visible{ outline-color: var(--m-accent-ring); }

/* ---------- 内容区 ---------- */
.n26ui-content{ overscroll-behavior: contain; }
.n26ui-panel{ height: auto; }
.page{ display:flex; flex-direction:column; gap: var(--sp-5, 20px); padding-bottom: 8px; animation: pageIn 220ms var(--ease-out-quart, cubic-bezier(.25,1,.5,1)) both; }
@keyframes pageIn{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
body.perf-mode .page, body.reduce-motion .page{ animation: none; }

.pg-head{ display:flex; align-items:flex-end; gap: var(--sp-3, 12px); flex-wrap: wrap; }
.pg-head .txt{ min-width: 0; }
.pg-title{ font-size: var(--fs-18, 18px); font-weight: 650; line-height: 1.3; letter-spacing: -.2px; margin: 0; }
.pg-sub{ font-size: var(--fs-12, 12px); color: var(--text-2, #5b6472); line-height: 1.55; margin-top: 4px; }
.pg-tools{ margin-left: auto; display:flex; align-items:center; gap: var(--sp-2, 8px); }
.sec-head{ display:flex; align-items:center; gap: var(--sp-2, 8px); margin-bottom: var(--sp-3, 12px); }
.sec-title{ font-size: var(--fs-14, 14px); font-weight: 650; letter-spacing: -.1px; margin: 0; }
.sec-more{ margin-left:auto; font-size: var(--fs-11, 11px); color: var(--text-3, #8a93a0); background:none; border:0; cursor:pointer; padding:4px 6px; border-radius: 6px; }
.sec-more:hover{ color: var(--text-1, #1b1f26); background: var(--m-hover); }

/* 图标按钮（播放器/行内动作，32px 圆形，语义化 aria-label） */
.ico{
  width:32px; height:32px; flex:none; border-radius:50%; border:0; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  background: transparent; color: var(--text-2, #5b6472);
  font-size: 13px; cursor: pointer;
  transition: background var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1)),
              color var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1)),
              transform var(--dur-instant, 100ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1));
}
.ico:hover{ background: var(--m-hover); color: var(--text-1, #1b1f26); }
.ico:active{ transform: scale(.92); }
.ico.on{ color: var(--m-accent-text); }
.ico[disabled]{ opacity:.35; cursor: default; }
.ico.sm{ width:26px; height:26px; font-size:11px; }

/* ---------- 搜索框 ---------- */
.search{ position:relative; flex: 1 1 260px; max-width: 440px; }
.search input{
  width:100%; padding:10px 14px;
  border-radius: var(--r-sm, 10px); border:1px solid var(--m-line);
  background: var(--m-card); color: var(--text-1, #1b1f26);
  font-size: var(--fs-13, 13px); outline:none;
  transition: border-color var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1)),
              box-shadow var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1));
}
.search input::placeholder{ color: var(--text-3, #8a93a0); }
.search input:focus{ border-color: var(--m-accent); box-shadow: 0 0 0 3px var(--m-accent-ring); }

.chips{ display:flex; flex-wrap:wrap; gap: var(--sp-2, 8px); }
.chip{
  height:28px; padding:0 12px; border-radius: var(--r-full, 999px);
  border:1px solid var(--m-line); background: var(--m-card);
  color: var(--text-2, #5b6472); font-size: var(--fs-11, 11px); cursor:pointer;
  transition: color var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1)),
              border-color var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1));
}
.chip:hover{ color: var(--text-1, #1b1f26); border-color: var(--m-accent-ring); }

/* ---------- 继续听 / 欢迎 ---------- */
.hero{
  display:flex; align-items:center; gap: var(--sp-5, 20px);
  padding: var(--sp-4, 16px); border-radius: var(--r-lg, 16px);
  background: var(--m-card); border:1px solid var(--m-card-line); box-shadow: var(--m-shadow);
}
.hero-cover{
  width: 116px; height: 116px; flex:none; border-radius: var(--r-md, 12px); overflow:hidden;
  background: rgba(120,132,150,.16); cursor:pointer; position:relative;
}
.hero-cover img{ width:100%; height:100%; object-fit:cover; }
.hero-meta{ flex:1 1 auto; min-width:0; }
.hero-kicker{ font-size: var(--fs-11, 11px); font-weight:600; letter-spacing:.4px; text-transform:uppercase; color: var(--m-accent-text); }
.hero-name{ font-size: var(--fs-22, 22px); font-weight:600; letter-spacing:-.4px; line-height:1.25; margin:6px 0 4px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hero-sub{ font-size: var(--fs-13, 13px); color: var(--text-2, #5b6472); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hero-prog{ margin-top: 12px; display:flex; align-items:center; gap:10px; max-width: 420px; }
.hero-bar{ flex:1 1 auto; height:4px; border-radius:999px; background: rgba(120,132,150,.22); overflow:hidden; }
.hero-bar > i{ display:block; height:100%; border-radius:999px;
  background: linear-gradient(90deg, var(--m-accent-2) 0%, var(--m-accent) 100%); }
.hero-time{ font-size: var(--fs-11, 11px); color: var(--text-3, #8a93a0); font-variant-numeric: tabular-nums; }
.hero-acts{ display:flex; align-items:center; gap: var(--sp-2, 8px); flex:none; }
.hero-hint{ font-size: var(--fs-12, 12px); color: var(--text-2, #5b6472); line-height:1.6; max-width: 520px; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height: 34px; padding: 0 16px; border-radius: var(--r-sm, 10px);
  border:1px solid var(--m-line); background: var(--m-card); color: var(--text-1, #1b1f26);
  font-size: var(--fs-13, 13px); font-weight:600; cursor:pointer;
  transition: background var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1)),
              border-color var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1)),
              transform var(--dur-instant, 100ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1));
}
.btn:hover{ background: var(--m-hover); }
.btn:active{ transform: scale(.97); }
.btn.primary{ background: var(--m-grad); border-color: transparent; color: var(--m-on-accent); }
.btn.primary:hover{ filter: brightness(1.04) saturate(.96); background: var(--m-grad); }
.btn.ghost{ background: transparent; }
.btn.sm{ height:28px; padding:0 12px; font-size: var(--fs-12, 12px); }
.btn.icon-btn{ width:34px; padding:0; flex:none; }
.btn.sm.icon-btn{ width:28px; }

/* ---------- 网格卡片（歌单 / 推荐） ---------- */
.grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: var(--sp-3, 12px); }
.card{
  display:flex; flex-direction:column; gap: var(--sp-2, 8px);
  padding: var(--sp-2, 8px); border-radius: var(--r-md, 12px);
  background: var(--m-card); border:1px solid var(--m-card-line);
  cursor:pointer; text-align:left; color:inherit; font:inherit;
  transition: transform var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1)),
              box-shadow var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1));
}
.card:hover{ transform: translateY(-2px); box-shadow: var(--m-shadow); }
.card:active{ transform: none; }
.card-cover{ position:relative; aspect-ratio:1/1; border-radius: var(--r-sm, 10px); overflow:hidden; background: rgba(120,132,150,.14); }
.card-cover img{ width:100%; height:100%; object-fit:cover; }
.card-cover .mini-play{
  position:absolute; right:8px; bottom:8px; width:30px; height:30px; border:0;
  display:grid; place-items:center; border-radius:50%; font-size:11px; cursor:pointer;
  background: rgba(255,255,255,.88); color:#1b1f26; box-shadow: 0 4px 12px rgba(10,20,40,.22);
  opacity:0; transform: translateY(4px) scale(.94); transition: opacity var(--dur-fast,160ms), transform var(--dur-fast,160ms);
}
.card:hover .mini-play{ opacity:1; transform:none; }
.card-name{ font-size: var(--fs-13, 13px); font-weight:600; line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-sub{ font-size: var(--fs-11, 11px); color: var(--text-3, #8a93a0); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- 列表行 ---------- */
.rows{ display:flex; flex-direction:column; gap:1px; }
.row{
  display:flex; align-items:center; gap: var(--sp-3, 12px);
  padding: 7px var(--sp-3, 12px); border-radius: var(--r-sm, 10px);
  cursor:pointer; position:relative;
  transition: background var(--dur-fast, 160ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1));
}
.row:hover{ background: var(--m-hover); }
.row.cur{ background: var(--m-accent-soft); }
.row.drag{ opacity:.45; }
.row.over{ box-shadow: inset 0 2px 0 var(--m-accent); }
.row-idx{ width:22px; flex:none; text-align:center; font-size: var(--fs-11, 11px); color: var(--text-3, #8a93a0); font-variant-numeric: tabular-nums; }
.row-idx .eq{ font-size:11px; color: var(--m-eq); }
.row-cover{ width:40px; height:40px; flex:none; border-radius: var(--r-xs, 6px); overflow:hidden; background: rgba(120,132,150,.16); }
.row-cover img{ width:100%; height:100%; object-fit:cover; }
.row-meta{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.row-name{ display:block; font-size: var(--fs-13, 13px); font-weight:500; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row.cur .row-name{ color: var(--m-eq); font-weight:600; }
.row-sub{ display:block; font-size: var(--fs-11, 11px); color: var(--text-2, #5b6472); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* 行内的歌手 / 专辑入口：独立命中区，不触发整行播放 */
.row-inline{ color:inherit; border-radius:4px; cursor:pointer; }
.row-inline:hover{ color: var(--m-accent-text, #0d6b57); text-decoration: underline; text-underline-offset:2px; }
.row-inline:focus-visible{ outline:2px solid var(--m-accent); outline-offset:1px; }
.row-dur{ flex:none; width:42px; text-align:right; font-size: var(--fs-11, 11px); color: var(--text-2, #5b6472); font-variant-numeric: tabular-nums; }
/* 信息流：触底加载的骨架与结束提示 */
.feed-foot{ display:flex; align-items:center; justify-content:center; gap:8px; padding:14px 0 8px; font-size: var(--fs-12,12px); color: var(--text-2,#5b6472); }
.feed-foot i{ font-size: 12px; }
.feed-end{ margin-top:6px; padding-top:12px; border-top:1px dashed var(--m-line-soft); color: var(--text-3,#8a93a0); }
.feed-end i{ color: var(--m-accent-text); }
.feed-loading{ padding-top:2px; }
.feed-loading .rows{ margin-top:0; }
.row-act{ flex:none; display:flex; gap:2px; opacity:0; pointer-events:none; transition: opacity var(--dur-fast, 160ms); }
.row:hover .row-act, .row.cur .row-act, .row:focus-within .row-act{ opacity:1; pointer-events:auto; }
.row .ico{ color: var(--text-2, #5b6472); }
.tag{
  flex:none; font-size:10px; line-height:1; padding:3px 6px; border-radius: var(--r-full,999px);
  border:1px solid rgba(232,144,42,.45); color:#b97213; background: rgba(232,144,42,.08);
}
body.dark-mode .tag{ color:#e5a852; border-color: rgba(229,168,82,.4); }
.tag.tag-trial{ color:#0d6b57; border-color: rgba(87,195,174,.55); background: rgba(87,195,174,.14); }
body.dark-mode .tag.tag-trial{ color:#93dccb; border-color: rgba(147,220,203,.45); background: rgba(147,220,203,.12); }
.pl-trial{ display:none; margin-top:7px; }
.pl-trial.on{ display:block; }

/* 封面占位 */
.cph{ width:100%; height:100%; display:grid; place-items:center; background: rgba(120,132,150,.14); color: var(--text-3, #8a93a0); font-size: 15px; }
/* 封面容器：占位块在下、图片盖在上，加载失败也不会留灰块 */
.cover-wrap{ position:relative; display:block; width:100%; height:100%; overflow:hidden; border-radius:inherit; }
.cover-wrap img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

/* ---------- 空状态 / 骨架 ---------- */
.empty{ display:flex; flex-direction:column; align-items:center; gap: var(--sp-2, 8px); padding: 46px 20px; text-align:center; }
.empty > i{ font-size: 34px; opacity:.28; margin-bottom: 4px; }
.empty .t{ font-size: var(--fs-14, 14px); font-weight:600; }
.empty .d{ font-size: var(--fs-12, 12px); color: var(--text-2, #5b6472); line-height:1.65; max-width: 380px; }
.empty .acts{ margin-top: var(--sp-2, 8px); display:flex; gap: var(--sp-2, 8px); }
.sk-row{ display:flex; align-items:center; gap:12px; padding:7px 12px; }
.sk{ position:relative; overflow:hidden; background: rgba(120,132,150,.13); border-radius: 6px; }
.sk::after{
  content:''; position:absolute; inset:0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
  transform: translateX(-100%); animation: skShimmer 1.6s cubic-bezier(.4,0,.2,1) infinite;
}
body.dark-mode .sk::after{ background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent); }
@keyframes skShimmer{ to{ transform: translateX(100%) } }
body.perf-mode .sk::after{ animation: none; }
.sk-line{ height:10px; border-radius:4px; }

/* ---------- 歌单详情头 ---------- */
.pl-hero{ display:flex; gap: var(--sp-5, 20px); align-items:center; padding: var(--sp-4, 16px); border-radius: var(--r-lg, 16px); background: var(--m-card); border:1px solid var(--m-card-line); box-shadow: var(--m-shadow); }
.pl-hero .cov{ width:128px; height:128px; flex:none; border-radius: var(--r-md, 12px); overflow:hidden; background: rgba(120,132,150,.14); }
.pl-hero .name{ font-size: var(--fs-22, 22px); font-weight:600; letter-spacing:-.4px; margin:0 0 6px; }
.pl-hero .sub{ font-size: var(--fs-12, 12px); color: var(--text-2, #5b6472); }
.pl-hero .acts{ display:flex; gap: var(--sp-2, 8px); margin-top: var(--sp-3, 12px); }

/* ---------- 在线状态提示 ---------- */
.notice{
  display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius: var(--r-sm,10px);
  font-size: var(--fs-12, 12px); color:#a4600d; background: rgba(240,170,60,.12); border:1px solid rgba(240,170,60,.3);
}
body.dark-mode .notice{ color:#e7b266; background: rgba(240,170,60,.10); }
.notice .btn{ margin-left:auto; height:24px; padding:0 10px; font-size:11px; }

/* ============================================================
   底部迷你播放条（全屏播放器的 morph 起点）
   ============================================================ */
#bar{
  flex:none; position:relative; display:flex; align-items:center; gap: var(--sp-3, 12px);
  height: 76px; margin: 10px; padding: 0 var(--sp-4, 16px);
  border-radius: var(--r-md, 14px);
  background: rgba(255,255,255, calc(var(--m-a) * .94));
  border:1px solid rgba(255,255,255,.58);
  -webkit-backdrop-filter: blur(var(--m-blur)) saturate(var(--m-sat)) var(--n26-grain-fn, opacity(1));
  backdrop-filter: blur(var(--m-blur)) saturate(var(--m-sat)) var(--n26-grain-fn, opacity(1));
  box-shadow: inset 0 1px 0 rgba(255,255,255,var(--m-hi)), var(--m-shadow);
  transform: translateZ(0);
  transition: opacity 220ms var(--ease-out-quart, cubic-bezier(.25,1,.5,1));
}
body.dark-mode #bar{
  background: rgba(30,34,42, calc(var(--m-a) * .88));
  border-color: rgba(255,255,255,.09);
  box-shadow: inset 0 1px 0 rgba(255,255,255,var(--m-hi)), var(--m-shadow);
}
body.mat-solid #bar, body.perf-mode #bar{ -webkit-backdrop-filter:none; backdrop-filter:none; background: rgba(248,249,251,.97); }
body.dark-mode.mat-solid #bar, body.dark-mode.perf-mode #bar{ background: rgba(30,34,42,.97); }
body.player-open #bar #barOpen, body.player-open #bar .bar-ctrl, body.player-open #bar .bar-seek, body.player-open #bar .bar-side{ pointer-events:none; }

.bar-left{ display:flex; align-items:center; gap: var(--sp-3, 12px); min-width:0; flex: 0 1 268px; }
.bar-open{
  display:flex; align-items:center; gap: var(--sp-3, 12px); min-width:0; flex:1 1 auto;
  background:none; border:0; padding:0; text-align:left; color:inherit; cursor:pointer; border-radius: var(--r-sm, 10px);
}
.bar-cover{
  width:52px; height:52px; flex:none; border-radius: var(--r-sm, 9px); overflow:hidden;
  background: rgba(120,132,150,.16); position:relative;
  transition: transform 380ms var(--ease-out-expo, cubic-bezier(.16,1,.3,1)), opacity 220ms;
}
.bar-cover img{ width:100%; height:100%; object-fit:cover; }
.bar-open:hover .bar-cover{ transform: scale(1.03); }
.bar-meta{ min-width:0; display:flex; flex-direction:column; gap:3px; }
.bar-name{ font-size: var(--fs-13, 13px); font-weight:600; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-sub{ font-size: var(--fs-11, 11px); color: var(--text-2, #5b6472); line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-sub.err{ color:#d0553f; }
body.dark-mode .bar-sub.err{ color:#ff8f7a; }

.bar-ctrl{ display:flex; align-items:center; gap:4px; flex:none; }
.bar-ctrl .play{
  width:38px; height:38px; border-radius:50%; border:0; cursor:pointer;
  display:grid; place-items:center; font-size:13px;
  background: var(--m-grad); color: var(--m-on-accent);
  box-shadow: 0 4px 14px var(--m-accent-ring);
  transition: transform var(--dur-instant,100ms) var(--ease-out-quart, cubic-bezier(.25,1,.5,1)), filter var(--dur-fast,160ms);
}
.bar-ctrl .play:hover{ filter: brightness(1.08); }
.bar-ctrl .play:active{ transform: scale(.93); }
.bar-ctrl .play[disabled]{ opacity:.45; cursor:default; }
.bar-ctrl .play .spin{ animation: spin 900ms linear infinite; }
@keyframes spin{ to{ transform: rotate(360deg) } }

.bar-seek{ display:flex; align-items:center; gap:10px; flex:1 1 180px; min-width:120px; }
.bar-time{ font-size: var(--fs-11, 11px); color: var(--text-3, #8a93a0); font-variant-numeric: tabular-nums; flex:none; }
.seek{ position:relative; height:22px; flex:1 1 auto; cursor:pointer; display:flex; align-items:center; touch-action:none; }
.seek .track{ position:relative; width:100%; height:4px; border-radius:999px; background: rgba(120,132,150,.26); overflow:hidden; }
.seek .fill{ position:absolute; inset:0 auto 0 0; width:0%; border-radius:999px;
  background: linear-gradient(90deg, var(--m-accent-2) 0%, var(--m-accent) 100%); }
.seek .knob{
  position:absolute; top:50%; left:0%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%;
  background:#fff; box-shadow: 0 1px 4px rgba(10,20,40,.35); opacity:0; transform: scale(.8);
  transition: opacity var(--dur-fast,160ms), transform var(--dur-fast,160ms);
}
.seek:hover .knob, .seek.drag .knob{ opacity:1; transform:none; }
.seek[aria-disabled="true"]{ cursor: default; }
.seek[aria-disabled="true"] .fill{ background: rgba(120,132,150,.5); }
.seek[aria-disabled="true"] .knob{ display:none; }

.bar-side{ display:flex; align-items:center; gap:2px; flex:none; }
.bar-vol{ display:flex; align-items:center; gap:6px; flex:none; }
.bar-vol input{ width:76px; height:18px; accent-color: var(--m-accent); cursor:pointer; }

/* ============================================================
   播放队列抽屉
   ============================================================ */
#qScrim{ position:fixed; inset:0; z-index: 900; background: rgba(10,14,22,.16); opacity:0; pointer-events:none; transition: opacity 240ms var(--ease-out-quart, cubic-bezier(.25,1,.5,1)); }
#qScrim.open{ opacity:1; pointer-events:auto; }
#queue{
  position:fixed; top:10px; right:10px; bottom:96px; width: min(320px, 86vw); z-index: 901;
  display:flex; flex-direction:column; min-height:0;
  border-radius: var(--r-md, 14px);
  background: rgba(255,255,255, calc(var(--m-a) * .96));
  border:1px solid rgba(255,255,255,.6);
  -webkit-backdrop-filter: blur(var(--m-blur)) saturate(var(--m-sat));
  backdrop-filter: blur(var(--m-blur)) saturate(var(--m-sat));
  box-shadow: inset 0 1px 0 rgba(255,255,255,var(--m-hi)), var(--m-shadow-lift);
  transform: translateX(calc(100% + 22px)); opacity:0; pointer-events:none;
  transition: transform 260ms var(--ease-out-expo, cubic-bezier(.16,1,.3,1)), opacity 200ms;
}
body.dark-mode #queue{ background: rgba(30,34,42, calc(var(--m-a) * .96)); border-color: rgba(255,255,255,.09); }
body.mat-solid #queue, body.perf-mode #queue{ -webkit-backdrop-filter:none; backdrop-filter:none; background: rgba(248,249,251,.98); }
body.dark-mode.mat-solid #queue, body.dark-mode.perf-mode #queue{ background: rgba(30,34,42,.98); }
#queue.open{ transform:none; opacity:1; pointer-events:auto; }
.q-head{ display:flex; align-items:center; gap:8px; padding: 12px 12px 8px 16px; }
.q-head .t{ font-size: var(--fs-13, 13px); font-weight:600; }
.q-head .n{ font-size: var(--fs-11, 11px); color: var(--text-3, #8a93a0); }
.q-head .sp{ margin-left:auto; }
.q-list{ flex:1 1 auto; min-height:0; overflow:auto; padding: 0 8px 10px; overscroll-behavior: contain; }
.q-list .row{ padding:6px 8px; }
.q-foot{ padding: 8px 12px 12px; border-top:1px solid var(--m-line-soft); display:flex; gap:8px; }

/* ============================================================
   全屏播放详情（磨砂封面背景 + 固定视口歌词）
   —— 背景 = 当前专辑封面的磨砂玻璃化（blur 60 + saturate 1.6 + brightness .55）
   —— 歌词「文字待在原地，动的是摄像机」：行绝对定位在长轨里，整轨 translate3d
   ============================================================ */
#player{
  position:absolute; inset:0; z-index:1000; display:none; flex-direction:column;
  opacity:0; overflow:hidden; color:#fff;
  background: linear-gradient(155deg, #262b33 0%, #171a20 52%, #0b0d11 100%);
  transition: opacity 240ms var(--pl-ease, cubic-bezier(.22,.61,.36,1));
  /* ---- 全屏播放层变量 ---- */
  --pl-ease: cubic-bezier(.22,.61,.36,1);  /* 短而干脆，无弹簧 */
  --pl-dur: 280ms;
  --pl-line: clamp(24px, 3.2vw, 40px);     /* 当前行字号 */
  --pl-sub: clamp(13px, 1.3vw, 17px);      /* 译文字号 */
  --pl-line-h: 1.35;
  --pl-t1: rgba(255,255,255,.96);
  --pl-t2: rgba(255,255,255,.64);
  --pl-t3: rgba(255,255,255,.42);
}
#player.is-open{ opacity:1; }
#player.no-anim{ transition:none; }
.pl-bg{ position:absolute; inset:0; overflow:hidden; }
.pl-bg img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  filter: blur(60px) saturate(1.6) brightness(.55);
  transform: scale(1.25);            /* 放大避免模糊后边缘露白 */
  transform-origin: center center;
}
/* 很淡的暗色 scrim：只压高光，保证白字可读 */
.pl-bg::after{
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(120% 85% at 24% 12%, rgba(8,11,16,0) 0%, rgba(8,11,16,.34) 82%),
    linear-gradient(180deg, rgba(8,11,16,.26) 0%, rgba(8,11,16,.04) 42%, rgba(8,11,16,.36) 100%);
}

.pl-top{ position:relative; z-index:3; flex:none; display:flex; align-items:center; gap:8px; padding: 12px 16px; }
.pl-crumb{ font-size: var(--fs-11,11px); font-weight:600; letter-spacing:.6px; text-transform:uppercase; color: var(--pl-t3); }
.pl-top .sp{ margin-left:auto; }
#player .ico{ color: var(--pl-t2); }
#player .ico:hover{ color:#fff; background: rgba(255,255,255,.12); }
#player .ico.on{ color:#fff; }

/* 两栏：左（封面 / 歌名 / 歌手 / 进度 / 控制） 右（歌词视口） */
.pl-body{
  position:relative; z-index:3; flex:1 1 auto; min-height:0;
  display:grid; grid-template-columns: minmax(230px, 31%) minmax(0, 1fr);
  align-items:center; gap: clamp(28px, 4vw, 72px);
  width:100%; max-width:1180px; margin:0 auto;
  padding: 0 clamp(20px, 4vw, 64px) clamp(16px, 3vh, 32px);
}
.pl-left{ min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap: clamp(10px, 1.6vh, 16px); }
.pl-cover{
  width: min(100%, clamp(180px, 30vh, 330px)); aspect-ratio:1/1; flex:none;
  border-radius: 20px; overflow:hidden;
  background: rgba(255,255,255,.08);
  box-shadow: 0 26px 60px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.36), inset 0 0 0 1px rgba(255,255,255,.10);
  position:relative; transform-origin: center center; will-change: transform;
}
.pl-cover img{ width:100%; height:100%; object-fit:cover; }
.pl-cover::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
}
/* 播放中的封面呼吸与光环（真实播放状态驱动，暂停即停） */
#player.playing .pl-cover{ animation: coverBreath 6.5s var(--ease-in-out-quart, cubic-bezier(.76,0,.24,1)) infinite; }
#player.playing .pl-cover::after{ animation: coverHalo 6.5s ease-in-out infinite; }
@keyframes coverBreath{ 0%,100%{ transform: scale(1) } 50%{ transform: scale(1.022) } }
@keyframes coverHalo{
  0%,100%{ box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), 0 0 0 0 rgba(87,195,174,0) }
  50%{ box-shadow: inset 0 0 0 1px rgba(255,255,255,.34), 0 0 48px 6px var(--m-glow) }
}
.pl-meta{ min-width:0; width:100%; }
.pl-name{ font-size: clamp(20px, 1.9vw, 27px); font-weight:650; letter-spacing:-.02em; line-height:1.26; margin:0; color:#fff;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pl-artist{ font-size: var(--fs-13,13px); color: var(--pl-t2); margin-top:6px; line-height:1.5;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pl-acts{ display:flex; align-items:center; gap:4px; }

.pl-right{ position:relative; min-width:0; height: clamp(280px, 62vh, 560px); align-self:center; }
/* 歌词视口：固定窗口，把「摄像机」交给轨道 transform（文字本身不滚） */
.lrc{
  position:absolute; inset:0; overflow:hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 12%, #000 88%, transparent 100%);
  mask-image: linear-gradient(180deg, transparent 0, #000 12%, #000 88%, transparent 100%);
}
.lrc-track{
  position:absolute; left:0; right:0; top:0;
  transform: translate3d(0,0,0);
  transition: transform var(--pl-dur) var(--pl-ease);
  will-change: transform;
}
.lrc-track.no-anim{ transition:none; }
.lrc-track.no-anim .lrc-line{ transition:none; }
/* 每行绝对定位在长轨里：纵向位置由 JS 写入 --y，换行高度不同也不漂 */
.lrc-line{
  position:absolute; left:0; right:0; top:0;
  display:block; width:100%; margin:0; padding: 13px 6px 13px 0;
  border:0; background:none; text-align:left; cursor:pointer;
  font-size: var(--pl-line); font-weight:700; line-height: var(--pl-line-h);
  letter-spacing:-.01em; color: var(--pl-t1);
  opacity:.30; border-radius:10px;
  transform: translate3d(0, var(--y, 0px), 0) scale(1);
  transform-origin: left center;
  transition: transform var(--pl-dur) var(--pl-ease),
              opacity 240ms var(--pl-ease),
              filter 240ms var(--pl-ease);
  overflow-wrap: break-word; word-break: break-word;
  max-height: calc(var(--pl-line-h) * 3em + 26px); /* 最多 3 行，不用 ellipsis 截断 */
  overflow: hidden;
}
.lrc-line:hover{ opacity:.60; }
.lrc-line.near{ opacity:.54; }
.lrc-line.cur{
  opacity:1; color:#fff;
  transform: translate3d(0, var(--y, 0px), 0) scale(1.04);
  filter: brightness(1.08);
}
.lrc-line .tr{
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  /* v2.10.6：用户钦定「一行原歌词 + 一行约 40% 大小的中文译文，两者是一个整体」。
     用 em 跟原文联动，全屏放大时比例不变。 */
  margin-top:.16em; max-height:2.9em;
  font-size:.42em; font-weight:500; line-height:1.4;
  letter-spacing:.03em; opacity:.74; color:#fff;
}
/* 译文明示开关：失败时给「重试」，不再静默 */
.pl-right{ position:relative; }
.lrc-tr-btn{
  position:absolute; top:8px; right:10px; z-index:6;
  display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px;
  border-radius:999px; border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.10); color:#fff; font:inherit; font-size:11px; font-weight:600;
  cursor:pointer; opacity:.68; transition:opacity .16s ease, border-color .16s ease, background-color .16s ease;
}
.lrc-tr-btn:hover{ opacity:1; background:rgba(255,255,255,.18); }
.lrc-tr-btn.on{ opacity:.95; border-color:rgba(255,255,255,.42); }
.lrc-tr-btn.busy{ opacity:.8; }
.lrc-tr-btn.fail{ opacity:1; color:#ffc0b0; border-color:rgba(255,150,120,.55); background:rgba(255,120,90,.14); }
/* 关掉译文时整行译文不占位（原文行高回到正常） */
body.n26-tr-off .lrc-line .tr{ display:none; }
body.n26-tr-off .lrc-line.has-tr{ max-height: calc(var(--pl-line-h) * 3em + 26px); }
/* 带译文的行：行高上限要留出译文那两行，否则原文会被自己的 max-height 裁掉 */
.lrc-line.has-tr{ max-height: calc(var(--pl-line-h) * 3em + var(--pl-sub) * 3.2 + 26px); }
/* v2.10.10 · MV 舞台：走 B 站 playurl 拿真 MP4（无弹幕、无站内提示、无 B 站 UI），
   底部进度条与歌曲共用同一条时间轴 —— 歌拖到哪，画面就跳到哪 */
.pl-mv{ position:absolute; inset:0; z-index:8; display:none; background:#05070c; }
.pl-mv.on{ display:block; }
.pl-mv > video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#05070c; display:block; }
.pl-mv-state{
  position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; color:#fff; font-size:12.5px; text-align:center; padding:0 24px; background:rgba(4,6,10,.55);
}
.pl-mv-state.off{ display:none; }
.pl-mv-state i{ font-size:20px; opacity:.9; }
.pl-mv-state-acts{ display:flex; gap:8px; }
.pl-mv-state-acts[hidden]{ display:none; }
.pl-mv-bar{
  position:absolute; left:0; right:0; bottom:0; z-index:4;
  display:flex; align-items:center; gap:10px; padding:12px 16px 14px;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.78));
  color:#fff; font-size:12px;
}
.pl-mv-name{ font-weight:650; letter-spacing:.02em; max-width:32%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pl-mv-time{ font-variant-numeric:tabular-nums; opacity:.86; min-width:38px; text-align:center; }
.pl-mv-seek{ flex:1 1 auto; min-width:80px; height:22px; }
.pl-mv-seek .track{ height:5px; background:rgba(255,255,255,.24); }
.pl-mv-seek .fill{ background:#fff; }
.pl-mv-seek .knob{
  width:11px; height:11px; margin:-5.5px 0 0 -5.5px; opacity:1; transform:none;
  background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.18), 0 1px 5px rgba(0,0,0,.5);
}
.pl-mv .btn.sm{ height:26px; flex:0 0 auto; }
.pl-mv-bar .ico{ width:26px; height:26px; flex:0 0 auto; color:#fff; background:rgba(255,255,255,.10); }
.pl-mv-bar .ico:hover{ background:rgba(255,255,255,.20); }
/* v2.10.11 · MV 设置（右上角）：画质选择 */
.pl-mv-gear{
  position:absolute; top:12px; right:12px; z-index:6;
  width:32px; height:32px; border-radius:50%; display:grid; place-items:center; cursor:pointer;
  border:1px solid rgba(255,255,255,.20); background:rgba(16,18,24,.55); color:#fff; font-size:13px;
  backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 4px 14px rgba(0,0,0,.32);
  transition:background-color .18s ease, border-color .18s ease, transform .18s ease;
}
.pl-mv-gear:hover{ background:rgba(28,32,40,.72); border-color:rgba(255,255,255,.34); }
.pl-mv-gear.on{ background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.42); }
.pl-mv-gear.on i{ transform:rotate(60deg); }
.pl-mv-gear i{ transition:transform .26s cubic-bezier(.2,.7,.2,1); }
.pl-mv-set{
  position:absolute; top:52px; right:12px; z-index:7; width:246px; max-height:70%; overflow:auto;
  padding:12px 12px 10px; border-radius:16px; color:#fff;
  background:rgba(14,16,22,.86); border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(22px) saturate(1.25); -webkit-backdrop-filter:blur(22px) saturate(1.25);
  box-shadow:0 18px 44px rgba(0,0,0,.48);
  opacity:0; transform:translateY(-6px) scale(.97); pointer-events:none;
  transition:opacity .2s ease, transform .26s cubic-bezier(.2,.7,.2,1);
}
.pl-mv-set.on{ opacity:1; transform:none; pointer-events:auto; }
.pl-mv-set-h{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:650; margin-bottom:10px; }
.pl-mv-set-h span{ flex:1 1 auto; }
.pl-mv-set-x{ width:22px; height:22px; border:0; border-radius:50%; background:rgba(255,255,255,.10); color:#fff; cursor:pointer; font-size:11px; }
.pl-mv-set-x:hover{ background:rgba(255,255,255,.20); }
.pl-mv-set-sec{ font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.5; margin:2px 0 6px; }
.pl-mv-q{
  display:flex; align-items:center; gap:8px; width:100%; padding:7px 9px; margin-bottom:3px;
  border:1px solid transparent; border-radius:10px; background:transparent; color:#fff;
  font:inherit; font-size:12px; cursor:pointer; text-align:left;
  transition:background-color .16s ease, border-color .16s ease;
}
.pl-mv-q:hover{ background:rgba(255,255,255,.07); }
.pl-mv-q.on{ background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.26); }
.pl-mv-q .nm{ flex:1 1 auto; }
.pl-mv-q .sub{ font-size:10.5px; opacity:.5; }
.pl-mv-q.lock{ opacity:.62; }
.pl-mv-q.lock .nm::after{ content:' 🔒'; font-size:10px; }
.pl-mv-q .ck{ opacity:0; font-size:11px; }
.pl-mv-q.on .ck{ opacity:1; }
.pl-mv-set-tip{ margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.10); font-size:10.8px; line-height:1.65; opacity:.72; }
.pl-mv-set-tip b{ color:#fff; opacity:1; font-weight:650; }
/* v2.10.13：MV 出声规则说明（静音画面 / 声音来自歌曲） */
.pl-mv-note{
  display:flex; gap:7px; align-items:flex-start;
  margin:0 0 10px; padding:8px 9px; border-radius:10px;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10);
  font-size:10.8px; line-height:1.6; opacity:.86;
}
.pl-mv-note i{ margin-top:2px; opacity:.75; }
.pl-mv-note b{ color:#fff; font-weight:650; }
.pl-mv-mute{ font-size:11px; opacity:.55; margin-left:-2px; }
.pl-mv-set-go{
  display:inline-flex; align-items:center; gap:5px; margin-top:7px; padding:5px 10px; border-radius:999px;
  border:1px solid rgba(255,255,255,.24); background:rgba(255,255,255,.10); color:#fff;
  font:inherit; font-size:11px; font-weight:600; cursor:pointer;
}
.pl-mv-set-go:hover{ background:rgba(255,255,255,.20); }
#player.mv-on .pl-left, #player.mv-on .pl-right{ visibility:hidden; }
.lrc-empty{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; color: var(--pl-t3); font-size: var(--fs-12,12px); }
.lrc-empty.on{ display:flex; }
.lrc-empty i{ font-size: 26px; opacity:.4; }

.pl-err{
  position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
  gap: 10px; text-align:center; padding: 20px; color: var(--pl-t1);
}
.pl-err.on{ display:flex; }
.pl-err .ti{ font-size: var(--fs-14,14px); font-weight:600; }
.pl-err .ds{ font-size: var(--fs-12,12px); color: var(--pl-t2); line-height:1.6; max-width: 340px; }
.pl-err .acts{ display:flex; gap:8px; margin-top:2px; }

/* 左栏内的传输区（进度 + 播放控制），ID 全部沿用原有播放逻辑 */
.pl-transport{ width:100%; max-width: 340px; display:flex; flex-direction:column; gap: 6px; }
.pl-seek{ display:flex; align-items:center; gap:10px; }
.pl-seek .seek{ height:26px; }
.pl-seek .seek .track{ height:5px; background: rgba(255,255,255,.20); }
.pl-seek .seek .fill{ background: linear-gradient(90deg, rgba(255,255,255,.94) 0%, var(--m-accent) 100%); }
.pl-seek .seek .knob{
  width:11px; height:11px; margin:-5.5px 0 0 -5.5px; opacity:1; transform:none;
  background:#fff; box-shadow: 0 0 0 3px rgba(255,255,255,.16), 0 1px 5px rgba(0,0,0,.45);
}
.pl-seek .seek:hover .knob, .pl-seek .seek.drag .knob{ transform: scale(1.14); }
.pl-seek .bar-time{ font-size: var(--fs-11,11px); color: var(--pl-t2); min-width:36px; text-align:center; font-variant-numeric: tabular-nums; }
.pl-ctrl{ display:grid; grid-template-columns: auto 1fr auto; align-items:center; gap: 8px; }
.pl-ctrl .side{ display:flex; align-items:center; gap: 2px; }
.pl-ctrl .side.r{ justify-content:flex-end; }
.pl-ctrl .mid{ display:flex; align-items:center; justify-content:center; gap: clamp(6px, 1.4vw, 14px); }
.pl-ctrl .play{
  width:50px; height:50px; border-radius:50%; border:0; cursor:pointer; display:grid; place-items:center;
  background:#fff; color:#11151b; font-size:15px;
  box-shadow: 0 10px 26px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.30);
  transition: transform var(--dur-instant,100ms) var(--pl-ease), filter var(--dur-fast,160ms), box-shadow 200ms;
}
.pl-ctrl .play:hover{ filter: brightness(1.04); box-shadow: 0 14px 32px rgba(0,0,0,.48); }
.pl-ctrl .play:active{ transform: scale(.94); }
.pl-ctrl .play[disabled]{ opacity:.45; cursor:default; }
.pl-vol{ display:flex; align-items:center; gap:4px; }
.pl-vol input{ width:62px; accent-color:#fff; cursor:pointer; height:16px; }
body.dark-mode .bar-ctrl .play{ box-shadow: 0 4px 12px rgba(0,0,0,.45); }

/* 进场：除封面外整体淡入上浮（封面由 JS FLIP 从播放条飞入） */
#player .pl-top, #player .pl-meta, #player .pl-acts, #player .pl-right, #player .pl-transport{
  opacity:0; transform: translateY(10px);
  transition: opacity 300ms var(--pl-ease), transform 360ms var(--pl-ease);
}
#player.is-open .pl-top, #player.is-open .pl-meta, #player.is-open .pl-acts, #player.is-open .pl-right, #player.is-open .pl-transport{
  opacity:1; transform:none;
}
#player.is-open .pl-transport{ transition-delay: 60ms; }

/* ============================================================
   对话框 / 轻提示 / 拖放遮罩 / 边缘返回提示
   ============================================================ */
#dlgLayer{
  position:fixed; inset:0; z-index: 1100; display:none; align-items:center; justify-content:center;
  background: rgba(8,12,20,.34); opacity:0; transition: opacity 200ms var(--ease-out-quart, cubic-bezier(.25,1,.5,1));
}
#dlgLayer.on{ opacity:1; }
.dlg{
  width: min(400px, 88vw); border-radius: var(--r-lg, 16px); padding: 18px;
  background: var(--surface, #fff); color: var(--text-1, #1b1f26);
  box-shadow: var(--m-shadow-lift); border:1px solid var(--m-line);
  transform: scale(.96) translateY(4px); transition: transform 280ms var(--ease-spring, cubic-bezier(.34,1.56,.64,1));
  max-height: 78vh; display:flex; flex-direction:column;
}
body.dark-mode .dlg{ background: #22262e; }
#dlgLayer.on .dlg{ transform:none; }
.dlg h3{ margin:0 0 4px; font-size: var(--fs-14,14px); font-weight:600; }
.dlg .ds{ font-size: var(--fs-12,12px); color: var(--text-2,#5b6472); line-height:1.6; }
.dlg .fields{ margin: 12px 0 4px; display:flex; flex-direction:column; gap:8px; }
.dlg input[type=text]{
  width:100%; padding:9px 12px; border-radius: var(--r-sm,10px); border:1px solid var(--m-line);
  background: var(--m-card); color: var(--text-1,#1b1f26); font-size: var(--fs-13,13px); outline:none;
}
.dlg input[type=text]:focus{ border-color: var(--m-accent); box-shadow: 0 0 0 3px var(--m-accent-ring); }
.dlg .list{ margin-top: 10px; overflow:auto; display:flex; flex-direction:column; gap:2px; min-height:0; }
.dlg .list .row{ padding: 8px; }
.dlg .foot{ display:flex; justify-content:flex-end; gap:8px; margin-top: 14px; }

#toastHost{ position:fixed; left:50%; bottom: 104px; transform: translateX(-50%); z-index: 1200; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
.toast{
  padding: 8px 14px; border-radius: var(--r-full,999px);
  font-size: var(--fs-12,12px); color:#fff; background: rgba(24,28,36,.86);
  box-shadow: 0 6px 18px rgba(8,12,20,.24);
  animation: toastIn 220ms var(--ease-out-expo, cubic-bezier(.16,1,.3,1)) both;
}
@keyframes toastIn{ from{ opacity:0; transform: translateY(6px) scale(.98) } to{ opacity:1; transform:none } }

#dropMask{
  position:fixed; inset:0; z-index: 1050; display:none; align-items:center; justify-content:center; gap:12px;
  font-size: var(--fs-16,16px); font-weight:600; color: var(--m-accent-text);
  background: rgba(243,246,251,.78); border: 2px dashed var(--m-accent-ring); border-radius: 0;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); pointer-events:none;
}
body.dark-mode #dropMask{ background: rgba(14,16,21,.8); }
#dropMask.on{ display:flex; }

#edgeHint{
  position:fixed; left:0; top:50%; z-index: 950; width:54px; height:92px; margin-top:-46px;
  display:flex; align-items:center; justify-content:center; border-radius: 0 14px 14px 0;
  background: var(--m-accent-soft); color: var(--m-accent-text); font-size:15px;
  opacity:0; pointer-events:none; transform: translateX(-100%);
}

/* ============================================================
   响应式 / 降级
   ============================================================ */
@media (max-width: 1100px){
  .bar-vol{ display:none; }
  .bar-left{ flex-basis: 216px; }
}
@media (max-width: 900px){
  .hero-cover{ width:92px; height:92px; }
  .hero-name{ font-size: var(--fs-18,18px); }
}
/* 窄窗：上下堆叠（歌词在上，封面/信息/控制在下方） */
@media (max-width: 820px){
  .pl-body{
    grid-template-columns: 1fr; align-content:center;
    gap: 14px; padding: 0 18px 14px;
  }
  .pl-right{ order:1; width:100%; height: min(44vh, 320px); }
  .pl-left{ order:2; flex-direction:row; flex-wrap:wrap; align-items:center; gap: 12px; }
  .pl-cover{ width: 84px; border-radius:14px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .pl-meta{ flex:1 1 auto; min-width: 0; }
  .pl-name{ font-size: var(--fs-18,18px); -webkit-line-clamp:1; }
  .pl-artist{ margin-top:3px; }
  .pl-acts{ display:none; }
  .pl-transport{ flex: 1 0 100%; max-width:none; }
  .pl-ctrl .play{ width:46px; height:46px; }
  .pl-vol{ display:none; }
  .lrc-line{ padding: 10px 4px 10px 0; }
}
/* 矮窗：封面别顶到歌词 */
@media (max-height: 620px) and (min-width: 821px){
  .pl-cover{ width: clamp(140px, 24vh, 220px); }
  .pl-right{ height: 52vh; }
  .pl-transport{ gap:2px; }
}
@media (max-width: 760px){
  .bar-seek .bar-time{ display:none; }
  .bar-dur{ display:none; }
  .hero{ flex-wrap:wrap; }
  .pg-title{ font-size: var(--fs-16,16px); }
}
@media (prefers-reduced-motion: reduce){
  .page, .toast, .sk::after, #player.playing .pl-cover, #player.playing .pl-cover::after{ animation: none; }
  #player, #player .pl-top, #player .pl-meta, #player .pl-acts, #player .pl-right, #player .pl-transport,
  #queue, .seek .knob, .lrc-track, .lrc-line, .bar-cover, .card{ transition-duration: 1ms; }
}

/* ============================================================
   沉浸播放层（应用内全覆盖；Three.js 单 canvas 渲染）
   ============================================================ */
#imm{
  position:fixed; inset:0; z-index: 1180; display:none; overflow:hidden;
  background:#05080c; color:#eef6f4;
}
#imm.on{ display:block; }
#imm canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.imm-hud{
  position:absolute; left:0; right:0; top:0; z-index:2;
  display:flex; align-items:center; gap:12px; padding:14px 18px;
  pointer-events:none;
}
.imm-track{
  font-size: var(--fs-12, 12px); letter-spacing:.4px; color: rgba(233,246,243,.58);
  max-width:62%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.imm-exit{
  margin-left:auto; pointer-events:auto; width:34px; height:34px; flex:none;
  border-radius:50%; border:1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.06); color: rgba(255,255,255,.82); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; font-size:13px;
  transition: background var(--dur-fast,160ms) var(--ease-out-quart,cubic-bezier(.25,1,.5,1));
}
.imm-exit:hover{ background: rgba(255,255,255,.15); }
.imm-hint{
  position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:2;
  font-size: var(--fs-11, 11px); letter-spacing:.6px; color: rgba(233,246,243,.34);
  pointer-events:none;
}
</style>
</head>
<body>
<div id="app">
  <div id="shellMount"></div>

  <footer id="bar" aria-label="Mini player">

        <span class="bar-meta">
          <span class="bar-name" id="barName">Nothing playing</span>
          <span class="bar-sub" id="barSub">Pick a track to start</span>
        </span>
      </button>
    </div>
    <div class="bar-ctrl">
      <button class="ico" id="barPrev" type="button" aria-label="Previous" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
      <button class="play" id="barPlay" type="button" aria-label="Play" disabled><i class="fa-solid fa-play"></i></button>
      <button class="ico" id="barNext" type="button" aria-label="Next" title="Next"><i class="fa-solid fa-forward-step"></i></button>
    </div>
    <div class="bar-seek">
      <span class="bar-time" id="barCur">0:00</span>
      <div class="seek" id="barSeek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-disabled="true">

      </div>

      <button class="ico" id="barFav" type="button" aria-label="Favorite" title="Favorite"><i class="fa-regular fa-heart"></i></button>
      <button class="ico" id="barQueue" type="button" aria-label="Queue" title="Queue"><i class="fa-solid fa-list-ul"></i></button>

<div id="player" role="dialog" aria-modal="true" aria-label="Now playing" aria-hidden="true">

    <span class="sp"></span>
    <button class="ico" id="plImmersive" type="button" aria-label="Immersive mode" title="Immersive mode"><i class="fa-solid fa-expand"></i></button>
    <button class="ico" id="plMv" type="button" aria-label="MV" title="MV 视频"><i class="fa-solid fa-clapperboard"></i></button>

      </div>
      <div class="pl-acts">

      </div>
      <div class="pl-transport">
        <div class="pl-seek">
          <span class="bar-time" id="plCur">0:00</span>

    <div class="pl-right">

      <button class="lrc-tr-btn" id="lrcTrBtn" type="button" title="显示/隐藏译文" onclick="n26TrToggle()">

}

/* ============================================================
   媒体守卫：全局单播仲裁 + 离窗释放

   ============================================================ */
var MEDIA_ID = 'music-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
var MEDIA_KEY = 'n26MediaOwnerV1';
var MEDIA_CH = null;
try { MEDIA_CH = new BroadcastChannel('n26-media-arbiter'); } catch (e) { MEDIA_CH = null; }

function readOwner() {
  try { var s = localStorage.getItem(MEDIA_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function writeOwner(o) {
  try { if (o) localStorage.setItem(MEDIA_KEY, JSON.stringify(o)); else localStorage.removeItem(MEDIA_KEY); } catch (e) { }
}
function stopHostBackground() {
  try { if (window.parent && window.parent !== window) window.parent.postMessage({ __nexusMusicCmd: 'bg-stop' }, '*'); } catch (e) { }

  try { localStorage.removeItem('n26MusicBg'); localStorage.removeItem('n26VideoBg'); } catch (e) { }
}
function claimMedia() {
  writeOwner({ id: MEDIA_ID, app: 'music', at: Date.now() });
  stopHostBackground();
  if (MEDIA_CH) { try { MEDIA_CH.postMessage({ type: 'claim', id: MEDIA_ID, app: 'music' }); } catch (e) { } }
}
function releaseMedia() {
  var o = readOwner();
  if (o && o.id === MEDIA_ID) writeOwner(null);
  if (MEDIA_CH) { try { MEDIA_CH.postMessage({ type: 'release', id: MEDIA_ID, app: 'music' }); } catch (e) { } }
}
function externalStop() {

}

  if (m.type === 'claim') externalStop();
}

/* 暂停意图记账：只有我们自己主动 pause 时才允许真的停下来。
   主壳在“开新窗口 / 最小化 / 切后台”时会直接 pause iframe 里的 audio，
   那不是用户意图，必须在 pause 事件里立刻续播。 */
var PAUSE_INTENT = 0;
/* pause 落账：UI 与媒体权同步到“已暂停” */
function markPaused() {
  S.playing = false;
  releaseMedia();
  paintTransport(); paintBar(); paintQueue(); broadcast();
}

function sysPause(el) {
  var a = el || A;
  if (a.paused) return; // 已经停着：不记账，避免意图计数泄漏把下一次外部暂停当成自己人
  PAUSE_INTENT++;
  try { a.pause(); } catch (e) { }
}
/* 判断宿主窗口是否还活着：关窗时主壳会同步把 windows 条目 splice 掉，
   最小化 / 开别的应用 / 切后台时条目仍在。 */
function hostWindowAlive() {
  try {
    if (!window.frameElement) return true; // 独立打开：没有宿主可抢停
    var P = window.parent;
    if (!P || !Array.isArray(P.windows)) return true;
    var host = window.frameElement.closest('.window');
    if (!host) return true;
    return P.windows.some(function (w) { return 'window-' + w.id === host.id; });
  } catch (e) { return true; }
}
/* 主壳 Windows 是闭包变量，iframe 侧拿不到；用宿主窗口元素上的状态判断「关窗」这一种真暂停：
   关窗走 n26MorphOut（el.__n26Morph），最小化走 genie（el._n26Minimizing）。 */
function hostWindowClosing() {
  try {
    var fe = window.frameElement;
    if (!fe) return false;
    var host = fe.closest('.window');
    if (!host) return false;
    if (host._n26Minimizing) return false; // 最小化：窗口仍在，只是收进 Dock
    if (host.__n26Morph) return true;      // 退场 morph = 正在关窗
    return !host.isConnected;
  } catch (e) { return false; }
}

/* 离开应用（仅真正的关闭 / 页面卸载时调用）：暂停并释放音频 */
function leaveApp(full) {
  try { if (IMM && IMM.open) closeImmersive(); } catch (e) { }
  if (S.cur) {
    var pos = (A.src && isFinite(A.duration) && A.duration > 0) ? (A.currentTime || 0)
      : ((S.last && same(S.last.track, S.cur)) ? S.last.pos : 0);
    S.last = { track: plain(S.cur), pos: pos, at: Date.now() };
  }
  sysPause(A);
  S.playing = false; S.loading = false;
  flush();
  if (full) {
    try { A.removeAttribute('src'); A.load(); } catch (e) { }
  }
  paintAll(); renderPage();
  releaseMedia();
}

/* 只有 iframe 真正卸载（= 窗口被关闭）才停声；失焦 / 最小化 / 切后台一律不停 */
function watchLeave() {
  window.addEventListener('pagehide', function () { leaveApp(true); });
}

/* ============================================================
   基础工具
   ============================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmt(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  var m = Math.floor(sec / 60), r = sec % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}
function fmtLong(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), r = sec % 60;
  if (h) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  return m + ':' + (r < 10 ? '0' : '') + r;
}
function tid(t) { return t ? (t.src || 'netease') + ':' + t.id : ''; }
function same(a, b) { return !!(a && b && tid(a) === tid(b)); }
function plain(t) {
  return { id: String(t.id), src: t.src || 'netease', name: t.name, artist: t.artist, album: t.album, cover: t.cover, dur: t.dur || 0, fee: t.fee == null ? null : t.fee };
}
function track(o) {
  return {
    id: String(o.id || ''), src: o.src || 'netease', name: o.name || '—', artist: o.artist || '',
    album: o.album || '', cover: o.cover || '', dur: o.dur || 0,
    fee: o.fee == null ? null : o.fee, _url: o._url || ''
  };
}
function isFav(t) {
  if (!t) return false;
  for (var i = 0; i < S.fav.length; i++) if (same(S.fav[i], t)) return true;
  return false;
}
function qIndex(t) {
  for (var i = 0; i < S.queue.length; i++) if (same(S.queue[i], t)) return i;
  return -1;
}
function fixUrl(u) {
  if (!u) return '';
  if (u.indexOf('//') === 0) return 'https:' + u;
  if (u.indexOf('http://') === 0) return 'https://' + u.slice(7);
  return u;
}
function proxy(u) {
  try {
    var b = btoa(unescape(encodeURIComponent(u))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return API + '/cover?u=' + b;
  } catch (e) { return ''; }
}
function coverHTML(t, cls) {
  var u = t && t.cover ? fixUrl(t.cover) : '';
  var ph = '<span class="cph"><i class="fa-solid fa-music"></i></span>';
  // 音符占位块始终垫在图片下面：封面没给、没加载完、加载失败时都不会留一块纯灰空白
  if (!u) return '<span class="cover-wrap">' + ph + '</span>';
  return '<span class="cover-wrap">' + ph +
    '<img src="' + esc(u) + '" data-proxy="' + esc(proxy(u)) + '" alt="" loading="lazy" decoding="async">' +
    '</span>';
}
function toast(msg) {
  var host = $('toastHost');
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(function () {
    el.style.transition = 'opacity 200ms, transform 200ms';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-4px)';
    setTimeout(function () { el.remove(); }, 220);
  }, 2000);
  if (N && N.notify) { try { N.notify(T('tApp'), msg, 'info'); } catch (e) { } }
}

/* 封面热链失败 → 走同源代理；再失败则占位 */
document.addEventListener('error', function (e) {
  var img = e.target;
  if (!img || img.tagName !== 'IMG') return;
  if (!img.dataset.fb) {
    img.dataset.fb = '1';
    var p = img.getAttribute('data-proxy');
    if (p) { img.src = p; return; }
  }
  img.style.display = 'none';
  if (img.parentNode && !img.parentNode.querySelector('.cph')) {
    var ph = document.createElement('span');
    ph.className = 'cph';
    ph.innerHTML = '<i class="fa-solid fa-music"></i>';
    img.parentNode.appendChild(ph);
  }
}, true);

/* ============================================================
   网络层（真实错误态，不伪造可播）
   ============================================================ */
function biz(reason, detail) { var e = new Error(reason || 'biz'); e.biz = true; e.reason = reason || 'biz'; if (detail) e.detail = detail; return e; }
var offAt = 0;
function isOffline() { return offAt > 0 && Date.now() - offAt < 60000; }
function api(path, opt) {
  opt = opt || {};
  var ctl = null;
  try { ctl = new AbortController(); } catch (e) { }
  var timer = setTimeout(function () { if (ctl) { try { ctl.abort(); } catch (e) { } } }, opt.timeout || 12000);
  return fetch(API + path, ctl ? { signal: ctl.signal } : {}).then(function (r) {
    return r.json();
  }).then(function (j) {
    clearTimeout(timer);
    if (j && j.ok) { offAt = 0; return j; }
    if (j && j.reason) throw biz(j.reason, j.error);
    if (j && j.error) throw biz('server', j.error);
    throw biz('bad');
  }).catch(function (e) {
    clearTimeout(timer);
    if (e && e.biz) throw e;
    offAt = Date.now();
    throw biz('offline');
  });

function paintFeedFoot() {
  var foot = $('feedFoot');
  if (!foot) return;
  var total = S.results.length;
  if (FEED.shown >= total) {
    foot.className = 'feed-foot feed-end';

  } else {
    foot.className = 'feed-foot';

  }
}
function loadMoreFeed() {
  if (FEED.loading || FEED.done) return;
  if (FEED.shown >= S.results.length) { FEED.done = true; paintFeedFoot(); return; }
  FEED.loading = true;
  var foot = $('feedFoot'), rows = $('feedRows');
  if (foot) {
    foot.className = 'feed-foot feed-loading';
    foot.innerHTML = '<div class="rows" aria-hidden="true">' + skRowHTML(0) + skRowHTML(1) + skRowHTML(2) + '</div>';
  }
  FEED.timer = setTimeout(function () {
    FEED.loading = false;
    FEED.shown = Math.min(FEED.shown + FEED.batch, S.results.length);
    if (rows) rows.innerHTML = rowsHTML(S.results.slice(0, FEED.shown), 'search');
    paintFeedFoot();
    checkFeedFill();
  }, 200);
}
/* 首屏没填满时最多补一批，其余交给滚动触发，避免一次性把 20 首全铺完 */
function feedScroller() {
  var n = document.getElementById('pg-search');
  while (n && n !== document.body) {
    var s = getComputedStyle(n);
    if (/(auto|scroll)/.test(s.overflowY)) return n;
    n = n.parentElement;
  }
  return document.scrollingElement || document.body;
}
function checkFeedFill() {
  var rows = $('feedRows');
  if (!rows || S.tab !== 'search') return;
  if (FEED.shown >= S.results.length) { FEED.done = true; paintFeedFoot(); return; }
  if (FEED.autofill) return;
  var sc = feedScroller();
  var viewH = sc === document.scrollingElement ? window.innerHeight : sc.clientHeight;
  var top = sc === document.scrollingElement ? 0 : sc.getBoundingClientRect().top;
  if (rows.getBoundingClientRect().bottom - 40 < top + viewH) { FEED.autofill = 1; loadMoreFeed(); }
}
function bindFeedScroll() {
  document.addEventListener('scroll', function (ev) {
    if (S.tab !== 'search' || !S.q || S.searching || !S.results.length) return;
    if (FEED.loading || FEED.done) return;
    var t = ev.target, st, vh, hh;
    if (t === document || t === document.body || t === document.documentElement) {
      st = window.scrollY; vh = window.innerHeight; hh = document.documentElement.scrollHeight;
    } else if (t && typeof t.scrollTop === 'number') {
      st = t.scrollTop; vh = t.clientHeight; hh = t.scrollHeight;
    } else return;
    if (hh - (st + vh) < 200) loadMoreFeed();
  }, true);
}

/* ============================================================
   播放详情：从迷你播放条连续变形（封面 FLIP + 面板展开）
   ============================================================ */
function morphCover(el, from, to, reverse) {
  if (reduceMotion || !el || !el.animate || !to.width || !from.width) return;
  var dx = from.left - to.left, dy = from.top - to.top;
  var sx = from.width / to.width, sy = from.height / to.height;
  var kf = reverse
    ? [{ transform: 'none' }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')' }]
    : [{ transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')' }, { transform: 'none' }];
  try {
    var a = el.animate(kf, { duration: reverse ? 300 : 420, easing: 'cubic-bezier(.16,1,.3,1)' });
    a.onfinish = function () { try { a.cancel(); } catch (e) { } };
  } catch (e) { }
}
function morphBg(p) {
  var bg = p.querySelector('.pl-bg');
  if (!bg || reduceMotion || !bg.animate) return;
  var r = $('bar').getBoundingClientRect();
  var W = window.innerWidth, H = window.innerHeight;
  var inset = Math.max(0, r.top) + 'px ' + Math.max(0, W - r.right) + 'px ' +
    Math.max(0, H - r.bottom) + 'px ' + Math.max(0, r.left) + 'px';
  try {
    bg.animate([
      { clipPath: 'inset(' + inset + ' round 14px)', opacity: 0 },
      { clipPath: 'inset(0px round 0px)', opacity: 1 }
    ], { duration: 420, easing: 'cubic-bezier(.16,1,.3,1)' });
  } catch (e) { }
}

    case 'local-add': $('fileInput').click(); break;

    case 'clear-q': S.queue = []; S.qi = -1; S.cur = null; S.playing = false; S.err = '';
      try { A.pause(); A.removeAttribute('src'); } catch (e2) { }

function bindSeek(id) {
  var el = $(id);
  if (!el) return;
  function ratio(e) {
    var r = el.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / Math.max(1, r.width)));
  }
  el.addEventListener('pointerdown', function (e) {
    if (!S.cur) return;
    try { el.setPointerCapture(e.pointerId); } catch (err) { }
    S.dragSeek = ratio(e); el.classList.add('drag'); paintDrag(S.dragSeek);
    e.preventDefault();
  });
  el.addEventListener('pointermove', function (e) {
    if (S.dragSeek == null) return;
    S.dragSeek = ratio(e); paintDrag(S.dragSeek);
  });
  function end() {
    if (S.dragSeek == null) return;
    var r = S.dragSeek;
    S.dragSeek = null;
    el.classList.remove('drag');
    var dur = (isFinite(A.duration) && A.duration > 0) ? A.duration : ((S.cur && S.cur.dur) || 0);
    if (dur > 0) seekTo(r * dur);
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', function (e) {
    if (!S.cur) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); seekTo((A.currentTime || 0) + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seekTo((A.currentTime || 0) - 5); }
  });
}
function paintDrag(p) {
  var pct = p * 100;
  ['barFill', 'plFill', 'plMvFill'].forEach(function (id) { var e = $(id); if (e) e.style.width = pct + '%'; });
  setKnob('barSeek', pct); setKnob('plSeek', pct);
  try { setKnob('plMvSeek', pct); } catch (e) { }
  var dur = (isFinite(A.duration) && A.duration > 0) ? A.duration : ((S.cur && S.cur.dur) || 0);
  $('barCur').textContent = fmt(p * dur);
  $('plCur').textContent = fmtLong(p * dur);
  var mc = $('plMvCur'); if (mc) mc.textContent = fmtLong(p * dur);
}

function importFiles(files) {

    if (!byType && !byName) return;

var edgeState = { active: false, acc: 0, last: 0 };
var edgeTimer = 0, pinchAt = 0;
function resetEdge() {
  edgeState.active = false;
  edgeState.acc = 0;
  $('edgeHint').style.opacity = '0';
  $('edgeHint').style.transform = 'translateX(-100%)';
}
function showEdge(p) {
  $('edgeHint').style.opacity = String(p * 0.95);
  $('edgeHint').style.transform = 'translateX(' + (-100 + p * 100) + '%)';
}
function onPinch(e) {
  var tg = e.target;
  var hit = tg && tg.closest ? tg.closest('#plCover, #barCover, .hero-cover, .card-cover') : null;
  if (!hit) return;
  e.preventDefault();
  var now = Date.now();
  if (now - pinchAt < 480) return;
  if (e.deltaY < 0 && !S.playerOpen) { pinchAt = now; openPlayer(); }
  else if (e.deltaY > 0 && S.playerOpen) { pinchAt = now; closePlayer(); }
}
function onWheel(e) {
  if (e.ctrlKey) { onPinch(e); return; }
  if (S.playerOpen) return;
  if (e.clientX > 26) { if (edgeState.active) resetEdge(); return; }
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  if (e.deltaX <= 0) return;
  if (Date.now() - edgeState.last < 600) return;
  edgeState.active = true;
  edgeState.acc += e.deltaX;
  showEdge(Math.min(1, edgeState.acc / 120));
  clearTimeout(edgeTimer);
  edgeTimer = setTimeout(resetEdge, 240);
  if (edgeState.acc >= 120) {
    resetEdge();
    edgeState.last = Date.now();
    back();
  }
}

function bindKeys() {
  document.addEventListener('keydown', function (e) {
    var tg = e.target;
    var typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable);
    if (e.key === 'Escape') {
      if ($('dlgLayer').classList.contains('on')) { e.preventDefault(); closeDialog(); return; }
      if (S.queueOpen) { e.preventDefault(); toggleQueue(false); return; }
      if (S.playerOpen) { e.preventDefault(); closePlayer(); return; }
      back();
      return;
    }
    if (typing) {
      if (e.key === 'Enter' && tg.id === 'searchInput') { e.preventDefault(); S.q = tg.value; doSearch(); return; }
      if (e.key === 'Enter' && tg.id === 'dlgPlName') { e.preventDefault(); doCreatePl(); return; }
      return;
    }
    if (e.key === 'Enter' && tg && tg.classList && tg.classList.contains('row')) {
      e.preventDefault();
      tg.click();
      return;
    }
    var meta = e.ctrlKey || e.metaKey;
    if (meta && e.key.toLowerCase() === 'f') { e.preventDefault(); switchTab('search'); S.focusSearch = true; renderPage(); return; }
    if (meta || e.altKey) return;
    var k = e.key;
    var onBtn = tg && tg.closest ? tg.closest('button, [role="button"], .seek') : null;
    if (k === ' ') { if (onBtn) return; e.preventDefault(); toggle(); }
    else if (k === 'ArrowRight' || k === 'ArrowLeft') {
      if (!S.cur) return;
      if (tg && tg.closest && tg.closest('.seek')) return;
      e.preventDefault();
      seekTo((A.currentTime || 0) + (k === 'ArrowRight' ? 5 : -5));
    } else if (k === 'ArrowUp' || k === 'ArrowDown') {
      if (tg && tg.tagName === 'INPUT') return;
      e.preventDefault();
      setVolume(S.vol + (k === 'ArrowUp' ? 0.05 : -0.05));
    } else if (k === 'm' || k === 'M') { toggleMute(); }
    else if (k === 'n' || k === 'N') { next(); }
    else if (k === 'p' || k === 'P') { prev(); }
    else if (k === 'f' || k === 'F') { toggleFav(S.cur); }
    else if (k === 'q' || k === 'Q') { toggleQueue(); }
    else if (k === 'l' || k === 'L') { S.playerOpen ? closePlayer() : openPlayer(); }
    else if (k === '/') { e.preventDefault(); switchTab('search'); S.focusSearch = true; renderPage(); }
  });
}

function bindAudio() {
  A.addEventListener('loadedmetadata', function () {
    if (A._seekTo) {
      try { A.currentTime = Math.min(A._seekTo, Math.max(0, (A.duration || 0) - 1)); } catch (e) { }
      A._seekTo = 0;
    }
    var needRender = false;
    if (S.cur && !S.cur.dur && isFinite(A.duration) && A.duration > 0) {
      S.cur.dur = Math.round(A.duration);
      needRender = true; // 实测时长回写列表，替掉 --:--
    }
    // 试听片段识别：接口不返回 fee/privilege/freeTrialInfo，只能按真实时长异常短（<60s）判定
    var durNow = A.duration;
    if (S.cur && S.cur.src !== 'local' && isFinite(durNow) && durNow > 0 && durNow < 60) {
      var sec = Math.round(durNow);
      if (TRIAL[tid(S.cur)] !== sec) {
        TRIAL[tid(S.cur)] = sec;
        saveTrial();
        needRender = true; // 首次点播后把「试听 Ns」回写到当前列表行
      }
    }
    if (needRender) renderPage();
    S.trialHinted = false;
    paintPlayerFace();
    paintSeek();
  });
  A.addEventListener('timeupdate', function () {
    if (!S.cur) return;
    paintSeek();
    if (S.err) return;
    if (S.playing) {
      S.last = { track: plain(S.cur), pos: A.currentTime || 0, at: Date.now() };
      syncLrc(A.currentTime || 0);
      pushDock(); // 内部节流 ~900ms，顺带刷新 Dock Bar 的进度
      var now = Date.now();
      if (now - (S._saveAt || 0) > 5000) { S._saveAt = now; save(); }
    }
    var ts = trialSec(S.cur);
    if (ts && !S.trialHinted && (A.currentTime || 0) >= Math.max(8, ts - 8)) {
      S.trialHinted = true;
      toast(T('tTrialHint', ts));
    }
  });
  A.addEventListener('ended', function () {
    var ts = trialSec(S.cur);
    if (ts) {
      // 试听片段结束：明确告知，不静默跳走也不假循环
      S.trialHinted = true;
      S.playing = false; S.loading = false;
      toast(T('tTrialEnd', ts));
      paintAll();
      releaseMedia();
      return;
    }
    if (S.repeat === 2) { claimMedia(); A.currentTime = 0; A.play().catch(function () { }); return; }
    next(true);
  });
  A.addEventListener('error', function () {
    if (!S.cur || !A.src) return;
    fail('decode');
  });
  A.addEventListener('play', function () {
    claimMedia();
    S.playing = true; S.loading = false;
    paintTransport(); paintBar(); paintQueue(); broadcast();
  });
  A.addEventListener('pause', function () {

  });
  I.wave = new T3.Mesh(wg, wm);
  I.wave.position.set(0, -0.55, -3.6);
  I.wave.rotation.x = -0.09;
  I.wave.renderOrder = 1;
  I.scene.add(I.wave);

  // 粒子：固定 80 个，位置用确定式分布（不用随机数）
  var N = 80, pg = new T3.BufferGeometry(), pa = new Float32Array(N * 3);
  for (var i = 0; i < N; i++) {
    var ang = i * 2.399, rad = 2.4 + ((i * 37) % 83) / 83 * 7.6;
    pa[i * 3] = Math.cos(ang) * rad;
    pa[i * 3 + 1] = Math.sin(ang) * rad * 0.6;
    pa[i * 3 + 2] = -2.2 + ((i * 53) % 97) / 97 * 3.6;
  }
  pg.setAttribute('position', new T3.BufferAttribute(pa, 3));
  var pm = new T3.PointsMaterial({
    size: 0.06, color: 0xa8ecdf, transparent: true, opacity: 0.5,
    depthWrite: false, blending: T3.AdditiveBlending, sizeAttenuation: true
  });
  I.pts = new T3.Points(pg, pm);
  I.pts.renderOrder = 0;
  I.scene.add(I.pts);
}
function immResize() {
  var I = imm();
  if (!I.renderer || !I.camera) return;
  var w = window.innerWidth, h = Math.max(1, window.innerHeight);
  I.renderer.setSize(w, h, false);
  I.camera.aspect = w / h;
  I.camera.updateProjectionMatrix();
}

/* ---------- 逐帧 ---------- */
function immFrame(now) {
  var I = imm();
  if (!I.open || !I.renderer) { I.raf = 0; return; }
  I.raf = requestAnimationFrame(immFrame);
  if (!I.last) I.last = now;
  var dtMs = now - I.last;
  I.last = now;
  if (dtMs > 250) dtMs = 16; // 从后台/别的窗口切回来的大跳变不计入最长帧
  var dt = Math.min(0.05, dtMs / 1000);
  I.frames++;
  if (dtMs > I.maxMs) I.maxMs = dtMs;
  if (dtMs > I.maxMsEver) I.maxMsEver = dtMs;
  if (!I.statT) I.statT = now;
  if (now - I.statT >= 1000) {
    I.fps = Math.round(I.frames * 1000 / (now - I.statT));
    window.__n26ImmStats = {
      fps: I.fps,
      maxFrameMs: Math.round(I.maxMs * 10) / 10,
      maxFrameMsEver: Math.round(I.maxMsEver * 10) / 10,
      dpr: Math.min(window.devicePixelRatio || 1, 1.5),
      canvasCount: 1,
      spriteCount: (I.cur ? 1 : 0) + (I.next ? 1 : 0) + I.trash.length,
      lyricIdx: I.idx,
      noLyric: !!I.noLyric,
      cam: [Math.round(I.camera.position.x * 100) / 100, Math.round(I.camera.position.y * 100) / 100, Math.round(I.camera.position.z * 100) / 100],
      amp: Math.round(I.amp * 1000) / 1000
    };
    I.frames = 0; I.maxMs = 0; I.statT = now;
  }

  // 频谱能量（AnalyserNode）
  if (I.analyser && I.freq) {
    I.analyser.getByteFrequencyData(I.freq);
    var lo = 0, hi = 0, n1 = 0, n2 = 0;
    for (var bi = 1; bi < 16; bi++) { lo += I.freq[bi]; n1++; }
    for (var bj = 16; bj < 64; bj++) { hi += I.freq[bj]; n2++; }
    var aLo = lo / n1 / 255, aHi = hi / n2 / 255;
    I.amp += (aLo - I.amp) * Math.min(1, dt * 8);
    I.ampHi += (aHi - I.ampHi) * Math.min(1, dt * 10);
  } else {
    I.amp *= 0.95;
    I.ampHi *= 0.95;
  }

  var tEl = (now - I.t0) / 1000;
  I.dolly *= Math.exp(-dt * 2.4);
  var orb = tEl * 0.062;
  var rad = 10.4 + Math.sin(tEl * 0.21) * 0.8 + I.dolly;
  I.camera.position.set(Math.sin(orb) * rad * 0.66, 0.3 + Math.sin(tEl * 0.17) * 0.5 + I.amp * 0.05, Math.cos(orb) * rad);
  I.camera.lookAt(0, -0.1, 0);
  I.camera.fov = 52 - I.amp * 2.2;
  I.camera.updateProjectionMatrix();

  if (I.wave && I.wave.material) {
    I.wave.material.uniforms.uTime.value = tEl;
    I.wave.material.uniforms.uAmp.value = I.amp;
    I.wave.material.uniforms.uAmpHi.value = I.ampHi;
  }
  if (I.pts) {
    I.pts.rotation.y = tEl * 0.03;
    I.pts.scale.setScalar(1 + I.amp * 0.16);
  }

  // 歌曲 / 歌词变化 → 重建背景与歌词
  if (!same(S.cur, I.track)) {
    I.track = S.cur ? plain(S.cur) : null;
    I.bgKey = '';
    immBg();
    immSyncLyrics();
    $('immTrack').textContent = S.cur ? (S.cur.name + (S.cur.artist ? ' · ' + S.cur.artist : '')) : '';
  }
  if (I.lrcRef !== S.lrc || I.lrcState !== S.lrcState) immSyncLyrics();
  if (S.lrc.length && !I.noLyric) {
    var tm = A.currentTime || 0, idx = -1;
    for (var li = 0; li < S.lrc.length; li++) {
      if (S.lrc[li].t <= tm + 0.15) idx = li; else break;
    }
    immSetLine(idx);
  }

  // 精灵动画：入场（从远处飞入 + 微旋转）/ 呼吸 / 退场（横向滑出 + 抬起 + 拉近）
  if (I.cur) immAnim(I.cur, now, tEl, I);
  if (I.next) immAnim(I.next, now, tEl, I);
  for (var q = I.trash.length - 1; q >= 0; q--) immAnim(I.trash[q], now, tEl, I);

  I.renderer.render(I.scene, I.camera);
}

function immAnim(sp, now, tEl, I) {
  var u = sp.userData || {};
  var age = (now - u.t0) / 1000;
  var st = u.state;
  if (st === 'in') {
    var k = Math.min(1, age / 0.62);
    var e = 1 - Math.pow(1 - k, 3);
    sp.material.opacity = e * (0.92 + I.amp * 0.08);
    sp.position.set(-1.6 * (1 - e), 0.35 + Math.sin(tEl * 1.5) * 0.012, 0.2 - 5.5 * (1 - e));
    var sc = 0.86 + 0.14 * e + I.amp * 0.02;
    sp.scale.set(u.baseW * sc, u.baseH * sc, 1);
    sp.material.rotation = -0.075 * (1 - e);
    if (k >= 1) u.state = 'on';
  } else if (st === 'on') {
    sp.material.opacity = 0.94 + Math.sin(tEl * 1.7) * 0.03;
    sp.position.y = 0.35 + Math.sin(tEl * 1.35) * 0.022;
    var sc2 = 1 + I.amp * 0.035;
    sp.scale.set(u.baseW * sc2, u.baseH * sc2, 1);
    sp.material.rotation = Math.sin(tEl * 0.6) * 0.004;
  } else if (st === 'pre') {
    var k2 = Math.min(1, age / 0.5);
    sp.material.opacity = k2 * 0.34;
    sp.position.y = -1.32 - (1 - k2) * 0.22;
  } else if (st === 'out') {
    var k3 = Math.min(1, age / 0.55);
    var e3 = k3 * k3;
    sp.material.opacity = (1 - e3) * 0.9;
    sp.position.x = -3.4 * e3;
    sp.position.y = 0.35 + 1.35 * e3;
    sp.position.z = 0.2 + 2.6 * e3;
    sp.material.rotation = 0.06 * e3;
    sp.scale.set(u.baseW * (1 + 0.22 * e3), u.baseH * (1 + 0.22 * e3), 1);
    if (k3 >= 1) immDrop(sp);
  }
}

function immStart() {
  var I = imm();
  if (!I.renderer) return;
  I.t0 = performance.now();
  I.last = 0; I.frames = 0; I.maxMs = 0; I.maxMsEver = 0; I.statT = 0; I.fps = 0;
  I.track = null; I.lrcRef = null; I.lrcState = ''; I.bgKey = ''; I.idx = -2;
  window.__n26ImmStats = null;
  immResize();
  window.addEventListener('resize', immResize);
  I.raf = requestAnimationFrame(immFrame);
}

function immDispose() {
  var I = imm();
  if (I.raf) { cancelAnimationFrame(I.raf); I.raf = 0; }
  immClearLyrics();
  if (I.pts) {
    try { I.pts.geometry.dispose(); I.pts.material.dispose(); } catch (e) { }
    try { if (I.scene) I.scene.remove(I.pts); } catch (e) { }
    I.pts = null;
  }
  if (I.wave) {
    try { I.wave.geometry.dispose(); I.wave.material.dispose(); } catch (e) { }
    try { if (I.scene) I.scene.remove(I.wave); } catch (e) { }
    I.wave = null;
  }
  if (I.bgTex) { try { I.bgTex.dispose(); } catch (e) { } I.bgTex = null; }
  if (I.scene) { try { I.scene.background = null; } catch (e) { } }
  if (I.renderer) {
    try { I.renderer.forceContextLoss(); } catch (e) { }
    try { I.renderer.dispose(); } catch (e) { }
  }
  if (I.canvas && I.canvas.parentNode) I.canvas.parentNode.removeChild(I.canvas);
  I.canvas = null; I.renderer = null; I.scene = null; I.camera = null;
  // 断开分析器（AudioContext 与源节点保留：关闭它会让 <audio> 永久静音）
  if (I.analyser) { try { I.analyser.disconnect(); } catch (e) { } I.analyser = null; I.freq = null; }
  I.amp = 0; I.ampHi = 0; I.last = 0; I.idx = -2; I.track = null; I.lrcRef = null; I.bgKey = ''; I.lrcState = '';
  window.__n26ImmStats = null;
}

function openImmersive() {
  var I = imm();
  if (I.open) return;
  if (!S.cur) { toast(T('barHint')); return; }
  if (!S.playerOpen) openPlayer(true);
  I.open = true;
  immAudio(); // 必须在用户手势里同步建图，否则 WebAudio 会挂起
  var host = $('imm');
  host.classList.add('on');
  host.setAttribute('aria-hidden', 'false');
  $('immTrack').textContent = S.cur.name + (S.cur.artist ? ' · ' + S.cur.artist : '');
  document.addEventListener('keydown', immKey, true);
  var boot = function () {
    if (!I.open) return;
    immBuild();
    immStart();
  };
  if (I.T) { boot(); return; }
  immThree().then(boot).catch(function () {
    toast(T('tFail'));
    closeImmersive();
  });
}
function closeImmersive() {
  var I = imm();
  if (!I.open) return;
  I.open = false;
  document.removeEventListener('keydown', immKey, true);
  window.removeEventListener('resize', immResize);
  var host = $('imm');
  host.classList.remove('on');
  host.setAttribute('aria-hidden', 'true');
  immDispose();
}
function immKey(e) {
  if (!imm().open) return;
  if (e.key === 'Escape' || e.key === 'Esc') {
    e.preventDefault();
    e.stopPropagation();
    closeImmersive();
  }
}
function immInit() {
  var b = $('plImmersive');
  if (b) {
    b.title = T('ariaImm');
    b.setAttribute('aria-label', T('ariaImm'));
    b.addEventListener('click', openImmersive);
  }
  var x = $('immExit');
  if (x) {
    x.title = T('tImmExit');
    x.setAttribute('aria-label', T('tImmExit'));
    x.addEventListener('click', closeImmersive);
  }
  var h = $('immHint');
  if (h) h.textContent = T('tImmHint');
  /* 离屏（最小化 / 切虚拟桌面 / 别的窗口全屏）→ 停 rAF，回来再续 */
  document.addEventListener('visibilitychange', function () {
    var I = imm();
    if (!I.open) return;
    if (document.hidden) {
      if (I.raf) { cancelAnimationFrame(I.raf); I.raf = 0; }
    } else if (!I.raf && I.renderer) {
      I.last = 0;
      I.raf = requestAnimationFrame(immFrame);
    }
  });
}

function init() {
  LANG = resolveLang('');
  applyForcedTheme();
  hydrate(readJSON(KEY), readJSON(KEY_FAV));
  buildShell();
  bindUI();
  bindDockBar();
  try { mvBind(); } catch (e) { }
  bindFeedScroll();
  applyI18nStatic();
  try { if (trIsOff()) document.body.classList.add('n26-tr-off'); } catch (e) { }
  paintAll();
  renderPage();
  bootHost();

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function () { toggle(); });
      navigator.mediaSession.setActionHandler('pause', function () { toggle(); });
      navigator.mediaSession.setActionHandler('previoustrack', function () { prev(); });
      navigator.mediaSession.setActionHandler('nexttrack', function () { next(); });
    } catch (e) { }
  }
  A.volume = S.vol;

  // 窗口没被真正关闭就一律不停声：宿主直接在 iframe 里 pause() 的情况由 A 的 pause 事件续播兜底，
  // 本应用不再监听 visibilitychange / blur / media-pause。
  stopHostBackground();
  watchLeave();
  immInit();
  window.addEventListener('nexus:ready', function (ev) {
    var d = ev.detail || {};
    var lg = resolveLang((d.user && d.user.lang) || d.lang);
    if (lg !== LANG) {
      LANG = lg;
      if (shell) { try { shell.destroy(); } catch (e) { } }
      buildShell();
      applyI18nStatic();
      paintAll();
      renderPage();
    }
    applyForcedTheme();
  });

  try {
    if (/[?&]player=1/.test(location.search) && S.cur) {
      S.lrcState = 'loading'; renderLrc(); loadLrc(S.cur);
      setTimeout(function () { openPlayer(true); }, 80);
    }
  } catch (e) { }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
