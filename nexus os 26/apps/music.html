<!DOCTYPE html>
<html lang="zh-CN" data-ui="liquid" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="doc_title">音乐</title>
<link rel="stylesheet" href="../vendor/fontawesome/all.min.css">
<script src="_bridge.js"></script>
<script src="_app.js?v=2.9.57"></script>
<style>
/* ============================================================
   v2.9.53 · 音乐播放器重写
   主题：外壳完全跟随系统深浅色（_app.js 广播 data-mode）
   颜色只收敛在六个 --m-* 变量里；专辑主色只做点缀（进度条/光晕），
   紫色色相强制重映射（禁紫令）。
   ============================================================ */
:root {
  --m-bg: #10131a;
  --m-panel: rgba(255,255,255,0.045);
  --m-panel2: rgba(255,255,255,0.08);
  --m-line: rgba(255,255,255,0.09);
  --m-text: #f2f2f0;
  --m-sub: rgba(242,242,240,0.55);
  --m-accent: #4A9BF5;
  --m-glow: #4A9BF5;
  --m-dim: rgba(242,242,240,0.30);
}
[data-mode="light"] {
  --m-bg: #f2f5fa;
  --m-panel: rgba(255,255,255,0.78);
  --m-panel2: rgba(20,40,70,0.06);
  --m-line: rgba(20,40,70,0.10);
  --m-text: #17202c;
  --m-sub: rgba(23,32,44,0.58);
  --m-accent: #2e7cd6;
  --m-glow: #2e7cd6;
  --m-dim: rgba(23,32,44,0.30);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
  background: var(--m-bg); color: var(--m-text);
  overflow: hidden; user-select: none;
  transition: background 0.25s ease, color 0.25s ease;
}
#app { display: flex; flex-direction: column; height: 100%; }

/* ---------- 上部：左栏 + 主区 ---------- */
#upper { flex: 1 1 0; min-height: 0; display: flex; }

/* 左栏 */
#side {
  width: 158px; flex: none; display: flex; flex-direction: column;
  border-right: 1px solid var(--m-line); padding: 12px 8px 10px;
}
#side .brand {
  font-size: 13px; font-weight: 700; padding: 2px 10px 12px; letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 8px; color: var(--m-sub);
}
#side .brand i { color: var(--m-accent); }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: 9px; margin-bottom: 2px;
  font-size: 12.5px; cursor: pointer; color: var(--m-sub);
  transition: background 0.15s, color 0.15s;
}
.nav-item i { width: 15px; text-align: center; font-size: 13px; }
.nav-item:hover { background: var(--m-panel); color: var(--m-text); }
.nav-item.on { background: var(--m-panel2); color: var(--m-accent); font-weight: 600; }
.nav-item .cnt { margin-left: auto; font-size: 10.5px; opacity: 0.6; }
#sideFoot { margin-top: auto; padding: 10px 10px 2px; font-size: 10px; line-height: 1.6; color: var(--m-dim); }

/* 主区 */
#main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
#banner {
  display: none; align-items: center; gap: 8px;
  margin: 10px 14px 0; padding: 7px 12px; border-radius: 9px;
  font-size: 11.5px; background: rgba(234,158,39,0.12); color: #d98a1f;
}
[data-mode="light"] #banner { background: rgba(234,158,39,0.14); color: #8a5a10; }
#banner i { font-size: 12px; }
#viewHead {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 10px; flex: none;
}
#viewTitle { font-size: 16px; font-weight: 700; }
#viewSub { font-size: 11.5px; color: var(--m-sub); margin-top: 1px; }
#headSearch {
  display: none; flex: 1 1 0; max-width: 340px; position: relative;
}
#headSearch input {
  width: 100%; padding: 8px 12px 8px 32px; border-radius: 10px;
  border: 1px solid var(--m-line); background: var(--m-panel);
  color: var(--m-text); font-size: 12.5px; outline: none; font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}
#headSearch input:focus { border-color: var(--m-accent); }
#headSearch i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--m-sub); }
#boardChips { display: none; gap: 6px; }
.chip {
  padding: 5px 13px; border-radius: 16px; font-size: 11.5px; cursor: pointer;
  border: 1px solid var(--m-line); color: var(--m-sub);
  transition: all 0.15s; background: transparent; font-family: inherit;
}
.chip:hover { color: var(--m-text); }
.chip.on { background: var(--m-accent); border-color: var(--m-accent); color: #fff; font-weight: 600; }
#headBtns { margin-left: auto; display: flex; gap: 7px; }
.hbtn {
  padding: 7px 13px; border-radius: 9px; border: 1px solid var(--m-line);
  background: var(--m-panel); color: var(--m-text); font-size: 11.5px;
  cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px;
  transition: background 0.15s, border-color 0.15s;
}
.hbtn:hover { background: var(--m-panel2); }
.hbtn.primary { background: var(--m-accent); border-color: var(--m-accent); color: #fff; font-weight: 600; }
.hbtn.primary:hover { filter: brightness(1.08); }

/* 列表 */
#listWrap { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 0 10px 12px; }
#listWrap::-webkit-scrollbar { width: 8px; }
#listWrap::-webkit-scrollbar-thumb { background: var(--m-line); border-radius: 4px; }
.trow {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 10px; cursor: pointer;
  transition: background 0.12s;
}
.trow:hover { background: var(--m-panel); }
.trow.cur { background: var(--m-panel2); }
.trow.cur .tname { color: var(--m-accent); font-weight: 600; }
.trow.dim { opacity: 0.45; }
.tidx { width: 22px; flex: none; text-align: center; font-size: 11px; color: var(--m-dim); font-variant-numeric: tabular-nums; }
.trow.cur .tidx i { color: var(--m-accent); animation: eq 0.9s ease-in-out infinite alternate; }
@keyframes eq { from { transform: scaleY(0.55); } to { transform: scaleY(1); } }
.tcover {
  width: 38px; height: 38px; border-radius: 9px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: hsla(var(--m-h, 210), 34%, 42%, 0.22); color: var(--m-sub); font-size: 13px;
  overflow: hidden;
}
.tcover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tmeta { flex: 1 1 0; min-width: 0; }
.tname { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tsub { font-size: 11px; color: var(--m-sub); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbadge {
  flex: none; font-size: 9.5px; padding: 2px 7px; border-radius: 12px;
  border: 1px solid var(--m-line); color: var(--m-sub);
}
.tbadge.src { color: var(--m-accent); border-color: color-mix(in srgb, var(--m-accent) 40%, transparent); }
.tdur { flex: none; font-size: 11px; color: var(--m-sub); font-variant-numeric: tabular-nums; width: 34px; text-align: right; }
.tact { flex: none; display: none; gap: 2px; }
.trow:hover .tact, .trow.cur .tact { display: flex; }
.ibtn {
  width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent;
  color: var(--m-sub); cursor: pointer; font-size: 11.5px; display: flex; align-items: center; justify-content: center;
  transition: background 0.12s, color 0.12s;
}
.ibtn:hover { background: var(--m-panel2); color: var(--m-text); }
.ibtn.faved { color: #e8598a; }
[data-mode="dark"] .ibtn.faved { color: #f07ba4; }
.empty {
  padding: 46px 20px; text-align: center; color: var(--m-sub); font-size: 12.5px; line-height: 2;
  border: 1px dashed var(--m-line); border-radius: 14px; margin: 8px 6px;
}
.empty i { font-size: 26px; display: block; margin-bottom: 8px; opacity: 0.5; }
.spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loadtip { padding: 26px; text-align: center; color: var(--m-sub); font-size: 12px; }

/* 歌词视图 */
#lyricsView { flex: 1 1 0; min-height: 0; display: flex; gap: 22px; padding: 12px 26px 18px; }
#lyLeft { width: 200px; flex: none; display: flex; flex-direction: column; align-items: center; padding-top: 16px; gap: 14px; }
#lyCover {
  width: 172px; height: 172px; border-radius: 20px; overflow: hidden;
  background: hsla(var(--m-h, 210), 34%, 42%, 0.2);
  display: flex; align-items: center; justify-content: center; font-size: 44px; color: var(--m-sub);
  box-shadow: 0 14px 36px rgba(0,0,0,0.18);
}
[data-mode="dark"] #lyCover { box-shadow: 0 14px 36px rgba(0,0,0,0.5); }
#lyCover img { width: 100%; height: 100%; object-fit: cover; display: block; }
#lyMeta { text-align: center; }
#lyName { font-size: 14.5px; font-weight: 700; }
#lyArtist { font-size: 11.5px; color: var(--m-sub); margin-top: 3px; }
#lyBox {
  flex: 1 1 0; min-width: 0; overflow-y: auto; position: relative;
  mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent);
  -webkit-mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent);
  padding: 26% 8px;
}
#lyBox::-webkit-scrollbar { width: 0; }
.lrc-line {
  padding: 7px 4px; font-size: 13px; color: var(--m-sub); cursor: pointer;
  transition: color 0.2s, transform 0.2s; transform-origin: left center; line-height: 1.55;
}
.lrc-line:hover { color: var(--m-text); }
.lrc-line.cur { color: var(--m-accent); font-weight: 700; font-size: 14.5px; }
.lyr-empty { color: var(--m-dim); font-size: 12.5px; text-align: center; padding-top: 40%; }

/* ---------- 底部播放条 ---------- */
#bar {
  flex: none; height: 76px; border-top: 1px solid var(--m-line);
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
  background: var(--m-panel);
}
#barCover {
  width: 52px; height: 52px; border-radius: 12px; flex: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--m-sub);
  background: hsla(var(--m-h, 210), 34%, 42%, 0.2); overflow: hidden;
  box-shadow: 0 4px 14px hsla(var(--m-h, 210), 60%, 45%, 0.25);
  transition: transform 0.2s;
}
#barCover:hover { transform: scale(1.04); }
#barCover img { width: 100%; height: 100%; object-fit: cover; display: block; }
#barInfo { width: 168px; flex: none; min-width: 0; cursor: pointer; }
#barName { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#barArtist { font-size: 11px; color: var(--m-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#barMid { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
#barBtns { display: flex; align-items: center; gap: 6px; }
.pbtn {
  width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent;
  color: var(--m-text); cursor: pointer; font-size: 12.5px;
  display: flex; align-items: center; justify-content: center; transition: background 0.12s;
}
.pbtn:hover { background: var(--m-panel2); }
.pbtn.on { color: var(--m-accent); }
#btnPlay { width: 40px; height: 40px; font-size: 15px; background: var(--m-accent); color: #fff; }
#btnPlay:hover { filter: brightness(1.1); background: var(--m-accent); }
#seekRow { display: flex; align-items: center; gap: 9px; width: 100%; max-width: 560px; }
.tstamp { font-size: 10px; color: var(--m-sub); font-variant-numeric: tabular-nums; width: 34px; flex: none; }
#seek { flex: 1 1 0; height: 14px; display: flex; align-items: center; cursor: pointer; }
#seekTrack { width: 100%; height: 4px; border-radius: 2px; background: var(--m-panel2); position: relative; overflow: visible; }
#seekFill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
  background: linear-gradient(90deg, var(--m-glow), var(--m-accent));
  transform: scaleX(0); transform-origin: left center; border-radius: 2px;
}
#seekKnob {
  position: absolute; top: 50%; left: 0; width: 11px; height: 11px; border-radius: 50%;
  background: var(--m-text); transform: translate(-50%, -50%); opacity: 0;
  transition: opacity 0.15s; box-shadow: 0 1px 5px rgba(0,0,0,0.3);
}
#seek:hover #seekKnob { opacity: 1; }
#barRight { flex: none; display: flex; align-items: center; gap: 8px; }
#qualityBtn {
  font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 7px;
  border: 1px solid var(--m-line); background: transparent; color: var(--m-sub);
  cursor: pointer; font-family: inherit; letter-spacing: 0.3px; transition: all 0.15s;
}
#qualityBtn.hq { color: var(--m-accent); border-color: color-mix(in srgb, var(--m-accent) 45%, transparent); }
#volWrap { display: flex; align-items: center; gap: 6px; }
#vol { width: 74px; accent-color: var(--m-accent); cursor: pointer; }

/* 拖放遮罩 */
#dropHint {
  position: fixed; inset: 0; z-index: 50; display: none;
  align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
  background: color-mix(in srgb, var(--m-bg) 72%, transparent); color: var(--m-accent);
  backdrop-filter: blur(6px);
}
/* ============================================================
   v2.9.54 · 液态玻璃 + 磨砂 + 全屏播放
   玻璃语言：大面积中性玻璃 + 专辑主色只做氛围点缀（禁紫令）；
   模糊层数控制到最少（性能铁律）：仅 #bar / #fsView 两处 backdrop。
   ============================================================ */

/* ---------- 氛围光斑（跟随专辑主色，低饱和慢漂移） ---------- */
body::before, body::after {
  content: ''; position: fixed; z-index: 0; border-radius: 50%;
  pointer-events: none; filter: blur(90px); opacity: 0.15;
}
body::before {
  width: 46vw; height: 46vw; left: -12vw; top: -14vw;
  background: hsl(var(--m-h, 210), 65%, 55%);
  animation: blobA 26s ease-in-out infinite alternate;
}
body::after {
  width: 40vw; height: 40vw; right: -10vw; bottom: -16vw;
  background: hsl(calc(var(--m-h, 210) + 40), 60%, 56%);
  animation: blobB 32s ease-in-out infinite alternate;
}
[data-mode="light"] body::before, [data-mode="light"] body::after { opacity: 0.10; }
@keyframes blobA { to { translate: 9vw 7vh; scale: 1.15; } }
@keyframes blobB { to { translate: -8vw -6vh; scale: 0.9; } }
#app { position: relative; z-index: 1; }

/* ---------- 液态玻璃底座 ---------- */
#bar {
  background: color-mix(in srgb, var(--m-bg) 52%, transparent);
  backdrop-filter: blur(var(--glass-blur, 22px)) saturate(1.35);
  -webkit-backdrop-filter: blur(var(--glass-blur, 22px)) saturate(1.35);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
}
[data-mode="light"] #bar { box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); }
/* 跟随宿主玻璃材质：solid 时完全不透明、无模糊 */
body.mat-solid #bar {
  background: var(--m-bg);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
#headSearch input { backdrop-filter: blur(calc(var(--glass-blur, 22px) * 0.5)); -webkit-backdrop-filter: blur(calc(var(--glass-blur, 22px) * 0.5)); }

/* 按压回弹（独立 scale 属性，不打架原有过渡） */
.pbtn, .ibtn, .hbtn, .chip, .nav-item { transition: background 0.15s, color 0.15s, border-color 0.15s, scale 0.15s ease; }
.pbtn:active, .ibtn:active, .hbtn:active, .chip:active, .nav-item:active { scale: 0.92; }

/* 列表行进入动画（innerHTML 重排自动触发） */
.trow { animation: rowIn 0.26s ease both; }
@keyframes rowIn { from { opacity: 0; translate: 0 7px; } to { opacity: 1; translate: 0 0; } }

/* 行 hover 玻璃高光 */
.trow { transition: background 0.12s, scale 0.15s ease; }
.trow:hover { background: var(--m-panel); }
.trow:active { scale: 0.995; }

/* ---------- 全屏播放 ---------- */
#fsView {
  --fs-text: #f4f6fa;
  --fs-sub: rgba(244,246,250,0.62);
  --fs-accent: hsl(var(--m-h, 210), 88%, 70%);
  position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; overflow: hidden;
  opacity: 0; translate: 0 16px; scale: 0.985;
  transition: opacity 0.32s ease, translate 0.32s ease, scale 0.32s ease;
}
#fsView.open { opacity: 1; translate: 0 0; scale: 1; }
[data-mode="light"] #fsView { --fs-text: #131c28; --fs-sub: rgba(19,28,40,0.62); --fs-accent: hsl(var(--m-h, 210), 75%, 36%); }

/* 渐变背景：专辑主色三光斑 + 缓慢漂移 */
.fs-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fs-bg::before {
  content: ''; position: absolute; inset: -18%;
  background:
    radial-gradient(58% 68% at 22% 26%, hsl(var(--m-h, 210) 60% 46% / 0.52), transparent 62%),
    radial-gradient(50% 60% at 80% 70%, hsl(calc(var(--m-h, 210) + 42) 55% 50% / 0.44), transparent 60%),
    radial-gradient(66% 76% at 52% 104%, hsl(calc(var(--m-h, 210) - 28) 48% 42% / 0.34), transparent 64%);
  animation: fsDrift 30s ease-in-out infinite alternate;
}
@keyframes fsDrift { to { rotate: 4deg; scale: 1.08; translate: -2% -3%; } }
[data-mode="light"] .fs-bg::before { opacity: 0.44; }
[data-mode="dark"] #fsView { background: color-mix(in srgb, hsl(var(--m-h, 210) 45% 7%) 78%, #0a0c10); }
[data-mode="light"] #fsView { background: color-mix(in srgb, hsl(var(--m-h, 210) 55% 92%) 70%, #eef2f8); }

.fs-close { position: absolute; top: 2.6vh; right: 2.4vw; z-index: 3; color: var(--fs-text); }
.fs-close:hover { background: rgba(127,142,160,0.18); }

.fs-main { flex: 1 1 0; min-height: 0; display: flex; gap: 5vw; padding: 5vh 5vw 0; position: relative; z-index: 1; }
.fs-left { width: min(33vh, 30vw); flex: none; display: flex; flex-direction: column; align-items: center; gap: 2.8vh; padding-top: 1.5vh; }

/* 黑胶胶片：纹理盘旋转，中心专辑封面 */
.fs-disc {
  width: 100%; aspect-ratio: 1; max-width: min(33vh, 30vw); border-radius: 50%; position: relative;
  background:
    radial-gradient(circle at 50% 50%, #141416 0 8%, transparent 8.2%),
    repeating-radial-gradient(circle at 50% 50%, #26262a 0 2px, #1d1d20 2px 4px);
  box-shadow: 0 18px 60px hsl(var(--m-h, 210) 55% 38% / 0.45), inset 0 0 0 1px rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: center;
  animation: discSpin 16s linear infinite; animation-play-state: paused;
}
#fsView.playing .fs-disc { animation-play-state: running; }
@keyframes discSpin { to { rotate: 360deg; } }
/* 液态反光：黑胶盘上的斜向高光，转动时像光线在流动 */
.fs-disc::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: linear-gradient(125deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 34%, transparent 58%, rgba(255,255,255,0.07) 100%);
}
.fs-disc-img {
  width: 37%; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
  background: hsl(var(--m-h, 210) 40% 42%);
  box-shadow: 0 0 0 4px #0e0e10, 0 0 26px rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center; color: #9aa2ad; font-size: 24px;
}
[data-mode="light"] .fs-disc-img { box-shadow: 0 0 0 4px #101216, 0 6px 20px rgba(0,0,0,0.35); }
.fs-disc-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

.fs-meta { text-align: center; max-width: 100%; }
#fsName { font-size: clamp(15px, 2.3vh, 21px); font-weight: 800; color: var(--fs-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: min(33vh, 30vw); }
#fsArtist { font-size: clamp(11px, 1.7vh, 13px); color: var(--fs-sub); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: min(33vh, 30vw); }

/* 右侧歌词：行按距离淡出/虚化，当前行放大点亮（渐显渐隐） */
.fs-right { flex: 1 1 0; min-width: 0; position: relative; }
.fs-lrc {
  position: absolute; inset: 0; overflow: hidden;
  mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent);
  -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent);
}
.fs-lrc-inner { position: absolute; left: 0; right: 0; top: 0; padding: 44% 6px; transition: translate 0.55s cubic-bezier(0.22, 1, 0.36, 1); }
.fs-line {
  padding: 2vh 4px; font-size: clamp(15px, 2.9vh, 22px); line-height: 1.5; font-weight: 600;
  color: var(--fs-text); opacity: 0.34; filter: blur(0.9px); cursor: pointer; transform-origin: left center;
  transition: opacity 0.45s ease, filter 0.45s ease, scale 0.45s ease;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fs-line:hover { opacity: 0.75; }

  /* ==================== 基础 ==================== */

  /* ==================== 工具 ==================== */
  function fmt(t) { if (!isFinite(t) || t < 0) t = 0; var m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }

    s = String(s || 'x'); var h = 0;

  function mApi(path) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 8000);
    return fetch(MUSIC_BASE + '/api/music' + path, { signal: ctl.signal })
      .then(function (res) {
        clearTimeout(timer);
        return res.json().catch(function () { throw new Error('服务端返回不是 JSON'); });
      })
      .then(function (j) {
        if (j && j.ok) return j;

      })
      .catch(function (e) {

      });
  }
  function showBanner(text) {

  }

  /* ==================== 本地曲库 ==================== */
  function addLocalFile(name, url) {
    var m = /^(.*?)\s*[-–—]\s*(.+?)\.[a-z0-9]+$/i.exec(name);
    var title = m ? m[2] : name.replace(/\.[a-z0-9]+$/i, '');

    S.tracks.push({ id: 'local:' + name + ':' + S.tracks.length, src: 'local', name: title, artist: artist, album: '本地音乐', cover: '', dur: 0, _url: url, hue: hueOf(name) });
  }
  function scanFS() {
    N.getUserLS('filesystem').then(function (fs) {
      if (!fs) return;
      (function walk(node) {
        Object.keys(node || {}).forEach(function (k) {
          var ch = node[k];
          if (!ch || typeof ch !== 'object') return;
          if (ch.type === 'file' || ch.content != null) {

  }

  /* ==================== 收藏（内存缓存 + 异步持久化，桥为 Promise 接口） ==================== */
  function favKey(t) { return (t.src || 'local') + ':' + t.id; }

  function isFav(t) { var k = favKey(t); return S.fav.some(function (x) { return favKey(x) === k; }); }

  function resolvePlay(t) {

    return mApi('/url?src=' + t.src + '&id=' + encodeURIComponent(t.id) + '&br=' + br).then(function (j) {

      return MUSIC_BASE + j.play;

  }

    if (list) { S.queue = list.slice(); S.qi = idx; }
    else {
      var i = S.queue.findIndex(function (x) { return x === t || (x.id === t.id && x.src === t.src); });
      if (i >= 0) S.qi = i;
      else { S.queue.splice(S.qi + 1, 0, t); S.qi++; }
    }
    S.cur = t; S.failCount = 0; S.lrc = []; S.lrcIdx = -1;
    applyHue(t);

    el('btnPlay').innerHTML = '<i class="fas fa-spinner spin" aria-hidden="true"></i>';

    resolvePlay(t).then(function (url) {

      audio.src = url;
      return audio.play().then(function () { S.failCount = 0; });
    }).catch(function (err) {

      resetPlayBtn();
      if (err && err.reason === 'vip') {

      } else if (err && err.reason === 'offline') {
        N.notify(T('nf_off_title'), T('nf_off_body'), 'warning');
      } else {
        N.notify(T('nf_fail_title'), T('nf_fail_body', t.name), 'error');
        next(true);

  /* ==================== 歌词 ==================== */
  function parseLrc(text) {

    el('boardChips').style.display = S.view === 'toplist' ? 'flex' : 'none';
    el('btnAdd').style.display = (S.view === 'library' || S.view === 'fav' || S.view === 'queue') ? 'flex' : 'none';

    document.querySelectorAll('.nav-item').forEach(function (n) {
      n.classList.toggle('on', n.dataset.view === S.view);
    });

    var _vt = { library: 'view_library', search: 'view_online', toplist: 'view_toplist', fav: 'view_fav', queue: 'view_queue', lyrics: 'view_playing' }[S.view];
    el('viewTitle').textContent = T(_vt) || T('doc_title');
    var sub = '';
    var html = '';

    if (S.view === 'library') {
      sub = S.tracks.length ? T('sub_lib', S.tracks.length) : '';
      html = listHtml(S.tracks,
        '<i class="fas fa-folder-open" aria-hidden="true"></i>' + T('empty_library'));
    } else if (S.view === 'search') {
      sub = S.onlineLabel;
      if (S.searching) html = '<div class="loadtip"><i class="fas fa-spinner spin"></i> ' + T('searching') + '</div>';
      else html = listHtml(S.online,
        '<i class="fas fa-magnifying-glass" aria-hidden="true"></i>' + (alive()
          ? T('empty_search')
          : T('empty_search_off')));
    } else if (S.view === 'toplist') {
      sub = S.onlineLabel;
      if (S.searching) html = '<div class="loadtip"><i class="fas fa-spinner spin"></i> ' + T('loading_board') + '</div>';
      else html = listHtml(S.online,
        '<i class="fas fa-ranking-star" aria-hidden="true"></i>' + T(alive() ? 'empty_board' : 'empty_board_off'));
    } else if (S.view === 'fav') {
      var favs = favList();
      sub = favs.length ? T('sub_fav', favs.length) : '';
      html = listHtml(favs, '<i class="fas fa-heart" aria-hidden="true"></i>' + T('empty_fav'));
    } else if (S.view === 'queue') {
      sub = S.queue.length ? T('sub_queue', S.queue.length) : '';
      html = S.queue.length
        ? S.queue.map(function (t, i) {
            var cur = i === S.qi;
            return '<div class="trow' + (cur ? ' cur' : '') + '" data-i="' + i + '" role="button" tabindex="0" aria-label="播放 ' + esc(t.name) + '">'
              + '<div class="tidx">' + (i + 1) + '</div>'
              + '<div class="tcover" style="--m-h:' + (t.hue != null ? t.hue : hueOf(t.id || t.name)) + '">' + (t.cover ? '<img src="' + esc(t.cover) + '" alt="" loading="lazy" onerror="this.remove()">' : '<i class="fas fa-compact-disc" aria-hidden="true"></i>') + '</div>'
              + '<div class="tmeta"><div class="tname">' + esc(t.name) + '</div><div class="tsub">' + esc(t.artist) + '</div></div>'
              + '<span class="tdur">' + (t.dur ? fmt(t.dur) : '') + '</span>'
              + '<div class="tact"><button class="ibtn" data-act="delq" title="' + T('row_delq') + '" aria-label="' + T('row_delq') + '"><i class="fas fa-xmark" aria-hidden="true"></i></button></div></div>';
          }).join('')
        : '<div class="empty"><i class="fas fa-list-ol" aria-hidden="true"></i>' + T('empty_queue') + '</div>';
    }
    if (S.view !== 'lyrics') wrap.innerHTML = html;
    updateCounts();
  }

  function switchView(v) {
    S.view = v;
    hideBanner();
    if (v === 'toplist' && !(S.online._isBoard)) loadBoard(S.board);
    renderView();
    if (v === 'search') el('searchInput').focus();
  }

  /* ==================== 在线数据 ==================== */
  function doSearch(q) {
    if (!alive()) { renderView(); return; }
    S.searching = true; S.online = []; S.onlineLabel = ''; renderView();
    mApi('/search?q=' + encodeURIComponent(q) + '&limit=30').then(function (j) {
      S.searching = false;
      S.online = (j.tracks || []).map(function (t) { t.hue = hueOf(t.id || t.name); return t; });
      S.online._isBoard = false;
      S.onlineLabel = T('search_found', S.online.length) + srcName(j.src);
      renderView();
    }).catch(function () {
      S.searching = false; renderView();
    });
  }

  function loadBoard(board) {
    if (!alive()) { renderView(); return; }
    S.board = board; S.searching = true; S.online = []; S.onlineLabel = '';
    document.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c.dataset.board === board); });
    renderView();
    mApi('/toplist?board=' + board).then(function (j) {
      S.searching = false;
      S.online = (j.tracks || []).map(function (t) { t.hue = hueOf(t.id || t.name); return t; });
      S.online._isBoard = true;
      var _bn = { hot: T('board_hot_name'), new: T('board_new_name'), up: T('board_up_name') };
      S.onlineLabel = _bn[board] || '';
      renderView();
    }).catch(function () { S.searching = false; renderView(); });
  }

  /* ==================== 事件绑定 ==================== */

  document.querySelectorAll('.nav-item').forEach(function (n) {
    n.addEventListener('click', function () { switchView(n.dataset.view); });
  });
  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () { loadBoard(c.dataset.board); });
  });

  var searchTimer = null;
  el('searchInput').addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(searchTimer);
    if (!v) { S.online = []; S.onlineLabel = ''; S.searching = false; renderView(); return; }
    searchTimer = setTimeout(function () { doSearch(v); }, 400);
  });

  function currentList() {
    if (S.view === 'library') return S.tracks;
    if (S.view === 'search' || S.view === 'toplist') return S.online;
    if (S.view === 'fav') return favList();
    if (S.view === 'queue') return S.queue;
    return S.tracks;
  }

  el('listWrap').addEventListener('click', function (e) {
    var actBtn = e.target.closest('.ibtn');
    var row = e.target.closest('.trow');
    if (actBtn && row) {
      e.stopPropagation();
      var i = parseInt(row.dataset.i, 10);
      var t = currentList()[i];
      if (!t) return;
      if (actBtn.dataset.act === 'fav') {
        var added = toggleFav(t);
        actBtn.classList.toggle('faved', added);
        actBtn.innerHTML = '<i class="' + (added ? 'fas' : 'far') + ' fa-heart" aria-hidden="true"></i>';
        if (added) N.notify(T('nf_faved'), t.name + ' — ' + t.artist, 'success');
      } else if (actBtn.dataset.act === 'queue') {
        S.queue.splice(S.qi + 1, 0, plainTrack(t));
        N.notify(T('nf_queue'), t.name, 'info');
        updateCounts();
      } else if (actBtn.dataset.act === 'delq') {
        S.queue.splice(i, 1);
        if (i < S.qi) S.qi--;
        updateCounts(); renderView();
      }
      return;
    }
    if (row) {
      var i2 = parseInt(row.dataset.i, 10);
      var list2 = currentList();
      if (list2[i2]) playTrack(list2[i2], list2, i2);
    }
  });

  el('lyBox').addEventListener('click', function (e) {
    var line = e.target.closest('.lrc-line');
    if (line && audio.src) audio.currentTime = parseFloat(line.dataset.t);
  });

  el('btnPlay').addEventListener('click', togglePlay);
  el('btnNext').addEventListener('click', function () { next(false); });
  el('btnPrev').addEventListener('click', prev);
  el('btnShuffle').addEventListener('click', function () {
    S.shuffle = !S.shuffle;
    this.classList.toggle('on', S.shuffle);
    this.style.color = S.shuffle ? 'var(--m-accent)' : '';
  });
  el('btnRepeat').addEventListener('click', function () {
    S.repeat = (S.repeat + 1) % 3;
    this.classList.toggle('on', S.repeat > 0);
    this.style.color = S.repeat > 0 ? 'var(--m-accent)' : '';
    this.title = T('title_repeat') + '（当前：' + [T('loop_off'), T('loop_list'), T('loop_single')][S.repeat] + '）';
  });
  function togglePlay() {
    if (!audio.src) {
      if (S.queue.length) playTrack(S.queue[Math.max(0, S.qi)]);
      else if (S.tracks.length) playTrack(S.tracks[0], S.tracks, 0);
      return;
    }
    if (audio.paused) audio.play().catch(function () {}); else audio.pause();
  }

  /* 音质（设置项，持久化） */
  el('qualityBtn').addEventListener('click', function () {
    settingsTouched = true;
    settings.quality = settings.quality === '128' ? '320' : '128';
    this.textContent = settings.quality + 'k';
    this.classList.toggle('hq', settings.quality === '320');
    saveSettings();
    N.notify(T('nf_quality'), T('nf_quality_body', settings.quality + 'k'), 'info');
  });
  el('qualityBtn').textContent = settings.quality + 'k';
  el('qualityBtn').classList.toggle('hq', settings.quality === '320');

  /* 音量（持久化） */
  var vol = el('vol');
  vol.value = Math.round(settings.volume * 100);
  audio.volume = settings.volume;
  vol.addEventListener('input', function () {
    settingsTouched = true;
    audio.volume = this.value / 100;
    settings.volume = audio.volume;
    clearTimeout(vol._t); vol._t = setTimeout(saveSettings, 400);
  });

  /* 进度条（scaleX，不触发 layout）；底部条与全屏条共用同一套逻辑 */
  var seek = el('seek');
  function seekToEl(seekEl, e) {
    if (!audio.duration || !isFinite(audio.duration)) return;
    var r = seekEl.getBoundingClientRect();
    var p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    audio.currentTime = p * audio.duration;
    paintProgress(p, audio.duration);
  }
  function bindSeek(seekEl) {
    seekEl.addEventListener('pointerdown', function (e) {
      S.seekDrag = true;
      try { seekEl.setPointerCapture(e.pointerId); } catch (er) {}
      seekToEl(seekEl, e);
    });
    seekEl.addEventListener('pointermove', function (e) { if (S.seekDrag) seekToEl(seekEl, e); });
    seekEl.addEventListener('pointerup', function () { S.seekDrag = false; });
    seekEl.addEventListener('pointercancel', function () { S.seekDrag = false; });
  }
  bindSeek(seek);
  bindSeek(el('fsSeek'));
  function paintProgress(p, dur) {
    var x = 'scaleX(' + p.toFixed(4) + ')';
    el('seekFill').style.transform = x;
    el('seekKnob').style.left = (p * 100).toFixed(2) + '%';
    el('tCur').textContent = fmt(dur * p);
    el('tDur').textContent = fmt(dur);
    el('fsFill').style.transform = x;
    el('fsKnob').style.left = (p * 100).toFixed(2) + '%';
    el('fsCur').textContent = fmt(dur * p);
    el('fsDur').textContent = fmt(dur);
  }

  /* audio 事件 */
  audio.addEventListener('timeupdate', function () {
    if (S.seekDrag || !audio.duration || !isFinite(audio.duration)) return;
    paintProgress(audio.currentTime / audio.duration, audio.duration);
    syncLrc(audio.currentTime);
    broadcastNow();
  });
  audio.addEventListener('loadedmetadata', function () {
    if (S.cur) S.cur.dur = Math.round(audio.duration);
    el('tDur').textContent = fmt(audio.duration);
    el('fsDur').textContent = fmt(audio.duration);
    broadcastNow(true);
  });
  audio.addEventListener('play', function () {
    S.playing = true;
    el('playIcon').className = 'fas fa-pause';
    paintFsState();
    broadcastNow(true);
    if (S.cur && S.view === 'lyrics' && !S.lrc.length && !S.loadingLrc) loadLrc(S.cur);
    setupMediaSession();
  });
  audio.addEventListener('pause', function () {
    S.playing = false;
    el('playIcon').className = 'fas fa-play';
    paintFsState();
    broadcastNow(true);
  });
  audio.addEventListener('ended', function () { next(true); });
  audio.addEventListener('error', function () {
    if (!S.cur || !audio.src) return;
    S.failCount++;
    if (S.failCount >= 3) {
      S.failCount = 0;
      resetPlayBtn();
      N.notify(T('nf_paused_title'), T('nf_paused_body'), 'warning');
      return;
    }
    N.notify(T('nf_fail_title'), T('nf_fail_body', S.cur.name), 'error');
    next(true);
  });

  /* 歌词视图入口 */
  function openLyrics() {
    if (!S.cur) { N.notify(T('nf_tip'), T('nf_tip_body'), 'info'); return; }
    S.view = 'lyrics';
    document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.remove('on'); });
    renderView();
    el('viewTitle').textContent = T('view_playing');
    if (!S.lrc.length && !S.loadingLrc) loadLrc(S.cur);
    paintLyrics();
  }
  el('barCover').addEventListener('click', openLyrics);
  el('barInfo').addEventListener('click', openLyrics);
  el('barCover').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') openLyrics(); });

  /* 键盘：Esc 回列表；空格播放；←→ 快退快进 */
  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement && document.activeElement.tagName;
    var inInput = tag === 'INPUT' || tag === 'TEXTAREA';
    if (e.key === 'Escape' && S.fsOpen) { closeFs(); return; }
    if (e.key === 'Escape' && S.view === 'lyrics') { switchView('library'); return; }
    if (inInput) return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowLeft' && audio.duration) audio.currentTime = Math.max(0, audio.currentTime - 5);
    else if (e.key === 'ArrowRight' && audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
  });

  /* 本地导入 */
  el('btnAdd').addEventListener('click', function () { el('filePicker').click(); });
  el('filePicker').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
  function addFiles(files) {
    var n = 0;
    Array.prototype.forEach.call(files || [], function (f) {
      if (AUD_EXT.indexOf(extOf(f.name)) === -1) return;
      addLocalFile(f.name, URL.createObjectURL(f)); n++;
    });
    if (n) {
      N.notify(T('nf_added'), T('nf_added_body', n), 'success');
      if (S.view !== 'library') switchView('library'); else renderView();
    }
  }
  var drop = el('dropHint'), dragDepth = 0;
  document.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; drop.style.display = 'flex'; });
  document.addEventListener('dragleave', function () { if (--dragDepth <= 0) { dragDepth = 0; drop.style.display = 'none'; } });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; drop.style.display = 'none';
    addFiles(e.dataTransfer.files);
  });

  /* ==================== 全屏播放 ==================== */
  function openFs() {
    if (S.fsOpen) return;
    S.fsOpen = true;
    var fv = el('fsView');
    fv.style.display = 'flex';
    requestAnimationFrame(function () { requestAnimationFrame(function () { fv.classList.add('open'); }); });
    paintFsMeta(); paintFsState(); paintFsLrc();
    if (audio.duration && isFinite(audio.duration)) paintProgress(audio.currentTime / audio.duration, audio.duration);
  }
  function closeFs() {
    if (!S.fsOpen) return;
    S.fsOpen = false;
    var fv = el('fsView');
    fv.classList.remove('open');
    setTimeout(function () { if (!S.fsOpen) fv.style.display = 'none'; }, 330);
  }
  el('btnFs').addEventListener('click', openFs);
  el('btnFsExit').addEventListener('click', closeFs);
  el('fsPlay').addEventListener('click', togglePlay);
  el('fsPrev').addEventListener('click', prev);
  el('fsNext').addEventListener('click', function () { next(false); });
  /* 全屏歌词行点击跳转进度 */
  el('fsLrcInner').addEventListener('click', function (e) {
    var line = e.target.closest('.fs-line');
    if (!line) return;
    var t = parseFloat(line.dataset.t);
    if (isFinite(t) && audio.duration) { audio.currentTime = t; syncLrc(t); }
  });

  function paintFsMeta() {
    var t = S.cur;
    el('fsName').textContent = t ? t.name : T('not_playing');
    el('fsArtist').textContent = t ? t.artist : '';
    var c = el('fsCover');
    if (t && t.cover) c.innerHTML = '<img src="' + esc(t.cover) + '" alt="" onerror="this.replaceWith(document.createTextNode(\'\'))">';
    else c.innerHTML = '<i class="fas fa-compact-disc"></i>';
  }
  function paintFsState() {
    el('fsView').classList.toggle('playing', S.playing);
    el('fsPlayIcon').className = S.playing ? 'fas fa-pause' : 'fas fa-play';
  }
  /* 全屏歌词渲染：行渐显渐隐（cur 放大点亮 + pop 动画，远行虚化） */
  function paintFsLrc() {
    var box = el('fsLrcInner'), empty = el('fsLrcEmpty');
    if (S.loadingLrc) { box.innerHTML = ''; empty.style.display = 'block'; empty.textContent = T('loading_lyrics'); return; }
    if (!S.lrc.length) { box.innerHTML = ''; empty.style.display = 'block'; empty.textContent = T('no_lyrics'); return; }
    empty.style.display = 'none';
    box.innerHTML = S.lrc.map(function (l) {
      return '<div class="fs-line" data-t="' + l.t + '">' + esc(l.text) + '</div>';
    }).join('');
    syncFsLrc();
  }
  function syncFsLrc() {
    var box = el('fsLrcInner');
    var lines = box.children;
    if (!lines.length) return;
    var idx = S.lrcIdx;
    for (var k = 0; k < lines.length; k++) {
      lines[k].classList.toggle('cur', k === idx);
      /* 还没走到第一句（idx<0）：首行给「即将到来」的可见度，避免整屏糊成一片 */
      lines[k].classList.toggle('near', (idx >= 0 && Math.abs(k - idx) === 1) || (idx < 0 && k === 0));
    }
    if (idx >= 0 && lines[idx]) {
      var off = lines[idx].offsetTop + lines[idx].offsetHeight / 2 - el('fsLrc').clientHeight / 2;
      box.style.translate = '0 ' + (-off) + 'px';
    }
  }

  /* ==================== 后台播放 + 桌面小主页联动 ==================== */
  /* 状态广播：n26MusicNow（600ms 节流），桌面「音乐控制」部件读它渲染真进度 */
  var lastBroadcast = 0;
  function broadcastNow(force) {
    var now = Date.now();
    if (!force && now - lastBroadcast < 600) return;
    lastBroadcast = now;
    var t = S.cur;
    var payload = {
      name: t ? t.name : '', artist: t ? t.artist : '', album: t ? (t.album || '') : '',
      cover: t ? (t.cover || '') : '', hue: t ? (t.hue != null ? t.hue : hueOf(t.id || t.name)) : 210,
      dur: (audio.duration && isFinite(audio.duration)) ? Math.round(audio.duration) : (t ? (t.dur || 0) : 0),
      pos: audio.currentTime || 0, playing: !!(S.playing && t),
      ts: now
    };
    try { localStorage.setItem('n26MusicNow', JSON.stringify(payload)); } catch (e) {}
  }
  /* 小主页控制命令（storage 事件跨 frame 广播） */
  window.addEventListener('storage', function (e) {
    if (e.key !== 'n26MusicCmd' || !e.newValue) return;
    var cmd = null;
    try { cmd = JSON.parse(e.newValue); } catch (er) { return; }
    if (!cmd) return;
    if (cmd.act === 'toggle') togglePlay();
    else if (cmd.act === 'next') next(false);
    else if (cmd.act === 'prev') prev();
    else if (cmd.act === 'fs') openFs();
  });
  /* 关窗移交：音频正播时把状态交给宿主全局音频，实现后台播放 */
  window.addEventListener('pagehide', function () {
    if (!audio.src || audio.paused) { try { localStorage.removeItem('n26MusicBg'); } catch (e) {} return; }
    var t = S.cur;
    var bg = {
      src: audio.src, pos: audio.currentTime || 0, playing: !audio.paused,
      name: t ? t.name : '', artist: t ? t.artist : '', cover: t ? (t.cover || '') : '',
      dur: (audio.duration && isFinite(audio.duration)) ? Math.round(audio.duration) : 0,
      hue: t ? (t.hue != null ? t.hue : 210) : 210, ts: Date.now()
    };
    try { localStorage.setItem('n26MusicBg', JSON.stringify(bg)); } catch (e) {}
    try { parent.postMessage({ __nexusBgAudio: bg }, '*'); } catch (e) {}
  });
  /* 再打开 → 无缝接管回后台音频 */
  function takeOverBg() {
    var bg = null;
    try { bg = JSON.parse(localStorage.getItem('n26MusicBg') || 'null'); } catch (e) {}
    if (!bg || !bg.src) return;
    S.cur = { id: 'bg:' + (bg.name || 'x'), src: 'netease', name: bg.name || '后台音乐', artist: bg.artist || '', album: '', cover: bg.cover || '', dur: bg.dur || 0, hue: bg.hue || 210, _bg: true };
    S.queue = [S.cur]; S.qi = 0;
    audio.src = bg.src;
    paintBar(); renderView();
    if (bg.playing) {
      audio.play().then(function () {
        if (isFinite(bg.pos) && bg.pos > 0) { try { audio.currentTime = bg.pos; } catch (e) {} }
      }).catch(function () {});
      N.notify(T('nf_takeover_title'), T('nf_takeover_body', bg.name || ''), 'success');
    } else {
      audio.addEventListener('loadedmetadata', function once() {
        try { audio.currentTime = bg.pos || 0; } catch (e) {}
        audio.removeEventListener('loadedmetadata', once);
      });
    }
    try { localStorage.removeItem('n26MusicBg'); } catch (e) {}
    try { parent.postMessage({ __nexusMusicCmd: 'bg-stop' }, '*'); } catch (e) {}
  }

  /* ==================== 多语言热切换（v2.9.57） ==================== */
  N.onLanguageChange(function () {
    renderView();
    paintBar();
    if (S.view === 'lyrics') paintLyrics();
    if (S.fsOpen) { paintFsMeta(); paintFsLrc(); }
    el('btnRepeat').title = T('title_repeat') + '（当前：' + [T('loop_off'), T('loop_list'), T('loop_single')][S.repeat] + '）';
  });

  /* ==================== 启动 ==================== */
  scanFS();
  takeOverBg();
  N.getUserLS(FAV_KEY).then(function (l) {
    S.fav = Array.isArray(l) ? l : [];
    updateCounts();
    if (S.view === 'fav' || S.view === 'library') renderView();
  }).catch(function () {});
  renderView();
  paintBar();
})();
</script>
</body>
</html>
