<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小游戏合集</title>
<script src="_bridge.js"></script>
<script src="_app.js"></script>
<style>
  :root {
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --primary: #f97316;
    --primary2: #fb923c;
    --gm-bg: rgba(250, 248, 245, 0.94);
    --card: rgba(255, 255, 255, 0.85);
    --line: rgba(15, 23, 42, 0.09);
    --gm-text: #1a1f2b;
    --sub: rgba(30, 41, 59, 0.55);
  }
  body.dark-mode {
    --gm-bg: rgba(13, 15, 24, 0.94);
    --card: rgba(30, 34, 48, 0.66);
    --line: rgba(255, 255, 255, 0.09);
    --gm-text: #f1f5f9;
    --sub: rgba(226, 232, 240, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--gm-bg); color: var(--gm-text); overflow: hidden;
    display: flex; flex-direction: column;
    transition: background 0.3s var(--ease-out), color 0.3s var(--ease-out);
  }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 13px 18px 9px; flex: none; }
  .app-icon { width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #fb923c, #f97316); display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 15px; box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4); }
  .app-title { font-size: 15px; font-weight: 700; }
  .app-sub { font-size: 11px; color: var(--sub); margin-top: 1px; }
  .count { margin-left: auto; font-size: 12px; color: var(--sub); }

  .controls { display: flex; gap: 10px; align-items: center; padding: 4px 18px 12px; flex: none; flex-wrap: wrap; }
  .search { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px; background: var(--card);
    border: 1px solid var(--line); border-radius: 11px; padding: 8px 12px; }
  .search input { border: none; background: transparent; outline: none; color: var(--gm-text); font-size: 13px; width: 100%; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--sub); border-radius: 20px;
    padding: 6px 13px; font-size: 12px; cursor: pointer; transition: all 0.22s var(--ease-out); }
  .chip:hover { color: var(--gm-text); }
  .chip.active { background: linear-gradient(135deg, #fb923c, #f97316); color: #fff; border-color: transparent; }
  .btn-rand { border: none; background: linear-gradient(135deg, #fb923c, #f97316); color: #fff; border-radius: 11px;
    padding: 8px 15px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px;
    transition: transform 0.2s var(--ease-spring); }
  .btn-rand:hover { transform: translateY(-2px); }

  .content { flex: 1; overflow: auto; padding: 6px 18px 22px; }
  .content::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-thumb { background: rgba(120,130,150,0.3); border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px;
    cursor: pointer; text-align: center; transition: transform 0.26s var(--ease-spring), box-shadow 0.26s var(--ease-out);
    animation: gi 0.4s var(--ease-out) backwards;
    display: flex; flex-direction: column; align-items: center;
    min-height: 116px; }
  @keyframes gi { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: none; } }
  .game:hover { transform: translateY(-5px); box-shadow: 0 12px 28px rgba(0,0,0,0.14); }
  .game:active { transform: translateY(-2px) scale(0.985); }
  /* emoji 当图标用必须套固定方盒：不同 emoji 的字形高度/宽度差别很大，
     直接当文本渲染会让卡片看着一排高一排低（和启动台图标那个坑同源）。 */
  .game .em {
    width: 46px; height: 46px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; line-height: 1; margin-bottom: 8px;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(251,146,60,0.14), rgba(249,115,22,0.06));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
  }
  body.dark-mode .game .em { background: linear-gradient(180deg, rgba(251,146,60,0.2), rgba(249,115,22,0.08)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
  .game .nm { font-size: 13px; font-weight: 700; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    max-width: 100%; }
  .game .cat { font-size: 10.5px; color: var(--sub); margin-top: 4px;
    padding: 1px 8px; border-radius: 999px; background: rgba(120,130,150,0.12); }
  .game .recent {
    position: absolute; top: 8px; right: 9px;
    font-size: 9px; font-weight: 700; letter-spacing: .3px;
    color: #b45309; background: rgba(251,191,36,0.22);
    padding: 1px 6px; border-radius: 99px;
  }
  .game { position: relative; }
  .empty { text-align: center; color: var(--sub); padding: 50px 20px; }
  .empty i { font-size: 38px; opacity: 0.35; }

  /* 游戏播放器 */
  .player { position: fixed; inset: 0; background: rgba(8,10,18,0.9); backdrop-filter: blur(16px);
    display: none; flex-direction: column; z-index: 60; animation: pf 0.28s var(--ease-out); }
  .player.show { display: flex; }
  @keyframes pf { from { opacity: 0; } to { opacity: 1; } }
  .player-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; flex: none; }
  .player-bar .pn { font-size: 15px; font-weight: 700; color: #fff; }
  .player-bar .pc { font-size: 12px; color: rgba(255,255,255,0.6); }
  .player-bar .sp { margin-left: auto; }
  .pbtn { border: none; border-radius: 10px; background: rgba(255,255,255,0.14); color: #fff; font-size: 13px;
    padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: background 0.2s; }
  .pbtn:hover { background: rgba(255,255,255,0.28); }
  .pbtn.close { background: rgba(239,68,68,0.8); }
  .player-frame { flex: 1; margin: 0 16px 16px; border-radius: 14px; overflow: hidden; background: #fff; position: relative; }
  .player-frame iframe { width: 100%; height: 100%; border: none; }
  .player-loading {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(250, 250, 252, 0.96); color: #475569; font-size: 12.5px;
    opacity: 1; transition: opacity 0.25s var(--ease-out);
  }
  .player-loading.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2.5px solid rgba(100,116,139,0.22); border-top-color: #f97316;
    animation: sp 0.75s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(16px);
    background: rgba(20,22,32,0.9); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 12.5px;
    opacity: 0; transition: all 0.35s var(--ease-spring); z-index: 99; backdrop-filter: blur(14px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="app-icon"><i class="fas fa-gamepad"></i></div>
    <div><div class="app-title">小游戏合集</div><div class="app-sub">小方工作室 · 全部小游戏即点即玩</div></div>
    <div class="count" id="count"></div>
  </div>

  <div class="controls">
    <div class="search"><i class="fas fa-search" style="color:var(--sub)"></i>
      <input id="q" placeholder="搜索游戏…" oninput="applyFilter()"></div>
    <div class="chips" id="chips"></div>
    <button class="btn-rand" onclick="randomGame()"><i class="fas fa-dice"></i>随机一局</button>
  </div>

  <div class="content">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;"><i class="fas fa-gamepad"></i><div>没有匹配的游戏</div></div>
  </div>

  <!-- 播放器 -->
  <div class="player" id="player">
    <div class="player-bar">
      <span class="pn" id="pName"></span>
      <span class="pc" id="pCat"></span>
      <span class="sp"></span>
      <button class="pbtn" onclick="openExternal()"><i class="fas fa-external-link-alt"></i>新窗口打开</button>
      <button class="pbtn close" onclick="closePlayer()"><i class="fas fa-times"></i>返回</button>
    </div>
    <div class="player-frame"><iframe id="pFrame" allow="autoplay; fullscreen"></iframe>
      <div class="player-loading" id="pLoading"><div class="spinner"></div><div>正在载入游戏…</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  // 小方工作室「工具与小游戏」页全部小游戏（section id 对应源文件锚点）
  var GAMES = [
    { id:'eluosi', name:'俄罗斯小方', cat:'休闲益智', em:'🧱' },
    { id:'tanchi', name:'贪吃方', cat:'休闲益智', em:'🐍' },
    { id:'fbti', name:'FBTI测试', cat:'趣味测试', em:'🧠' },
    { id:'nexusos', name:'Nexus OS', cat:'模拟', em:'💻' },
    { id:'aixiaofang', name:'AI小方', cat:'趣味', em:'🤖' },
    { id:'tiaoyitiao', name:'跳一跳', cat:'休闲益智', em:'🦘' },
    { id:'flappy', name:'Flappy方', cat:'休闲益智', em:'🐤' },
    { id:'uno', name:'Uno', cat:'棋牌桌游', em:'🃏' },
    { id:'xiaoxiao', name:'消消方', cat:'休闲益智', em:'🍬' },
    { id:'saolei', name:'扫小方', cat:'解谜冒险', em:'💣' },
    { id:'senlin', name:'森林冰火方', cat:'解谜冒险', em:'🌲' },
    { id:'tanke', name:'坦克震荡', cat:'竞技动作', em:'🚜' },
    { id:'zhaobutong', name:'找不同', cat:'解谜冒险', em:'🔍' },
    { id:'hecheng', name:'合成大方佳', cat:'休闲益智', em:'🔗' },
    { id:'daxiaofang', name:'打小方', cat:'竞技动作', em:'👊' },
    { id:'fangvsfang', name:'方vs方', cat:'竞技动作', em:'⚔️' },
    { id:'taiqiu', name:'台球', cat:'竞技动作', em:'🎱' },
    { id:'chidou', name:'吃豆方', cat:'休闲益智', em:'🟡' },
    { id:'siziqi', name:'小方四子棋', cat:'棋牌桌游', em:'⚫' },
    { id:'xiaofangtafang', name:'小方塔防', cat:'竞技动作', em:'🏰' },
    { id:'diyukuangchao', name:'抵御狂潮', cat:'竞技动作', em:'🛡️' },
    { id:'lanqiumingxing', name:'篮球明星', cat:'体育', em:'🏀' },
    { id:'danmufengbao', name:'弹幕风暴', cat:'竞技动作', em:'💥' },
    { id:'pingpingpangpang', name:'乒乒乓乓', cat:'体育', em:'🏓' },
    { id:'dangxinluoti', name:'当心落体', cat:'休闲益智', em:'⬇️' },
    { id:'daimashijie', name:'代码世界', cat:'趣味', em:'💻' },
    { id:'emolunpan', name:'恶魔轮盘', cat:'棋牌桌游', em:'🎰' },
    { id:'mofangdaiheji', name:'魔方大合集', cat:'解谜冒险', em:'🧊' },
    { id:'gonglujiashi', name:'公路驾驶', cat:'体育', em:'🚗' },
    { id:'xiaofangonline', name:'小方Online', cat:'多人在线', em:'🌐' },
    { id:'xiaofanglangrensha', name:'小方狼人杀', cat:'多人在线', em:'🐺' },
    { id:'fangdaolixianji', name:'方岛历险记', cat:'解谜冒险', em:'🏝️' },
    { id:'xiaofanglife', name:'小方生命游戏', cat:'趣味', em:'🔬' },
    { id:'xiaofangjisuanqi', name:'小方计算器', cat:'工具', em:'🧮' },
    { id:'xiaofangshijie', name:'小方世界', cat:'模拟', em:'🌍' },
    { id:'xiaofangjisuan', name:'小方计算', cat:'工具', em:'➗' },
    { id:'renzhixingchang', name:'认知异常', cat:'解谜冒险', em:'👁️' },
    { id:'yanlitiaozhan', name:'眼力挑战', cat:'解谜冒险', em:'👀' },
    { id:'duominuo', name:'小方多米诺', cat:'休闲益智', em:'🁢' },
    { id:'skyteam', name:'天合小队', cat:'竞技动作', em:'🚁' },
    { id:'migongxiuji', name:'迷宫修机', cat:'解谜冒险', em:'🌀' },
    { id:'bubuweiying', name:'步步为营', cat:'棋牌桌游', em:'🔢' },
    { id:'xiaofangyaoshangtian', name:'小方要上天', cat:'休闲益智', em:'🚀' },
    { id:'danggechuangshishen', name:'当个创世神', cat:'模拟', em:'⛏️' },
    { id:'hanshudazhan', name:'函数大战', cat:'趣味', em:'📈' },
    { id:'jiangjindatiaozhan', name:'奖金大挑战', cat:'竞技动作', em:'💰' },
    { id:'jiemidaheji', name:'解密大合集', cat:'解谜冒险', em:'🔐' }
  ];
  // 本地游戏站（不要用线上官网，会被 X-Frame-Options 拦截）
  // 路径基准：apps/games.html → ../../../ = 小游戏/，游戏站就放在那里
  var SRC = '../../../工具与小游戏.html';
  var loadT = null;   // 加载超时检测计时器
  var curCat = '全部';
  var curGame = null;

  function $(id) { return document.getElementById(id); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2200); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  function buildChips() {
    var cats = ['全部'].concat(Array.from(new Set(GAMES.map(function (g) { return g.cat; }))));
    $('chips').innerHTML = cats.map(function (c) {
      return '<span class="chip' + (c === curCat ? ' active' : '') + '" data-c="' + esc(c) + '">' + c + '</span>';
    }).join('');
    Array.prototype.forEach.call($('chips').children, function (el) {
      el.onclick = function () { curCat = el.dataset.c; buildChips(); renderGrid(); };
    });
  }
  function applyFilter() { renderGrid(); }

  function renderGrid() {
    var q = ($('q').value || '').trim().toLowerCase();
    var list = GAMES.filter(function (g) {
      if (curCat !== '全部' && g.cat !== curCat) return false;
      if (q && (g.name + g.cat).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    // 最近玩过的排在前面（同分类/搜索条件下）
    var recent = getRecent();
    list.sort(function (a, b) {
      var ia = recent.indexOf(a.id), ib = recent.indexOf(b.id);
      if (ia === -1 && ib === -1) return 0;
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    $('count').textContent = '共 ' + list.length + ' / ' + GAMES.length + ' 款';
    $('empty').style.display = list.length ? 'none' : 'block';
    $('grid').innerHTML = list.map(function (g, i) {
      var isRecent = recent.indexOf(g.id) >= 0;
      return '<div class="game" style="animation-delay:' + Math.min(i * 0.025, 0.4) + 's" onclick="play(\'' + g.id + '\')">' +
        (isRecent ? '<span class="recent">最近</span>' : '') +
        '<div class="em">' + g.em + '</div><div class="nm">' + esc(g.name) + '</div><div class="cat">' + g.cat + '</div></div>';
    }).join('');
  }

  /* 最近玩过：最多记 8 个，跟账户走 */
  function getRecent() { return Array.isArray(window.__recent) ? window.__recent : []; }
  function pushRecent(id) {
    var r = getRecent().filter(function (x) { return x !== id; });
    r.unshift(id);
    window.__recent = r.slice(0, 8);
    try { Nexus.setUserLS('games_recent', window.__recent); } catch (e) {}
  }

  window.play = function (id) {
    var g = GAMES.find(function (x) { return x.id === id; }); if (!g) return;
    curGame = g;
    pushRecent(id);
    $('pName').textContent = g.em + ' ' + g.name;
    $('pCat').textContent = g.cat;
    var fr = $('pFrame');
    var ld = $('pLoading');
    if (ld) ld.classList.remove('hide');
    // 加载失败兜底：3.5s 内没 load 就提示（避免"点了完全没反应"）
    if (loadT) clearTimeout(loadT);
    fr.onload = function () {
      if (loadT) { clearTimeout(loadT); loadT = null; }
      if (ld) ld.classList.add('hide');
    };
    fr.src = SRC + '#' + id;
    loadT = setTimeout(function () {
      loadT = null;
      // 超时不收起骨架，直接告诉用户可以新窗口打开
      if (ld) ld.innerHTML = '<div style="font-size:26px;opacity:.5;">🎮</div><div style="text-align:center;line-height:1.7;">'
        + '游戏没有在当前窗口展开<br><span style="opacity:.6;font-size:11.5px;">可以点右上角「新窗口打开」</span></div>';
      toast('游戏加载超时，可点「新窗口打开」');
    }, 3500);
    $('player').classList.add('show');
    renderGrid();
  };
  window.closePlayer = function () {
    $('player').classList.remove('show');
    $('pFrame').src = 'about:blank';
    var ld = $('pLoading');
    if (ld) ld.innerHTML = '<div class="spinner"></div><div>正在载入游戏…</div>';
    curGame = null;
  };
  window.openExternal = function () {
    if (curGame) window.open(SRC + '#' + curGame.id, '_blank');
  };
  window.randomGame = function () {
    var g = GAMES[Math.floor(Math.random() * GAMES.length)];
    play(g.id);
    toast('随机：' + g.name);
  };

  // Esc 收回播放器
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('player').classList.contains('show')) closePlayer();
  });

  Nexus.ready(function () {
    buildChips(); renderGrid();
    try {
      Promise.resolve(Nexus.getUserLS('games_recent')).then(function (v) {
        if (Array.isArray(v)) { window.__recent = v; renderGrid(); }
      }).catch(function () {});
    } catch (e) {}
  });
})();
</script>
</body>
</html>
