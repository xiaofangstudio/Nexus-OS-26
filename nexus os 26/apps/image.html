<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相册</title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/glass.css">
<script>
if (location.search.indexOf('theme=dark') >= 0) {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.documentElement.setAttribute('data-mode', 'dark');
  document.documentElement.classList.add('force-dark');
}
</script>
<script src="../ui/n26-gestures.js?v=20261108c"></script>
<script src="_bridge.js"></script>
<script src="_app.js?v=2.9.97"></script>
<style>
:root{
  --img-bg: var(--bg, rgba(242,243,241,1));
  --img-surface: var(--surface, rgba(249,249,247,1));
  --img-surface-2: var(--surface-2, rgba(238,239,236,1));
  --img-surface-3: var(--surface-3, rgba(228,230,226,1));
  --img-text: var(--text, rgba(30,30,34,.94));
  --img-muted: var(--text-muted, rgba(100,100,108,.92));
  --img-faint: var(--text-faint, rgba(120,120,128,.72));
  --img-border: var(--border, rgba(15,23,42,.10));
  --img-divider: var(--divider, rgba(15,23,42,.06));
  --img-accent: hsl(12 78% 47%);
  --img-accent-ink: hsl(12 82% 34%);
  --img-accent-soft: hsl(12 78% 47% / .13);
  --img-accent-line: hsl(12 78% 47% / .32);
  --img-on-accent: rgba(255,255,255,.98);
  --ck-a: color-mix(in srgb, var(--img-surface) 86%, var(--img-bg));
  --ck-b: color-mix(in srgb, var(--img-surface) 62%, var(--img-bg));
  --tile: 136px;
  --gap: var(--sp-2);
  --tb: 52px;
  --st: 28px;
  --film: 88px;
}
html[data-mode="dark"], body.dark-mode{
  --img-bg: var(--bg, rgba(28,28,32,1));
  --img-surface: var(--surface, rgba(36,36,41,1));
  --img-surface-2: var(--surface-2, rgba(44,44,50,1));
  --img-surface-3: var(--surface-3, rgba(54,54,61,1));
  --img-text: var(--text, rgba(242,243,246,.96));
  --img-muted: var(--text-muted, rgba(180,182,190,.92));
  --img-faint: var(--text-faint, rgba(150,152,162,.72));
  --img-border: var(--border, rgba(255,255,255,.14));
  --img-divider: var(--divider, rgba(255,255,255,.08));
  --img-accent: hsl(14 70% 60%);
  --img-accent-ink: hsl(16 84% 74%);
  --img-accent-soft: hsl(14 70% 60% / .16);
  --img-accent-line: hsl(14 70% 60% / .40);
  --img-on-accent: rgba(24,15,11,.92);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--img-bg);
  color:var(--img-text);
  font-family:var(--font-sans, -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif);
  font-size:var(--fs-14, 14px);
  line-height:1.6;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit}
[hidden]{display:none !important}
#app{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column}
.grow{flex:1 1 auto;min-width:0}

/* —— 跟滑杆走的玻璃；无色 tint，只用 surface —— */
.n26-glass-follow{
  background: color-mix(in srgb, var(--img-surface) calc(min(1, var(--n26-glass-alpha, .55) * var(--n26-alpha-k, 1)) * 100%), transparent);
  -webkit-backdrop-filter: blur(calc(var(--n26-blur, 18px) * var(--n26-k, 1) * .86)) saturate(calc(var(--n26-glass-sat, 148%) * var(--n26-sat-k, 1)));
  backdrop-filter: blur(calc(var(--n26-blur, 18px) * var(--n26-k, 1) * .86)) saturate(calc(var(--n26-glass-sat, 148%) * var(--n26-sat-k, 1)));
  border: 1px solid var(--img-border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,calc(var(--n26-glass-hi, .35) * .62)), var(--sh-pop, 0 4px 16px rgba(0,0,0,.12));
}
body.mat-solid .n26-glass-follow{
  background:var(--img-surface);
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
}
.n26-sheen{position:relative;overflow:hidden}
.n26-sheen::after{
  content:"";position:absolute;inset:0 0 auto 0;height:52%;
  background:linear-gradient(120deg,rgba(255,255,255,.16),transparent 52%);
  opacity:calc(var(--n26-glass-hi, .35) * 1.1);
  pointer-events:none;
}
body:not(.mat-liquid) .n26-sheen::after{display:none}
body.perf-mode .n26-sheen::after{display:none}

/* —— 顶栏 —— */
.topbar{
  position:absolute;inset:0 0 auto 0;height:var(--tb);z-index:var(--z-panel, 900);
  display:flex;align-items:center;padding:0 var(--sp-3);
}
.tb{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-width:0}
.brand{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.brand-ic{
  width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;
  background:var(--img-accent-soft);color:var(--img-accent);border:1px solid var(--img-accent-line);
  font-size:13px;flex:0 0 auto;
}
.brand-tx{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-tx b{font-size:var(--fs-14);font-weight:600;white-space:nowrap}
.brand-tx span{font-size:var(--fs-11, 11px);color:var(--img-muted);white-space:nowrap;margin-top:2px}
.tabs{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.tab{
  height:28px;padding:0 var(--sp-2);border:1px solid transparent;border-radius:var(--r-full, 999px);
  background:transparent;color:var(--img-muted);font-size:var(--fs-12, 12px);line-height:1.1;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;transition:background var(--dur-fast, 160ms) var(--ease-out-expo),color var(--dur-fast, 160ms) var(--ease-out-expo),border-color var(--dur-fast, 160ms) var(--ease-out-expo);
}
.tab:hover{background:color-mix(in srgb, var(--img-text) 7%, transparent);color:var(--img-text)}
.tab[aria-selected="true"]{background:var(--img-accent-soft);border-color:var(--img-accent-line);color:var(--img-accent-ink)}
.tab .n{font-size:var(--fs-11, 11px);color:var(--img-faint);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .n{color:inherit;opacity:.8}
.search{
  display:flex;align-items:center;gap:6px;height:30px;padding:0 var(--sp-2);
  border:1px solid var(--img-border);border-radius:var(--r-sm);background:color-mix(in srgb, var(--img-surface-2) 68%, transparent);
  min-width:150px;transition:border-color var(--dur-fast, 160ms) var(--ease-out-expo);
}
.search:focus-within{border-color:var(--img-accent-line)}
.search i{font-size:12px;color:var(--img-faint)}
.search input{
  width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--img-text);
  font-size:var(--fs-12, 12px);line-height:1.1;padding:0;
}
.search input::placeholder{color:var(--img-faint)}
.in-btn{width:18px;height:18px;padding:0;border:0;border-radius:var(--r-xs);background:transparent;color:var(--img-faint);display:grid;place-items:center;cursor:pointer;font-size:11px}
.in-btn:hover{color:var(--img-text);background:color-mix(in srgb, var(--img-text) 8%, transparent)}
.icon-btn,.text-btn{
  height:30px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--img-text);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:0 0 auto;
  transition:background var(--dur-fast,160ms) var(--ease-out-expo),color var(--dur-fast,160ms) var(--ease-out-expo),border-color var(--dur-fast,160ms) var(--ease-out-expo),scale var(--dur-fast,160ms) var(--ease-spring);
}
.icon-btn{width:30px;padding:0;font-size:14px}
.text-btn{padding:0 var(--sp-2);font-size:var(--fs-12,12px);font-weight:500;line-height:1.1}
.icon-btn:hover,.text-btn:hover{background:color-mix(in srgb, var(--img-text) 8%, transparent)}
.icon-btn:active,.text-btn:active{scale:.96}
.text-btn.primary{background:var(--img-accent);color:var(--img-on-accent);border-color:var(--img-accent)}
.text-btn.primary:hover{background:color-mix(in srgb, var(--img-accent) 86%, var(--img-text))}
.icon-btn.on{background:var(--img-accent-soft);border-color:var(--img-accent-line);color:var(--img-accent)}
.icon-btn[aria-disabled="true"],.text-btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.slash{font-size:var(--fs-11,11px);color:var(--img-faint);padding:0 2px}
.slide-prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;overflow:hidden}
.slide-prog i{display:block;height:100%;width:0;background:var(--img-accent);transform-origin:left center}
.slide-prog i.run{animation:n26SlideProg 5s linear forwards}
@keyframes n26SlideProg{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* —— 相册列表 —— */
#library{position:absolute;inset:0 0 var(--st) 0;overflow:hidden}
#libScroll{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:calc(var(--tb) + var(--sp-2)) var(--sp-4) var(--sp-6);
  overscroll-behavior:contain;
}
#libScroll::-webkit-scrollbar{width:10px}
#libScroll::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--img-text) 14%, transparent);border-radius:var(--r-full);border:3px solid transparent;background-clip:padding-box}
.day{margin-bottom:var(--sp-4)}
.day-head{
  position:relative;z-index:1;
  display:flex;align-items:baseline;gap:var(--sp-2);padding:6px 2px 8px;
  background:var(--img-bg);
  border-bottom:1px solid var(--img-divider);
}
.day-head h2{margin:0;font-size:var(--fs-13,13px);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-head span{font-size:var(--fs-11,11px);color:var(--img-muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:var(--gap);padding-top:var(--sp-2)}
.tile{
  position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;cursor:pointer;
  background:var(--img-surface-2);border:2px solid transparent;padding:0;color:inherit;text-align:left;
  transition:border-color var(--dur-fast,160ms) var(--ease-out-expo),scale var(--dur-fast,160ms) var(--ease-spring),background var(--dur-fast,160ms) var(--ease-out-expo);
  animation:n26TileIn var(--dur-base, 260ms) var(--ease-out-expo) both;
}
@keyframes n26TileIn{from{opacity:0;scale:.985}to{opacity:1;scale:1}}
.tile:hover{scale:1.02;border-color:var(--img-accent-line)}
.tile:focus-visible{outline:2px solid var(--img-accent-line);outline-offset:2px}
.tile img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none;background:var(--img-surface-2)}
.tile.sel{border-color:var(--img-accent);background:var(--img-accent-soft)}
.tile .cap{
  position:absolute;inset:auto 0 0 0;padding:14px 8px 6px;
  font-size:var(--fs-11,11px);line-height:1.2;color:rgba(255,255,255,.96);
  background:linear-gradient(transparent,rgba(0,0,0,.52));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity var(--dur-fast,160ms) var(--ease-out-expo);
  pointer-events:none;
}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1}
body :focus-visible{outline-color:var(--img-accent)!important}
.tile .fav{
  position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:var(--r-full);border:0;
  display:grid;place-items:center;font-size:11px;cursor:pointer;
  background:color-mix(in srgb, var(--img-surface) 78%, transparent);color:var(--img-accent);
  opacity:0;transition:opacity var(--dur-fast,160ms) var(--ease-out-expo),scale var(--dur-fast,160ms) var(--ease-spring);
}
.tile:hover .fav,.tile .fav.on{opacity:1}
.tile .fav:hover{scale:1.06}
.tile .pick{
  position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:var(--r-full);
  border:1.5px solid rgba(255,255,255,.72);background:rgba(0,0,0,.18);display:grid;place-items:center;color:transparent;
  font-size:11px;pointer-events:none;opacity:0;transition:opacity var(--dur-fast,160ms) var(--ease-out-expo);
}
.tile .pick.show{opacity:1}
.tile.sel .pick{background:var(--img-accent);border-color:var(--img-accent);color:var(--img-on-accent)}
.tile.broken .cap,.tile.broken .fav{display:none}
.tile-broken{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--img-surface-2);color:var(--img-muted);font-size:var(--fs-11,11px);text-align:center;padding:var(--sp-2);
}
.tile.broken .tile-broken{display:flex}
.tile-broken i{font-size:18px;color:var(--img-faint)}
.sk{aspect-ratio:1;border-radius:var(--r-sm);background:var(--img-surface-2);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:n26Sk 1.5s var(--ease-in-out-quart,cubic-bezier(.76,0,.24,1)) infinite}
@keyframes n26Sk{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* —— 空 / 错误态 —— */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);padding:60px 20px;text-align:center;min-height:100%;color:var(--img-text)}
.state i{font-size:40px;opacity:.35}
.state i.danger{color:var(--danger);opacity:.9}
.state .t{font-size:var(--fs-14,14px);font-weight:600;line-height:1.3}
.state .d{font-size:var(--fs-12,12px);line-height:1.6;color:var(--img-muted);max-width:340px}
.state .acts{display:flex;gap:var(--sp-2);flex-wrap:wrap;justify-content:center}
.fu-btn{display:inline-flex;align-items:center;gap:var(--sp-2);height:32px;padding:0 var(--sp-3);border-radius:var(--r-sm);border:1px solid var(--img-border);background:var(--img-surface);color:var(--img-text);font-size:var(--fs-12,12px);cursor:pointer;transition:background var(--dur-fast,160ms) var(--ease-out-expo),border-color var(--dur-fast,160ms) var(--ease-out-expo),scale var(--dur-fast,160ms) var(--ease-spring)}
.fu-btn:hover{background:var(--img-surface-2)}
.fu-btn:active{scale:.97}
body .fu-btn--accent{background:var(--img-accent)!important;border-color:var(--img-accent)!important;color:var(--img-on-accent)!important}
body .fu-btn--accent:hover{background:color-mix(in srgb, var(--img-accent) 86%, var(--img-text))!important}
.fu-btn--ghost{background:transparent}

/* —— 状态栏 / 批量条 —— */
#statusbar{
  position:absolute;inset:auto 0 0 0;height:var(--st);z-index:var(--z-dock,500);
  display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-4);
  background:var(--img-surface);border-top:1px solid var(--img-border);
  font-size:var(--fs-11,11px);color:var(--img-muted);line-height:1.1;
}
#statusbar .dot{width:3px;height:3px;border-radius:50%;background:var(--img-faint)}
#statusbar .sel{color:var(--img-accent-ink);font-weight:600}
#statusbar .net{color:var(--img-muted)}
#statusbar .net.off{color:var(--warn)}
#bulkbar{
  position:absolute;left:var(--sp-4);right:var(--sp-4);bottom:calc(var(--st) + var(--sp-2));z-index:var(--z-menu,800);
  display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);
  animation:n26BarIn var(--dur-base,260ms) var(--ease-out-expo) both;
}
@keyframes n26BarIn{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
#bulkbar .cnt{font-size:var(--fs-12,12px);font-weight:600;color:var(--img-text);font-variant-numeric:tabular-nums}
#bulkbar .cnt b{color:var(--img-accent-ink)}
#bulkbar .grow{flex:1}
#bulkbar .fu-btn{height:28px}

/* —— 查看器 —— */
#viewer{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--tb);overflow:hidden}
body.mode-viewer #viewer{display:flex}
body.mode-viewer #library,body.mode-viewer #statusbar,body.mode-viewer #bulkbar,body.mode-viewer #tbLib{display:none}
body.mode-viewer #tbView{display:flex}
body.mode-viewer #tbLib{display:none}
#tbView{display:none;gap:var(--sp-1)}
.vname{display:flex;flex-direction:column;line-height:1.1;min-width:0;max-width:38%}
.vname b{font-size:var(--fs-13,13px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vname span{font-size:var(--fs-11,11px);color:var(--img-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.zoomgrp{display:inline-flex;align-items:center;height:30px;border:1px solid var(--img-border);border-radius:var(--r-sm);overflow:hidden;flex:0 0 auto}
.zoomgrp button{height:28px;min-width:28px;padding:0 6px;border:0;background:transparent;color:var(--img-text);cursor:pointer;font-size:12px}
.zoomgrp button:hover{background:color-mix(in srgb, var(--img-text) 7%, transparent)}
.zoomgrp .zl{min-width:48px;font-size:var(--fs-11,11px);font-variant-numeric:tabular-nums;color:var(--img-muted);cursor:default}
.zoomgrp .zl:hover{background:transparent}
.vsep{width:1px;height:18px;background:var(--img-divider);flex:0 0 auto;margin:0 2px}
#vBody{flex:1 1 auto;display:flex;min-height:0;position:relative}
#vStage{
  position:relative;flex:1 1 auto;min-width:0;overflow:hidden;background-color:var(--ck-a);
  background-image:conic-gradient(var(--ck-b) 25%,transparent 0 50%,var(--ck-b) 0 75%,transparent 0);
  background-size:24px 24px;background-position:0 0;touch-action:none;
}
#vStage.dragging{cursor:grabbing}
#vStage.zoomed{cursor:grab}
#mainImg{
  position:absolute;left:50%;top:50%;transform-origin:center center;will-change:transform;
  max-width:none;max-height:none;user-select:none;-webkit-user-drag:none;display:block;
  border-radius:var(--r-xs);box-shadow:var(--sh-window,0 16px 48px rgba(0,0,0,.2));
}
img.n26-fade{animation:n26ImgIn var(--dur-base, 260ms) var(--ease-out-expo) both}
@keyframes n26ImgIn{from{opacity:0}to{opacity:1}}
.vspin{
  position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  border:2px solid color-mix(in srgb, var(--img-text) 18%, transparent);border-top-color:var(--img-accent);
  animation:n26Spin .8s linear infinite;z-index:2;
}
@keyframes n26Spin{to{transform:rotate(360deg)}}
.v-error{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);text-align:center;padding:var(--sp-5);z-index:3;background:color-mix(in srgb, var(--img-bg) 72%, transparent)}
.v-error i{font-size:40px;color:var(--danger);opacity:.8}
.v-error .t{font-size:var(--fs-14,14px);font-weight:600;line-height:1.3}
.v-error .d{font-size:var(--fs-12,12px);line-height:1.6;color:var(--img-muted);max-width:360px}
.v-error .acts{display:flex;gap:var(--sp-2)}
.film{
  flex:0 0 var(--film);display:flex;align-items:center;gap:var(--sp-2);
  padding:0 var(--sp-2);background:var(--img-surface);border-top:1px solid var(--img-border);
}
body.no-film .film{display:none}
.film .fbtn{width:26px;height:52px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--img-muted);cursor:pointer;font-size:12px}
.film .fbtn:hover{background:color-mix(in srgb, var(--img-text) 6%, transparent);color:var(--img-text)}
#filmList{display:flex;align-items:center;gap:var(--sp-2);overflow-x:auto;overflow-y:hidden;height:72px;flex:1;padding:2px}
#filmList::-webkit-scrollbar{height:0}
.thumb{
  position:relative;flex:0 0 72px;width:72px;height:72px;border-radius:var(--r-xs);overflow:hidden;
  border:2px solid transparent;background:var(--img-surface-2);cursor:pointer;padding:0;
  transition:border-color var(--dur-fast,160ms) var(--ease-out-expo),scale var(--dur-fast,160ms) var(--ease-spring);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb.active{border-color:var(--img-accent)}
.thumb:hover{scale:1.04}
.thumb.broken::after{content:"\f1e5";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset:0;display:grid;place-items:center;color:var(--img-faint);font-size:14px}

/* 信息侧栏：宽屏内嵌，窄屏浮层 */
#vInfo{
  position:absolute;right:var(--sp-3);top:var(--sp-3);bottom:var(--sp-3);width:280px;z-index:var(--z-panel,900);
  border-radius:var(--r-md);padding:var(--sp-3);overflow:auto;display:none;flex-direction:column;gap:var(--sp-1);
}
body.show-info #vInfo{display:flex}
#viewer #vInfo{background:color-mix(in srgb, var(--img-surface) 92%, transparent)}
@media (min-width: 1080px){
  #vInfo{position:relative;right:auto;top:auto;bottom:auto;inset:auto;border-radius:0;border:0;border-left:1px solid var(--img-border);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--img-surface);width:280px;display:none;flex:0 0 280px}
}
#vInfo h3{margin:0;font-size:var(--fs-12,12px);font-weight:600;line-height:1.3;color:var(--img-muted);letter-spacing:.02em}
#vInfo .fld{display:flex;flex-direction:column;gap:2px;padding-bottom:var(--sp-1);border-bottom:1px solid var(--img-divider)}
#vInfo .k{font-size:var(--fs-11,11px);color:var(--img-faint);line-height:1.1}
#vInfo .v{font-size:var(--fs-12,12px);line-height:1.45;color:var(--img-text);word-break:break-word}
#vInfo .v.num{font-variant-numeric:tabular-nums}
#vInfo .fu-btn{margin-top:auto}

/* 裁剪 */
.crop-layer{position:absolute;inset:0;z-index:4;display:none;overflow:hidden;background:color-mix(in srgb, var(--img-bg) 35%, transparent)}
body.cropping .crop-layer{display:block}
body.cropping #mainImg{visibility:hidden}
body.cropping .film,body.cropping #vInfo{display:none}
.crop-inner{position:absolute;left:50%;top:50%;translate:-50% -50%;box-shadow:0 0 0 100vmax rgba(0,0,0,.42)}
.crop-inner canvas{display:block;max-width:none;max-height:none}
.crop-rect{position:absolute;border:1px solid var(--img-accent);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset;cursor:move;touch-action:none}
.crop-rect .g{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--img-accent-line) 1px,transparent 1px),linear-gradient(90deg,var(--img-accent-line) 1px,transparent 1px);background-size:33.33% 33.33%;opacity:.6}
.crop-rect .h{position:absolute;width:14px;height:14px;background:var(--img-accent);border:2px solid var(--img-on-accent);border-radius:var(--r-xs);translate:-50% -50%}
.crop-rect .h[data-dir="nw"]{left:0;top:0;cursor:nwse-resize}
.crop-rect .h[data-dir="ne"]{left:100%;top:0;cursor:nesw-resize}
.crop-rect .h[data-dir="sw"]{left:0;top:100%;cursor:nesw-resize}
.crop-rect .h[data-dir="se"]{left:100%;top:100%;cursor:nwse-resize}
.crop-rect .h[data-dir="n"]{left:50%;top:0;cursor:ns-resize}
.crop-rect .h[data-dir="s"]{left:50%;top:100%;cursor:ns-resize}
.crop-rect .h[data-dir="w"]{left:0;top:50%;cursor:ew-resize}
.crop-rect .h[data-dir="e"]{left:100%;top:50%;cursor:ew-resize}
.crop-bar{position:absolute;left:50%;bottom:var(--sp-4);translate:-50% 0;z-index:var(--z-menu,800);display:none;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md)}
body.cropping .crop-bar{display:flex}
.crop-bar .hint{font-size:var(--fs-11,11px);color:var(--img-muted);white-space:nowrap}
.crop-bar .fu-btn{height:28px}

/* 菜单 / 提示 / 快捷键 */
.menu{
  position:fixed;z-index:var(--z-menu,800);min-width:204px;max-width:280px;padding:6px;border-radius:var(--r-md);
  display:none;flex-direction:column;gap:2px;
}
.menu.open{display:flex;animation:n26MenuIn var(--dur-fast,160ms) var(--ease-out-expo) both}
@keyframes n26MenuIn{from{opacity:0;translate:0 -4px}to{opacity:1;translate:0 0}}
.menu-item{display:flex;align-items:center;gap:var(--sp-2);height:32px;padding:0 var(--sp-2);border:0;border-radius:var(--r-xs);background:transparent;color:var(--img-text);font-size:var(--fs-12,12px);text-align:left;cursor:pointer;white-space:nowrap}
.menu-item i:first-child{width:16px;font-size:12px;color:var(--img-muted);text-align:center}
.menu-item .tail{margin-left:auto;font-size:var(--fs-11,11px);color:var(--img-faint)}
.menu-item:hover{background:color-mix(in srgb, var(--img-text) 7%, transparent)}
.menu-item.on{color:var(--img-accent-ink)}
.menu-item.on i:first-child{color:var(--img-accent)}
.menu-sep{height:1px;background:var(--img-divider);margin:4px 2px}
.toast{
  position:fixed;left:50%;bottom:calc(var(--st) + var(--sp-4));translate:-50% 0;z-index:var(--z-toast,1200);
  min-width:280px;max-width:360px;padding:14px 18px;border-radius:var(--r-sm);
  font-size:var(--fs-12,12px);line-height:1.5;color:var(--img-text);display:none;
}
.toast.show{display:block;animation:n26ToastIn var(--dur-slow,400ms) var(--ease-out-expo) both}
@keyframes n26ToastIn{from{opacity:0;translate:-50% 8px}to{opacity:1;translate:-50% 0}}
.sheet{position:fixed;inset:0;z-index:var(--z-modal,1100);background:rgba(0,0,0,.34);display:none;align-items:center;justify-content:center;padding:var(--sp-4)}
.sheet.show{display:flex}
.sheet-card{width:480px;max-width:100%;max-height:86%;overflow:auto;border-radius:var(--r-lg);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);animation:n26SheetIn var(--dur-base,260ms) var(--ease-spring) both}
@keyframes n26SheetIn{from{opacity:0;scale:.96}to{opacity:1;scale:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{margin:0;font-size:var(--fs-16,16px);font-weight:600;line-height:1.3}
.kbd-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:5px 0;border-bottom:1px solid var(--img-divider);font-size:var(--fs-12,12px);color:var(--img-muted)}
.kbd-row:last-child{border-bottom:0}
.kbd{font-size:var(--fs-11,11px);color:var(--img-text);background:var(--img-surface-2);border:1px solid var(--img-border);border-radius:var(--r-xs);padding:1px 6px;font-family:inherit;white-space:nowrap}
#drop{position:fixed;inset:0;z-index:var(--z-overlay,1000);display:none;align-items:center;justify-content:center;padding:var(--sp-6);background:color-mix(in srgb, var(--img-bg) 62%, transparent)}
body.dragging-file #drop{display:flex}
#drop .dz{width:100%;height:100%;border:2px dashed var(--img-accent-line);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);color:var(--img-text);background:color-mix(in srgb, var(--img-surface) 70%, transparent)}
#drop .dz i{font-size:36px;color:var(--img-accent)}
#drop .dz b{font-size:var(--fs-14,14px);font-weight:600}
#drop .dz span{font-size:var(--fs-12,12px);color:var(--img-muted)}

/* 窄窗收敛 */
@media (max-width: 820px){
  .zoomgrp .zl{min-width:42px}
  #tbView .vsep{display:none}
}
@media (max-width: 720px){
  .brand-tx{display:none}
  .brand{border:0;padding:0}
  .text-btn span{display:none}
  .text-btn{padding:0 6px}
  .search{min-width:32px;width:32px;padding:0 8px}
  .search input{width:0;opacity:0;pointer-events:none}
  .search.open{width:170px}
  .search.open input{width:100%;opacity:1;pointer-events:auto}
  .tabs .n{display:none}
  #tbView .vname{max-width:26%}
  .zoomgrp{display:none}
  #btnFlip{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .tile:hover,.thumb:hover{scale:1}
}
body.perf-mode .n26-glass-follow{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--img-surface)}
body.perf-mode .sk::after,body.perf-mode .vspin,body.perf-mode .slide-prog i.run{animation:none}
</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="topbar n26-glass-follow n26-sheen">
    <div class="tb" id="tbLib">
      <div class="brand">
        <span class="brand-ic"><i class="fa-solid fa-images" aria-hidden="true"></i></span>
        <span class="brand-tx"><b data-i18n="app_title">相册</b><span id="brandCount">0</span></span>
      </div>
      <nav class="tabs" role="tablist" aria-label="照片筛选">
        <button class="tab" role="tab" data-filter="all" aria-selected="true" tabindex="0"><span data-i18n="tab_all">全部</span><span class="n" data-count="all">0</span></button>
        <button class="tab" role="tab" data-filter="fav" aria-selected="false" tabindex="-1"><span data-i18n="tab_fav">收藏</span><span class="n" data-count="fav">0</span></button>
        <button class="tab" role="tab" data-filter="local" aria-selected="false" tabindex="-1"><span data-i18n="tab_local">本地</span><span class="n" data-count="local">0</span></button>
      </nav>
      <div class="grow"></div>
      <div class="search" id="searchBox">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="search_ph" data-i18n-aria="search_ph" aria-label="搜索照片">
        <button class="in-btn" id="searchClear" data-i18n-aria="clear_search" aria-label="清除搜索" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </div>
      <button class="icon-btn" id="btnTimeline" data-i18n-title="timeline" data-i18n-aria="timeline" aria-label="时间轴"><i class="fa-solid fa-clock" aria-hidden="true"></i></button>
      <button class="icon-btn" id="btnSort" data-i18n-title="sort" data-i18n-aria="sort" aria-label="排序"><i class="fa-solid fa-arrow-down-short-wide" aria-hidden="true"></i></button>
      <button class="text-btn" id="btnSelect" data-i18n-title="select_t" aria-label="选择"><i class="fa-solid fa-check-double" aria-hidden="true"></i><span data-i18n="select">选择</span></button>
      <button class="text-btn primary" id="btnImport" data-i18n-title="import" aria-label="导入"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i><span data-i18n="import">导入</span></button>
      <button class="icon-btn" id="btnMoreLib" data-i18n-title="more" data-i18n-aria="more" aria-label="更多"><i class="fa-solid fa-ellipsis" aria-hidden="true"></i></button>
    </div>

    <div class="tb" id="tbView">
      <button class="icon-btn" id="btnBack" data-i18n-title="back" data-i18n-aria="back" aria-label="返回相册"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
      <div class="vname"><b id="vName">—</b><span id="vIndex"></span></div>
      <div class="grow"></div>
      <div class="zoomgrp" role="group" aria-label="缩放">
        <button id="btnZoomOut" data-i18n-title="zoom_out" aria-label="缩小"><i class="fa-solid fa-minus" aria-hidden="true"></i></button>
        <span class="zl" id="zoomLabel">100%</span>
        <button id="btnZoomIn" data-i18n-title="zoom_in" aria-label="放大"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
      </div>
      <button class="icon-btn" id="btnFit" data-i18n-title="fit" aria-label="适应窗口"><i class="fa-solid fa-expand" aria-hidden="true"></i></button>
      <button class="text-btn" id="btnActual" data-i18n-title="actual" aria-label="原始尺寸">1:1</button>
      <span class="vsep"></span>
      <button class="icon-btn" id="btnRotate" data-i18n-title="rotate" aria-label="旋转"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i></button>
      <button class="icon-btn" id="btnFlip" data-i18n-title="flip" aria-label="水平镜像"><i class="fa-solid fa-arrows-left-right" aria-hidden="true"></i></button>
      <button class="icon-btn" id="btnFav" data-i18n-title="fav_add" aria-label="收藏"><i class="fa-regular fa-heart" aria-hidden="true"></i></button>
      <button class="icon-btn" id="btnDownload" data-i18n-title="download" aria-label="下载"><i class="fa-solid fa-download" aria-hidden="true"></i></button>
      <button class="icon-btn" id="btnInfo" data-i18n-title="info" aria-label="信息"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></button>
      <button class="icon-btn" id="btnMoreView" data-i18n-title="more" data-i18n-aria="more" aria-label="更多"><i class="fa-solid fa-ellipsis" aria-hidden="true"></i></button>
    </div>
    <div class="slide-prog" id="slideProg" hidden><i id="slideProgBar"></i></div>
  </header>

  <main id="library">
    <div id="libScroll">
      <div id="skeleton">
        <div class="grid" aria-hidden="true">
          <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
          <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
          <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
          <div class="sk"></div><div class="sk"></div><div class="sk"></div>
        </div>
      </div>
      <div id="libList"></div>
      <div id="libState" class="state" hidden></div>
    </div>
  </main>

  <section id="viewer" aria-label="图片查看器">
    <div id="vBody">
      <div id="vStage" data-n26-pinch="emit">
        <img id="mainImg" alt="" data-n26-pinch="emit" draggable="false" hidden>
        <div class="vspin" id="vSpin" hidden></div>
        <div class="v-error" id="vError" hidden>
          <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
          <span class="t" data-i18n="err_title">无法打开这张图片</span>
          <span class="d" id="vErrorDesc" data-i18n="err_desc">文件已损坏、格式不受支持，或网络图片在离线时不可用。</span>
          <div class="acts">
            <button class="fu-btn" id="btnERetry"><i class="fa-solid fa-rotate" aria-hidden="true"></i><span data-i18n="retry">重试</span></button>
            <button class="fu-btn" id="btnESave"><i class="fa-solid fa-download" aria-hidden="true"></i><span data-i18n="save_original">另存原文件</span></button>
          </div>
        </div>
        <div class="crop-layer" id="cropLayer">
          <div class="crop-inner" id="cropInner">
            <canvas id="cropCanvas"></canvas>
            <div class="crop-rect" id="cropRect">
              <i class="g"></i>
              <span class="h" data-dir="nw"></span><span class="h" data-dir="ne"></span>
              <span class="h" data-dir="sw"></span><span class="h" data-dir="se"></span>
              <span class="h" data-dir="n"></span><span class="h" data-dir="s"></span>
              <span class="h" data-dir="w"></span><span class="h" data-dir="e"></span>
            </div>
          </div>
        </div>
        <div class="crop-bar n26-glass-follow">
          <span class="hint" data-i18n="crop_hint">拖动选框调整裁剪区域</span>
          <button class="fu-btn fu-btn--ghost" id="btnCropCancel" data-i18n="cancel">取消</button>
          <button class="fu-btn fu-btn--accent" id="btnCropApply" data-i18n="crop_apply">应用裁剪</button>
        </div>
      </div>
      <aside id="vInfo" class="n26-glass-follow" aria-label="图片信息"></aside>
    </div>
    <div class="film" id="vFilm">
      <button class="fbtn" id="btnPrev" data-i18n-title="prev" aria-label="上一张"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
      <div id="filmList"></div>
      <button class="fbtn" id="btnNext" data-i18n-title="next" aria-label="下一张"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
    </div>
  </section>

  <footer id="statusbar">
    <span id="stCount">0</span>
    <span class="dot" aria-hidden="true"></span>
    <span id="stSize">—</span>
    <span class="sel" id="stSel" hidden></span>
    <span class="grow"></span>
    <span class="net" id="stNet" data-i18n="online">在线</span>
  </footer>

  <div id="bulkbar" class="n26-glass-follow" hidden>
    <span class="cnt" id="bulkCount"></span>
    <div class="grow"></div>
    <button class="fu-btn" id="bulkAll" data-i18n="select_all">全选</button>
    <button class="fu-btn fu-btn--accent" id="bulkExport" data-i18n="download">下载</button>
    <button class="fu-btn fu-btn--ghost" id="bulkCancel" data-i18n="cancel">取消</button>
  </div>

  <div class="menu" id="menu" role="menu"></div>
  <div class="toast n26-glass-follow" id="toast" role="status" aria-live="polite"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-card n26-glass-follow" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><h2 id="sheetTitle" data-i18n="shortcuts">快捷键</h2><button class="icon-btn" id="sheetClose" aria-label="关闭"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="drop"><div class="dz"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i><b data-i18n="drop_title">松开即可导入照片</b><span data-i18n="drop_desc">支持 JPG / PNG / WebP / GIF / AVIF</span></div></div>
  <input type="file" id="filePicker" accept="image/*" multiple hidden>
</div>

    // 拖入导入
    var dc = 0;
    window.addEventListener('dragenter', function (e) { if (e.dataTransfer && e.dataTransfer.types && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0) { dc++; document.body.classList.add('dragging-file'); } });
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('dragleave', function () { dc--; if (dc <= 0) { dc = 0; document.body.classList.remove('dragging-file'); } });
    window.addEventListener('drop', function (e) {
      e.preventDefault(); dc = 0; document.body.classList.remove('dragging-file');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
    });

    window.addEventListener('resize', function () {
      if (mode === 'viewer' && view.loaded) {
        if (view.fit) { view.scale = fitScale(); view.panX = 0; view.panY = 0; } else clampPan();
        applyView();
      }
    });
    window.addEventListener('online', function () { offline = false; updateCounts(); });
    window.addEventListener('offline', function () { offline = true; updateCounts(); });
    window.addEventListener('storage', function (e) { if (e.key === 'n26ImageCmd' && e.newValue) applyCmd(e.newValue); });

    document.addEventListener('keydown', onKey, true);
  }

  function applyCmd(raw) {
    var c; try { c = JSON.parse(raw); } catch (e) { return; }
    if (!c) return;
    if (c.act === 'toggle') {
      if (mode === 'viewer') setSlide(!slideOn);
      else { var p0 = filtered[0] || photos[0]; if (p0) { openViewer(p0.id); setTimeout(function () { setSlide(true); }, 500); } }
    } else if (c.act === 'next') {
      if (mode === 'viewer') next(1); else { var p1 = filtered[1] || filtered[0] || photos[0]; if (p1) openViewer(p1.id); }
    } else if (c.act === 'prev') {
      if (mode === 'viewer') next(-1); else { var p2 = filtered[0] || photos[0]; if (p2) openViewer(p2.id); }
    } else if (c.act === 'fs') {
      if (mode !== 'viewer') { var p3 = filtered[0] || photos[0]; if (p3) openViewer(p3.id); }
      toggleFull();
    }
  }

  function onKey(e) {
    var tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable)) {
      if (e.key === 'Escape') tg.blur();
      return;
    }
    var k = e.key;
    if (k === 'Escape') {
      if (el.sheet.classList.contains('show')) { closeSheet(); e.preventDefault(); return; }
      if (el.menu.classList.contains('open')) { hideMenu(); e.preventDefault(); return; }
      if (crop.on) { exitCrop(false); e.preventDefault(); return; }
      if (mode === 'viewer') { closeViewer(); e.preventDefault(); return; }
      if (selectMode) { exitSelect(); e.preventDefault(); return; }
      if (query) { clearFilters(); e.preventDefault(); }
      return;
    }
    if (mode === 'library') {
      if ((e.ctrlKey || e.metaKey) && (k === 'a' || k === 'A')) {
        e.preventDefault(); el.bulkAll.onclick();
      }
      return;
    }
    // 查看器快捷键
    var mod = e.ctrlKey || e.metaKey;
    if (mod && (k === 's' || k === 'S')) { e.preventDefault(); downloadCur(); return; }
    if (mod && (k === 'c' || k === 'C')) { e.preventDefault(); copyCur(); return; }
    if (mod) return;
    switch (k) {
      case 'ArrowLeft': e.preventDefault(); next(-1); break;
      case 'ArrowRight': e.preventDefault(); next(1); break;
      case '+': case '=': e.preventDefault(); zoomBy(1.2); break;
      case '-': case '_': e.preventDefault(); zoomBy(1 / 1.2); break;
      case '0': e.preventDefault(); doFit(); break;
      case '1': e.preventDefault(); doActual(); break;
      case 'r': case 'R': e.preventDefault(); rotateCur(); break;
      case 'm': case 'M': e.preventDefault(); flipCur(); break;
      case 'f': case 'F':
        e.preventDefault();
        if (e.shiftKey) toggleFull();
        else { var cp = curPhoto(); if (cp) toggleFav(cp.id); }
        break;
      case 'c': case 'C': e.preventDefault(); enterCrop(); break;
      case 'i': case 'I': e.preventDefault(); toggleInfo(); break;
      case ' ': case 'p': case 'P': e.preventDefault(); setSlide(!slideOn); break;
      default: break;
    }
  }

  // —— 启动 ——
  function onReady(ctx) {
    ctx = ctx || {};
    lang = (ctx.lang || ctx.language || ctx.locale || 'zh').toLowerCase();
    if (N.applyLanguage) { try { N.applyLanguage(); } catch (e) {} }
    forceTheme();
    if (ctx.dark && forcedDark === false) { /* 宿主主题已由 _app 应用 */ }
    offline = !!(ctx.offline) || !navigator.onLine;
    el.libScroll.style.setProperty('--tile', tileSize + 'px');
    bindEvents();
    bindGestures();
    setupMedia();
    Promise.all([scanFS(), loadLocal()]).then(function (all) {
      mergeAll(all[0], all[1]);
      offline = offline || fsError;
      rebuild();
      renderLibrary();
    });
  }
  if (N.ready) N.ready(onReady);
  else setTimeout(function () { onReady({ lang: 'zh' }); }, 0);
  window.__imgState = function () { return { photos: photos.length, filtered: filtered.length, mode: mode, cur: cur, scale: view.scale, slide: slideOn, crop: crop.on }; };
})();
</script>
</body>
</html>
