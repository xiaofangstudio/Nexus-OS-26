<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气</title>
<script src="_bridge.js"></script>
<script src="_app.js"></script>
<link rel="stylesheet" href="../vendor/fontawesome/all.min.css">
<style>
/* ===================================================================
   天气 · 苹果风格重做（v2.9.39）
   结构：城市名 → 大温度 → 天气描述 → 逐小时 → 十天预报 → 指标卡
   背景随「天气状况 + 白天/夜间」变化，不是一张固定图。
   =================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff; overflow: hidden; background: #2b3a4a; position: relative;
}
#sky {
    position: absolute; inset: 0;
    transition: background 1.1s ease;
    background: linear-gradient(180deg, #3b6ea5 0%, #6ea3cf 55%, #a8c7de 100%);
}
#sky::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,0.28), transparent 62%);
    pointer-events: none;
}
.scroll {
    position: relative; height: 100%;
    overflow-y: auto; overflow-x: hidden;
    padding: 16px 16px 26px; scrollbar-width: thin;
}
.scroll::-webkit-scrollbar { width: 6px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.28); border-radius: 6px; }

/* 顶部 */
.top { display: flex; align-items: center; gap: 8px; }
.city {
    font-size: 17px; font-weight: 600; letter-spacing: .3px;
    display: flex; align-items: center; gap: 6px;
    text-shadow: 0 1px 6px rgba(0,0,0,.28); min-width: 0;
}
.city #cityName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-actions { margin-left: auto; display: flex; gap: 7px; flex-shrink: 0; }
.tbtn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.26);
    background: rgba(255,255,255,.16); color: #fff; font-size: 12px;
    cursor: pointer; display: grid; place-items: center;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: background .16s ease;
}
.tbtn:hover { background: rgba(255,255,255,.3); }

/* 主温度 */
.hero { text-align: center; padding: 4px 0 12px; }
.hero .temp {
    font-size: 88px; font-weight: 200; line-height: 1;
    letter-spacing: -4px; text-shadow: 0 4px 26px rgba(0,0,0,.3);
    font-variant-numeric: tabular-nums;
}
.hero .temp sup { font-size: 32px; font-weight: 300; vertical-align: super; letter-spacing: 0; }
.hero .cond { font-size: 15px; font-weight: 500; opacity: .95; margin-top: 2px; }
.hero .hilo { font-size: 13.5px; opacity: .82; margin-top: 3px; font-variant-numeric: tabular-nums; }

/* 玻璃卡 */
.card {
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 16px;
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
    padding: 12px 14px; margin-bottom: 12px;
}
.card-title {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    opacity: .72; margin-bottom: 9px; display: flex; align-items: center; gap: 6px;
}

/* 逐小时 */
.hours { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.hours::-webkit-scrollbar { display: none; }
.hour {
    flex: 0 0 auto; width: 54px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 6px 0; border-radius: 12px; font-size: 12px;
}
.hour.now { background: rgba(255,255,255,.2); }
.hour .h-time { opacity: .82; font-variant-numeric: tabular-nums; }
.hour i { font-size: 17px; }
.hour .h-temp { font-weight: 600; font-variant-numeric: tabular-nums; }

/* 十天 */
.day {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; font-size: 13px;
    border-top: 1px solid rgba(255,255,255,.12);
}
.day:first-of-type { border-top: 0; }
.day .d-name { width: 52px; flex-shrink: 0; font-weight: 500; }
.day i { width: 20px; text-align: center; font-size: 14px; }
.day .d-low { width: 34px; text-align: right; opacity: .68; font-variant-numeric: tabular-nums; }
.day .d-high { width: 34px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.day .d-bar {
    flex: 1; height: 4px; border-radius: 2px; position: relative;
    background: rgba(255,255,255,.2); overflow: hidden;
}
.day .d-bar span {
    position: absolute; top: 0; bottom: 0; border-radius: 2px;
    background: linear-gradient(90deg, #7dd3fc, #fbbf24);
}

/* 指标 */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.metric {
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 14px; padding: 10px 12px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.metric .m-label { font-size: 10.5px; opacity: .72; letter-spacing: .05em; display: flex; align-items: center; gap: 5px; }
.metric .m-val { font-size: 21px; font-weight: 300; margin-top: 4px; font-variant-numeric: tabular-nums; }
.metric .m-val small { font-size: 12px; font-weight: 400; opacity: .7; }

/* 状态 / 提示 */
.state {
    text-align: center; font-size: 12.5px; opacity: .9;
    padding: 10px 12px; border-radius: 12px;
    background: rgba(0,0,0,.18); margin: 10px 0 12px; display: none;
}
.state.show { display: block; }
.toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(10px);
    background: rgba(20,24,32,.9); color: #fff; font-size: 12.5px;
    padding: 9px 16px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease;
    z-index: 40;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 搜索浮层 */
.search-wrap {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(10,16,26,.55);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    display: none; flex-direction: column; padding: 16px;
}
.search-wrap.show { display: flex; }
.search-box {
    display: flex; align-items: center; gap: 9px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.26);
    border-radius: 12px; padding: 9px 12px;
}
.search-box input {
    flex: 1; border: 0; outline: 0; background: transparent;
    color: #fff; font-size: 14px; font-family: inherit; min-width: 0;
}
.search-box input::placeholder { color: rgba(255,255,255,.6); }
.search-cancel { border: 0; background: transparent; color: #fff; font-size: 13px; cursor: pointer; opacity: .85; }
.search-list { margin-top: 12px; overflow-y: auto; }
.sr { padding: 11px 12px; border-radius: 11px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.sr:hover { background: rgba(255,255,255,.16); }
.sr .sr-name { font-size: 14px; font-weight: 500; }
.sr .sr-sub { font-size: 11.5px; opacity: .62; }
.sr-empty { text-align: center; font-size: 12.5px; opacity: .6; padding: 24px 0; }
</style>
</head>
<body>
<div id="sky"></div>

<div class="scroll">
    <div class="top">
        <div class="city"><i class="fas fa-location-dot" style="font-size:13px;opacity:.85;"></i><span id="cityName">定位中…</span></div>
        <div class="top-actions">
            <button class="tbtn" id="btnLocate" title="使用我的位置"><i class="fas fa-crosshairs"></i></button>
            <button class="tbtn" id="btnSearch" title="搜索城市"><i class="fas fa-magnifying-glass"></i></button>
            <button class="tbtn" id="btnRefresh" title="刷新"><i class="fas fa-rotate-right"></i></button>
        </div>
    </div>

    <div class="state" id="state"></div>

    <div class="hero">
        <div class="temp" id="temp">--<sup>°</sup></div>
        <div class="cond" id="cond">正在获取天气…</div>
        <div class="hilo" id="hilo">&nbsp;</div>
    </div>

    <div class="card" id="hourCard" style="display:none;">
        <div class="card-title"><i class="fas fa-clock"></i> 24 小时预报</div>
        <div class="hours" id="hours"></div>
    </div>

    <div class="card" id="dayCard" style="display:none;">
        <div class="card-title"><i class="fas fa-calendar-days"></i> 10 天预报</div>
        <div id="days"></div>
    </div>

    <div class="metrics" id="metrics" style="display:none;">
        <div class="metric"><div class="m-label"><i class="fas fa-temperature-half"></i> 体感</div><div class="m-val" id="mFeels">--</div></div>
        <div class="metric"><div class="m-label"><i class="fas fa-droplet"></i> 湿度</div><div class="m-val" id="mHum">--</div></div>
        <div class="metric"><div class="m-label"><i class="fas fa-wind"></i> 风速</div><div class="m-val" id="mWind">--</div></div>
        <div class="metric"><div class="m-label"><i class="fas fa-gauge-high"></i> 气压</div><div class="m-val" id="mPres">--</div></div>
        <div class="metric"><div class="m-label"><i class="fas fa-sun"></i> 紫外线</div><div class="m-val" id="mUv">--</div></div>
        <div class="metric"><div class="m-label"><i class="fas fa-cloud-rain"></i> 降水概率</div><div class="m-val" id="mRain">--</div></div>
    </div>
</div>

<div class="search-wrap" id="searchWrap">
    <div class="search-box">
        <i class="fas fa-magnifying-glass" style="opacity:.7;font-size:13px;"></i>
        <input id="q" placeholder="搜索城市…" autocomplete="off">
        <button class="search-cancel" id="searchCancel">取消</button>
    </div>
    <div class="search-list" id="srList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
    var $ = function (id) { return document.getElementById(id); };
    var FALLBACK = { name: '北京', lat: 39.9042, lon: 116.4074 };
    var cur = null, token = 0;

    function toast(msg) {
        var t = $('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
    }
    function esc(x) {
        return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
    }

    function wx(code, isDay) {
        var d = isDay !== false;
        if (code === 0) return { t: d ? '晴' : '晴夜', i: d ? 'fa-sun' : 'fa-moon', k: 'clear', d: d };
        if (code === 1 || code === 2) return { t: '局部多云', i: d ? 'fa-cloud-sun' : 'fa-cloud-moon', k: 'partly', d: d };
        if (code === 3) return { t: '多云', i: 'fa-cloud', k: 'cloudy', d: d };
        if (code >= 45 && code <= 48) return { t: '雾', i: 'fa-smog', k: 'fog', d: d };
        if (code >= 51 && code <= 57) return { t: '毛毛雨', i: 'fa-cloud-rain', k: 'rain', d: d };
        if (code >= 61 && code <= 67) return { t: '雨', i: 'fa-cloud-showers-heavy', k: 'rain', d: d };
        if (code >= 71 && code <= 77) return { t: '雪', i: 'fa-snowflake', k: 'snow', d: d };
        if (code >= 80 && code <= 82) return { t: '阵雨', i: 'fa-cloud-showers-heavy', k: 'rain', d: d };
        if (code >= 85 && code <= 86) return { t: '阵雪', i: 'fa-snowflake', k: 'snow', d: d };
        if (code >= 95) return { t: '雷雨', i: 'fa-bolt', k: 'storm', d: d };
        return { t: '多云', i: 'fa-cloud', k: 'cloudy', d: d };
    }
    var SKY = {
        clear_d: 'linear-gradient(180deg,#2f7fd1 0%,#5ba6dd 48%,#a9cfe8 100%)',
        clear_n: 'linear-gradient(180deg,#0b1a33 0%,#1c3357 52%,#33507a 100%)',
        partly_d: 'linear-gradient(180deg,#3f7fb5 0%,#7aa9cd 55%,#b6cfe1 100%)',
        partly_n: 'linear-gradient(180deg,#101d33 0%,#26364f 55%,#3d4f6b 100%)',
        cloudy_d: 'linear-gradient(180deg,#5c6f80 0%,#8598a6 55%,#b9c5cd 100%)',
        cloudy_n: 'linear-gradient(180deg,#1a222d 0%,#2c3642 55%,#424e5c 100%)',
        fog_d: 'linear-gradient(180deg,#7b8792 0%,#a3adb6 55%,#ccd3d8 100%)',
        fog_n: 'linear-gradient(180deg,#20262e 0%,#333b45 55%,#495260 100%)',
        rain_d: 'linear-gradient(180deg,#3c5468 0%,#5f7789 55%,#8fa3b1 100%)',
        rain_n: 'linear-gradient(180deg,#0e1a24 0%,#1e2d3a 55%,#31424f 100%)',
        snow_d: 'linear-gradient(180deg,#6d8397 0%,#9db0c1 55%,#cdd9e3 100%)',
        snow_n: 'linear-gradient(180deg,#16202c 0%,#27343f 55%,#3d4b58 100%)',
        storm_d: 'linear-gradient(180deg,#2b3a4c 0%,#455a70 55%,#6b8098 100%)',
        storm_n: 'linear-gradient(180deg,#0a1017 0%,#161f2b 55%,#28323f 100%)'
    };
    function skyFor(kind, isDay) { return SKY[kind + '_' + (isDay ? 'd' : 'n')] || SKY.cloudy_d; }

    async function getGeo() {
        try { var g = await Nexus.getLS('n26_geo'); if (g && g.lat && g.lon) return g; } catch (e) { }
        return null;
    }
    async function askGeo() {
        return new Promise(function (resolve) {
            if (!navigator.geolocation) { resolve(null); return; }
            var done = false;
            var fin = function (v) { if (done) return; done = true; resolve(v); };
            var g = setTimeout(function () { fin(null); }, 4500);
            navigator.geolocation.getCurrentPosition(function (p) {
                clearTimeout(g);
                fin({ lat: +p.coords.latitude.toFixed(4), lon: +p.coords.longitude.toFixed(4), name: '我的位置' });
            }, function () { clearTimeout(g); fin(null); }, { timeout: 4000, maximumAge: 600000 });
        });
    }

    async function load(city) {
        cur = city;
        $('cityName').textContent = city.name || '我的位置';
        var my = ++token;
        $('state').textContent = '正在获取天气…';
        $('state').classList.add('show');
        try {
            var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + city.lat + '&longitude=' + city.lon
                + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,pressure_msl'
                + '&hourly=temperature_2m,weather_code'
                + '&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max'
                + '&forecast_days=10&timezone=auto';
            var r = await fetch(url);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            var data = await r.json();
            if (my !== token) return;
            render(city, data);
            $('state').classList.remove('show');
        } catch (e) {
            $('state').textContent = '天气服务连接失败：' + e.message;
        }
    }

    function render(city, d) {
        var c = d.current, day = d.daily;
        var isDay = c.is_day === 1;
        var info = wx(c.weather_code, isDay);
        $('sky').style.background = skyFor(info.k, isDay);

        $('temp').innerHTML = Math.round(c.temperature_2m) + '<sup>°</sup>';
        $('cond').textContent = info.t;
        $('hilo').textContent = '最高 ' + Math.round(day.temperature_2m_max[0]) + '°　最低 ' + Math.round(day.temperature_2m_min[0]) + '°';

        var hours = d.hourly, nowT = Date.now(), startIdx = 0;
        for (var i = 0; i < hours.time.length; i++) {
            if (new Date(hours.time[i]).getTime() >= nowT - 3600000) { startIdx = i; break; }
        }
        var hh = '';
        for (var j = startIdx; j < Math.min(startIdx + 24, hours.time.length); j++) {
            var t = new Date(hours.time[j]), hr = t.getHours();
            var wi = wx(hours.weather_code[j], hr >= 6 && hr < 19);
            hh += '<div class="hour ' + (j === startIdx ? 'now' : '') + '">'
                + '<div class="h-time">' + (j === startIdx ? '现在' : hr + '时') + '</div>'
                + '<i class="fas ' + wi.i + '"></i>'
                + '<div class="h-temp">' + Math.round(hours.temperature_2m[j]) + '°</div></div>';
        }
        $('hours').innerHTML = hh;
        $('hourCard').style.display = '';

        var wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        var allMax = Math.max.apply(null, day.temperature_2m_max);
        var allMin = Math.min.apply(null, day.temperature_2m_min);
        var span = Math.max(1, allMax - allMin);
        var dd = '';
        for (var k = 0; k < day.time.length; k++) {
            var dt = new Date(day.time[k] + 'T00:00:00');
            var di = wx(day.weather_code[k], true);
            var hi = Math.round(day.temperature_2m_max[k]), lo = Math.round(day.temperature_2m_min[k]);
            var left = ((lo - allMin) / span) * 100;
            var width = Math.max(6, ((hi - lo) / span) * 100);
            dd += '<div class="day">'
                + '<div class="d-name">' + (k === 0 ? '今天' : (k === 1 ? '明天' : wd[dt.getDay()])) + '</div>'
                + '<i class="fas ' + di.i + '"></i>'
                + '<div class="d-low">' + lo + '°</div>'
                + '<div class="d-bar"><span style="left:' + left.toFixed(1) + '%;width:' + width.toFixed(1) + '%"></span></div>'
                + '<div class="d-high">' + hi + '°</div></div>';
        }
        $('days').innerHTML = dd;
        $('dayCard').style.display = '';

        $('mFeels').innerHTML = Math.round(c.apparent_temperature) + '<small>°</small>';
        $('mHum').innerHTML = Math.round(c.relative_humidity_2m) + '<small>%</small>';
        $('mWind').innerHTML = Math.round(c.wind_speed_10m) + '<small> km/h</small>';
        $('mPres').innerHTML = Math.round(c.pressure_msl) + '<small> hPa</small>';
        var uv = (day.uv_index_max && day.uv_index_max[0] != null) ? Math.round(day.uv_index_max[0]) : null;
        $('mUv').innerHTML = uv == null ? '--' : uv + '<small> ' + (uv <= 2 ? '低' : uv <= 5 ? '中' : uv <= 7 ? '高' : '很高') + '</small>';
        var rain = (day.precipitation_probability_max && day.precipitation_probability_max[0] != null)
            ? Math.round(day.precipitation_probability_max[0]) : 0;
        $('mRain').innerHTML = rain + '<small>%</small>';
        $('metrics').style.display = '';

        try { Nexus.setUserLS('weatherData', { loc: city, ts: Date.now() }); } catch (e) { }
    }

    async function searchCity(q) {
        $('srList').innerHTML = '<div class="sr-empty">搜索中…</div>';
        try {
            var r = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q) + '&count=6&language=zh&format=json');
            var g = await r.json();
            var list = g.results || [];
            if (!list.length) { $('srList').innerHTML = '<div class="sr-empty">没找到这个城市</div>'; return; }
            $('srList').innerHTML = list.map(function (c, i) {
                return '<div class="sr" data-i="' + i + '"><span class="sr-name">' + esc(c.name) + '</span>'
                    + '<span class="sr-sub">' + esc([c.admin1, c.country].filter(Boolean).join(' · ')) + '</span></div>';
            }).join('');
            Array.prototype.forEach.call($('srList').querySelectorAll('.sr'), function (el) {
                el.onclick = function () {
                    var c = list[+el.dataset.i];
                    closeSearch();
                    load({ name: c.name, lat: +c.latitude.toFixed(4), lon: +c.longitude.toFixed(4) });
                };
            });
        } catch (e) {
            $('srList').innerHTML = '<div class="sr-empty">搜索服务连接失败</div>';
        }
    }
    function openSearch() { $('searchWrap').classList.add('show'); setTimeout(function () { $('q').focus(); }, 60); }
    function closeSearch() { $('searchWrap').classList.remove('show'); }

    function bind() {
        $('btnSearch').onclick = openSearch;
        $('searchCancel').onclick = closeSearch;
        $('q').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { var v = $('q').value.trim(); if (v) searchCity(v); }
            e.stopPropagation();
        });
        $('btnRefresh').onclick = function () { if (cur) load(cur); else boot(); };
        $('btnLocate').onclick = async function () {
            var g = await askGeo();
            if (!g) { toast('拿不到定位，已保留当前城市'); return; }
            try { Nexus.setLS('n26_geo', { lat: g.lat, lon: g.lon, name: g.name, ts: Date.now() }); } catch (e) { }
            load(g);
        };
    }

    async function boot() {
        var g = await getGeo();
        if (g) { load({ name: g.name || '我的位置', lat: g.lat, lon: g.lon }); return; }
        try {
            var saved = await Nexus.getUserLS('weatherData');
            if (saved && saved.loc) { load(saved.loc); return; }
        } catch (e) { }
        var pos = await askGeo();
        if (pos) {
            try { Nexus.setLS('n26_geo', { lat: pos.lat, lon: pos.lon, name: pos.name, ts: Date.now() }); } catch (e) { }
            load(pos);
        } else {
            load(FALLBACK);
        }
    }

    /* 桥接可用则等它就绪，否则直接跑（单独打开这个文件时也能用） */
    if (window.Nexus && Nexus.ready) {
        Nexus.ready(function () { bind(); boot(); });
    } else {
        bind(); boot();
    }
})();
</script>
</body>
</html>
