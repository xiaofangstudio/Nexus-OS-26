# ============================================================
# Nexus OS 26 · AI 小方后端（Cloudflare Worker）· BYOK
# 部署：wrangler deploy
#
# ⚠️ 重要：这里**不需要、也不允许**配置任何 API Key。
#    每个用户在自己的 Nexus OS 设置里填自己的 Key，请求时随
#    Authorization: Bearer <用户Key> 带上；Worker 只做 CORS 转发。
#    站长不承担任何人的调用费用。
# ============================================================
name = "nexus-os-ai"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 自定义域名（绕开 *.workers.dev 的 DNS 污染；Cloudflare 自动建 DNS 记录与证书）
routes = [
  { pattern = "ai.fanggame.company", custom_domain = true }
]

[vars]
# —— MX 应用商店（解决浏览器 CORS 与 http 混合内容）——
MX_STORE_BASE = "http://api.store.mxos.zlromi.com/api/v1"
# —— CORS ——
ALLOW_ORIGIN = "*"
# —— 仅开发用：true 时返回模拟回复、不调上游（默认关）——
MOCK_AI = "false"
# —— 账号服务签名密钥（★ 部署前务必换成随机串，否则别人能伪造登录 token）——
#    生成方法：任意在线 UUID 生成器，或 PowerShell 里 [guid]::NewGuid().ToString('N')
ACC_SECRET = "change-me-to-a-random-string"
# —— v2.9.52 市场（应用/插件）管理令牌：审核台请求要带 X-N26-Admin: <这个值> ——
#    部署脚本会自动生成随机值并回填；不配则市场管理端锁定（只能浏览/下载）。
STORE_ADMIN = "change-me-to-a-random-string"

# ============================================================
# v2.9.47 · Nexus 账号服务（注册 / 登录 / 资料）
# ------------------------------------------------------------
# 需要给这个 Worker 绑一个 KV 命名空间来存账号：
#   1) 控制台新建 KV：Workers & Pages → KV → Create namespace（名字如 nexus-accounts）
#   2) 把下面的 id 换成它给你的 ID（或直接 `wrangler kv namespace create ACC_KV`）
# 没有绑定 KV 时，/api/acc/* 会返回 503 并说明原因，前端会自动退回「本地账号」模式。
#
# ★ v2.9.49 修正：TOML 不允许重复的 [vars] 表。原来这里又写了一个 [vars]，
#   一部署就会把上面的 MX_STORE_BASE / ALLOW_ORIGIN / MOCK_AI 覆盖掉（AI 功能直接废）。
#   现已合并到上面同一个 [vars] 里，下面只留 kv_namespaces。
# ============================================================

[[kv_namespaces]]
binding = "ACC_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# ============================================================
# v2.9.52 · 应用/插件市场 KV（上传 → 审核 → 上架 → 下载）
#   部署脚本会自动创建 nexus-store 并回填 id（或手动 wrangler kv namespace create STORE_KV）
# ============================================================

[[kv_namespaces]]
binding = "STORE_KV"
id = "REPLACE_WITH_YOUR_KV_ID"
