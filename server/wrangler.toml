# ============================================================
# Nexus OS 26 · AI 小方后端（Cloudflare Worker）· BYOK
# 部署：wrangler deploy
#
# ⚠️ 重要：这里**不需要、也不允许**配置任何 API Key。
#    每个用户在自己的 Nexus OS 设置里填自己的 Key，请求时随
#    Authorization: Bearer <用户Key> 带上；Worker 只做 CORS 转发。
#    站长不承担任何人的调用费用。
# ============================================================
name = "nexus-os-ai"
main = "src/index.js"
compatibility_date = "2026-01-01"


# 自定义域名（绕开 *.workers.dev 的 DNS 污染；Cloudflare 自动建 DNS 记录与证书）
routes = [
  { pattern = "ai.fanggame.company", custom_domain = true }
]

[vars]
# —— MX 应用商店（解决浏览器 CORS 与 http 混合内容）——
MX_STORE_BASE = "http://api.store.mxos.zlromi.com/api/v1"
# —— CORS ——
ALLOW_ORIGIN = "*"
# —— 仅开发用：true 时返回模拟回复、不调上游（默认关）——
MOCK_AI = "false"
# —— v3.2 和风天气：key 走 secret（不写仓库）——
#    wrangler secret put QWEATHER_KEY
#    新版和风若分配了专属 API Host，改下面这个地址即可
QWEATHER_BASE = "https://devapi.qweather.com"
# —— v3.2 高德地图：key 走 secret（不写仓库）——
#    wrangler secret put AMAP_KEY
# —— v3.0 起 ACC_SECRET / STORE_ADMIN / ACC_ENC_KEY 改为 Worker secrets（不写进仓库）——
#    wrangler secret put ACC_SECRET / STORE_ADMIN / ACC_ENC_KEY
#    ACC_ENC_KEY 用于账号密码的可逆副本（AES-GCM），只允许 /api/admin/* 解密，不下发前端。

# ============================================================
# v2.9.47 · Nexus 账号服务（注册 / 登录 / 资料）
# ------------------------------------------------------------
# 需要给这个 Worker 绑一个 KV 命名空间来存账号：
#   1) 控制台新建 KV：Workers & Pages → KV → Create namespace（名字如 nexus-accounts）
#   2) 把下面的 id 换成它给你的 ID（或直接 `wrangler kv namespace create ACC_KV`）
# 没有绑定 KV 时，/api/acc/* 会返回 503 并说明原因，前端会自动退回「本地账号」模式。
#
# ★ v2.9.49 修正：TOML 不允许重复的 [vars] 表。原来这里又写了一个 [vars]，
#   一部署就会把上面的 MX_STORE_BASE / ALLOW_ORIGIN / MOCK_AI 覆盖掉（AI 功能直接废）。
#   现已合并到上面同一个 [vars] 里，下面只留 kv_namespaces。
# ============================================================

# v3.0 · 三个逻辑 KV 统一绑定到现有 XF_KV（前缀隔离：acc: / store: / music:）
#   不新建 namespace；键前缀互不重叠，和官网统计 stats:* 共存。
[[kv_namespaces]]
binding = "ACC_KV"
id = "83431e2e0fcc4ce7948e664f39b1ce84"

[[kv_namespaces]]
binding = "STORE_KV"
id = "83431e2e0fcc4ce7948e664f39b1ce84"

[[kv_namespaces]]
binding = "MUSIC_KV"
id = "83431e2e0fcc4ce7948e664f39b1ce84"

# v3.1 · B站代理缓存（feed/search/video/play/related 与 WBI 口令）
#   复用同一个 XF_KV，键前缀 bili:* 隔离
[[kv_namespaces]]
binding = "BILI_KV"
id = "83431e2e0fcc4ce7948e664f39b1ce84"

# v3.6 · Workers AI（字幕翻译主通道）
#   wrangler 4.x 的绑定写法；响应里的 usage.neurons 是本次实际消耗，
#   是否落在免费额度取决于账号计划
[ai]
binding = "AI"
